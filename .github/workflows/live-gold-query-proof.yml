name: Live Gold Query Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-gold-query-proof.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    steps:
      - name: Prove live fresh-data Telegram interaction
        shell: bash
        run: |
          set -euo pipefail
          BASE=/opt/metatron/metatron-workforce
          source "$BASE/.env"
          test -n "${TELEGRAM_WEBHOOK_SECRET:-}"
          test -n "${TELEGRAM_ALLOWED_USER_ID:-}"

          UPDATE_ID=$(date +%s%N | cut -c1-15)
          BODY=$(python3 - "$UPDATE_ID" "$TELEGRAM_ALLOWED_USER_ID" <<'PY'
          import json,sys
          update_id=int(sys.argv[1])
          user_id=int(sys.argv[2])
          print(json.dumps({
            "update_id": update_id,
            "message": {
              "message_id": update_id % 1000000000,
              "from": {"id": user_id, "is_bot": False, "first_name": "ProductionProof"},
              "chat": {"id": user_id, "type": "private"},
              "date": int(__import__('time').time()),
              "text": "Giá vàng hôm nay"
            }
          }, ensure_ascii=False))
          PY
          )

          echo "UPDATE_ID=$UPDATE_ID"
          CODE=$(curl -sS --max-time 10 -o /tmp/gold-proof-response.txt -w '%{http_code}' \
            -X POST 'https://gate.metatron.vn/telegram/webhook' \
            -H "X-Telegram-Bot-Api-Secret-Token: ${TELEGRAM_WEBHOOK_SECRET}" \
            -H 'Content-Type: application/json' \
            --data "$BODY")
          echo "WEBHOOK_HTTP=$CODE"
          test "$CODE" = 200

          CID=$(docker ps --filter name=deploy-workforce-1 -q | head -1)
          test -n "$CID"
          PASS=false
          for i in $(seq 1 50); do
            LOGS=$(docker logs --since 2m "$CID" 2>&1 || true)
            if echo "$LOGS" | grep -q "telegram_send_success update_id=$UPDATE_ID"; then
              PASS=true
              echo "$LOGS" | grep -E "update_id=$UPDATE_ID|web_research_complete|all_providers_failed_web_evidence_preserved" | tail -n 50 || true
              break
            fi
            if echo "$LOGS" | grep -q "telegram_failure_notification_sent update_id=$UPDATE_ID"; then
              echo "$LOGS" | grep -E "update_id=$UPDATE_ID|web_research_complete|provider_failed|all_providers_failed" | tail -n 100 || true
              echo 'LIVE_GOLD_QUERY=FAIL'
              exit 1
            fi
            sleep 1
          done
          test "$PASS" = true
          echo 'LIVE_GOLD_QUERY=PASS'
