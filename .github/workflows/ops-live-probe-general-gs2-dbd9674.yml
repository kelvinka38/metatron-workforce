name: Live Probe GS2 verifier 24a5d99

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-live-probe-general-gs2-dbd9674.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 5
    steps:
      - name: Inspect GS2 local verifier state
        shell: bash
        env:
          OID: objective:intelligence-case:case-95bfb9e6-7e56-4391-9332-712fc427cd50:request:telegram:update:178868936469353422
        run: |
          set -euo pipefail
          CID=$(docker ps --filter name=deploy-workforce-1 --format '{{.ID}}' | head -1)
          SID=$(docker ps --filter name=deploy-workforce-sandbox-1 --format '{{.ID}}' | head -1)
          test -n "$CID"
          test -n "$SID"
          docker exec "$CID" sh -c "grep -R -h -F '\"objectiveId\":\"$OID\"' /var/lib/metatron-workforce/runtime-evidence/action-journal 2>/dev/null || true" > /tmp/actions.jsonl
          python3 - /tmp/actions.jsonl > /tmp/proof.env <<'PY'
          import json,sys
          rows=[]
          for line in open(sys.argv[1],encoding='utf-8',errors='ignore'):
              try: rows.append(json.loads(line))
              except Exception: pass
          mats=[r for r in rows if r.get('thoughtAction')=='workspace.repository.materialize' and r.get('actionSuccess') is True]
          pubs=[r for r in rows if r.get('thoughtAction')=='workspace.github.pr.publish' and r.get('actionSuccess') is True]
          assert mats and pubs
          m=mats[-1].get('outputs') or {}; p=pubs[-1].get('outputs') or {}
          print('WORKSPACE_KEY='+m['workspaceRef'].split(':',1)[1])
          print('BASELINE_SHA='+m['localBaselineCommitSha'])
          print('LOCAL_HEAD='+p['localHeadSha'])
          print('REMOTE_COMMIT='+p['remoteCommitSha'])
          print('PR_NUMBER='+p['pullRequestNumber'])
          PY
          cat /tmp/proof.env
          source /tmp/proof.env
          W="/workspaces/$WORKSPACE_KEY"
          echo 'VERIFY_BEGIN'
          ACTUAL_LOCAL_HEAD=$(docker exec --user 10001:10001 "$SID" git -C "$W" rev-parse HEAD | tr -d '\r\n')
          echo "ACTUAL_LOCAL_HEAD=$ACTUAL_LOCAL_HEAD"
          echo "LOCAL_HEAD_MATCH=$([ "$ACTUAL_LOCAL_HEAD" = "$LOCAL_HEAD" ] && echo true || echo false)"
          echo 'STATUS_BEGIN'
          docker exec --user 10001:10001 "$SID" git -C "$W" status --porcelain=v1
          echo 'STATUS_END'
          echo 'BASELINE_REF='
          docker exec --user 10001:10001 "$SID" git -C "$W" rev-parse refs/metatron/materialized
          echo 'DIFF_BEGIN'
          docker exec --user 10001:10001 "$SID" git -C "$W" diff --name-status --no-renames "$BASELINE_SHA..$LOCAL_HEAD" --
          echo 'DIFF_END'
          echo 'LOG_BEGIN'
          docker exec --user 10001:10001 "$SID" git -C "$W" log --oneline --decorate -5
          echo 'LOG_END'
          echo 'SOURCE_SENTENCE_BEGIN'
          docker exec --user 10001:10001 "$SID" git -C "$W" show "$LOCAL_HEAD:src/main/java/com/metatron/workforce/action/GeneralCognitiveWorkerBrainFactory.java" | grep 'Produces one stateful provider-backed brain' || true
          echo 'SOURCE_SENTENCE_END'
          echo 'VERIFY_END'
