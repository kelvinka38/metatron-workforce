name: Live Probe General GS2 dbd9674

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-live-probe-general-gs2-dbd9674.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 5
    steps:
      - name: Inspect exact GS2 host workspace and mounts
        shell: bash
        env:
          OID: objective:intelligence-case:case-1aa25553-6f82-4f31-9e01-55e41fdfce82:request:telegram:update:178868556547190977
          WORKSPACE_KEY: df5fd07a19601634ed8fc6f6b1220c62
        run: |
          set -euo pipefail
          CID=$(docker ps --filter name=deploy-workforce-1 --format '{{.ID}}' | head -1)
          SID=$(docker ps --filter name=workforce-sandbox --format '{{.ID}}' | head -1)
          test -n "$CID"
          echo "WORKFORCE_CID=$CID"
          echo "SANDBOX_CID=$SID"
          echo 'WORKFORCE_MOUNTS_BEGIN'
          docker inspect "$CID" --format '{{range .Mounts}}{{println .Source "->" .Destination}}{{end}}'
          echo 'WORKFORCE_MOUNTS_END'
          echo 'SANDBOX_MOUNTS_BEGIN'
          if [ -n "$SID" ]; then docker inspect "$SID" --format '{{range .Mounts}}{{println .Source "->" .Destination}}{{end}}'; fi
          echo 'SANDBOX_MOUNTS_END'

          SRC=$(docker inspect "$CID" --format '{{range .Mounts}}{{if eq .Destination "/var/lib/metatron-workforce"}}{{.Source}}{{end}}{{end}}')
          test -n "$SRC"
          W="$SRC/objective-workspaces/$WORKSPACE_KEY"
          echo "HOST_WORKSPACE=$W"
          test -d "$W"
          echo 'IDENTITY_BEGIN'
          cat "$W/.metatron-workspace"
          cat "$W/.metatron-repository"
          echo 'IDENTITY_END'
          echo 'GIT_BEGIN'
          cd "$W"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "ROOTS=$(git rev-list --max-parents=0 HEAD | paste -sd, -)"
          echo "COUNT=$(git rev-list --count HEAD)"
          echo STATUS_BEGIN
          git status --porcelain=v1
          echo STATUS_END
          echo LOG_BEGIN
          git log --oneline --decorate -8
          echo LOG_END
          R=$(git rev-list --max-parents=0 HEAD | head -1)
          echo DIFF_BEGIN
          git diff --name-status --no-renames "$R..HEAD" --
          echo DIFF_END
          echo 'GIT_END'

          echo 'ACTIONS_BEGIN'
          grep -R -h -F "\"objectiveId\":\"$OID\"" "$SRC/runtime-evidence/action-journal" 2>/dev/null > /tmp/actions.jsonl || true
          python3 - /tmp/actions.jsonl <<'PY'
          import json,sys
          for line in open(sys.argv[1],encoding='utf-8',errors='ignore'):
              try:
                  d=json.loads(line)
              except Exception:
                  continue
              out={k:d.get(k) for k in ('workStepId','workerId','cycle','thoughtAction','thoughtInputs','actionSuccess','actionSummary','outputs','reflection','reflectionSummary')}
              print(json.dumps(out,sort_keys=True)[:16000])
          PY
          echo 'ACTIONS_END'
