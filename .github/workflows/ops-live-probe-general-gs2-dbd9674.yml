name: Live Probe General GS2 dbd9674

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-live-probe-general-gs2-dbd9674.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 5
    steps:
      - name: Inspect exact GS2 workspace and action journal
        shell: bash
        env:
          OID: objective:intelligence-case:case-1aa25553-6f82-4f31-9e01-55e41fdfce82:request:telegram:update:178868556547190977
          WORKSPACE_KEY: df5fd07a19601634ed8fc6f6b1220c62
        run: |
          set -euo pipefail
          CID=$(docker ps --filter name=deploy-workforce-1 --format '{{.ID}}' | head -1)
          test -n "$CID"
          W="/var/lib/metatron-workforce/objective-workspaces/$WORKSPACE_KEY"
          echo "CONTAINER=$CID"
          docker exec "$CID" sh -c "test -d '$W' && echo WORKSPACE_PRESENT=true || echo WORKSPACE_PRESENT=false"
          echo 'IDENTITY_BEGIN'
          docker exec "$CID" sh -c "cat '$W/.metatron-workspace' 2>/dev/null || true"
          docker exec "$CID" sh -c "cat '$W/.metatron-repository' 2>/dev/null || true"
          echo 'IDENTITY_END'
          echo 'GIT_BEGIN'
          docker exec "$CID" sh -c "cd '$W' && echo HEAD=\$(git rev-parse HEAD) && echo ROOTS=\$(git rev-list --max-parents=0 HEAD | tr '\n' ',') && echo COUNT=\$(git rev-list --count HEAD) && echo STATUS_BEGIN && git status --porcelain=v1 && echo STATUS_END && echo LOG_BEGIN && git log --oneline --decorate -8 && echo LOG_END && R=\$(git rev-list --max-parents=0 HEAD | head -1) && echo DIFF_BEGIN && git diff --name-status --no-renames \$R..HEAD -- && echo DIFF_END"
          echo 'GIT_END'
          echo 'ACTIONS_BEGIN'
          docker exec "$CID" sh -c "grep -R -h -F '\"objectiveId\":\"$OID\"' /var/lib/metatron-workforce/runtime-evidence/action-journal 2>/dev/null || true" > /tmp/actions.jsonl
          python3 - /tmp/actions.jsonl <<'PY'
          import json,sys
          for line in open(sys.argv[1],encoding='utf-8',errors='ignore'):
              try:
                  d=json.loads(line)
              except Exception:
                  continue
              out={k:d.get(k) for k in ('workStepId','workerId','cycle','thoughtAction','thoughtInputs','actionSuccess','actionSummary','outputs','reflection','reflectionSummary')}
              print(json.dumps(out,sort_keys=True)[:16000])
          PY
          echo 'ACTIONS_END'
