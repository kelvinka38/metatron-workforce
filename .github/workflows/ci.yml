name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workforce-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx384m -XX:MaxMetaspaceSize=192m -Dorg.gradle.workers.max=1 -Dorg.gradle.daemon=false"

jobs:
  test:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'
          cache: gradle
      - name: Verify POSIX line endings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ("gradlew",):
              data = Path(name).read_bytes()
              if b"\r\n" in data or b"\r" in data:
                  raise SystemExit(f"CRLF_NOT_ALLOWED: {name}")
          PY
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Test and build
        run: ./gradlew clean test bootJar --no-daemon --max-workers=1
