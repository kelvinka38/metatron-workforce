name: Workforce CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: workforce-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Workforce
        run: ./gradlew --no-daemon clean test
