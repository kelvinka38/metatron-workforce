name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workforce-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx384m -XX:MaxMetaspaceSize=192m -Dorg.gradle.workers.max=1 -Dorg.gradle.daemon=false"

jobs:
  test:
    # PR unit/contract tests do not require production-local state, credentials, Docker,
    # or the production network. Keep the single metatron-prod runner reserved for
    # exact-SHA deploy and live production acceptance so ordinary CI cannot serialize them.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'
          cache: gradle
      - name: Verify POSIX line endings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ("gradlew",):
              data = Path(name).read_bytes()
              if b"\r\n" in data or b"\r" in data:
                  raise SystemExit(f"CRLF_NOT_ALLOWED: {name}")
          PY
      - name: Verify production orchestration shell syntax
        run: bash -n scripts/runtime-conformance-point5.sh
      - name: Compile runtime and acceptance Python
        run: |
          python3 -m py_compile \
            runtime-sandbox/server.py \
            scripts/autonomy/p10_action_journal.py \
            scripts/autonomy/p10_collect.py \
            scripts/autonomy/p10_general_runtime_guard.py \
            scripts/autonomy/p10_ratify.py
      - name: Smoke-load sandbox runtime
        run: |
          set -euo pipefail
          TOKEN_FILE="$RUNNER_TEMP/metatron-sandbox-ci-token"
          WORKSPACE_ROOT="$RUNNER_TEMP/metatron-sandbox-ci-workspaces"
          printf '%s' 'ci-sandbox-token' > "$TOKEN_FILE"
          SANDBOX_TOKEN_FILE="$TOKEN_FILE" SANDBOX_WORKSPACE_ROOT="$WORKSPACE_ROOT" python3 - <<'PY'
          import runpy
          from pathlib import Path
          runtime=runpy.run_path('runtime-sandbox/server.py')
          deny=runtime['SHELL_DENY']
          assert deny.search('git status; rm -rf x')
          assert deny.search('echo $(id)')
          assert deny.search('git status\nwhoami')
          assert not deny.search('git status --short')
          child=runtime['child_environment'](Path('/tmp/metatron-ci-workspace'))
          assert child['JAVA_HOME']
          assert child['PATH'].startswith(child['JAVA_HOME'] + '/bin:')
          assert '-Dorg.gradle.workers.max=1' in child['GRADLE_OPTS']
          assert '-Xmx256m' in child['GRADLE_OPTS']
          assert '-Xmx256m' in child['MAVEN_OPTS']
          assert child['GRADLE_USER_HOME'].startswith(str(Path('/tmp/metatron-ci-workspace')))
          assert 'SANDBOX_TOKEN' not in child
          assert 'GITHUB_TOKEN' not in child
          assert 'OPENAI_API_KEY' not in child
          print('SANDBOX_RUNTIME_IMPORT=PASS')
          print('SANDBOX_JAVA_ENVIRONMENT=PASS')
          print('SANDBOX_BUILD_RESOURCE_ENVELOPE=PASS')
          print('SANDBOX_CHILD_CREDENTIAL_ISOLATION=PASS')
          PY
      - name: Verify strict P10 evidence contracts
        run: |
          python3 scripts/autonomy/p10_action_journal.py --self-test
          python3 scripts/autonomy/p10_collect.py --self-test
          python3 scripts/autonomy/p10_general_runtime_guard.py --self-test
          python3 scripts/autonomy/p10_ratify.py --self-test
      - name: Enforce Intelligence provider ownership boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          forbidden = (
              "interaction.llm.LlmProviderRouter",
              "interaction.llm.OpenAiLlmProviderClient",
              "interaction.llm.GoogleLlmProviderClient",
              "interaction.llm.AnthropicLlmProviderClient",
          )
          violations = []
          for path in Path("src/main/java").rglob("*.java"):
              p = path.as_posix()
              if "/interaction/intelligence/" in p or "/interaction/llm/" in p:
                  continue
              text = path.read_text(encoding="utf-8")
              for token in forbidden:
                  if token in text:
                      violations.append(f"{p} -> {token}")
          if violations:
              print("INTELLIGENCE_PROVIDER_BOUNDARY=FAIL")
              print("\n".join(violations))
              raise SystemExit(1)
          print("INTELLIGENCE_PROVIDER_BOUNDARY=PASS")
          PY
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Test and build
        run: ./gradlew clean test bootJar --no-daemon --max-workers=1
