name: General Runtime Polyglot Acceptance

on:
  push:
    paths:
      - 'runtime-sandbox/**'
      - 'deploy/docker-compose.yml'
      - 'src/main/java/com/metatron/workforce/action/**'
      - 'src/main/java/com/metatron/workforce/runtime/**'
      - 'src/test/java/com/metatron/workforce/action/**'
      - 'src/test/java/com/metatron/workforce/runtime/**'
      - '.github/workflows/general-runtime-polyglot-acceptance.yml'
  workflow_dispatch:

jobs:
  unit-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'
      - name: Run polyglot runtime contract tests
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon --max-workers=1 \
            --tests com.metatron.workforce.action.GeneralWorkspacePolyglotRuntimeContractTest \
            --tests com.metatron.workforce.runtime.ObjectiveWorkspaceAndProfileClosureTest \
            --tests com.metatron.workforce.action.GeneralWorkspaceBuildResourceContractTest

  real-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build polyglot sandbox image
        run: docker build -f runtime-sandbox/Dockerfile -t metatron-polyglot-sandbox .
      - name: Verify toolchains exist in built image
        run: |
          docker run --rm --entrypoint node metatron-polyglot-sandbox --version
          docker run --rm --entrypoint npm metatron-polyglot-sandbox --version
          docker run --rm --entrypoint pnpm metatron-polyglot-sandbox --version
          docker run --rm --entrypoint python3 metatron-polyglot-sandbox --version
          docker run --rm --entrypoint python3 metatron-polyglot-sandbox -m pytest --version
          echo "GENERAL_RUNTIME_POLYGLOT_IMAGE=PASS"
