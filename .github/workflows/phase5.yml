name: phase5-reality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  phase5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Phase 5 acceptance
        run: ./gradlew clean test --tests 'com.metatron.workforce.phase5.Phase5RealityAcceptanceTest' --no-daemon
      - name: Phase 5 regression
        run: ./gradlew test --tests 'com.metatron.workforce.phase5.*' --no-daemon
      - name: Full regression
        run: ./gradlew test --no-daemon
      - name: Build deployable artifact
        run: ./gradlew bootJar --no-daemon
