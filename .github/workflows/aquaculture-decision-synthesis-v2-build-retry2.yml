name: Aquaculture Decision Synthesis v2 Build Retry 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquaculture-decision-synthesis-v2-build-retry2.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Execute corrected synthesis build script
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/aquaculture-decision-synthesis-v2-build.yml').read_text()
          block=src.split('        run: |\n',1)[1]
          lines=[line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          script='\n'.join(lines)+'\n'
          script=script.replace(
              'git -c http.https://github.com/.extraheader="AUTHORIZATION: bearer $GITHUB_TOKEN" clone --depth 1 --branch aquaculture-decision-synthesis-v2 https://github.com/kelvinka38/bios.git "$WORK"',
              'git clone --depth 1 --branch aquaculture-decision-synthesis-v2 "https://x-access-token:${GITHUB_TOKEN}@github.com/kelvinka38/bios.git" "$WORK"')
          script=script.replace(
              'git -c http.https://github.com/.extraheader="AUTHORIZATION: bearer $GITHUB_TOKEN" push origin HEAD:aquaculture-decision-synthesis-v2',
              'git push origin HEAD:aquaculture-decision-synthesis-v2')
          fixed=[];embedded=None
          for line in script.splitlines():
              if line.startswith("method='''    def _auto_candidates"):
                  embedded='method';fixed.append(line);continue
              if line.startswith("insert='''    def _scenario_projection"):
                  embedded='insert';fixed.append(line);continue
              if embedded and line=="'''":
                  embedded=None;fixed.append(line);continue
              if embedded:
                  fixed.append('    '+line)
              else:
                  fixed.append(line)
          Path('/tmp/aq-synthesis-build.sh').write_text('\n'.join(fixed)+'\n')
          PY
          bash /tmp/aq-synthesis-build.sh
