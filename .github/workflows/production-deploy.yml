name: Highway Release Ingress

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'Dockerfile'
      - 'runtime-sandbox/**'
      - 'deploy/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'highway/**'
      - 'scripts/**'
      - '.github/workflows/production-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: highway-release-ingress-main
  cancel-in-progress: true

jobs:
  enqueue-release:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Activate exact-SHA Highway control plane and release
        shell: bash
        run: |
          set -euo pipefail
          bash highway/install.sh "$GITHUB_WORKSPACE" "$GITHUB_SHA"
          test "$(cat "$HOME/.metatron/highway/releases/$GITHUB_SHA/.highway-source-sha")" = "$GITHUB_SHA"
          grep -q '"runtime-closure"' "$HOME/.metatron/highway/current/task-registry.json"
          echo 'HIGHWAY_EXACT_CONTROL_PLANE_ACTIVE=PASS'

      - name: Submit build, deploy, and one-shot governed research closure DAG to persistent Highway
        shell: bash
        run: |
          set -euo pipefail
          BASE=/opt/metatron/metatron-workforce
          test -r "$BASE/.env"
          test -r "$HOME/.metatron/highway/highway.env"
          set -a
          source "$BASE/.env"
          source "$HOME/.metatron/highway/highway.env"
          set +a
          bash "$HOME/.metatron/highway/current/ensure-running.sh"
          CTL="python3 $HOME/.metatron/highway/current/highwayctl.py"

          BUILD=$($CTL submit \
            --kind workforce-build \
            --source-sha "$GITHUB_SHA" \
            --dedupe-key "workforce-build:$GITHUB_SHA" \
            --priority 90 \
            --env "TARGET_SHA=$GITHUB_SHA" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["task_id"])')

          DEPLOY=$($CTL submit \
            --kind workforce-deploy \
            --source-sha "$GITHUB_SHA" \
            --dependency "$BUILD" \
            --dedupe-key "workforce-deploy:$GITHUB_SHA" \
            --priority 100 \
            --env "TARGET_SHA=$GITHUB_SHA" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["task_id"])')

          RESEARCH=$($CTL submit \
            --kind mother-baby-bios-live-objective \
            --source-sha "$GITHUB_SHA" \
            --dependency "$DEPLOY" \
            --dedupe-key "aq-v5-governed-research-proof:$GITHUB_SHA" \
            --priority 110 \
            --env "EXPECTED_WORKFORCE_SHA=$GITHUB_SHA" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["task_id"])')

          echo "HIGHWAY_BUILD_TASK=$BUILD"
          echo "HIGHWAY_DEPLOY_TASK=$DEPLOY"
          echo "HIGHWAY_AQ_V5_RESEARCH_PROOF_TASK=$RESEARCH"
          $CTL get "$BUILD"
          $CTL get "$DEPLOY"
          $CTL get "$RESEARCH"
          echo 'HIGHWAY_GITHUB_EXECUTION_PLANE=BYPASSED'
          echo 'HIGHWAY_RELEASE_INGRESS=PASS'

          # GitHub remains ingress/observer only. All work above executes in the persistent Highway.
          $CTL wait "$RESEARCH" --timeout 1200 --poll 2
          echo 'AQ_V5_GOVERNED_RESEARCH_RUNTIME=PASS'
