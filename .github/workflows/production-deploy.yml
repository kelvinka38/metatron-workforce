name: Production Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'Dockerfile'
      - 'deploy/**'
      - '.github/workflows/production-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  METATRON_VERSION: "0.1.0"

# Production deployment deliberately builds from the immutable GitHub Actions
# workspace. The historical /opt/metatron/metatron-workforce tree may contain
# root-owned files and must not be recursively deleted or overwritten by the
# unprivileged runner. The production .env remains on the host and is injected
# via --env-file.
jobs:
  test-and-build:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Test
        run: ./gradlew clean test --no-daemon

      - name: Build
        run: ./gradlew bootJar --no-daemon

      - name: Validate production compose
        run: docker compose -f deploy/docker-compose.yml config

      - name: Upload deployable JAR
        uses: actions/upload-artifact@v4
        with:
          name: metatron-workforce-jar
          path: build/libs/metatron-workforce-0.1.0.jar
          if-no-files-found: error
          retention-days: 1

  deploy-production:
    needs: test-and-build
    runs-on: [self-hosted, linux, x64, metatron-prod]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download deployable JAR
        uses: actions/download-artifact@v4
        with:
          name: metatron-workforce-jar
          path: build/libs

      - name: Verify deployable artifact
        run: test -s build/libs/metatron-workforce-0.1.0.jar

      - name: Deploy to local production runtime
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          BASE=/opt/metatron/metatron-workforce
          WORKSPACE="$GITHUB_WORKSPACE"
          COMPOSE="$WORKSPACE/deploy/docker-compose.yml"

          echo "=== VERIFY HOST RUNTIME ==="
          test -d "$BASE"
          test -f "$BASE/.env"
          test -s "$WORKSPACE/build/libs/metatron-workforce-0.1.0.jar"
          test -f "$COMPOSE"
          test -f "$WORKSPACE/Dockerfile"

          echo "=== DEPLOY IDENTITY ==="
          echo "EXPECTED_SHA=$SHA"
          echo "WORKSPACE=$WORKSPACE"
          echo "BASE=$BASE"

          echo "=== VERIFY PRODUCTION ENV ==="
          test -r "$BASE/.env"

          cd "$WORKSPACE"
          export METATRON_VERSION=0.1.0
          export METATRON_COMMIT_SHA="$SHA"
          export METATRON_ENVIRONMENT=production

          echo "=== VALIDATE COMPOSE WITH PRODUCTION ENV ==="
          docker compose --env-file "$BASE/.env" -f "$COMPOSE" config >/dev/null

          echo "=== BUILD + START PRODUCTION ==="
          docker compose --env-file "$BASE/.env" -f "$COMPOSE" up -d --build --force-recreate

          echo "=== WAIT FOR HEALTH ==="
          healthy=false
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status"[[:space:]]*:[[:space:]]*"UP"'; then
              healthy=true
              break
            fi
            sleep 2
          done

          if [ "$healthy" != true ]; then
            docker compose --env-file "$BASE/.env" -f "$COMPOSE" logs --tail 200 workforce
            exit 1
          fi

          echo "=== TELEGRAM CHANNEL HEALTH ==="
          curl -fsS http://127.0.0.1:8080/telegram/health
          echo

          echo "=== TELEGRAM WEBHOOK BINDING ==="
          set -a
          source "$BASE/.env"
          set +a
          test -n "${TELEGRAM_BOT_TOKEN:-}"
          test -n "${TELEGRAM_WEBHOOK_SECRET:-}"
          test -n "${TELEGRAM_ALLOWED_USER_ID:-}"
          test -n "${METATRON_ORGANIZATION_ID:-}"
          test -n "${OPENAI_API_KEY:-}${GEMINI_API_KEY:-}${ANTHROPIC_API_KEY:-}"

          TELEGRAM_WEBHOOK_URL="https://gate.metatron.vn/telegram/webhook"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=${TELEGRAM_WEBHOOK_URL}" \
            --data-urlencode "secret_token=${TELEGRAM_WEBHOOK_SECRET}" \
            --data-urlencode 'drop_pending_updates=false' \
            >/tmp/telegram-set-webhook.json

          python3 - <<'PY'
          import json
          with open('/tmp/telegram-set-webhook.json') as f:
              data=json.load(f)
          assert data.get('ok') is True, data
          print('SET_WEBHOOK=PASS')
          PY

          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo" \
            >/tmp/telegram-webhook-info.json

          python3 - <<'PY'
          import json
          with open('/tmp/telegram-webhook-info.json') as f:
              data=json.load(f)
          assert data.get('ok') is True, data
          result=data['result']
          expected='https://gate.metatron.vn/telegram/webhook'
          assert result.get('url') == expected, result
          print('WEBHOOK_URL=' + result['url'])
          print('PENDING_UPDATE_COUNT=' + str(result.get('pending_update_count', 0)))
          if result.get('last_error_message'):
              print('LAST_ERROR=' + result['last_error_message'])
          PY

          deployed_sha=$(docker inspect deploy-workforce-1 --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^METATRON_COMMIT_SHA=//p' | head -1)
          test "$deployed_sha" = "$SHA"

          echo "PRODUCTION_DEPLOYMENT=PASS"
          echo "EXPECTED_SHA=$SHA"
          echo "DEPLOYED_SHA=$deployed_sha"
          echo "IMAGE=$(docker inspect deploy-workforce-1 --format '{{.Config.Image}}')"
          echo "HEALTH=$(curl -fsS http://127.0.0.1:8080/actuator/health)"
