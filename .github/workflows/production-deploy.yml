name: Production Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'Dockerfile'
      - 'deploy/**'
      - '.github/workflows/production-deploy.yml'
      - '.github/workflows/gateway-final-live-acceptance.yml'
      - '.github/workflows/telegram-one-message-worker-live-acceptance.yml'
      - '.github/workflows/workforce-autonomy-p10-production-acceptance.yml'
      - '.github/workflows/workforce-autonomy-p10-gs3-gs4-production-acceptance.yml'
      - '.github/workflows/workforce-autonomy-p10-45-condition-ratification.yml'
      - '.github/workflows/workforce-autonomy-p10-closure-final.yml'
      - '.github/workflows/work-observability-production-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metatron-workforce-production
  cancel-in-progress: true

env:
  METATRON_VERSION: "0.1.0"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx384m -XX:MaxMetaspaceSize=192m -Dorg.gradle.workers.max=1 -Dorg.gradle.daemon=false"

jobs:
  test-and-build:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    steps:
      - name: Verify runner host safety
        shell: bash
        run: |
          set -euo pipefail
          docker info >/dev/null
          test "$(df --output=pcent / | tail -1 | tr -dc '0-9')" -lt 90
          SWAP_BYTES=$(swapon --show --bytes --noheadings 2>/dev/null | awk '{s+=$3} END{print s+0}')
          test "${SWAP_BYTES:-0}" -ge 1073741824
      - uses: actions/checkout@v7
      - name: Setup Java 22
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Test and build with bounded memory
        run: ./gradlew clean test bootJar --no-daemon --max-workers=1
      - name: Validate production compose
        run: docker compose -f deploy/docker-compose.yml config >/dev/null
      - name: Upload deployable JAR
        uses: actions/upload-artifact@v7
        with:
          name: workforce-deployable-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 1

  deploy-production:
    needs: test-and-build
    runs-on: [self-hosted, linux, x64, metatron-prod]
    steps:
      - uses: actions/checkout@v7
      - name: Download deployable JAR
        uses: actions/download-artifact@v8
        with:
          name: workforce-deployable-${{ github.sha }}
          path: build/libs
      - name: Deploy exact tested artifact with rollback
        shell: bash
        run: |
          set -euo pipefail
          cd deploy
          source .env
          export METATRON_COMMIT_SHA="${GITHUB_SHA}"
          export METATRON_IMAGE_TAG="${GITHUB_SHA}"
          export METATRON_VERSION="0.1.0"

          PREVIOUS_IMAGE=$(docker inspect deploy-workforce-1 --format '{{.Config.Image}}' 2>/dev/null || true)
          PREVIOUS_SHA=$(docker inspect deploy-workforce-1 --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | sed -n 's/^METATRON_COMMIT_SHA=//p' | head -1 || true)
          echo "PREVIOUS_IMAGE=${PREVIOUS_IMAGE:-none}"
          echo "PREVIOUS_SHA=${PREVIOUS_SHA:-none}"

          cp ../build/libs/*.jar ../build/libs/app.jar
          docker build -f ../Dockerfile -t "metatron-workforce:${GITHUB_SHA}" ..
          docker compose -p deploy up -d --force-recreate workforce

          rollback() {
            echo "Deployment verification failed; attempting rollback"
            if [ -n "${PREVIOUS_IMAGE:-}" ] && [ "${PREVIOUS_IMAGE:-}" != "none" ]; then
              PREVIOUS_TAG="${PREVIOUS_IMAGE#metatron-workforce:}"
              export METATRON_IMAGE_TAG="$PREVIOUS_TAG"
              export METATRON_COMMIT_SHA="${PREVIOUS_SHA:-unknown}"
              docker compose -p deploy up -d --force-recreate workforce || true
            fi
          }
          trap rollback ERR

          CID=$(docker compose -p deploy ps -q workforce)
          test -n "$CID"
          for i in $(seq 1 45); do
            STATUS=$(docker inspect "$CID" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}')
            [ "$STATUS" = healthy ] && break
            [ "$STATUS" = unhealthy ] && { docker logs --tail 200 "$CID"; false; }
            sleep 2
          done
          test "$(docker inspect "$CID" --format '{{.State.Health.Status}}')" = healthy
          DEPLOYED_SHA=$(docker inspect "$CID" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^METATRON_COMMIT_SHA=//p' | head -1)
          test "$DEPLOYED_SHA" = "$GITHUB_SHA"
          curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'
          curl -fsS http://127.0.0.1:8080/telegram/health | grep -q '"status":"UP"'
          curl -fsS https://gate.metatron.vn/healthz >/dev/null
          echo "DEPLOYED_SHA=$DEPLOYED_SHA"
          trap - ERR
