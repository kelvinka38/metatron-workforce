name: Production Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'Dockerfile'
      - 'deploy/**'
      - '.github/workflows/production-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  METATRON_VERSION: "0.1.0"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Test
        run: ./gradlew clean test --no-daemon

      - name: Build
        run: ./gradlew bootJar --no-daemon

      - name: Validate production compose
        run: docker compose -f deploy/docker-compose.yml config

  deploy-production:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$PROD_SSH_KEY"
          test -n "$PROD_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/metatron_prod
          chmod 600 ~/.ssh/metatron_prod
          printf '%s\n' "$PROD_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Package source
        run: |
          set -euo pipefail
          tar --exclude='.git' --exclude='.env' --exclude='.gradle' --exclude='build' -czf metatron-workforce-${GITHUB_SHA}.tgz .

      - name: Upload source to production
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
        run: |
          set -euo pipefail
          test -n "$PROD_HOST"
          scp -i ~/.ssh/metatron_prod metatron-workforce-${GITHUB_SHA}.tgz root@"$PROD_HOST":/tmp/metatron-workforce-${GITHUB_SHA}.tgz

      - name: Deploy and verify production
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$PROD_HOST"
          ssh -i ~/.ssh/metatron_prod root@"$PROD_HOST" "SHA='$SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          BASE=/opt/metatron/metatron-workforce
          ARCHIVE=/tmp/metatron-workforce-${SHA}.tgz
          test -f "$BASE/.env"
          test -f "$ARCHIVE"

          mkdir -p "$BASE"
          find "$BASE" -mindepth 1 -maxdepth 1 ! -name .env ! -name runtime-state ! -name runtime-evidence -exec rm -rf {} +
          tar -xzf "$ARCHIVE" -C "$BASE"
          rm -f "$ARCHIVE"

          cd "$BASE"
          export METATRON_VERSION=0.1.0
          export METATRON_COMMIT_SHA="$SHA"
          export METATRON_ENVIRONMENT=production

          docker compose --env-file .env -f deploy/docker-compose.yml config >/dev/null
          docker compose --env-file .env -f deploy/docker-compose.yml up -d --build

          healthy=false
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status"[[:space:]]*:[[:space:]]*"UP"'; then
              healthy=true
              break
            fi
            sleep 2
          done
          if [ "$healthy" != true ]; then
            docker compose --env-file .env -f deploy/docker-compose.yml logs --tail 200 workforce
            exit 1
          fi

          deployed_sha=$(docker inspect deploy-workforce-1 --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^METATRON_COMMIT_SHA=//p' | head -1)
          test "$deployed_sha" = "$SHA"

          echo "PRODUCTION_DEPLOYMENT=PASS"
          echo "EXPECTED_SHA=$SHA"
          echo "DEPLOYED_SHA=$deployed_sha"
          echo "IMAGE=$(docker inspect deploy-workforce-1 --format '{{.Config.Image}}')"
          echo "HEALTH=$(curl -fsS http://127.0.0.1:8080/actuator/health)"
          REMOTE
