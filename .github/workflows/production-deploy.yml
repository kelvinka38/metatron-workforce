name: Highway Production Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'Dockerfile'
      - 'deploy/**'
      - 'scripts/**'
      - '.github/workflows/production-deploy.yml'
      - '.github/workflows/production-acceptance-highway-v2.yml'
      - '.github/workflows/highway-conformance-ci.yml'
      - '.github/workflows/runtime-conformance-point4-production-acceptance.yml'
      - '.github/workflows/runtime-conformance-point4-read-production-acceptance.yml'
      - '.github/workflows/runtime-conformance-point5-production-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  METATRON_VERSION: "0.1.0"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx384m -XX:MaxMetaspaceSize=192m -Dorg.gradle.workers.max=1 -Dorg.gradle.daemon=false"

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: metatron-hosted-build-main
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - name: Setup Java 22
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Test and build with bounded memory
        run: ./gradlew clean test bootJar --no-daemon --max-workers=1
      - name: Validate production compose
        run: docker compose -f deploy/docker-compose.yml config >/dev/null
      - name: Upload deployable JAR
        uses: actions/upload-artifact@v7
        with:
          name: metatron-workforce-${{ github.sha }}
          path: build/libs/metatron-workforce-0.1.0.jar
          if-no-files-found: error

  deploy-production:
    needs: test-and-build
    runs-on: [self-hosted, linux, x64, metatron-prod]
    environment: production
    # Repository-wide production lane. If a newer exact SHA is ready to deploy,
    # it supersedes any stale Highway acceptance still exercising the old SHA.
    concurrency:
      group: metatron-production-lane
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - name: Download deployable JAR
        uses: actions/download-artifact@v8
        with:
          name: metatron-workforce-${{ github.sha }}
          path: build/libs
      - name: Deploy exact tested artifact with image rollback
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BASE=/opt/metatron/metatron-workforce
          WORKSPACE="$GITHUB_WORKSPACE"
          COMPOSE="$WORKSPACE/deploy/docker-compose.yml"
          PROJECT=deploy
          DEPLOY_STARTED_AT=$(date +%s)

          echo '=== PRE-FLIGHT ==='
          test -r "$BASE/.env"
          test -d "$WORKSPACE/.git"
          test "$(git -C "$WORKSPACE" rev-parse HEAD)" = "$SHA"
          test -f "$WORKSPACE/build/libs/metatron-workforce-${METATRON_VERSION}.jar"
          set -a; source "$BASE/.env"; set +a

          # Remote runtime execution is an internal effect boundary and must never start open.
          # Generate one persistent host-local transport credential if the existing production
          # environment has not provisioned one yet. Never echo the credential to Actions logs.
          if [ -z "${METATRON_RUNTIME_EXECUTION_TOKEN:-}" ]; then
            python3 - "$BASE/.env" <<'PY'
          import os,secrets,sys
          path=sys.argv[1]
          with open(path,'r',encoding='utf-8') as f:
              lines=f.read().splitlines()
          lines=[line for line in lines if not line.startswith('METATRON_RUNTIME_EXECUTION_TOKEN=')]
          lines.append('METATRON_RUNTIME_EXECUTION_TOKEN=' + secrets.token_urlsafe(48))
          tmp=path+'.runtime-token.tmp'
          with open(tmp,'w',encoding='utf-8') as f:
              f.write('\n'.join(lines)+'\n')
          os.chmod(tmp,0o600)
          os.replace(tmp,path)
          PY
            set -a; source "$BASE/.env"; set +a
          fi
          test -n "${METATRON_RUNTIME_EXECUTION_TOKEN:-}"
          METATRON_IMAGE_TAG="$SHA" METATRON_COMMIT_SHA="$SHA" docker compose -p "$PROJECT" -f "$COMPOSE" config >/dev/null

          PREVIOUS_CID=$(docker ps --filter name=deploy-workforce-1 --format '{{.ID}}' | head -1)
          test -n "$PREVIOUS_CID"
          PREVIOUS_IMAGE=$(docker inspect "$PREVIOUS_CID" --format '{{.Config.Image}}')
          PREVIOUS_SHA=$(docker inspect "$PREVIOUS_CID" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^METATRON_COMMIT_SHA=//p' | head -1)
          test -n "$PREVIOUS_IMAGE"
          test -n "$PREVIOUS_SHA"
          case "$PREVIOUS_IMAGE" in
            metatron-workforce:*) PREVIOUS_TAG="${PREVIOUS_IMAGE#metatron-workforce:}" ;;
            *) echo "unexpected previous image: $PREVIOUS_IMAGE" >&2; exit 1 ;;
          esac
          docker image inspect "$PREVIOUS_IMAGE" >/dev/null

          rollback() {
            echo '=== ROLLBACK TO PREVIOUS IMMUTABLE IMAGE ==='
            METATRON_IMAGE_TAG="$PREVIOUS_TAG" METATRON_COMMIT_SHA="$PREVIOUS_SHA" \
              docker compose -p "$PROJECT" -f "$COMPOSE" up -d --no-build --force-recreate workforce || true
          }
          trap rollback ERR

          echo '=== BUILD EXACT TESTED IMAGE FROM RUNNER WORKSPACE ==='
          METATRON_IMAGE_TAG="$SHA" METATRON_COMMIT_SHA="$SHA" \
            docker compose -p "$PROJECT" -f "$COMPOSE" build workforce
          docker image inspect "metatron-workforce:$SHA" >/dev/null

          echo '=== DEPLOY EXACT TESTED IMAGE ==='
          METATRON_IMAGE_TAG="$SHA" METATRON_COMMIT_SHA="$SHA" \
            docker compose -p "$PROJECT" -f "$COMPOSE" up -d --no-build --force-recreate workforce

          echo '=== VERIFY CONTAINER ==='
          CID=$(docker compose -p "$PROJECT" -f "$COMPOSE" ps -q workforce)
          test -n "$CID"
          for i in $(seq 1 90); do
            STATUS=$(docker inspect "$CID" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}')
            [ "$STATUS" = healthy ] && break
            sleep 2
          done
          STATUS=$(docker inspect "$CID" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}')
          test "$STATUS" = healthy
          DEPLOYED_SHA=$(docker inspect "$CID" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^METATRON_COMMIT_SHA=//p' | head -1)
          DEPLOYED_IMAGE=$(docker inspect "$CID" --format '{{.Config.Image}}')
          test "$DEPLOYED_SHA" = "$SHA"
          test "$DEPLOYED_IMAGE" = "metatron-workforce:$SHA"
          docker inspect "$CID" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -q '^METATRON_RUNTIME_EXECUTION_TOKEN=.'

          echo '=== PUBLIC GATEWAY ==='
          curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 5 --max-time 15 https://gate.metatron.vn/telegram/health | grep -q '"status":"UP"'

          echo '=== LOCAL HEALTH ==='
          curl -fsS --connect-timeout 3 --max-time 10 http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'

          echo '=== INTERNET EGRESS ==='
          docker exec "$CID" sh -c 'wget -qO- --timeout=10 https://api.github.com/zen >/dev/null'

          echo '=== TELEGRAM WEBHOOK ==='
          test -n "${TELEGRAM_WEBHOOK_SECRET:-}"
          TEST_UPDATE=$(date +%s%N | cut -c1-15)
          BODY=$(python3 - "$TEST_UPDATE" "${TELEGRAM_ALLOWED_USER_ID:-0}" <<'PY'
          import json,sys
          update=int(sys.argv[1]); uid=int(sys.argv[2])
          print(json.dumps({"update_id":update,"message":{"message_id":update%2000000000,"from":{"id":uid,"is_bot":False,"first_name":"DeployProbe"},"chat":{"id":uid,"type":"private"},"date":0,"text":"/mode"}}))
          PY
          )
          HTTP=$(curl -sS -o /tmp/metatron-deploy-webhook.json -w '%{http_code}' --proto '=https' --tlsv1.2 --connect-timeout 5 --max-time 20 -X POST https://gate.metatron.vn/telegram/webhook -H "X-Telegram-Bot-Api-Secret-Token: $TELEGRAM_WEBHOOK_SECRET" -H 'Content-Type: application/json' --data-binary "$BODY")
          test "$HTTP" = 200

          echo '=== PERFORMANCE SLO ==='
          ELAPSED=$(( $(date +%s) - DEPLOY_STARTED_AT ))
          test "$ELAPSED" -lt 900

          trap - ERR
          echo "PRODUCTION_SHA=$SHA"
          echo "PRODUCTION_IMAGE=metatron-workforce:$SHA"
          echo "DEPLOY_SECONDS=$ELAPSED"
          echo 'PRODUCTION_DEPLOY=PASS'
