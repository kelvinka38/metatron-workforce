name: Production Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'Dockerfile'
      - 'deploy/**'
      - '.github/workflows/production-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  METATRON_VERSION: "0.1.0"

jobs:
  test-and-build:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Test
        run: ./gradlew clean test --no-daemon

      - name: Build
        run: ./gradlew bootJar --no-daemon

      - name: Validate production compose
        run: docker compose -f deploy/docker-compose.yml config

  deploy-production:
    needs: test-and-build
    runs-on: [self-hosted, linux, x64, metatron-prod]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to local production runtime
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          BASE=/opt/metatron/metatron-workforce
          WORKSPACE="$GITHUB_WORKSPACE"

          test -d "$BASE"
          test -f "$BASE/.env"
          test -f "$WORKSPACE/deploy/docker-compose.yml"

          echo "=== SYNC SOURCE TO PRODUCTION ==="
          mkdir -p "$BASE"
          find "$BASE" -mindepth 1 -maxdepth 1 \
            ! -name .env \
            ! -name runtime-state \
            ! -name runtime-evidence \
            -exec rm -rf {} +

          # Copy source without archive metadata preservation. The production
          # workspace is runner-owned; GNU cp -a metadata preservation is not
          # required and can fail on files/directories with restricted metadata.
          cp -r "$WORKSPACE/." "$BASE/"

          cd "$BASE"
          export METATRON_VERSION=0.1.0
          export METATRON_COMMIT_SHA="$SHA"
          export METATRON_ENVIRONMENT=production

          echo "=== VALIDATE COMPOSE ==="
          docker compose --env-file .env -f deploy/docker-compose.yml config >/dev/null

          echo "=== BUILD + START PRODUCTION ==="
          docker compose --env-file .env -f deploy/docker-compose.yml up -d --build

          echo "=== WAIT FOR HEALTH ==="
          healthy=false
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status"[[:space:]]*:[[:space:]]*"UP"'; then
              healthy=true
              break
            fi
            sleep 2
          done

          if [ "$healthy" != true ]; then
            docker compose --env-file .env -f deploy/docker-compose.yml logs --tail 200 workforce
            exit 1
          fi

          deployed_sha=$(docker inspect deploy-workforce-1 --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^METATRON_COMMIT_SHA=//p' | head -1)
          test "$deployed_sha" = "$SHA"

          echo "PRODUCTION_DEPLOYMENT=PASS"
          echo "EXPECTED_SHA=$SHA"
          echo "DEPLOYED_SHA=$deployed_sha"
          echo "IMAGE=$(docker inspect deploy-workforce-1 --format '{{.Config.Image}}')"
          echo "HEALTH=$(curl -fsS http://127.0.0.1:8080/actuator/health)"
