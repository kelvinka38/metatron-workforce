name: Highway Production Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'Dockerfile'
      - 'deploy/**'
      - 'scripts/**'
      - '.github/workflows/production-deploy.yml'
      - '.github/workflows/production-acceptance-highway-v2.yml'
      - '.github/workflows/highway-conformance-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  METATRON_VERSION: "0.1.0"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx384m -XX:MaxMetaspaceSize=192m -Dorg.gradle.workers.max=1 -Dorg.gradle.daemon=false"

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Setup Java 22
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Test and build with bounded memory
        run: ./gradlew clean test bootJar --no-daemon --max-workers=1
      - name: Validate production compose
        run: docker compose -f deploy/docker-compose.yml config >/dev/null
      - name: Upload deployable JAR
        uses: actions/upload-artifact@v7
        with:
          name: metatron-workforce-${{ github.sha }}
          path: build/libs/metatron-workforce-0.1.0.jar
          if-no-files-found: error

  deploy-production:
    needs: test-and-build
    runs-on: [self-hosted, linux, x64, metatron-prod]
    environment: production
    concurrency:
      group: metatron-live-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Download deployable JAR
        uses: actions/download-artifact@v8
        with:
          name: metatron-workforce-${{ github.sha }}
          path: build/libs
      - name: Deploy exact tested artifact with rollback
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BASE=/opt/metatron/metatron-workforce
          WORKSPACE="$GITHUB_WORKSPACE"
          COMPOSE="$WORKSPACE/deploy/docker-compose.yml"
          PROJECT=deploy
          DEPLOY_STARTED_AT=$(date +%s)

          echo '=== PRE-FLIGHT ==='
          test -d "$BASE"
          test -r "$BASE/.env"
          test -f "$WORKSPACE/build/libs/metatron-workforce-${METATRON_VERSION}.jar"
          docker compose -f "$COMPOSE" config >/dev/null

          CURRENT_SHA=$(git -C "$BASE" rev-parse HEAD 2>/dev/null || true)
          BACKUP_DIR="/opt/metatron/backups/$SHA"
          mkdir -p "$BACKUP_DIR"
          if [ -f "$BASE/build/libs/metatron-workforce-${METATRON_VERSION}.jar" ]; then
            cp "$BASE/build/libs/metatron-workforce-${METATRON_VERSION}.jar" "$BACKUP_DIR/previous.jar"
          fi
          printf '%s\n' "$CURRENT_SHA" > "$BACKUP_DIR/previous-sha"

          echo '=== INSTALL EXACT TESTED ARTIFACT ==='
          git -C "$BASE" fetch origin main
          git -C "$BASE" reset --hard "$SHA"
          git -C "$BASE" clean -fd
          mkdir -p "$BASE/build/libs"
          cp "$WORKSPACE/build/libs/metatron-workforce-${METATRON_VERSION}.jar" "$BASE/build/libs/metatron-workforce-${METATRON_VERSION}.jar"

          rollback() {
            echo '=== ROLLBACK ==='
            PREVIOUS_SHA=$(cat "$BACKUP_DIR/previous-sha" 2>/dev/null || true)
            if [ -n "$PREVIOUS_SHA" ]; then
              git -C "$BASE" reset --hard "$PREVIOUS_SHA" || true
            fi
            if [ -f "$BACKUP_DIR/previous.jar" ]; then
              cp "$BACKUP_DIR/previous.jar" "$BASE/build/libs/metatron-workforce-${METATRON_VERSION}.jar" || true
            fi
            (cd "$BASE" && METATRON_COMMIT_SHA="$PREVIOUS_SHA" docker compose -p "$PROJECT" -f deploy/docker-compose.yml up -d --build --force-recreate workforce) || true
          }
          trap rollback ERR

          echo '=== DEPLOY ==='
          cd "$BASE"
          METATRON_COMMIT_SHA="$SHA" docker compose -p "$PROJECT" -f deploy/docker-compose.yml up -d --build --force-recreate workforce

          echo '=== VERIFY CONTAINER ==='
          CID=$(docker compose -p "$PROJECT" -f deploy/docker-compose.yml ps -q workforce)
          test -n "$CID"
          for i in $(seq 1 90); do
            STATUS=$(docker inspect "$CID" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}')
            [ "$STATUS" = healthy ] && break
            sleep 2
          done
          STATUS=$(docker inspect "$CID" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}')
          test "$STATUS" = healthy
          DEPLOYED_SHA=$(docker inspect "$CID" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^METATRON_COMMIT_SHA=//p' | head -1)
          test "$DEPLOYED_SHA" = "$SHA"

          echo '=== PUBLIC GATEWAY ==='
          curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 5 --max-time 15 https://gate.metatron.vn/telegram/health | grep -q '"status":"UP"'

          echo '=== LOCAL HEALTH ==='
          curl -fsS --connect-timeout 3 --max-time 10 http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'

          echo '=== INTERNET EGRESS ==='
          docker exec "$CID" sh -c 'curl -fsS --connect-timeout 5 --max-time 10 https://api.github.com/zen >/dev/null'

          echo '=== TELEGRAM WEBHOOK ==='
          test -n "${TELEGRAM_WEBHOOK_SECRET:-}"
          TEST_UPDATE=$(date +%s%N | cut -c1-15)
          BODY=$(python3 - "$TEST_UPDATE" "${TELEGRAM_ALLOWED_USER_ID:-0}" <<'PY'
          import json,sys
          update=int(sys.argv[1]); uid=int(sys.argv[2])
          print(json.dumps({"update_id":update,"message":{"message_id":update%2000000000,"from":{"id":uid,"is_bot":False,"first_name":"DeployProbe"},"chat":{"id":uid,"type":"private"},"date":0,"text":"/mode"}}))
          PY
          )
          HTTP=$(curl -sS -o /tmp/metatron-deploy-webhook.json -w '%{http_code}' --proto '=https' --tlsv1.2 --connect-timeout 5 --max-time 20 -X POST https://gate.metatron.vn/telegram/webhook -H "X-Telegram-Bot-Api-Secret-Token: $TELEGRAM_WEBHOOK_SECRET" -H 'Content-Type: application/json' --data-binary "$BODY")
          test "$HTTP" = 200

          echo '=== PERFORMANCE SLO ==='
          ELAPSED=$(( $(date +%s) - DEPLOY_STARTED_AT ))
          test "$ELAPSED" -lt 900

          trap - ERR
          echo "PRODUCTION_SHA=$SHA"
          echo "DEPLOY_SECONDS=$ELAPSED"
          echo 'PRODUCTION_DEPLOY=PASS'
