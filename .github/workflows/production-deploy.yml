name: Production Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'Dockerfile'
      - 'deploy/**'
      - 'docs/WORKFORCE_COMPLETION_MATRIX.md'
      - 'docs/phase-12/G12_READINESS_MATRIX.md'
      - 'docs/EXECUTION_RUNTIME_INTEGRATION_CONTRACT.md'
      - '.github/workflows/g12-production-readiness.yml'
      - '.github/workflows/production-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metatron-workforce-production
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 30
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx384m -XX:MaxMetaspaceSize=192m -Dorg.gradle.workers.max=1 -Dorg.gradle.daemon=false"
    steps:
      - name: Verify or repair runner host resilience
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f /swapfile ]; then
            sudo fallocate -l 2G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          elif ! swapon --show=NAME --noheadings | grep -qx '/swapfile'; then
            sudo swapon /swapfile
          fi
          if ! grep -qE '^/swapfile\s+none\s+swap\s+sw' /etc/fstab; then
            echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab >/dev/null
          fi
          sudo systemctl enable docker >/dev/null
          sudo systemctl start docker
          free -h
          swapon --show
          systemctl is-enabled docker
          systemctl is-active docker

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Test and build with bounded memory
        run: ./gradlew clean test bootJar --no-daemon --max-workers=1

      - name: Validate production compose
        run: docker compose -f deploy/docker-compose.yml config >/dev/null

      - name: Upload deployable JAR
        uses: actions/upload-artifact@v4
        with:
          name: workforce-jar
          path: build/libs/metatron-workforce-0.1.0.jar
          retention-days: 1

  deploy-production:
    needs: test-and-build
    runs-on: [self-hosted, linux, x64, metatron-prod]
    environment: production
    timeout-minutes: 30
    env:
      DEPLOY_DIR: /opt/metatron/metatron-workforce
      ENV_FILE: /opt/metatron/metatron-workforce/.env
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download deployable JAR
        uses: actions/download-artifact@v4
        with:
          name: workforce-jar
          path: build/libs

      - name: Verify production inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f build/libs/metatron-workforce-0.1.0.jar
          test -f "$ENV_FILE"
          grep -q '^TELEGRAM_BOT_TOKEN=' "$ENV_FILE"
          grep -q '^TELEGRAM_WEBHOOK_SECRET=' "$ENV_FILE"
          grep -q '^OPENAI_API_KEY=' "$ENV_FILE"
          grep -q '^METATRON_INTERNET_ENABLED=' "$ENV_FILE"
          grep -q '^METATRON_INTERNET_ALLOWLIST=' "$ENV_FILE"

      - name: Stage release
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -m 755 "$DEPLOY_DIR"
          sudo cp deploy/docker-compose.yml "$DEPLOY_DIR/docker-compose.yml"
          sudo cp Dockerfile "$DEPLOY_DIR/Dockerfile"
          sudo cp build/libs/metatron-workforce-0.1.0.jar "$DEPLOY_DIR/metatron-workforce-0.1.0.jar"
          sudo chown -R "$USER":"$USER" "$DEPLOY_DIR"
          cd "$DEPLOY_DIR"
          export METATRON_COMMIT_SHA="$EXPECTED_SHA"
          docker compose --env-file "$ENV_FILE" config >/dev/null
          docker build --label "org.opencontainers.image.revision=$EXPECTED_SHA" -t "metatron-workforce:$EXPECTED_SHA" .

      - name: Deploy candidate with rollback protection
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          PREVIOUS_IMAGE=$(docker inspect deploy-workforce-1 --format '{{.Config.Image}}' 2>/dev/null || true)
          echo "$PREVIOUS_IMAGE" > /tmp/workforce-previous-image
          export METATRON_COMMIT_SHA="$EXPECTED_SHA"
          export WORKFORCE_IMAGE="metatron-workforce:$EXPECTED_SHA"
          docker compose --env-file "$ENV_FILE" up -d --force-recreate workforce
          healthy=false
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8080/actuator/health 2>/dev/null | grep -q '"status"[[:space:]]*:[[:space:]]*"UP"'; then healthy=true; break; fi
            sleep 2
          done
          if [ "$healthy" != true ]; then
            if [ -n "$PREVIOUS_IMAGE" ]; then export WORKFORCE_IMAGE="$PREVIOUS_IMAGE"; docker compose --env-file "$ENV_FILE" up -d --force-recreate workforce; fi
            exit 1
          fi

      - name: Verify production identity and capability
        shell: bash
        run: |
          set -euo pipefail
          rollback() {
            PREVIOUS_IMAGE=$(cat /tmp/workforce-previous-image 2>/dev/null || true)
            if [ -n "$PREVIOUS_IMAGE" ]; then
              cd "$DEPLOY_DIR"; export WORKFORCE_IMAGE="$PREVIOUS_IMAGE"; docker compose --env-file "$ENV_FILE" up -d --force-recreate workforce || true
            fi
          }
          trap 'rollback' ERR
          health=$(curl -fsS http://127.0.0.1:8080/actuator/health)
          echo "$health" | grep -q '"status"[[:space:]]*:[[:space:]]*"UP"'
          curl -fsS http://127.0.0.1:8080/actuator/health/internet | grep -q '"status"[[:space:]]*:[[:space:]]*"UP"'
          curl -fsS --max-time 20 https://gate.metatron.vn/healthz | grep -q '"status":"ok"'
          deployed=$(docker inspect deploy-workforce-1 --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^METATRON_COMMIT_SHA=//p' | head -1)
          test "$deployed" = "$EXPECTED_SHA"
          revision=$(docker image inspect "metatron-workforce:$EXPECTED_SHA" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          test "$revision" = "$EXPECTED_SHA"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "DEPLOYED_SHA=$deployed"
          echo 'IMAGE_REVISION=PASS'
          echo 'PUBLIC_GATEWAY_HEALTH=PASS'
          echo 'INTERNET_EGRESS=PASS'

      - name: Certify production performance
        shell: bash
        run: |
          set -euo pipefail
          rollback() {
            PREVIOUS_IMAGE=$(cat /tmp/workforce-previous-image 2>/dev/null || true)
            if [ -n "$PREVIOUS_IMAGE" ]; then cd "$DEPLOY_DIR"; export WORKFORCE_IMAGE="$PREVIOUS_IMAGE"; docker compose --env-file "$ENV_FILE" up -d --force-recreate workforce || true; fi
          }
          trap 'rollback' ERR
          passed=false
          for batch in 1 2 3; do
            for i in 1 2 3; do curl -fsS --max-time 5 https://gate.metatron.vn/healthz >/dev/null; done
            samples=()
            for i in $(seq 1 20); do samples+=("$(curl -fsS -o /dev/null -w '%{time_total}' --max-time 5 https://gate.metatron.vn/healthz)"); done
            p95=$(printf '%s\n' "${samples[@]}" | sort -n | awk 'NR==19 {print $1}')
            echo "PERFORMANCE_BATCH=$batch PUBLIC_HEALTH_P95_SECONDS=$p95"
            if awk -v p="$p95" 'BEGIN {exit !(p <= 0.500)}'; then passed=true; break; fi
          done
          test "$passed" = true
          current=$(curl -fsS --max-time 20 -o /dev/null -w '%{time_total}' 'http://127.0.0.1:8080/internet/current?query=bitcoin')
          echo "CURRENT_DATA_SECONDS=$current"
          awk -v p="$current" 'BEGIN {exit !(p <= 5.000)}'
          echo 'PERFORMANCE_SLO=PASS'

      - name: Configure and verify Telegram webhook
        shell: bash
        run: |
          set -euo pipefail
          set -a; . "$ENV_FILE"; set +a
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            --data-urlencode 'url=https://gate.metatron.vn/telegram/webhook' \
            --data-urlencode "secret_token=${TELEGRAM_WEBHOOK_SECRET}" \
            --data-urlencode 'drop_pending_updates=false' | grep -q '"ok":true'
          info=$(curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo")
          echo "$info" | grep -q '"url":"https://gate.metatron.vn/telegram/webhook"'
          echo "$info" | grep -q '"pending_update_count":0'
          echo 'SET_WEBHOOK=PASS'

      - name: Production completion summary
        shell: bash
        run: |
          set -euo pipefail
          deployed=$(docker inspect deploy-workforce-1 --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^METATRON_COMMIT_SHA=//p' | head -1)
          test "$deployed" = "$EXPECTED_SHA"
          echo 'PRODUCTION_DEPLOYMENT=PASS'
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "DEPLOYED_SHA=$deployed"
          docker stats --no-stream deploy-workforce-1
          free -h
          swapon --show
