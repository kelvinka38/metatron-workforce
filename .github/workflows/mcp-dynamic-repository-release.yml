name: MCP Dynamic Repository Release

on:
  push:
    branches: [main]
    paths:
      - 'src/main/java/com/metatron/workforce/runtime/CanonicalRepositoryScope.java'
      - 'src/main/java/com/metatron/workforce/management/DirectCodingIngressService.java'
      - 'src/main/resources/sot-enforcement-authority-manifests.json'
      - 'scripts/mcp/**'
      - '.github/workflows/mcp-dynamic-repository-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-dynamic-repository-release
  cancel-in-progress: false

jobs:
  release-g17:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - name: Static release script validation
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/mcp/release-dynamic-repository-g17.sh
          node --check scripts/mcp/patch-dynamic-repository-g17.mjs
          grep -q 'METATRON_DYNAMIC_REPOSITORY_SCOPE_G17' scripts/mcp/patch-dynamic-repository-g17.mjs
          grep -q 'ssh_mcp_self_upgrade' scripts/mcp/release-dynamic-repository-g17.sh
          echo 'MCP_G17_RELEASE_STATIC=PASS'

      - name: Release dynamic Repository Control Plane through fenced MCP broker
        shell: bash
        env:
          MCP_DYNAMIC_REPOSITORY_ACCEPTANCE: kelvinka38/archive
        run: |
          set -euo pipefail
          bash scripts/mcp/release-dynamic-repository-g17.sh "$GITHUB_SHA"
