name: Highway Queue Surface Audit

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Audit workflow queue surface
        shell: bash
        run: |
          set -euo pipefail
          python3 highway/audit_workflow_queue_surface.py
          echo 'HIGHWAY_QUEUE_SURFACE_AUDIT_STRICT=PASS'
