name: Runtime Conformance Point 5 Founder Product Acceptance (Manual Forensic)

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact deployed production SHA to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: metatron-production-forensic-point5
  cancel-in-progress: true

jobs:
  founder-product:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    environment: production
    timeout-minutes: 25
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Accept Founder chat product end to end
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/runtime-conformance-point5.sh
          scripts/runtime-conformance-point5.sh
      - name: Upload Point 5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-conformance-point5-${{ github.run_id }}
          path: /tmp/runtime-conformance-point5-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 90
