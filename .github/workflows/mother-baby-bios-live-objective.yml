name: Mother Baby BIOS Live Objective (Highway Ingress)

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact deployed Workforce SHA to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  enqueue:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Submit Mother and Baby BIOS objective to persistent Highway
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/highway-manual-ingress.sh 'mother-baby-bios-live-objective' '${{ inputs.target_sha }}' '55' "EXPECTED_WORKFORCE_SHA=${{ inputs.target_sha }}"
