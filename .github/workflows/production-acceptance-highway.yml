name: Production Acceptance Highway

on:
  workflow_run:
    workflows: ["Production Deploy"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact deployed production SHA to validate
        required: false
        type: string

permissions:
  contents: read

# The live deployment identity is frozen while the highway runs. Inside this single production
# scheduling slot, independent live checks and isolated production-equivalent stacks execute in
# parallel. Destructive acceptance never mutates the canonical live container/state.
concurrency:
  group: metatron-production-state
  cancel-in-progress: false

jobs:
  highway:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, linux, x64, metatron-prod]
    environment: production
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && (inputs.target_sha != '' && inputs.target_sha || github.sha) || github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Run production highway
        shell: bash
        run: |
          set -euo pipefail
          BASE=/opt/metatron/metatron-workforce
          COMPOSE="$GITHUB_WORKSPACE/deploy/docker-compose.yml"
          OUT=/tmp/metatron-production-highway-${GITHUB_RUN_ID}
          mkdir -p "$OUT"
          test -r "$BASE/.env"
          test -f "$COMPOSE"
          set -a; source "$BASE/.env"; set +a
          test -n "${TELEGRAM_WEBHOOK_SECRET:-}"
          test -n "${TELEGRAM_ALLOWED_USER_ID:-}"
          test -n "${METATRON_ORGANIZATION_ID:-}"
          test -n "${OPENAI_API_KEY:-}${GEMINI_API_KEY:-}${ANTHROPIC_API_KEY:-}"

          LIVE_CID=$(docker ps --filter name=deploy-workforce-1 --format '{{.ID}}' | head -1)
          test -n "$LIVE_CID"
          LIVE_SHA=$(docker inspect "$LIVE_CID" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^METATRON_COMMIT_SHA=//p' | head -1)
          test "$LIVE_SHA" = "$TARGET_SHA"
          test "$(docker inspect "$LIVE_CID" --format '{{.State.Health.Status}}')" = healthy
          docker image inspect "metatron-workforce:$TARGET_SHA" >/dev/null
          echo "HIGHWAY_TARGET_SHA=$TARGET_SHA"
          echo "HIGHWAY_LIVE_SHA=$LIVE_SHA"

          # A Telegram-compatible local sink lets isolated lanes traverse the real provider adapter
          # without sending acceptance noise to the Founder. The canonical live lane still proves the
          # real public Telegram/Gateway boundary.
          SINK_PORT=$((19000 + GITHUB_RUN_ID % 500))
          python3 - "$SINK_PORT" "$OUT/telegram-sink.log" <<'PY' &
          import json,sys
          from http.server import BaseHTTPRequestHandler,ThreadingHTTPServer
          port=int(sys.argv[1]); log=sys.argv[2]
          class H(BaseHTTPRequestHandler):
              counter=1000
              def do_POST(self):
                  n=int(self.headers.get('content-length','0')); body=self.rfile.read(n)
                  H.counter+=1
                  with open(log,'ab') as f: f.write(self.path.encode()+b' '+body+b'\n')
                  payload={"ok":True,"result":{"message_id":H.counter}}
                  raw=json.dumps(payload).encode()
                  self.send_response(200); self.send_header('Content-Type','application/json')
                  self.send_header('Content-Length',str(len(raw))); self.end_headers(); self.wfile.write(raw)
              def log_message(self,*args): pass
          ThreadingHTTPServer(('0.0.0.0',port),H).serve_forever()
          PY
          SINK_PID=$!

          PROJECTS=()
          cleanup() {
            set +e
            for project in "${PROJECTS[@]:-}"; do
              METATRON_STATE_VOLUME_NAME="${project}-state" \
              METATRON_WORKFORCE_NETWORK_NAME="${project}-network" \
              docker compose -p "$project" --env-file "$BASE/.env" -f "$COMPOSE" down -v --remove-orphans >/dev/null 2>&1 || true
            done
            kill "$SINK_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for i in $(seq 1 30); do
            curl -fsS --max-time 1 -X POST "http://127.0.0.1:$SINK_PORT/bottest/sendMessage" -H 'Content-Type: application/json' -d '{}' >/dev/null && break
            sleep 1
          done

          telegram_body() {
            local update="$1" text="$2"
            python3 - "$update" "$text" "$TELEGRAM_ALLOWED_USER_ID" <<'PY'
          import json,sys
          u=int(sys.argv[1]); text=sys.argv[2]; uid=int(sys.argv[3])
          print(json.dumps({"update_id":u,"message":{"message_id":u%2000000000,"from":{"id":uid,"is_bot":False,"first_name":"Founder"},"chat":{"id":uid,"type":"private"},"date":0,"text":text}},ensure_ascii=False))
          PY
          }

          send_local_update() {
            local port="$1" update="$2" text="$3" output="$4"
            local body status
            body=$(telegram_body "$update" "$text")
            status=$(curl -sS -o "$output" -w '%{http_code}' --max-time 20 \
              -X POST "http://127.0.0.1:$port/telegram/webhook" \
              -H "X-Telegram-Bot-Api-Secret-Token: $TELEGRAM_WEBHOOK_SECRET" \
              -H 'Content-Type: application/json' --data-binary "$body")
            test "$status" = 200
          }

          wait_health() {
            local port="$1"
            for i in $(seq 1 60); do
              curl -fsS --max-time 2 "http://127.0.0.1:$port/actuator/health" | grep -q '"status"[[:space:]]*:[[:space:]]*"UP"' && return 0
              sleep 2
            done
            return 1
          }

          start_isolated_lane() {
            local lane="$1" port="$2"
            local project="highway-${GITHUB_RUN_ID}-${lane}"
            PROJECTS+=("$project")
            METATRON_VERSION=0.1.0 \
            METATRON_ENVIRONMENT=production \
            METATRON_IMAGE_TAG="$TARGET_SHA" \
            METATRON_COMMIT_SHA="$TARGET_SHA" \
            METATRON_HOST_PORT="$port" \
            METATRON_STATE_VOLUME_NAME="${project}-state" \
            METATRON_WORKFORCE_NETWORK_NAME="${project}-network" \
            METATRON_WORKFORCE_GATEWAY_ALIAS="workforce-${lane}-${GITHUB_RUN_ID}" \
            METATRON_CONTAINER_MEM_LIMIT=512m \
            METATRON_CONTAINER_MEM_RESERVATION=256m \
            METATRON_CONTAINER_CPUS=0.75 \
            TELEGRAM_API_BASE_URL="http://host.docker.internal:$SINK_PORT" \
            docker compose -p "$project" --env-file "$BASE/.env" -f "$COMPOSE" up -d --no-build --force-recreate
            wait_health "$port"
            local cid
            cid=$(docker compose -p "$project" --env-file "$BASE/.env" -f "$COMPOSE" ps -q workforce)
            test -n "$cid"
            test "$(docker inspect "$cid" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^METATRON_COMMIT_SHA=//p' | head -1)" = "$TARGET_SHA"
            echo "$project|$cid"
          }

          find_objective() {
            local port="$1" update="$2"
            for i in $(seq 1 90); do
              payload=$(curl -fsS --max-time 3 "http://127.0.0.1:$port/workforce/management/objectives" || true)
              oid=$(python3 - "$payload" "$update" <<'PY'
          import json,sys
          try: data=json.loads(sys.argv[1])
          except Exception: raise SystemExit(1)
          needle=f"telegram:update:{sys.argv[2]}"; found=[]
          for row in data if isinstance(data,list) else []:
              if needle in json.dumps(row,sort_keys=True):
                  o=row.get('objective') or {}; oid=o.get('objectiveId') or o.get('objective_id')
                  if oid: found.append(oid)
          found=list(dict.fromkeys(found))
          if len(found)!=1: raise SystemExit(1)
          print(found[0])
          PY
              ) || true
              [ -n "${oid:-}" ] && { echo "$oid"; return 0; }
              sleep 1
            done
            return 1
          }

          wait_objective_terminal() {
            local port="$1" oid="$2"
            for i in $(seq 1 240); do
              payload=$(curl -fsS --max-time 3 "http://127.0.0.1:$port/workforce/management/objectives/$oid" || true)
              state=$(python3 - "$payload" <<'PY'
          import json,sys
          try: d=json.loads(sys.argv[1]); print((d.get('objective') or {}).get('status',''))
          except Exception: print('')
          PY
              )
              case "$state" in
                COMPLETED|DELIVERED) return 0 ;;
                BLOCKED|ESCALATED|CANCELLED) echo "bad_terminal=$state objective=$oid" >&2; return 2 ;;
              esac
              sleep 2
            done
            return 1
          }

          isolated_crash_lane() {
            local lane="$1" port="$2" repo="$3" update="$4"
            set -euo pipefail
            echo "ISOLATED_${lane}=START"
            lane_info=$(start_isolated_lane "$lane" "$port")
            project=${lane_info%%|*}; cid=${lane_info##*|}
            text="Take ownership of one Objective: perform a governed read-only institutional audit of $repo, verify it through Observation, and deliver evidence. Do not mutate anything."
            send_local_update "$port" "$update" "$text" "$OUT/${lane}-ingress.json"
            oid=$(find_objective "$port" "$update")
            test -n "$oid"
            echo "${lane}_OBJECTIVE_ID=$oid"

            # Destructive action is lane-local. Both lanes are killed concurrently by their parent
            # processes; neither touches deploy-workforce-1 or the canonical state volume.
            docker kill "$cid" >/dev/null
            for i in $(seq 1 60); do
              status=$(docker inspect "$cid" --format '{{.State.Health.Status}}' 2>/dev/null || true)
              [ "$status" = healthy ] && break
              sleep 2
            done
            test "$(docker inspect "$cid" --format '{{.State.Health.Status}}')" = healthy
            test "$(docker inspect "$cid" --format '{{.RestartCount}}')" -ge 1
            wait_objective_terminal "$port" "$oid"
            docker exec "$cid" sh -c "grep -q '$oid' /var/lib/metatron-workforce/management-state.json"
            evidence=$(docker exec "$cid" sh -c "grep -R -l -F 'repository=$repo' /var/lib/metatron-workforce/runtime-evidence 2>/dev/null | tail -1")
            test -n "$evidence"
            docker exec "$cid" sh -c "grep -q 'source=gateway-egress/github-api' '$evidence' && grep -q 'verdict=PASS' '$evidence'"
            echo "${lane}_CRASH_RECOVERY=PASS"
            echo "${lane}_REAL_TOOL_EVIDENCE=PASS"
            echo "ISOLATED_${lane}=PASS"
          }

          live_gateway_lane() {
            set -euo pipefail
            curl -fsS --proto '=https' --tlsv1.2 --max-time 10 https://gate.metatron.vn/telegram/health | grep -q '"status":"UP"'
            test "$(docker inspect "$LIVE_CID" --format '{{.State.Health.Status}}')" = healthy
            observed=$(docker inspect "$LIVE_CID" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^METATRON_COMMIT_SHA=//p' | head -1)
            test "$observed" = "$TARGET_SHA"
            echo 'LIVE_PUBLIC_GATEWAY=PASS'
          }

          live_observability_lane() {
            set -euo pipefail
            DASH=$(curl -fsS --max-time 10 http://127.0.0.1:8080/workforce/monitor)
            grep -q 'METATRON WORKFORCE' <<<"$DASH"
            grep -q 'canonical management projection' <<<"$DASH"
            API=$(curl -fsS --max-time 10 -H 'X-Metatron-Actor: human-primary' http://127.0.0.1:8080/workforce/monitor/api/objectives)
            python3 - "$API" <<'PY'
          import json,sys
          rows=json.loads(sys.argv[1]); assert isinstance(rows,list)
          for row in rows:
              for key in ('objectiveId','humanStatus','ownerWorker','staffingState','workItems','executionProof'):
                  assert key in row, (key,row)
          print('LIVE_OBSERVABILITY=PASS')
          PY
          }

          BASE_ID=$(date +%s%N | cut -c1-14)
          PORT_A=$((18100 + GITHUB_RUN_ID % 100))
          PORT_B=$((18200 + GITHUB_RUN_ID % 100))

          # Four first-class lanes start without waiting for each other. Two are live/read-only;
          # two are destructive and production-equivalent but isolated by container, project,
          # network, port, state volume and evidence namespace.
          (
            set +e; live_gateway_lane >"$OUT/live-gateway.log" 2>&1; echo $? >"$OUT/live-gateway.rc"
          ) & P1=$!
          (
            set +e; live_observability_lane >"$OUT/live-observability.log" 2>&1; echo $? >"$OUT/live-observability.rc"
          ) & P2=$!
          (
            set +e; isolated_crash_lane lane-a "$PORT_A" kelvinka38/bios "${BASE_ID}31" >"$OUT/lane-a.log" 2>&1; echo $? >"$OUT/lane-a.rc"
          ) & P3=$!
          (
            set +e; isolated_crash_lane lane-b "$PORT_B" kelvinka38/universal "${BASE_ID}32" >"$OUT/lane-b.log" 2>&1; echo $? >"$OUT/lane-b.rc"
          ) & P4=$!

          echo "HIGHWAY_LANE_PIDS=$P1,$P2,$P3,$P4"
          rc=0
          for pid in "$P1" "$P2" "$P3" "$P4"; do wait "$pid" || rc=1; done

          for lane in live-gateway live-observability lane-a lane-b; do
            echo "===== $lane ====="
            cat "$OUT/$lane.log" || true
            test -f "$OUT/$lane.rc" || rc=1
            [ -f "$OUT/$lane.rc" ] && test "$(cat "$OUT/$lane.rc")" = 0 || rc=1
          done

          # Cross-lane isolation proof: live production identity survived both simultaneous kills.
          test "$(docker inspect "$LIVE_CID" --format '{{.State.Health.Status}}')" = healthy
          FINAL_LIVE_SHA=$(docker inspect "$LIVE_CID" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^METATRON_COMMIT_SHA=//p' | head -1)
          test "$FINAL_LIVE_SHA" = "$TARGET_SHA"

          test "$rc" = 0
          echo 'HIGHWAY_LIVE_PARALLEL_LANES=2'
          echo 'HIGHWAY_ISOLATED_DESTRUCTIVE_LANES=2'
          echo 'HIGHWAY_CONCURRENT_LANES=4'
          echo 'HIGHWAY_STATE_ISOLATION=PASS'
          echo 'HIGHWAY_DESTRUCTIVE_PARALLELISM=PASS'
          echo 'HIGHWAY_LIVE_PRODUCTION_SURVIVED=PASS'
          echo 'PRODUCTION_ACCEPTANCE_HIGHWAY=PASS'

      - name: Upload highway evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-acceptance-highway-${{ github.run_id }}
          path: /tmp/metatron-production-highway-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 90
