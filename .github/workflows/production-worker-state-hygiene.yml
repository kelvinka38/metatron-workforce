name: Production Worker State Hygiene Highway Ingress

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact deployed production SHA
        required: false
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: worker-state-hygiene-highway-ingress
  cancel-in-progress: true

jobs:
  enqueue-hygiene:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Publish immutable control-plane release
        shell: bash
        run: |
          set -euo pipefail
          bash highway/publish-release.sh "$GITHUB_WORKSPACE" "$GITHUB_SHA"
      - name: Submit hygiene mutation to persistent Highway
        shell: bash
        env:
          REQUESTED_TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          TARGET_SHA="${REQUESTED_TARGET_SHA:-$GITHUB_SHA}"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          ENV_FILE="${METATRON_PRODUCTION_ENV_FILE:-$HOME/.metatron/config/workforce.env}"
          test -r "$ENV_FILE"
          set -a
          source "$ENV_FILE"
          source "$HOME/.metatron/highway/highway.env"
          set +a
          bash "$HOME/.metatron/highway/current/ensure-running.sh"
          CTL="python3 $HOME/.metatron/highway/current/highwayctl.py"
          TASK=$($CTL submit             --kind worker-state-hygiene             --source-sha "$GITHUB_SHA"             --priority 30             --dedupe-key "worker-state-hygiene:$TARGET_SHA:$GITHUB_RUN_ID"             --env "TARGET_SHA=$TARGET_SHA"             | python3 -c 'import json,sys; print(json.load(sys.stdin)["task_id"])')
          echo "HIGHWAY_HYGIENE_TASK=$TASK"
          $CTL get "$TASK"
          echo 'WORKER_STATE_HYGIENE_GITHUB_EXECUTION_PLANE=BYPASSED'
          echo 'WORKER_STATE_HYGIENE_HIGHWAY_INGRESS=PASS'
