name: Aquaculture v5 Governed Research Closure (One Shot)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-aq-v5-research-closure-once.yml'

permissions:
  contents: read

jobs:
  closure:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Verify canonical Workforce deployment and execute governed research acceptance through Highway
        shell: bash
        env:
          EXPECTED_WORKFORCE_SHA: e34fe81fcf97e21439c439eb1b0249f0fe89a950
          BUILD_TASK: hw-49e45f2a19614f7790b3
          DEPLOY_TASK: hw-ee9e941f14d44215b17b
        run: |
          set -euo pipefail
          BASE=/opt/metatron/metatron-workforce
          test -r "$BASE/.env"
          test -r "$HOME/.metatron/highway/highway.env"
          set -a
          source "$BASE/.env"
          source "$HOME/.metatron/highway/highway.env"
          set +a
          bash "$HOME/.metatron/highway/current/ensure-running.sh"
          CTL="python3 $HOME/.metatron/highway/current/highwayctl.py"

          echo '=== CANONICAL RELEASE TASKS ==='
          $CTL wait "$BUILD_TASK" --timeout 60 --poll 1
          $CTL wait "$DEPLOY_TASK" --timeout 60 --poll 1

          CID=$(docker ps --filter name=deploy-workforce-1 --format '{{.ID}}' | head -1)
          test -n "$CID"
          LIVE_SHA=$(docker inspect "$CID" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^METATRON_COMMIT_SHA=//p' | head -1)
          test "$LIVE_SHA" = "$EXPECTED_WORKFORCE_SHA"
          curl -fsS --connect-timeout 3 --max-time 10 http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'
          echo "WORKFORCE_PRODUCTION_SHA=$LIVE_SHA"
          echo 'WORKFORCE_PRODUCTION_HEALTH=PASS'

          echo '=== GOVERNED RESEARCH OBJECTIVE VIA CANONICAL HIGHWAY ==='
          OUT=$(bash scripts/highway-manual-ingress.sh \
            'mother-baby-bios-live-objective' \
            "$EXPECTED_WORKFORCE_SHA" \
            '80' \
            "EXPECTED_WORKFORCE_SHA=$EXPECTED_WORKFORCE_SHA")
          printf '%s\n' "$OUT"
          TASK=$(printf '%s\n' "$OUT" | sed -n 's/^HIGHWAY_MANUAL_TASK=//p' | tail -1)
          test -n "$TASK"
          echo "GOVERNED_RESEARCH_HIGHWAY_TASK=$TASK"
          $CTL wait "$TASK" --timeout 900 --poll 2
          $CTL get "$TASK"
          echo 'AQ_V5_WORKFORCE_DEPLOYMENT=PASS'
          echo 'AQ_V5_GOVERNED_RESEARCH_RUNTIME=PASS'
