name: Repository Audit Live Acceptance

on:
  workflow_run:
    workflows: ["Production Deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metatron-repository-audit-live-acceptance
  cancel-in-progress: true

jobs:
  accept-live-repository-execution:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, linux, x64, metatron-prod]
    environment: production
    steps:
      - name: Prove one dispatch audits private BIOS and reaches terminal Work
        shell: bash
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          CID=$(docker ps --filter name=deploy-workforce-1 --format '{{.ID}}' | head -1)
          test -n "$CID"
          DEPLOYED_SHA=$(docker inspect "$CID" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^METATRON_COMMIT_SHA=//p' | head -1)
          test "$DEPLOYED_SHA" = "$TARGET_SHA"
          docker exec "$CID" sh -c 'test -n "$GITHUB_TOKEN"'

          BODY='{"organizationContextId":"METATRON","repository":"kelvinka38/bios"}'
          HTTP_STATUS=$(curl -sS -o /tmp/repository-audit-live.json -w '%{http_code}' -X POST \
            http://127.0.0.1:8080/workforce/execution/repository-audit \
            -H 'Content-Type: application/json' \
            -H 'X-Metatron-Actor: FOUNDER' \
            -H 'X-Metatron-Authority: LIVE-ACCEPTANCE-OBSERVATION-AUTHORITY' \
            -H 'X-Metatron-Authorization: LIVE-ACCEPTANCE-REPOSITORY-READ' \
            -d "$BODY")
          echo "REPOSITORY_AUDIT_HTTP_STATUS=$HTTP_STATUS"
          cat /tmp/repository-audit-live.json
          echo
          test "$HTTP_STATUS" = "200"

          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/repository-audit-live.json'))
          assert d['repository']=='kelvinka38/bios', d
          assert d['workerResult']['worker']=='RepositoryAuditWorker', d
          assert d['workerResult']['status']=='PASS', d
          evidence=d['workerResult']['evidence']
          assert 'source=github-api' in evidence, evidence
          assert 'authenticated=true' in evidence, evidence
          assert 'repository=kelvinka38/bios' in evidence, evidence
          assert 'commitSha=' in evidence, evidence
          assert 'verdict=PASS' in evidence, evidence
          assert d['work']['status']=='COMPLETED', d
          assert d['work']['outcomeRef']=='repository-audit:PASS:kelvinka38/bios', d
          assert any(x.startswith('runtime-evidence:') for x in d['work']['evidenceRefs']), d
          print('PRIVATE_BIOS_REPOSITORY_AUDIT=PASS')
          print('ONE_DISPATCH_TERMINAL_WORK=PASS')
          PY
