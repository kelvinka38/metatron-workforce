name: Audit Current Metatron MCP Runtime

on:
  push:
    branches: [audit/current-metatron-mcp-runtime]
    paths:
      - '.github/workflows/audit-current-metatron-mcp-runtime.yml'

permissions:
  contents: read

concurrency:
  group: audit-current-metatron-mcp-runtime
  cancel-in-progress: true

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Diagnose Claude-compatible MCP handshake
        shell: bash
        run: |
          set -euo pipefail
          MCP_CID=$(docker ps -q --filter name=metatron-ssh-mcp | head -1)
          test -n "$MCP_CID"
          echo '===== PACKAGE ====='
          docker exec "$MCP_CID" sh -lc 'cat /app/package.json 2>/dev/null || true'
          echo '===== SERVER TRANSPORT IMPLEMENTATION ====='
          docker exec "$MCP_CID" sh -lc 'nl -ba /app/server.mjs | sed -n "1,180p"'

          echo '===== PUBLIC INITIALIZE RAW ====='
          H=$(mktemp); B=$(mktemp)
          set +e
          curl -sS -N --max-time 5 -D "$H" -o "$B" \
            -X POST 'https://ssh.metatron.vn/mcp' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -H 'MCP-Protocol-Version: 2025-03-26' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"claude-ai-compat-probe","version":"1.0"}}}'
          RC=$?
          set -e
          echo "CURL_RC=$RC"
          echo '--- HEADERS ---'; sed -n '1,80p' "$H"
          echo '--- BODY SIZE ---'; wc -c "$B"
          echo '--- BODY ---'; cat "$B"; echo

          echo '===== PUBLIC GET RAW ====='
          GH=$(mktemp); GB=$(mktemp)
          set +e
          curl -sS -N --max-time 3 -D "$GH" -o "$GB" \
            -H 'Accept: text/event-stream' \
            -H 'MCP-Protocol-Version: 2025-03-26' \
            'https://ssh.metatron.vn/mcp'
          GRC=$?
          set -e
          echo "GET_CURL_RC=$GRC"
          echo '--- GET HEADERS ---'; sed -n '1,80p' "$GH"
          echo '--- GET BODY SIZE ---'; wc -c "$GB"
          echo '--- GET BODY ---'; head -c 3000 "$GB"; echo

          echo '===== CLAUDE DOMAIN/TLS SURFACE ====='
          curl -sS -I --max-time 5 https://ssh.metatron.vn/mcp | sed -n '1,40p' || true
          echo 'CLAUDE_MCP_HANDSHAKE_DIAGNOSTIC=COMPLETE'