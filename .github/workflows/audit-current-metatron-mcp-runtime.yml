name: Audit Current Metatron MCP Runtime

on:
  push:
    branches: [audit/current-metatron-mcp-runtime]
    paths:
      - '.github/workflows/audit-current-metatron-mcp-runtime.yml'

permissions:
  contents: read

concurrency:
  group: audit-current-metatron-mcp-runtime
  cancel-in-progress: true

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Inspect MCP runtime without exposing credentials
        shell: bash
        run: |
          set -euo pipefail

          echo '===== DOCKER MCP/TUNNEL CANDIDATES ====='
          docker ps --format '{{.Names}}\t{{.Image}}\t{{.Ports}}\t{{.Status}}' | grep -Ei 'mcp|cloudflare|tunnel' || true

          echo '===== PROCESS MCP/TUNNEL CANDIDATES ====='
          ps -ef | grep -Ei '[m]cp|[c]loudflared' | sed -E 's/(token|secret|password|authorization)[^ ]*/REDACTED/Ig' || true

          echo '===== LISTENERS ====='
          ss -ltnp 2>/dev/null | grep -E '(:3000|:8080|:18090)\b' || true

          echo '===== CLOUDFLARE ROUTING CONFIG (NON-SECRET FIELDS ONLY) ====='
          for cfg in /etc/cloudflared/config.yml /etc/cloudflared/config.yaml "$HOME/.cloudflared/config.yml" "$HOME/.cloudflared/config.yaml"; do
            if [ -r "$cfg" ]; then
              echo "CONFIG=$cfg"
              grep -E '^[[:space:]]*(tunnel:|hostname:|service:|protocol:)' "$cfg" || true
            fi
          done

          echo '===== MCP CONTAINER DETAILS ====='
          while IFS= read -r cid; do
            [ -n "$cid" ] || continue
            name=$(docker inspect "$cid" --format '{{.Name}}' | sed 's#^/##')
            image=$(docker inspect "$cid" --format '{{.Config.Image}}')
            echo "CONTAINER=$name IMAGE=$image"
            docker inspect "$cid" --format 'STATE={{.State.Status}} STARTED={{.State.StartedAt}} RESTARTS={{.RestartCount}}'
            docker inspect "$cid" --format 'CMD={{json .Config.Cmd}} ENTRYPOINT={{json .Config.Entrypoint}} PORTS={{json .NetworkSettings.Ports}}'
          done < <(docker ps -q --filter name=mcp)

          probe_get() {
            local url="$1" label="$2"
            local h b code ctype
            h=$(mktemp); b=$(mktemp)
            code=$(curl -sS --max-time 3 -D "$h" -o "$b" -w '%{http_code}' "$url" || true)
            ctype=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{sub(/\r$/,""); print substr($0,index($0,":")+2)}' "$h" | tail -1)
            echo "$label URL=$url STATUS=$code CONTENT_TYPE=${ctype:-none}"
            head -c 400 "$b" | tr '\n' ' '; echo
            rm -f "$h" "$b"
          }

          probe_init() {
            local url="$1" label="$2"
            local h b code ctype session
            h=$(mktemp); b=$(mktemp)
            code=$(curl -sS --max-time 5 -D "$h" -o "$b" -w '%{http_code}' \
              -X POST "$url" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"metatron-mcp-runtime-audit","version":"1.0"}}}' || true)
            ctype=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{sub(/\r$/,""); print substr($0,index($0,":")+2)}' "$h" | tail -1)
            session=$(awk 'BEGIN{IGNORECASE=1} /^mcp-session-id:/{sub(/\r$/,""); print substr($0,index($0,":")+2)}' "$h" | tail -1)
            echo "$label URL=$url STATUS=$code CONTENT_TYPE=${ctype:-none} MCP_SESSION=${session:+present}"
            head -c 1200 "$b" | sed -E 's/(token|secret|password|authorization)[^,}\"]*/REDACTED/Ig' | tr '\n' ' '; echo
            rm -f "$h" "$b"
          }

          echo '===== LOCAL HTTP PROBES ====='
          probe_get 'http://127.0.0.1:3000/' 'LOCAL_ROOT'
          probe_get 'http://127.0.0.1:3000/health' 'LOCAL_HEALTH'
          probe_get 'http://127.0.0.1:3000/mcp' 'LOCAL_MCP_GET'
          probe_get 'http://127.0.0.1:3000/sse' 'LOCAL_SSE_GET'
          probe_init 'http://127.0.0.1:3000/mcp' 'LOCAL_MCP_INIT'

          echo '===== PUBLIC ROUTE PROBES FROM HOST ====='
          probe_get 'https://mcp.metatron.vn/' 'PUBLIC_ROOT'
          probe_get 'https://mcp.metatron.vn/mcp' 'PUBLIC_MCP_GET'
          probe_get 'https://mcp.metatron.vn/sse' 'PUBLIC_SSE_GET'
          probe_init 'https://mcp.metatron.vn/mcp' 'PUBLIC_MCP_INIT'

          echo 'MCP_RUNTIME_AUDIT=PASS'