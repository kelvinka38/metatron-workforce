name: Aquaculture Synthesis v2 Closure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aq-synthesis-v2-closure.yml'

permissions:
  contents: read

jobs:
  close:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Patch, test, and publish exact BIOS candidate
        shell: bash
        run: |
          set -euo pipefail
          BASE=/opt/metatron/metatron-workforce
          set -a; source "$BASE/.env"; set +a
          test -n "${GITHUB_TOKEN:-}"
          W=/tmp/aq-synthesis-v2-closure
          rm -rf "$W"
          git clone --depth 1 --branch aquaculture-decision-synthesis-v2-fix "https://x-access-token:${GITHUB_TOKEN}@github.com/kelvinka38/bios.git" "$W"
          cd "$W"
          git config user.name 'Metatron Selfhosted'
          git config user.email 'metatron@localhost'
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          # 1) Strict owner semantics + evidence-backed commercial-feed relation.
          p=Path('bios_runtime/domains/aquaculture/services.py')
          s=p.read_text()
          old='''        if "khong thuc an cong nghiep" in text or "khong dung thuc an cong nghiep" in text:\n            out.append({"constraint_type":"NO_COMMERCIAL_FEED_REQUIRED","value":True,"scope":{},"authority_ref":actor_id})\n'''
          new='''        if "khong thuc an cong nghiep" in text or "khong dung thuc an cong nghiep" in text:\n            # Zero industrial/commercial feed is both a low-input requirement and a stricter feed-source invariant.\n            out.append({"constraint_type":"LOW_INPUT_REQUIRED","value":True,"scope":{},"authority_ref":actor_id})\n            out.append({"constraint_type":"NO_COMMERCIAL_FEED_REQUIRED","value":True,"scope":{},"authority_ref":actor_id})\n'''
          assert old in s, 'strict feed parser anchor missing'
          s=s.replace(old,new,1)

          old='''            for input_strategy in strategies:\n                proto={"species_set":[species],"production_direction":direction,"culture_method":culture_method,"input_strategy":input_strategy}\n                economics,econ_refs,econ_assumptions=build_reference_economics(self.knowledge,self.repo,species,proto,discovery,farm_location=farm_location or {})\n                cand=synthesize_candidate(species=species,culture_method=culture_method,input_strategy=input_strategy,discovery=discovery,farm_location=farm_location or {},economics=economics,preferred_species=preferred_species,owner_profile=profile,knowledge_refs=base_refs+econ_refs,nutrition_items=nutrition.get("items") or [])\n'''
          new='''            for input_strategy in strategies:\n                proto={"species_set":[species],"production_direction":direction,"culture_method":culture_method,"input_strategy":input_strategy}\n                economics,econ_refs,econ_assumptions=build_reference_economics(self.knowledge,self.repo,species,proto,discovery,farm_location=farm_location or {})\n                relation_refs=[]\n                commercial_feed_relation="REQUIRED" if input_strategy=="COMMERCIAL_FEED" else None\n                if commercial_feed_relation is None:\n                    relation=self.knowledge.query({"knowledge_class":"NUTRITION_REQUIREMENT","subject":species,"property":"commercial_feed_relation","production_context":{"direction":direction,"input_strategy":input_strategy}})\n                    if relation["status"]=="RESOLVED" and relation.get("items"):\n                        commercial_feed_relation=relation["items"][0].get("value")\n                        relation_refs=[x["knowledge_id"] for x in relation.get("items") or []]\n                cand=synthesize_candidate(species=species,culture_method=culture_method,input_strategy=input_strategy,discovery=discovery,farm_location=farm_location or {},economics=economics,preferred_species=preferred_species,owner_profile=profile,knowledge_refs=base_refs+econ_refs+relation_refs,commercial_feed_relation=commercial_feed_relation)\n'''
          assert old in s, 'candidate synthesis anchor missing'
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('bios_runtime/domains/aquaculture/synthesis.py')
          s=p.read_text()
          old='''def synthesize_candidate(*,species:str,culture_method:str,input_strategy:str,discovery:dict,farm_location:dict|None,economics:dict,preferred_species:str|None,owner_profile:dict,knowledge_refs:list[str],nutrition_items:list[dict]|None=None)->dict:\n'''
          new='''def synthesize_candidate(*,species:str,culture_method:str,input_strategy:str,discovery:dict,farm_location:dict|None,economics:dict,preferred_species:str|None,owner_profile:dict,knowledge_refs:list[str],commercial_feed_relation:str|None=None)->dict:\n'''
          assert old in s, 'synthesis signature anchor missing'
          s=s.replace(old,new,1)
          old='''    inp=INPUT_PROFILES.get(input_strategy,INPUT_PROFILES["OPEN"])\n    nutrition_items=list(nutrition_items or [])\n    nutrition_text=" ".join(str(x.get("notes") or "")+" "+str(x.get("value") or "") for x in nutrition_items).casefold()\n    if input_strategy=="COMMERCIAL_FEED": commercial_feed_relation="REQUIRED"\n    elif input_strategy=="MIXED_LOW_INPUT" and any(x in nutrition_text for x in ("pellet","commercial feed","cám","cam")): commercial_feed_relation="PRESENT_IN_REFERENCE"\n    elif input_strategy=="NATURAL" and nutrition_items: commercial_feed_relation="NONE_IN_REFERENCE"\n    else: commercial_feed_relation="UNRESOLVED"\n'''
          new='''    inp=INPUT_PROFILES.get(input_strategy,INPUT_PROFILES["OPEN"])\n    # Feed composition is a governed knowledge fact. Never infer it from free-text notes\n    # because repository knowledge persistence intentionally stores structured semantics only.\n    commercial_feed_relation=("REQUIRED" if input_strategy=="COMMERCIAL_FEED" else str(commercial_feed_relation or "UNRESOLVED").upper())\n'''
          assert old in s, 'free-text feed inference block missing'
          s=s.replace(old,new,1)
          p.write_text(s)

          # 2) Persist the CTU feed-composition fact as structured governed knowledge.
          p=Path('KNOWLEDGE/DOMAINS/AQUACULTURE/data/vietnam_baseline_v1.json')
          data=json.loads(p.read_text())
          kid='aqk-nutrition-requirement-scat-mixed-commercial-feed'
          if not any(x.get('knowledge_id')==kid for x in data['knowledge']):
              data['knowledge'].append({
                  'knowledge_id':kid,
                  'knowledge_class':'NUTRITION_REQUIREMENT',
                  'subject':'Scatophagus argus',
                  'property':'commercial_feed_relation',
                  'value':'PRESENT_IN_REFERENCE',
                  'source_refs':['ctu-scat-natural-feed-2014'],
                  'geographic_scope':{'country':'VN','province':'Bạc Liêu'},
                  'production_context':{'direction':'GROW_OUT','input_strategy':'MIXED_LOW_INPUT'},
                  'epistemic_status':'OBSERVED','validation_status':'VALIDATED','quality':'HIGH'
              })
          data['version']='1.2.1'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')

          # 3) Unknown symbolic target dimensions are not requirements. This restores honest L3 matching
          # without weakening quantity/window/geography checks.
          p=Path('bios_runtime/domains/aquaculture/market.py')
          s=p.read_text()
          old='''def _dimension_match(expected:Any,actual:Any,label:str)->tuple[str,str|None]:\n    if expected in (None,"",{},[]):\n        return "NOT_APPLICABLE",None\n    if actual in (None,"",{},[]):\n        return "UNKNOWN",f"{label} is unresolved in market evidence"\n    return ("MATCH",None) if _norm(expected)==_norm(actual) else ("MISMATCH",f"{label} mismatch")\n'''
          new='''def _dimension_match(expected:Any,actual:Any,label:str)->tuple[str,str|None]:\n    symbolic_unknown={"unknown","unresolved","open","unspecified","not_assessable","none"}\n    if expected in (None,"",{},[]) or (isinstance(expected,str) and _norm(expected) in symbolic_unknown):\n        return "NOT_APPLICABLE",None\n    if actual in (None,"",{},[]) or (isinstance(actual,str) and _norm(actual) in symbolic_unknown):\n        return "UNKNOWN",f"{label} is unresolved in market evidence"\n    return ("MATCH",None) if _norm(expected)==_norm(actual) else ("MISMATCH",f"{label} mismatch")\n'''
          assert old in s, 'market dimension anchor missing'
          s=s.replace(old,new,1)
          p.write_text(s)

          # 4) Farmer UI may only offer commitment when the scenario is actually decision-ready.
          p=Path('bios_runtime/domains/aquaculture/web/app.js')
          s=p.read_text()
          pattern=r'''function scenarioCard\(s,i\)\{.*?\n\}\n\nfunction friendlyMethod'''
          m=re.search(pattern,s,re.S)
          assert m, 'scenarioCard block missing'
          replacement='''function scenarioCard(s,i){\n const pref=s.owner_intent_preferred?'<span class="pill info" style="margin-left:6px">Bạn đang quan tâm</span>':"";\n const cycle=s.production_blueprint?.cycle_duration?.days_reference||s.time_to_cash_days;\n const ready=s.eligibility==="ELIGIBLE"&&Number(s.blocking_unknowns||0)===0&&s.recommendation_state==="FINAL_FOR_CURRENT_EVIDENCE";\n const rejected=s.eligibility==="INELIGIBLE";\n const stateLabel=ready?"Sẵn sàng chốt":rejected?"Không phù hợp":"Cần kiểm chứng";\n const stateTone=ready?"ok":rejected?"bad":"warn";\n return '<div class="scenario-card '+(i===0&&ready?"featured":"")+'">'+\n '<div>'+pill(stateLabel,stateTone)+pref+'</div><div class="small muted">PHƯƠNG ÁN #'+html(s.rank||i+1)+'</div><h3>'+html(s.name)+'</h3><div class="latin">'+html(s.scientific_name)+'</div>'+\n '<div class="scenario-facts">'+fact("Cường độ",label(s.intensity))+fact("Cấu hình",label(s.species_configuration))+fact("Chu kỳ tham chiếu",cycle?num(cycle)+" ngày":"Chưa đủ bằng chứng")+\n fact("Vốn hiện hành",s.capital_required_minor?money(s.capital_required_minor):"Chưa đủ bằng chứng để chốt")+\n fact("Sản lượng tham chiếu",s.production_volume_kg_range?num(s.production_volume_kg_range.min)+"–"+num(s.production_volume_kg_range.max)+" kg":"Chưa đủ bằng chứng")+\n fact("Thị trường",label(s.market_evidence_level)+" · "+(s.market_freshness==="CURRENT"?"mới":s.market_freshness==="STALE"?"cũ":"chưa rõ độ mới"))+fact("Cần làm rõ",num(s.blocking_unknowns)+" điểm")+\n '</div><div class="card-actions"><button class="btn btn-secondary detailScenario" data-i="'+i+'">Xem hồ sơ phương án</button>'+(ready?'<button class="btn btn-primary chooseScenario" data-i="'+i+'">Chọn & chốt</button>':'')+'</div></div>'\n}\n\nfunction friendlyMethod'''
          s=s[:m.start()]+replacement+s[m.end():]
          old=''' '<div class="notice" style="margin-top:15px"><strong>Mức khuyến nghị</strong>'+html(label(s.recommendation_state))+'</div>')\n'''
          new=''' '<div class="notice" style="margin-top:15px"><strong>Trạng thái quyết định</strong>'+html((s.eligibility==="ELIGIBLE"&&Number(s.blocking_unknowns||0)===0&&s.recommendation_state==="FINAL_FOR_CURRENT_EVIDENCE")?"Đủ bằng chứng hiện tại để chọn":s.eligibility==="INELIGIBLE"?"Không phù hợp với hard gate hiện tại":"CHƯA ĐỦ BẰNG CHỨNG ĐỂ KHUYẾN NGHỊ / CHỐT")+'</div>')\n'''
          assert old in s, 'modal recommendation footer missing'
          s=s.replace(old,new,1)
          p.write_text(s)

          # 5) Update old regression expectation: zero commercial feed implies BOTH low-input and strict feed-source constraints.
          p=Path('tests/test_aquaculture_correctness_v13.py')
          s=p.read_text()
          s=s.replace('{"LOW_INPUT_REQUIRED","NO_CHEMICAL_REQUIRED","RENEWABLE_REQUIRED"}.issubset(types)', '{"LOW_INPUT_REQUIRED","NO_COMMERCIAL_FEED_REQUIRED","NO_CHEMICAL_REQUIRED","RENEWABLE_REQUIRED"}.issubset(types)',1)
          s=s.replace('types & {"LOW_INPUT_REQUIRED","NO_CHEMICAL_REQUIRED","RENEWABLE_REQUIRED"}', 'types & {"LOW_INPUT_REQUIRED","NO_COMMERCIAL_FEED_REQUIRED","NO_CHEMICAL_REQUIRED","RENEWABLE_REQUIRED"}',1)
          p.write_text(s)

          # 6) Lock UI readiness and structured feed evidence behavior in regression tests.
          p=Path('tests/test_aquaculture_owner_invariants_v2.py')
          s=p.read_text()
          s=s.replace("self.assertIn('NO_COMMERCIAL_FEED_REQUIRED', types)", "self.assertIn('LOW_INPUT_REQUIRED', types)\n        self.assertIn('NO_COMMERCIAL_FEED_REQUIRED', types)",1)
          p.write_text(s)

          p=Path('tests/test_aquaculture_farmer_ux.py')
          s=p.read_text()
          marker='''    def test_farmer_javascript_has_no_malformed_standalone_function_declarations(self):\n'''
          extra='''    def test_conditional_scenarios_are_not_rendered_as_selectable(self):\n        js=(ROOT/"bios_runtime"/"domains"/"aquaculture"/"web"/"app.js").read_text()\n        self.assertIn('const ready=s.eligibility==="ELIGIBLE"&&Number(s.blocking_unknowns||0)===0&&s.recommendation_state==="FINAL_FOR_CURRENT_EVIDENCE"',js)\n        self.assertIn('CHƯA ĐỦ BẰNG CHỨNG ĐỂ KHUYẾN NGHỊ / CHỐT',js)\n\n'''
          assert marker in s
          if 'test_conditional_scenarios_are_not_rendered_as_selectable' not in s:
              s=s.replace(marker,extra+marker,1)
          p.write_text(s)
          PY

          python3 -m py_compile bios_runtime/domains/aquaculture/services.py bios_runtime/domains/aquaculture/synthesis.py bios_runtime/domains/aquaculture/market.py bios_runtime/domains/aquaculture/rules.py bios_runtime/domains/aquaculture/farmer_workspace.py
          if command -v node >/dev/null 2>&1; then node --check bios_runtime/domains/aquaculture/web/app.js; fi
          python3 -m unittest discover -s tests -v
          git add bios_runtime/domains/aquaculture/services.py bios_runtime/domains/aquaculture/synthesis.py bios_runtime/domains/aquaculture/market.py bios_runtime/domains/aquaculture/web/app.js KNOWLEDGE/DOMAINS/AQUACULTURE/data/vietnam_baseline_v1.json tests/test_aquaculture_correctness_v13.py tests/test_aquaculture_owner_invariants_v2.py tests/test_aquaculture_farmer_ux.py
          git commit -m 'fix(aquaculture): close full-context decision synthesis v2'
          git push origin HEAD:aquaculture-decision-synthesis-v2-fix
          echo "AQ_SYNTHESIS_V2_CANDIDATE_SHA=$(git rev-parse HEAD)"
          echo "AQ_SYNTHESIS_V2_FULL_SUITE=PASS"
