name: Aquaculture v5 Live Research Acceptance Dispatcher

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/aq-v5-live-research-acceptance.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch-canonical-highway-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch existing canonical governed-research acceptance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: e34fe81fcf97e21439c439eb1b0249f0fe89a950
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/mother-baby-bios-live-objective.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"target_sha\":\"$TARGET_SHA\"}}"
          echo "CANONICAL_HIGHWAY_RESEARCH_ACCEPTANCE_DISPATCHED=$TARGET_SHA"
