name: Workforce Autonomy P10 After Deploy

on:
  workflow_run:
    workflows: ["Highway Production Deploy"]
    types: [completed]

permissions:
  contents: read
  actions: write

# This is a dispatch-only handoff. It does not consume the single production runner.
# The two acceptance workflows share their production concurrency group and therefore
# serialize destructive/fault-injection work against the same exact deployed SHA.
concurrency:
  group: workforce-autonomy-p10-after-deploy-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  dispatch-dedicated-slices:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact-SHA GS1/GS2 and GS3/GS4 acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          dispatch() {
            local workflow="$1"
            local payload
            payload=$(python3 - "$TARGET_SHA" <<'PY'
          import json,sys
          print(json.dumps({"ref":"main","inputs":{"target_sha":sys.argv[1]}}))
          PY
            )
            status=$(curl -sS -o /tmp/dispatch-response.json -w '%{http_code}' \
              -X POST "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/dispatches" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Content-Type: application/json' \
              --data-binary "$payload")
            test "$status" = 204
            echo "DISPATCHED_WORKFLOW=$workflow"
          }
          dispatch workforce-autonomy-p10-production-acceptance.yml
          dispatch workforce-autonomy-p10-gs3-gs4-production-acceptance.yml
          echo "P10_DEPLOYED_SHA=$TARGET_SHA"
          echo 'P10_GS1_GS2_HANDOFF=DISPATCHED'
          echo 'P10_GS3_GS4_HANDOFF=DISPATCHED'
