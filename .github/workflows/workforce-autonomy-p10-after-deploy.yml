name: Workforce Autonomy P10 After Deploy

on:
  workflow_run:
    workflows: ["Highway Production Deploy"]
    types: [completed]

permissions:
  contents: read
  actions: write

# Dispatch only GS1/GS2 here. GitHub concurrency groups retain at most one pending run,
# so dispatching both halves back-to-back can replace the first pending acceptance.
# GS3/GS4 is dispatched only after GS1/GS2 succeeds by the dedicated serial handoff.
concurrency:
  group: workforce-autonomy-p10-after-deploy-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  dispatch-gs1-gs2:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact-SHA GS1/GS2 acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          payload=$(python3 - "$TARGET_SHA" <<'PY'
          import json,sys
          print(json.dumps({"ref":"main","inputs":{"target_sha":sys.argv[1]}}))
          PY
          )
          status=$(curl -sS -o /tmp/dispatch-response.json -w '%{http_code}' \
            -X POST "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/workforce-autonomy-p10-production-acceptance.yml/dispatches" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data-binary "$payload")
          test "$status" = 204
          echo "P10_DEPLOYED_SHA=$TARGET_SHA"
          echo 'P10_GS1_GS2_HANDOFF=DISPATCHED'
