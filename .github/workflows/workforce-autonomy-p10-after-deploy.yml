name: Workforce Autonomy P10 After Deploy

on:
  workflow_run:
    workflows: ["Highway Production Deploy"]
    types: [completed]

permissions:
  contents: read
  actions: write

# One GitHub-hosted controller owns the exact-SHA P10 sequence after deployment.
# It does not occupy the production runner; each production acceptance workflow
# remains the canonical evidence owner and is dispatched only after its
# prerequisite has succeeded.
concurrency:
  group: workforce-autonomy-p10-after-deploy-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  exact-sha-p10-controller:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Run exact-SHA GS1/2 to GS3/4 to ratification sequence
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]

          api_get() {
            curl -fsSL               -H "Authorization: Bearer $GH_TOKEN"               -H 'Accept: application/vnd.github+json'               -H 'X-GitHub-Api-Version: 2022-11-28'               "$1"
          }

          dispatch_workflow() {
            local workflow="$1"
            local payload="$2"
            local response="/tmp/dispatch-${workflow##*/}.json"
            local status
            status=$(curl -sS -o "$response" -w '%{http_code}'               -X POST "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/dispatches"               -H "Authorization: Bearer $GH_TOKEN"               -H 'Accept: application/vnd.github+json'               -H 'X-GitHub-Api-Version: 2022-11-28'               -H 'Content-Type: application/json'               --data-binary "$payload")
            test "$status" = 204
          }

          find_successful_run() {
            local workflow="$1"
            local workflow_name="$2"
            api_get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?per_page=100"               | python3 - "$TARGET_SHA" "$workflow_name" <<'PY'
          import json,sys
          target,name=sys.argv[1:3]
          data=json.load(sys.stdin)
          rows=[
              r for r in data.get('workflow_runs',[])
              if r.get('head_sha')==target
              and r.get('name')==name
              and r.get('conclusion')=='success'
          ]
          if rows:
              rows.sort(key=lambda r:(r.get('created_at',''),int(r.get('id',0))), reverse=True)
              print(rows[0]['id'])
          PY
          }

          capture_dispatched_run() {
            local workflow="$1"
            local workflow_name="$2"
            local dispatched_after="$3"
            local response=/tmp/workflow-runs.json
            for _ in $(seq 1 90); do
              api_get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?per_page=100" > "$response"
              if python3 - "$response" "$TARGET_SHA" "$workflow_name" "$dispatched_after" <<'PY' > /tmp/run-id.txt
          import json,sys
          path,target,name,started=sys.argv[1:5]
          data=json.load(open(path))
          rows=[
              r for r in data.get('workflow_runs',[])
              if r.get('head_sha')==target
              and r.get('name')==name
              and r.get('event')=='workflow_dispatch'
              and r.get('created_at','')>=started
          ]
          if not rows:
              raise SystemExit(1)
          rows.sort(key=lambda r:(r.get('created_at',''),int(r.get('id',0))), reverse=True)
          print(rows[0]['id'])
          PY
              then
                cat /tmp/run-id.txt
                return 0
              fi
              sleep 2
            done
            echo "P10_CONTROLLER_RUN_DISCOVERY_TIMEOUT workflow=$workflow target=$TARGET_SHA" >&2
            return 1
          }

          wait_success() {
            local run_id="$1"
            local label="$2"
            local response="/tmp/run-${run_id}.json"
            for _ in $(seq 1 360); do
              api_get "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$response"
              read -r status conclusion < <(python3 - "$response" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          print(d.get('status',''), d.get('conclusion') or '')
          PY
              )
              echo "${label}_RUN_ID=$run_id STATUS=$status CONCLUSION=${conclusion:-pending}"
              if [ "$status" = completed ]; then
                test "$conclusion" = success
                echo "${label}=PASS"
                return 0
              fi
              sleep 10
            done
            echo "${label}_TIMEOUT run_id=$run_id" >&2
            return 1
          }

          dispatch_or_reuse() {
            local workflow="$1"
            local workflow_name="$2"
            local payload="$3"
            local existing started
            existing=$(find_successful_run "$workflow" "$workflow_name" || true)
            if [ -n "$existing" ]; then
              echo "P10_CONTROLLER_REUSE_SUCCESS workflow=$workflow run_id=$existing" >&2
              printf '%s\n' "$existing"
              return 0
            fi
            started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            dispatch_workflow "$workflow" "$payload"
            capture_dispatched_run "$workflow" "$workflow_name" "$started"
          }

          gs12_payload=$(python3 - "$TARGET_SHA" <<'PY'
          import json,sys
          print(json.dumps({"ref":"main","inputs":{"target_sha":sys.argv[1]}}))
          PY
          )
          GS12_RUN_ID=$(dispatch_or_reuse             'workforce-autonomy-p10-production-acceptance.yml'             'Workforce Autonomy P10 Production Acceptance'             "$gs12_payload")
          wait_success "$GS12_RUN_ID" P10_GS1_GS2

          gs34_payload=$(python3 - "$TARGET_SHA" <<'PY'
          import json,sys
          print(json.dumps({"ref":"main","inputs":{"target_sha":sys.argv[1]}}))
          PY
          )
          GS34_RUN_ID=$(dispatch_or_reuse             'workforce-autonomy-p10-gs3-gs4-production-acceptance.yml'             'Workforce Autonomy P10 GS3 GS4 Production Acceptance'             "$gs34_payload")
          wait_success "$GS34_RUN_ID" P10_GS3_GS4

          ratify_payload=$(python3 - "$TARGET_SHA" "$GS12_RUN_ID" "$GS34_RUN_ID" <<'PY'
          import json,sys
          print(json.dumps({
              "ref":"main",
              "inputs":{
                  "target_sha":sys.argv[1],
                  "gs12_run_id":sys.argv[2],
                  "gs34_run_id":sys.argv[3]
              }
          }))
          PY
          )
          RATIFICATION_RUN_ID=$(dispatch_or_reuse             'workforce-autonomy-p10-45-condition-ratification.yml'             'Workforce Autonomy P10 45 Condition Ratification'             "$ratify_payload")
          wait_success "$RATIFICATION_RUN_ID" P10_45_CONDITION_RATIFICATION

          echo "P10_EXACT_SHA=$TARGET_SHA"
          echo "P10_GS12_RUN_ID=$GS12_RUN_ID"
          echo "P10_GS34_RUN_ID=$GS34_RUN_ID"
          echo "P10_RATIFICATION_RUN_ID=$RATIFICATION_RUN_ID"
          echo 'P10_EXACT_SHA_SERIAL_CONTROLLER=PASS'
