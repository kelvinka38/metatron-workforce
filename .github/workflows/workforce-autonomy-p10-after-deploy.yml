name: Workforce Autonomy P10 After Deploy

on:
  workflow_run:
    workflows: ["Production Deploy"]
    types: [completed]

permissions:
  contents: read

# Production Deploy already triggers the dedicated GS1/GS2 and GS3/GS4 workflows.
# Closure Final is intentionally NOT dispatched here: it qualifies those dedicated
# slice results independently and runs only after both succeeded for the same SHA.
concurrency:
  group: workforce-autonomy-p10-after-deploy
  cancel-in-progress: false

jobs:
  record-dedicated-slice-handoff:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Record exact-SHA handoff
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TARGET_SHA"
          echo "P10_DEPLOYED_SHA=$TARGET_SHA"
          echo 'P10_GS1_GS2_HANDOFF=WORKFLOW_RUN_NATIVE'
          echo 'P10_GS3_GS4_HANDOFF=WORKFLOW_RUN_NATIVE'
          echo 'P10_CLOSURE_FINAL=QUALIFIES_DEDICATED_SLICE_RESULTS'
