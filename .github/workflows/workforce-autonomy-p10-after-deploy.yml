name: Workforce Autonomy P10 After Deploy

on:
  workflow_run:
    workflows: ["Production Deploy"]
    types: [completed]

permissions:
  contents: read

# The dedicated GS1/GS2 and GS3/GS4 workflows are already triggered directly by
# successful Production Deploy completion. Do not dispatch Closure Final here:
# that created a third self-hosted production workload which duplicated the
# Golden Slices, competed for the single production runner, and could inject a
# second runtime fault while the authoritative slice workflows were still running.
concurrency:
  group: workforce-autonomy-p10-after-deploy
  cancel-in-progress: false

jobs:
  record-dedicated-slice-handoff:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: [self-hosted, linux, x64, metatron-prod]
    steps:
      - name: Record exact-SHA handoff to dedicated production acceptance
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TARGET_SHA"
          echo "P10_DEPLOYED_SHA=$TARGET_SHA"
          echo 'P10_GS1_GS2_HANDOFF=WORKFLOW_RUN_NATIVE'
          echo 'P10_GS3_GS4_HANDOFF=WORKFLOW_RUN_NATIVE'
          echo 'P10_CLOSURE_FINAL_DISPATCH=DEFERRED_UNTIL_DEDICATED_SLICES_PASS'
