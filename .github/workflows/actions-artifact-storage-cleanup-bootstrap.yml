name: Actions Artifact Storage Cleanup Bootstrap

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/actions-artifact-storage-cleanup-bootstrap.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: actions-artifact-storage-cleanup-bootstrap
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clean superseded GitHub Actions artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          
          DEPLOYED_SHA="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=success&per_page=100" --jq '[.workflow_runs[] | select(.name=="Highway Production Deploy" and .conclusion=="success")][0].head_sha')"
          [[ "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "DEPLOYED_SHA=$DEPLOYED_SHA"
          
          ARTIFACTS="$(mktemp)"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired==false) | [.id,.name,.size_in_bytes,.created_at,(.workflow_run.head_sha // "")] | @tsv' \
            | sort -t $'\t' -k4,4r > "$ARTIFACTS"
          
          declare -A SEEN_FAMILY=()
          declare -A SEEN_DEPLOYED_FAMILY=()
          
          before_bytes=0
          deleted_bytes=0
          deleted_count=0
          retained_count=0
          artifact_count=0
          now_epoch="$(date +%s)"
          
          while IFS=$'\t' read -r id name size created sha; do
            [[ -n "$id" ]] || continue
            artifact_count=$((artifact_count + 1))
            before_bytes=$((before_bytes + size))
          
            family="$(printf '%s' "$name" | sed -E 's/-[0-9a-f]{40}$//; s/-[0-9]+$//')"
            keep=false
            reason=""
          
            if [[ -z "${SEEN_FAMILY[$family]+x}" ]]; then
              SEEN_FAMILY[$family]=1
              keep=true
              reason="latest-family"
            fi
          
            if [[ "$sha" == "$DEPLOYED_SHA" && -z "${SEEN_DEPLOYED_FAMILY[$family]+x}" ]]; then
              SEEN_DEPLOYED_FAMILY[$family]=1
              keep=true
              reason="latest-live-sha-family"
            fi
          
            created_epoch="$(date -d "$created" +%s)"
            age_hours=$(( (now_epoch - created_epoch) / 3600 ))
            if (( age_hours < 6 )); then
              keep=true
              reason="race-safety-under-6h"
            fi
          
            critical=false
            case "$name" in
              metatron-workforce-*|production-acceptance-highway-*|gateway-final-live-acceptance-*|g12-production-readiness-evidence-*|workforce-p10-production-evidence-*|workforce-p10-gs34-production-evidence-*|workforce-p10-final-evidence-*|workforce-p10-accepted-l10-evidence-*)
                critical=true
                ;;
            esac
          
            if [[ "$critical" == false ]]; then
              if [[ "$sha" == "$DEPLOYED_SHA" ]]; then
                keep=true
                reason="unknown-family-live-sha"
              elif (( age_hours < 336 )); then
                keep=true
                reason="unknown-family-under-14d"
              fi
            fi
          
            if [[ "$keep" == true ]]; then
              retained_count=$((retained_count + 1))
              echo "KEEP id=$id bytes=$size sha=$sha reason=$reason name=$name"
              continue
            fi
          
            err_file="$(mktemp)"
            if gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" 2>"$err_file"; then
              deleted_bytes=$((deleted_bytes + size))
              deleted_count=$((deleted_count + 1))
              echo "DELETED id=$id bytes=$size sha=$sha name=$name"
            elif grep -q 'HTTP 404' "$err_file"; then
              deleted_bytes=$((deleted_bytes + size))
              deleted_count=$((deleted_count + 1))
              echo "ALREADY_DELETED id=$id bytes=$size sha=$sha name=$name"
            else
              cat "$err_file" >&2
              exit 1
            fi
            rm -f "$err_file"
          done < "$ARTIFACTS"
          
          after_estimate=$((before_bytes - deleted_bytes))
          echo "CLEANUP_ARTIFACTS_BEFORE=$artifact_count"
          echo "CLEANUP_BYTES_BEFORE=$before_bytes"
          echo "CLEANUP_ARTIFACTS_DELETED=$deleted_count"
          echo "CLEANUP_BYTES_DELETED=$deleted_bytes"
          echo "CLEANUP_BYTES_AFTER_ESTIMATE=$after_estimate"
          echo "CLEANUP_ARTIFACTS_RETAINED=$retained_count"
          echo "CLEANUP_DEPLOYED_SHA=$DEPLOYED_SHA"
          echo "ACTIONS_ARTIFACT_CLEANUP=PASS"
