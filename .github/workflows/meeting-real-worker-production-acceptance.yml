          echo 'WORKER_ID_PERSISTED_AS_MEETING_PARTICIPANT=PASS'
          echo 'MULTI_TURN_MEETING_CONTINUITY=PASS'
          echo 'GATEWAY_DIRECTOR_WORK_ORDER_END_TO_END=PASS'
          echo 'NO_SHADOW_ROLE_SIMULATION=PASS'
          echo 'ACTIVE_WORKER_DIRECTORY=PASS'
          echo 'MEETING_REAL_WORKER_PRODUCTION_ACCEPTANCE=PASS'
 /var/lib/metatron-workforce/runtime-state/*.properties 2>/dev/null | head -1")
