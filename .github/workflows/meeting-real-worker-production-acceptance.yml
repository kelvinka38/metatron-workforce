name: Meeting Real Worker Highway Ingress

on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: meeting-real-worker-highway-ingress
  cancel-in-progress: true

jobs:
  enqueue-meeting-acceptance:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - name: Publish immutable control-plane release
        shell: bash
        run: |
          set -euo pipefail
          bash highway/publish-release.sh "$GITHUB_WORKSPACE" "$GITHUB_SHA"

      - name: Submit Meeting acceptance to persistent Highway
        shell: bash
        run: |
          set -euo pipefail
          ENV_FILE="${METATRON_PRODUCTION_ENV_FILE:-$HOME/.metatron/config/workforce.env}"
          test -r "$ENV_FILE"
          set -a
          source "$ENV_FILE"
          source "$HOME/.metatron/highway/highway.env"
          set +a
          bash "$HOME/.metatron/highway/current/ensure-running.sh"
          CTL="python3 $HOME/.metatron/highway/current/highwayctl.py"
          TASK=$($CTL submit             --kind meeting-real-worker             --source-sha "$GITHUB_SHA"             --dedupe-key "meeting-real-worker:$GITHUB_SHA:$GITHUB_RUN_ID"             --priority 60             | python3 -c 'import json,sys; print(json.load(sys.stdin)["task_id"])')
          echo "HIGHWAY_MEETING_TASK=$TASK"
          $CTL get "$TASK"
          echo 'MEETING_GITHUB_EXECUTION_PLANE=BYPASSED'
          echo 'MEETING_HIGHWAY_INGRESS=PASS'
