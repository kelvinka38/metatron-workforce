name: Runtime Intelligence Diagnose

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-intelligence-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    steps:
      - name: Capture recent Workforce intelligence logs
        shell: bash
        run: |
          set -euo pipefail
          CID=$(docker ps --filter name=deploy-workforce-1 -q | head -1)
          test -n "$CID"
          echo "CONTAINER=$CID"
          echo '=== RECENT INTELLIGENCE / TELEGRAM ERRORS ==='
          docker logs --since 45m "$CID" 2>&1 | grep -E 'telegram_|intelligence|llm|provider|web_search|ERROR|Exception|failed|timeout|HTTP' | tail -n 500 || true
