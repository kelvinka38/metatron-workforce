name: Highway Execution Fabric Acceptance

on:
  workflow_dispatch:
permissions:
  contents: read
  statuses: write

concurrency:
  group: highway-fabric-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Verify scheduler contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s highway/tests -v
          python3 -m py_compile highway/highwayd.py highway/highwayctl.py
          bash -n highway/install.sh highway/ensure-running.sh highway/publish-release.sh
          for script in scripts/highway-tasks/*.sh; do bash -n "$script"; done

          TMP_HIGHWAY=$(mktemp -d)
          cleanup_tmp_highway() { rm -rf "$TMP_HIGHWAY"; }
          trap cleanup_tmp_highway EXIT
          for n in 1 2 3 4; do
            METATRON_HIGHWAY_INSTALL_DIR="$TMP_HIGHWAY" \
              bash highway/publish-release.sh "$GITHUB_WORKSPACE" "$GITHUB_SHA" >"/tmp/highway-publish-$n.log" 2>&1 &
          done
          wait
          test "$(cat "$TMP_HIGHWAY/releases/$GITHUB_SHA/.highway-source-sha")" = "$GITHUB_SHA"
          test -f "$TMP_HIGHWAY/releases/$GITHUB_SHA/scripts/highway-tasks/workforce-build.sh"
          test "$(find "$TMP_HIGHWAY/releases" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1
          SOURCE_HASH=$(sha256sum "$TMP_HIGHWAY/releases/$GITHUB_SHA/scripts/highway-tasks/workforce-build.sh")
          METATRON_HIGHWAY_INSTALL_DIR="$TMP_HIGHWAY" \
            bash highway/publish-release.sh "$GITHUB_WORKSPACE" "$GITHUB_SHA" >/tmp/highway-republish.log
          test "$SOURCE_HASH" = "$(sha256sum "$TMP_HIGHWAY/releases/$GITHUB_SHA/scripts/highway-tasks/workforce-build.sh")"
          echo 'HIGHWAY_ATOMIC_IMMUTABLE_RELEASE_PUBLICATION=PASS'

          python3 - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('highway/task-registry.json').read_text())
          required={
            'workforce-build','workforce-deploy','production-highway-fast',
            'work-observability','control-room-fast','bios-deploy',
            'meeting-real-worker','general-engineering-go1','production-highway-full',
            'worker-state-hygiene','runtime-closure'
          }
          assert required <= set(reg['tasks']), required-set(reg['tasks'])
          install=Path('highway/install.sh').read_text()
          publish=Path('highway/publish-release.sh').read_text()
          build_task=Path('scripts/highway-tasks/workforce-build.sh').read_text()
          deploy_task=Path('scripts/highway-tasks/workforce-deploy.sh').read_text()
          closure_task=Path('scripts/highway-tasks/runtime-closure.sh').read_text()
          assert 'rm -rf "$RELEASE"' not in install
          assert 'rm -rf "$RELEASE"' not in publish
          assert 'HIGHWAY_BUILD_WORKSPACE_ISOLATION=PASS' in build_task
          assert 'HIGHWAY_ARTIFACT_SEALED=' in build_task
          assert 'HIGHWAY_SEALED_ARTIFACT_IDENTITY=PASS' in deploy_task
          assert 'HIGHWAY_DEPLOY_WORKSPACE_ISOLATION=PASS' in deploy_task
          assert 'HIGHWAY_RUNTIME_CLOSURE=PASS' in closure_task
          assert 'HIGHWAY_POST_DEPLOY_PARALLEL_FANOUT=PASS' in closure_task
          build_resources={(x['name'],x['mode']) for x in reg['tasks']['workforce-build']['resources']}
          deploy_resources={(x['name'],x['mode']) for x in reg['tasks']['workforce-deploy']['resources']}
          assert ('source-release:{source_sha}','READ') in build_resources
          assert ('artifact:{source_sha}','WRITE') in build_resources
          assert ('source-release:{source_sha}','READ') in deploy_resources
          assert ('artifact:{source_sha}','READ') in deploy_resources
          assert ('prod:workforce','WRITE') in deploy_resources
          fanout=set(reg['tasks']['workforce-deploy'].get('on_success',[]))
          assert {'production-highway-fast','work-observability','control-room-fast','runtime-closure'} <= fanout
          closure_resources={(x['name'],x['mode']) for x in reg['tasks']['runtime-closure']['resources']}
          assert ('prod:workforce','READ') in closure_resources
          deploy=Path('.github/workflows/production-deploy.yml').read_text()
          assert 'name: Highway Release Ingress' in deploy
          assert 'bash highway/install.sh "$GITHUB_WORKSPACE" "$GITHUB_SHA"' in deploy
          assert 'HIGHWAY_EXACT_CONTROL_PLANE_ACTIVE=PASS' in deploy
          assert '--kind workforce-build' in deploy and '--kind workforce-deploy' in deploy
          assert './gradlew clean test bootJar' not in deploy
          assert 'docker compose' not in deploy
          migrated=[
            '.github/workflows/bios-production-deploy.yml',
            '.github/workflows/meeting-real-worker-production-acceptance.yml',
            '.github/workflows/general-engineering-go1-production-acceptance.yml',
            '.github/workflows/production-acceptance-highway-v2.yml',
            '.github/workflows/work-observability-production-acceptance.yml',
            '.github/workflows/workplace-control-room-production-acceptance.yml',
            '.github/workflows/production-worker-state-hygiene.yml',
          ]
          for path in migrated:
              text=Path(path).read_text()
              assert 'runs-on: [self-hosted, linux, x64, metatron-prod]' in text
              assert 'highwayctl.py' in text, path
              assert 'workflow_run:' not in text, path
          print('HIGHWAY_GITHUB_INGRESS_ONLY_CONTRACT=PASS')
          PY
          echo 'HIGHWAY_SCHEDULER_UNIT_CONTRACT=PASS'
          echo 'HIGHWAY_TASK_SCRIPT_SYNTAX=PASS'

      - name: Install persistent Highway service
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          bash highway/install.sh "$GITHUB_WORKSPACE" "$GITHUB_SHA"
          test "$(cat "$HOME/.metatron/highway/releases/$GITHUB_SHA/.highway-source-sha")" = "$GITHUB_SHA"
          echo 'HIGHWAY_HOST_SERVICE_INSTALL=PASS'

      - name: Prove unrelated work executes concurrently
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          ENV_FILE="${METATRON_PRODUCTION_ENV_FILE:-$HOME/.metatron/config/workforce.env}"
          test -r "$ENV_FILE"
          set -a; source "$ENV_FILE"; set +a
          set -a; source "$HOME/.metatron/highway/highway.env"; set +a
          bash "$HOME/.metatron/highway/current/ensure-running.sh"
          CTL="python3 $HOME/.metatron/highway/current/highwayctl.py"
          $CTL health

          submit() {
            local kind="$1" dedupe="$2"
            $CTL submit --kind "$kind" --source-sha "$GITHUB_SHA" --dedupe-key "$dedupe"               | python3 -c 'import json,sys; print(json.load(sys.stdin)["task_id"])'
          }

          PREFIX="fabric-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          R1=$(submit fabric-probe-read "$PREFIX-r1")
          R2=$(submit fabric-probe-read "$PREFIX-r2")
          OTHER=$(submit fabric-probe-unrelated "$PREFIX-other")
          WRITE=$(submit fabric-probe-write "$PREFIX-write")

          $CTL wait "$R1" --timeout 30 >/tmp/highway-r1.json
          $CTL wait "$R2" --timeout 30 >/tmp/highway-r2.json
          $CTL wait "$OTHER" --timeout 30 >/tmp/highway-other.json
          $CTL wait "$WRITE" --timeout 30 >/tmp/highway-write.json

          $CTL get "$R1" > /tmp/highway-r1.json
          $CTL get "$R2" > /tmp/highway-r2.json
          $CTL get "$OTHER" > /tmp/highway-other.json
          $CTL get "$WRITE" > /tmp/highway-write.json

          python3 - /tmp/highway-r1.json /tmp/highway-r2.json /tmp/highway-other.json /tmp/highway-write.json <<'PY'
          import json,sys
          from datetime import datetime
          rows=[json.load(open(p)) for p in sys.argv[1:]]
          r1,r2,other,write=rows
          def t(v): return datetime.fromisoformat(v.replace('Z','+00:00')).timestamp()
          for row in rows:
              assert row['state']=='SUCCEEDED',row
          read_start=max(t(r1['started_at']),t(r2['started_at']))
          read_finish=min(t(r1['finished_at']),t(r2['finished_at']))
          assert read_start < read_finish, 'READ tasks did not overlap'

          independent_starts=[t(r1['started_at']),t(r2['started_at']),t(other['started_at'])]
          start_spread=max(independent_starts)-min(independent_starts)
          assert start_spread < 2.0, f'independent work was not dispatched promptly: start_spread={start_spread}'

          all_readers_finished=max(t(r1['finished_at']),t(r2['finished_at']))
          assert t(write['started_at']) >= all_readers_finished - 0.05, 'WRITE started while a reader still held the resource'

          wall=max(t(x['finished_at']) for x in rows)-min(t(x['started_at']) for x in rows)
          print(f'HIGHWAY_INDEPENDENT_START_SPREAD_SECONDS={start_spread:.3f}')
          print(f'HIGHWAY_PROBE_WALL_SECONDS={wall:.3f}')
          print('HIGHWAY_READ_READ_PARALLEL=PASS')
          print('HIGHWAY_UNRELATED_RESOURCE_PARALLEL=PASS')
          print('HIGHWAY_WRITE_CONFLICT_SERIALIZATION=PASS')
          print('HIGHWAY_ZERO_UNNECESSARY_QUEUE=PASS')
          PY

          $CTL stats
          echo 'HIGHWAY_EXECUTION_FABRIC_ACCEPTANCE=PASS'
