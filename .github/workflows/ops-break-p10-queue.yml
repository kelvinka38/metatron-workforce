name: Break Legacy P10 Production Queue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-break-p10-queue.yml'

permissions:
  contents: read

concurrency:
  group: metatron-workforce-autonomy-p10-production-acceptance
  cancel-in-progress: true

jobs:
  break-legacy-p10-queue:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'P10_LEGACY_QUEUE_BREAKER=PASS'
          echo 'Automatic deep ratification is being removed from the per-commit production path.'
