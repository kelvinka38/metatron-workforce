name: Phase 9 D3

on:
  push:
    branches:
      - phase9-d3-g9-closure
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
      - name: Run full regression suite
        run: bash ./gradlew clean test
