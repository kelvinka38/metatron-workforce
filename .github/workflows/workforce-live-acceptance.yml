name: Workforce Live Acceptance

# Legacy production-mutating acceptance is intentionally disabled.
# Historical versions of this workflow created synthetic W-<sha>-<run>-<attempt>
# Workers directly in the durable production Workforce Core. Those records are
# preserved for audit but MUST never be created again.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-acceptance-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain replacement
        shell: bash
        run: |
          set -euo pipefail
          cat <<'EOF'
          WORKFORCE_LIVE_ACCEPTANCE=DISABLED
          reason=legacy workflow mutated durable production Workforce Core with synthetic acceptance Workers
          replacement=CI/in-memory acceptance + exact production read/observe acceptance only
          production_mutation=PROHIBITED
          EOF
