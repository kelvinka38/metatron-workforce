name: Workforce Live Acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/workforce-live-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metatron-workforce-live-acceptance
  cancel-in-progress: false

jobs:
  accept-live-management:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    environment: production
    steps:
      - name: Verify live delegated management lifecycle
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL='http://127.0.0.1:8080/workforce/management'
          SUFFIX="${GITHUB_SHA:0:12}"
          OBJ="OBJ-LIVE-ACCEPT-${SUFFIX}"
          INITIATOR="HUMAN-LIVE-ACCEPT-${SUFFIX}"
          DIRECTOR="WORKER-GATEWAY-DIRECTOR-${SUFFIX}"
          AUTHORITY="AUTHORITY-LIVE-ACCEPT-${SUFFIX}"
          AUTHZ="AUTHORIZATION-LIVE-ACCEPT-${SUFFIX}"
          ASSIGN="ASSIGN-LIVE-ACCEPT-${SUFFIX}"

          echo '=== LOCAL PRODUCTION HEALTH ==='
          curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status"[[:space:]]*:[[:space:]]*"UP"'

          echo '=== FOUNDER/UPSTREAM ACTOR -> DIRECTOR OBJECTIVE DELEGATION ==='
          curl -fsS -X POST "$BASE_URL/objectives" \
            -H 'Content-Type: application/json' \
            -H "X-Metatron-Actor: $INITIATOR" \
            -d "{\"objectiveId\":\"$OBJ\",\"ownerWorkerId\":\"$DIRECTOR\",\"organizationContextId\":\"ORG-GATEWAY\",\"description\":\"Deliver Gateway V2 according to approved specification\",\"initiatingActorId\":\"$INITIATOR\",\"authorityReference\":\"$AUTHORITY\",\"authorizationReference\":\"$AUTHZ\"}" \
            >/tmp/workforce-live-objective.json

          DIRECTOR="$DIRECTOR" python3 - <<'PY'
          import json, os
          with open('/tmp/workforce-live-objective.json') as f:
              data=json.load(f)
          assert data['status']=='ACTIVE', data
          assert data['ownerWorkerId']==os.environ['DIRECTOR'], data
          print('OBJECTIVE_DELEGATION=PASS')
          PY

          echo '=== DIRECTOR CAPACITY GAP / STAFFING NEED ==='
          curl -fsS -X POST "$BASE_URL/objectives/$OBJ/capacity" \
            -H 'Content-Type: application/json' \
            -H "X-Metatron-Actor: $DIRECTOR" \
            -d '{"requiredCapability":"gateway-engineering","requiredCapacity":2,"availableCapacity":0}' \
            >/tmp/workforce-live-capacity.json

          python3 - <<'PY'
          import json
          with open('/tmp/workforce-live-capacity.json') as f:
              data=json.load(f)
          need=data['staffingNeed']
          assert need is not None, data
          assert float(need['capacityGap'])==2.0, data
          print('STAFFING_NEED=PASS')
          PY

          echo '=== DIRECTOR ASSIGNMENT ATTRIBUTION ==='
          curl -fsS -X POST "$BASE_URL/objectives/$OBJ/assignments" \
            -H 'Content-Type: application/json' \
            -H "X-Metatron-Actor: $DIRECTOR" \
            -d "{\"assignmentReference\":\"$ASSIGN\"}" \
            >/tmp/workforce-live-assignment.json

          echo '=== NON-OWNER ACTION MUST BE FORBIDDEN ==='
          HTTP_CODE=$(curl -sS -o /tmp/workforce-live-spoof.json -w '%{http_code}' -X POST "$BASE_URL/objectives/$OBJ/capacity" \
            -H 'Content-Type: application/json' \
            -H 'X-Metatron-Actor: WORKER-UNAUTHORIZED' \
            -d '{"requiredCapability":"gateway-engineering","requiredCapacity":1,"availableCapacity":0}')
          test "$HTTP_CODE" = "403"
          grep -q '"error":"forbidden"' /tmp/workforce-live-spoof.json
          echo "NON_OWNER_REJECTED_HTTP=$HTTP_CODE"

          echo '=== RECOVERY LOOP ==='
          curl -fsS -X POST "$BASE_URL/objectives/$OBJ/blocked" \
            -H 'Content-Type: application/json' \
            -H "X-Metatron-Actor: $DIRECTOR" \
            -d '{"reason":"acceptance simulated blocker"}' >/tmp/workforce-live-blocked.json
          curl -fsS -X POST "$BASE_URL/objectives/$OBJ/recover" \
            -H 'Content-Type: application/json' \
            -H "X-Metatron-Actor: $DIRECTOR" \
            -d '{"recoveryPlan":"acceptance local recovery"}' >/tmp/workforce-live-recovered.json

          echo '=== EVIDENCE-BOUND DELIVERY ==='
          curl -fsS -X POST "$BASE_URL/objectives/$OBJ/deliver" \
            -H 'Content-Type: application/json' \
            -H "X-Metatron-Actor: $DIRECTOR" \
            -d "{\"evidenceReferences\":[\"evidence:live-acceptance:$SUFFIX\"]}" \
            >/tmp/workforce-live-delivered.json

          echo '=== DURABLE HISTORY / ATTRIBUTION VIEW ==='
          curl -fsS "$BASE_URL/objectives/$OBJ" >/tmp/workforce-live-view.json
          OBJ="$OBJ" INITIATOR="$INITIATOR" DIRECTOR="$DIRECTOR" AUTHZ="$AUTHZ" ASSIGN="$ASSIGN" python3 - <<'PY'
          import json, os
          with open('/tmp/workforce-live-view.json') as f:
              data=json.load(f)
          objective=data['objective']
          history=data['history']
          assert objective['objectiveId']==os.environ['OBJ'], data
          assert objective['ownerWorkerId']==os.environ['DIRECTOR'], data
          assert objective['status']=='DELIVERED', data
          assert os.environ['ASSIGN'] in objective['assignmentRefs'], data
          assert any(e['type']=='OBJECTIVE_ACCEPTED' and e['actorWorkerId']==os.environ['INITIATOR'] and os.environ['AUTHZ'] in e['detail'] for e in history), history
          assert any(e['type']=='STAFFING_NEED_DETECTED' for e in history), history
          assert any(e['type']=='BLOCKED' for e in history), history
          assert any(e['type']=='LOCAL_RECOVERY' for e in history), history
          assert any(e['type']=='DELIVERED' for e in history), history
          print('LIVE_MANAGEMENT_LIFECYCLE=PASS')
          PY

          echo '=== PUBLIC BOUNDARY ISOLATION ==='
          PUBLIC_CODE=$(curl -sS --max-time 10 -o /tmp/workforce-public-boundary.txt -w '%{http_code}' \
            "https://gate.metatron.vn/workforce/management/objectives/$OBJ" || true)
          test "$PUBLIC_CODE" = "404"
          echo "PUBLIC_MANAGEMENT_ROUTE_HTTP=$PUBLIC_CODE"
          echo 'PUBLIC_MANAGEMENT_ROUTE_ISOLATION=PASS'

          echo 'WORKFORCE_LIVE_ACCEPTANCE=PASS'
