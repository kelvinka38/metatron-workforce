name: Cancel Bot Deep P10 Runs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-cancel-bot-deep-p10.yml'

permissions:
  contents: read
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel active bot-dispatched deep P10 runs
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 34027335912 34027343977; do
            code=$(curl -sS -o "/tmp/cancel-$run_id.json" -w '%{http_code}'               -X POST               -H "Authorization: Bearer $GH_TOKEN"               -H 'Accept: application/vnd.github+json'               -H 'X-GitHub-Api-Version: 2022-11-28'               "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel")
            case "$code" in
              202|409) echo "BOT_P10_CANCEL=$run_id:$code" ;;
              *) cat "/tmp/cancel-$run_id.json" >&2; exit 1 ;;
            esac
          done
          echo 'BOT_DEEP_P10_RESIDUAL_RUNS_CANCELLED=PASS'
