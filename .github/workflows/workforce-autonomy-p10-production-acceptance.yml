name: Workforce Autonomy P10 Production Acceptance
run-name: P10 GS12 ${{ inputs.target_sha }}

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact deployed SHA to validate; defaults to dispatched ref SHA
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: metatron-production-lane
  cancel-in-progress: false

jobs:
  golden-slices-1-and-2:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, linux, x64, metatron-prod]
    environment: production
    timeout-minutes: 45
    steps:
      - name: Checkout exact acceptance source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.target_sha != '' && inputs.target_sha || github.sha) || github.event.workflow_run.head_sha }}
      - name: Run strict autonomous production slices
        shell: bash
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && (inputs.target_sha != '' && inputs.target_sha || github.sha) || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          BASE=/opt/metatron/metatron-workforce
          EVIDENCE=/tmp/workforce-p10-${GITHUB_RUN_ID}
          mkdir -p "$EVIDENCE"
          test -r "$BASE/.env"
          set -a; source "$BASE/.env"; set +a
          test -n "${TELEGRAM_WEBHOOK_SECRET:-}"
          test -n "${TELEGRAM_ALLOWED_USER_ID:-}"

          CID=$(docker ps --filter name=deploy-workforce-1 --format '{{.ID}}' | head -1)
          SANDBOX_CID=$(docker ps --filter name=deploy-workforce-sandbox-1 --format '{{.ID}}' | head -1)
          test -n "$CID"
          test -n "$SANDBOX_CID"
          DEPLOYED_SHA=$(docker inspect "$CID" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^METATRON_COMMIT_SHA=//p' | head -1)
          test "$DEPLOYED_SHA" = "$TARGET_SHA"
          test "$(docker inspect "$CID" --format '{{.State.Health.Status}}')" = healthy
          test "$(docker inspect "$SANDBOX_CID" --format '{{.State.Health.Status}}')" = healthy
          printf 'target_sha=%s\ndeployed_sha=%s\ncontainer=%s\nsandbox_container=%s\n' "$TARGET_SHA" "$DEPLOYED_SHA" "$CID" "$SANDBOX_CID" > "$EVIDENCE/deployment.txt"

          submit_objective() {
            local label="$1"
            local text="$2"
            local update_id="$3"
            local body="$EVIDENCE/${label}-request.json"
            local response="$EVIDENCE/${label}-response.json"
            local duplicate_response="$EVIDENCE/${label}-duplicate-response.json"
            python3 - "$TELEGRAM_ALLOWED_USER_ID" "$update_id" "$text" > "$body" <<'PY'
          import json,sys
          uid=int(sys.argv[1]); update=int(sys.argv[2]); text=sys.argv[3]
          print(json.dumps({"update_id":update,"message":{"message_id":update%2000000000,"from":{"id":uid,"is_bot":False,"first_name":"Founder"},"chat":{"id":uid,"type":"private"},"date":0,"text":text}}))
          PY
            local start_ns end_ns status elapsed_ms
            start_ns=$(date +%s%N)
            status=$(curl -sS -o "$response" -w '%{http_code}' --proto '=https' --tlsv1.2 --max-time 20 \
              -X POST https://gate.metatron.vn/telegram/webhook \
              -H "X-Telegram-Bot-Api-Secret-Token: $TELEGRAM_WEBHOOK_SECRET" \
              -H 'Content-Type: application/json' --data-binary "@$body")
            end_ns=$(date +%s%N)
            elapsed_ms=$(( (end_ns-start_ns)/1000000 ))
            echo "${label}_ACK_HTTP=$status"
            echo "${label}_ACK_MILLIS=$elapsed_ms"
            test "$status" = 200
            test "$elapsed_ms" -lt 5000

            status=$(curl -sS -o "$duplicate_response" -w '%{http_code}' --proto '=https' --tlsv1.2 --max-time 20 \
              -X POST https://gate.metatron.vn/telegram/webhook \
              -H "X-Telegram-Bot-Api-Secret-Token: $TELEGRAM_WEBHOOK_SECRET" \
              -H 'Content-Type: application/json' --data-binary "@$body")
            test "$status" = 200
            printf 'update_id=%s\nack_millis=%s\nduplicate_http=%s\n' "$update_id" "$elapsed_ms" "$status" > "$EVIDENCE/${label}-ingress.txt"
          }

          locate_objective() {
            local label="$1" update_id="$2"
            local out="$EVIDENCE/${label}-objectives.json"
            for i in $(seq 1 150); do
              curl -fsS --max-time 5 http://127.0.0.1:8080/workforce/management/objectives > "$out" || true
              if python3 - "$out" "$update_id" > "$EVIDENCE/${label}-objective-id.txt" <<'PY'
          import json,sys
          path,update=sys.argv[1],sys.argv[2]
          try: data=json.load(open(path))
          except Exception: raise SystemExit(1)
          needle=f"telegram:update:{update}"
          found=[]
          for item in data if isinstance(data,list) else []:
              if needle in json.dumps(item,sort_keys=True):
                  objective=item.get('objective',{}) if isinstance(item,dict) else {}
                  oid=objective.get('objectiveId') or objective.get('objective_id')
                  if oid: found.append(oid)
          found=list(dict.fromkeys(found))
          if len(found)!=1: raise SystemExit(1)
          print(found[0])
          PY
              then return 0; fi
              sleep 2
            done
            echo "OBJECTIVE_NOT_FOUND label=$label update=$update_id" >&2
            return 1
          }

          wait_terminal() {
            local label="$1" oid="$2"
            local view="$EVIDENCE/${label}-terminal-view.json"
            for i in $(seq 1 600); do
              curl -fsS --max-time 5 "http://127.0.0.1:8080/workforce/management/objectives/${oid}" > "$view" || true
              state=$(python3 - "$view" <<'PY'
          import json,sys
          try: d=json.load(open(sys.argv[1])); print((d.get('objective') or {}).get('status',''))
          except Exception: print('')
          PY
              )
              case "$state" in
                COMPLETED|DELIVERED) echo "${label}_TERMINAL_STATUS=$state"; return 0 ;;
                BLOCKED|ESCALATED|CANCELLED) echo "${label}_BAD_TERMINAL_STATUS=$state" >&2; return 2 ;;
              esac
              sleep 2
            done
            echo "${label}_TERMINAL_TIMEOUT" >&2
            return 1
          }

          snapshot_state() {
            local label="$1"
            docker exec "$CID" sh -c 'for f in /var/lib/metatron-workforce/*.json; do [ -f "$f" ] && { echo "===== $f ====="; cat "$f"; echo; }; done' > "$EVIDENCE/${label}-durable-state.txt"
            docker exec "$CID" sh -c 'find /var/lib/metatron-workforce/runtime-evidence -type f -maxdepth 4 -print 2>/dev/null | sort' > "$EVIDENCE/${label}-runtime-files.txt" || true
          }

          assert_gs1() {
            local oid="$1"
            snapshot_state gs1
            OID="$oid" EVIDENCE="$EVIDENCE" python3 - <<'PY'
          import json,os
          oid=os.environ['OID']; root=os.environ['EVIDENCE']
          view=json.load(open(root+'/gs1-terminal-view.json'))
          o=view.get('objective') or {}; hist=view.get('history') or []
          assert o.get('objectiveId')==oid, (o.get('objectiveId'),oid)
          assert o.get('status') in ('COMPLETED','DELIVERED'), o.get('status')
          assert o.get('ownerWorkerId'), 'missing_owner'
          blob=json.dumps(view,sort_keys=True)
          for repo in ['kelvinka38/universal','kelvinka38/metatron-institution','kelvinka38/metatron-workforce','kelvinka38/bios']:
              assert repo in blob, f'missing_planned_repository:{repo}'
          assert 'repository.audit.read' in blob, 'missing_repository_audit_capability'
          assert len(hist)>=4, 'management_history_too_small'
          print('GS1_OBJECTIVE_TERMINAL=PASS')
          print('GS1_FOUR_REPOSITORIES_PLANNED=PASS')
          print('GS1_AUTONOMOUS_CAPABILITY_BINDING=PASS')
          PY
            for repo in kelvinka38/universal kelvinka38/metatron-institution kelvinka38/metatron-workforce kelvinka38/bios; do
              docker exec "$CID" sh -c "grep -R -l -F 'repository=$repo' /var/lib/metatron-workforce/runtime-evidence 2>/dev/null | head -1" | grep -q .
            done
            docker exec "$CID" sh -c "grep -F '$oid' /var/lib/metatron-workforce/observation-state.json >/dev/null && grep -F 'PASS' /var/lib/metatron-workforce/observation-state.json >/dev/null"
            echo 'GS1_RUNTIME_EFFECT_EVIDENCE=PASS'
            echo 'GS1_INDEPENDENT_OBSERVATION_PRESENT=PASS'
          }

          assert_gs2() {
            local oid="$1"
            local source_path='src/main/java/com/metatron/workforce/action/GeneralCognitiveWorkerBrainFactory.java'
            local old_sentence='Produces one stateful provider-backed brain per Cognitive Worker execution.'
            local new_sentence='Produces one stateful provider-backed brain for each governed Cognitive Worker execution.'
            snapshot_state gs2
            OID="$oid" EVIDENCE="$EVIDENCE" python3 - <<'PY'
          import json,os
          oid=os.environ['OID']; root=os.environ['EVIDENCE']
          view=json.load(open(root+'/gs2-terminal-view.json'))
          o=view.get('objective') or {}; blob=json.dumps(view,sort_keys=True)
          assert o.get('objectiveId')==oid
          assert o.get('status') in ('COMPLETED','DELIVERED'), o.get('status')
          assert 'execution.general.workspace' in blob, 'planner_did_not_bind_general_workspace_capability'
          assert 'general-action-runtime:execution.general.workspace' in blob, 'general_runtime_observation_marker_missing'
          print('GS2_OBJECTIVE_TERMINAL=PASS')
          print('GS2_GENERAL_CAPABILITY_BINDING=PASS')
          PY

            ACTION_ROOT="$EVIDENCE/gs2-action-journals"
            mkdir -p "$ACTION_ROOT"
            mapfile -t ACTION_FILES < <(docker exec "$CID" sh -c "grep -R -l -F '\"objectiveId\":\"$oid\"' /var/lib/metatron-workforce/runtime-evidence/action-journal 2>/dev/null" || true)
            test "${#ACTION_FILES[@]}" -gt 0
            for action_file in "${ACTION_FILES[@]}"; do
              docker cp "$CID:$action_file" "$ACTION_ROOT/$(basename "$action_file")"
            done
            python3 "$GITHUB_WORKSPACE/scripts/autonomy/p10_action_journal.py" \
              --root "$ACTION_ROOT" \
              --objective-id "$oid" \
              --output "$EVIDENCE/gs2-action-journal.jsonl"

            TARGET_SHA="$TARGET_SHA" SOURCE_PATH="$source_path" EVIDENCE="$EVIDENCE" python3 - <<'PY'
          import json,os,re
          target=os.environ['TARGET_SHA']; source_path=os.environ['SOURCE_PATH']; root=os.environ['EVIDENCE']
          rows=[json.loads(line) for line in open(root+'/gs2-action-journal.jsonl',encoding='utf-8') if line.strip()]
          assert rows, 'empty_action_journal'
          successful=[r for r in rows if r.get('actionSuccess') is True]
          actions=[r.get('thoughtAction') for r in successful]
          for required in ('workspace.repository.materialize','workspace.file.read','workspace.file.write',
                           'workspace.test.run','workspace.git.run','workspace.github.pr.publish'):
              assert required in actions, f'missing_successful_action:{required}'
          materialized=next(r for r in successful if r.get('thoughtAction')=='workspace.repository.materialize')
          outputs=materialized.get('outputs') or {}
          assert outputs.get('repository')=='kelvinka38/metatron-workforce', outputs
          assert outputs.get('sourceCommitSha')==target, (outputs.get('sourceCommitSha'),target)
          baseline=outputs.get('localBaselineCommitSha','')
          assert re.fullmatch(r'[0-9a-f]{40}',baseline), baseline
          workspace_ref=outputs.get('workspaceRef','')
          assert workspace_ref.startswith('objective-workspace:'), workspace_ref
          workspace_key=workspace_ref.split(':',1)[1]

          writes=[r for r in successful if r.get('thoughtAction')=='workspace.file.write']
          assert any((r.get('thoughtInputs') or {}).get('path')==source_path for r in writes), 'source_file_not_written'

          git_rows=[r for r in successful if r.get('thoughtAction')=='workspace.git.run']
          parsed=[]
          for row in git_rows:
              raw=(row.get('thoughtInputs') or {}).get('argsJson','[]')
              try: args=json.loads(raw)
              except Exception: args=[]
              parsed.append(args)
          assert any(args and args[0]=='add' for args in parsed), parsed
          assert any(args and args[0]=='commit' for args in parsed), parsed
          assert not any(args and args[0] in ('push','fetch','pull','remote') for args in parsed), parsed

          publications=[r for r in successful if r.get('thoughtAction')=='workspace.github.pr.publish']
          publication=publications[-1]
          remote=publication.get('outputs') or {}
          assert remote.get('repository')=='kelvinka38/metatron-workforce', remote
          assert remote.get('sourceCommitSha')==target, remote
          assert re.fullmatch(r'[0-9a-f]{40}',remote.get('localHeadSha','')), remote
          assert re.fullmatch(r'[0-9a-f]{40}',remote.get('remoteCommitSha','')), remote
          assert remote.get('branch','').startswith('metatron/objective-'), remote
          assert remote.get('pullRequestUrl','').startswith('https://github.com/kelvinka38/metatron-workforce/pull/'), remote
          assert int(remote.get('pullRequestNumber','0')) > 0, remote
          changed=json.loads(remote.get('changedPathsJson','[]'))
          assert changed==[source_path], changed

          with open(root+'/gs2-journal-proof.env','w',encoding='utf-8') as out:
              out.write('WORKSPACE_KEY='+workspace_key+'\n')
              out.write('BASELINE_SHA='+baseline+'\n')
              out.write('LOCAL_HEAD='+remote['localHeadSha']+'\n')
              out.write('REMOTE_BRANCH='+remote['branch']+'\n')
              out.write('REMOTE_COMMIT='+remote['remoteCommitSha']+'\n')
              out.write('PR_NUMBER='+remote['pullRequestNumber']+'\n')
              out.write('PR_URL='+remote['pullRequestUrl']+'\n')
          print('GS2_REPOSITORY_MATERIALIZATION=PASS')
          print('GS2_COGNITIVE_ACTION_FABRIC=PASS')
          print('GS2_SOURCE_EDIT_ACTION=PASS')
          print('GS2_TEST_ACTION=PASS')
          print('GS2_LOCAL_GIT_COMMIT_ACTION=PASS')
          print('GS2_GOVERNED_REMOTE_PUBLICATION_ACTION=PASS')
          PY
            source "$EVIDENCE/gs2-journal-proof.env"
            [[ "$WORKSPACE_KEY" =~ ^[0-9a-f]{32}$ ]]
            [[ "$BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$LOCAL_HEAD" =~ ^[0-9a-f]{40}$ ]]
            [[ "$REMOTE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            [[ "$REMOTE_BRANCH" == metatron/objective-* ]]
            [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
            test "$LOCAL_HEAD" != "$BASELINE_SHA"

            ACTUAL_LOCAL_HEAD=$(docker exec --user 10001:10001 "$SANDBOX_CID" git -C "/workspaces/$WORKSPACE_KEY" rev-parse HEAD | tr -d '\r\n')
            test "$ACTUAL_LOCAL_HEAD" = "$LOCAL_HEAD"
            CHANGED_PATHS=$(docker exec --user 10001:10001 "$SANDBOX_CID" git -C "/workspaces/$WORKSPACE_KEY" diff --name-only "$BASELINE_SHA..$LOCAL_HEAD" -- | sed '/^$/d')
            test "$CHANGED_PATHS" = "$source_path"
            docker exec --user 10001:10001 "$SANDBOX_CID" git -C "/workspaces/$WORKSPACE_KEY" show "$LOCAL_HEAD:$source_path" > "$EVIDENCE/gs2-local-source.java"
            grep -F "$new_sentence" "$EVIDENCE/gs2-local-source.java" >/dev/null
            ! grep -F "$old_sentence" "$EVIDENCE/gs2-local-source.java" >/dev/null

            # Independently rerun the repository tests after Worker completion in the isolated sandbox.
            docker exec --user 10001:10001 \
              -e HOME="/workspaces/$WORKSPACE_KEY" \
              -e GRADLE_USER_HOME="/workspaces/$WORKSPACE_KEY/.gradle" \
              -e JAVA_HOME="/opt/java/openjdk" \
              -w "/workspaces/$WORKSPACE_KEY" "$SANDBOX_CID" \
              ./gradlew --no-daemon --max-workers=1 test > "$EVIDENCE/gs2-independent-test-rerun.txt" 2>&1
            grep -F 'BUILD SUCCESSFUL' "$EVIDENCE/gs2-independent-test-rerun.txt" >/dev/null
            echo 'GS2_INDEPENDENT_TEST_RERUN=PASS'

            # Fresh remote reads: never accept the Worker's own publication response as Observation truth.
            test -n "${GITHUB_TOKEN:-}"
            API='https://api.github.com'
            auth=(-H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
            curl -fsS --max-time 20 "${auth[@]}" "$API/repos/kelvinka38/metatron-workforce/pulls/$PR_NUMBER" > "$EVIDENCE/gs2-pr.json"
            curl -fsS --max-time 20 "${auth[@]}" "$API/repos/kelvinka38/metatron-workforce/pulls/$PR_NUMBER/files?per_page=100" > "$EVIDENCE/gs2-pr-files.json"
            curl -fsS --max-time 20 "${auth[@]}" "$API/repos/kelvinka38/metatron-workforce/git/commits/$REMOTE_COMMIT" > "$EVIDENCE/gs2-pr-commit.json"
            curl -fsS --max-time 20 "${auth[@]}" "$API/repos/kelvinka38/metatron-workforce/contents/$source_path?ref=$REMOTE_COMMIT" > "$EVIDENCE/gs2-pr-source.json"

            TARGET_SHA="$TARGET_SHA" SOURCE_PATH="$source_path" OLD_SENTENCE="$old_sentence" NEW_SENTENCE="$new_sentence" \
              REMOTE_BRANCH="$REMOTE_BRANCH" REMOTE_COMMIT="$REMOTE_COMMIT" PR_NUMBER="$PR_NUMBER" EVIDENCE="$EVIDENCE" python3 - <<'PY'
          import base64,json,os
          root=os.environ['EVIDENCE']; target=os.environ['TARGET_SHA']; source_path=os.environ['SOURCE_PATH']
          branch=os.environ['REMOTE_BRANCH']; remote=os.environ['REMOTE_COMMIT']
          pr=json.load(open(root+'/gs2-pr.json'))
          files=json.load(open(root+'/gs2-pr-files.json'))
          commit=json.load(open(root+'/gs2-pr-commit.json'))
          source=json.load(open(root+'/gs2-pr-source.json'))
          assert pr.get('state')=='open', pr.get('state')
          assert not pr.get('merged',False) and pr.get('merged_at') is None, 'PR unexpectedly merged'
          assert (pr.get('base') or {}).get('ref')=='main', pr.get('base')
          assert (pr.get('head') or {}).get('ref')==branch, pr.get('head')
          assert (pr.get('head') or {}).get('sha')==remote, pr.get('head')
          assert [f.get('filename') for f in files]==[source_path], files
          parents=commit.get('parents') or []
          assert len(parents)==1 and parents[0].get('sha')==target, parents
          body=base64.b64decode((source.get('content') or '').replace('\n','')).decode('utf-8')
          assert os.environ['NEW_SENTENCE'] in body
          assert os.environ['OLD_SENTENCE'] not in body
          print('GS2_FRESH_GITHUB_PR_OBSERVATION=PASS')
          print('GS2_REMOTE_SOURCE_PARENT_BINDING=PASS')
          print('GS2_REMOTE_CHANGED_PATH_SET=PASS')
          print('GS2_REMOTE_PR_OPEN_UNMERGED=PASS')
          PY

            docker exec "$CID" cat /var/lib/metatron-workforce/observation-state.json > "$EVIDENCE/gs2-observation-state.json"
            OID="$oid" EVIDENCE="$EVIDENCE" python3 - <<'PY'
          import json,os
          oid=os.environ['OID']; root=os.environ['EVIDENCE']
          d=json.load(open(root+'/gs2-observation-state.json'))
          reports=d.get('reportsByRequirement') or {}
          selected=[r for r in reports.values() if r.get('objectiveId')==oid]
          assert selected, 'no_observation_reports_for_gs2'
          assert all(r.get('criterionResult')=='PASS' and r.get('quality')!='INSUFFICIENT' for r in selected), selected
          blob=json.dumps(selected,sort_keys=True)
          assert 'authoritative-github-api-read' in blob or 'github-general-pr-observation-fresh-api-read:true' in blob, selected
          print('GS2_INDEPENDENT_OBSERVATION=PASS')
          PY

            if docker inspect "$SANDBOX_CID" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Eq '^(GITHUB_TOKEN|OPENAI_API_KEY|GEMINI_API_KEY|ANTHROPIC_API_KEY|CLOUDFLARE_API_TOKEN|HETZNER_API_TOKEN)=.'; then
              echo 'SANDBOX_INSTITUTIONAL_CREDENTIAL_LEAK' >&2
              exit 1
            fi

            cat > "$EVIDENCE/gs2-general-runtime.txt" <<EOF
          general_capability=execution.general.workspace
          repository=kelvinka38/metatron-workforce
          source_commit_sha=$TARGET_SHA
          workspace_materialized=PASS
          cognitive_action_fabric=PASS
          source_edit_action=PASS
          test_action=PASS
          independent_test_rerun=PASS
          independent_observation=PASS
          sandbox_isolated=PASS
          local_git_commit=$LOCAL_HEAD
          local_git_baseline=$BASELINE_SHA
          workspace_key=$WORKSPACE_KEY
          remote_publication=PASS
          remote_pull_request=$PR_URL
          remote_branch=$REMOTE_BRANCH
          remote_commit=$REMOTE_COMMIT
          remote_changed_path=$CHANGED_PATHS
          EOF
            echo 'GS2_GENERAL_MUTATING_EXECUTION_RUNTIME=PASS'
          }

          GS1_UPDATE=$(date +%s%N | cut -c1-18)
          GS1_TEXT='Take ownership of one Objective: perform a governed read-only institutional audit of kelvinka38/universal, kelvinka38/metatron-institution, kelvinka38/metatron-workforce, and kelvinka38/bios. Independently plan the work, audit all four repositories in parallel where dependencies allow, join the results, analyze contradictions, verify every acceptance criterion through Observation, and deliver one evidence-backed completion. Do not mutate anything.'
          submit_objective gs1 "$GS1_TEXT" "$GS1_UPDATE"
          locate_objective gs1 "$GS1_UPDATE"
          GS1_OID=$(cat "$EVIDENCE/gs1-objective-id.txt")
          echo "GS1_OBJECTIVE_ID=$GS1_OID"
          wait_terminal gs1 "$GS1_OID"
          assert_gs1 "$GS1_OID"

          GS2_UPDATE=$((GS1_UPDATE+1))
          GS2_TEXT="Take ownership of one governed MUTATING general engineering Objective against kelvinka38/metatron-workforce at exact source commit $TARGET_SHA using execution.general.workspace. Materialize that exact repository snapshot into the Objective workspace. Read src/main/java/com/metatron/workforce/action/GeneralCognitiveWorkerBrainFactory.java and replace exactly one Javadoc sentence 'Produces one stateful provider-backed brain per Cognitive Worker execution.' with 'Produces one stateful provider-backed brain for each governed Cognitive Worker execution.' Do not modify any other source path. Run the full repository test suite through the governed test action after the edit and require PASS. Stage the intended source change and create one local Git commit. Publish the clean committed Objective workspace through the governed GitHub proposal action as an Objective-scoped reviewable unmerged pull request against main. Verify both tests and the remote pull request through independent Observation. Do not merge."
          submit_objective gs2 "$GS2_TEXT" "$GS2_UPDATE"
          locate_objective gs2 "$GS2_UPDATE"
          GS2_OID=$(cat "$EVIDENCE/gs2-objective-id.txt")
          echo "GS2_OBJECTIVE_ID=$GS2_OID"
          wait_terminal gs2 "$GS2_OID"
          assert_gs2 "$GS2_OID"

          docker logs --since 60m "$CID" > "$EVIDENCE/workforce.log" 2>&1 || true
          docker logs --since 60m "$SANDBOX_CID" > "$EVIDENCE/workforce-sandbox.log" 2>&1 || true
          tar -C "$EVIDENCE" -czf "/tmp/workforce-p10-${GITHUB_RUN_ID}.tgz" .

          DURABLE="$HOME/.metatron/acceptance-evidence/p10/$TARGET_SHA/gs12-$GITHUB_RUN_ID"
          rm -rf "$DURABLE"
          mkdir -p "$DURABLE"
          cp -a "$EVIDENCE/." "$DURABLE/"
          printf 'kind=gs12\ntarget_sha=%s\nrun_id=%s\n' "$TARGET_SHA" "$GITHUB_RUN_ID" > "$DURABLE/_index.txt"

          echo 'P10_GOLDEN_SLICE_1=PASS'
          echo 'P10_GOLDEN_SLICE_2_GENERAL_MUTATING_EXECUTION_RUNTIME=PASS'
          echo 'P10_GS2_REMOTE_MUTATION=GOVERNED_UNMERGED_PR'
          echo 'P10_L10_VERDICT=NOT_YET_CLAIMED_GS3_GS4_AND_45_GATE_REMAIN'
          echo "P10_DURABLE_EVIDENCE=$DURABLE"

      - name: Upload P10 evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: workforce-p10-production-evidence-${{ github.run_id }}
          path: |
            /tmp/workforce-p10-${{ github.run_id }}/
