name: WebSearch Build Gate Selfhosted

on:
  push:
    branches:
      - fix/highway-build-gate-websearch-test
    paths:
      - 'src/main/java/com/metatron/workforce/interaction/tools/WebSearchToolAdapter.java'
      - 'src/test/java/com/metatron/workforce/interaction/tools/WebSearchToolAdapterTest.java'
      - '.github/workflows/websearch-build-gate-selfhosted.yml'

permissions:
  contents: read

concurrency:
  group: websearch-build-gate-selfhosted
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Full repository test suite
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean test bootJar --no-daemon --max-workers=1
          echo 'WEBSEARCH_BUILD_GATE_FULL_SUITE=PASS'
