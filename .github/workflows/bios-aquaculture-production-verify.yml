name: BIOS Aquaculture Production Verify (Highway Ingress)

on:
  workflow_dispatch:
    inputs:
      bios_expected_sha:
        description: Exact deployed BIOS SHA
        required: false
        default: 8493323a6535003f875fe5cf43114892fbae3626
        type: string

permissions:
  contents: read

jobs:
  enqueue:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Submit to persistent Highway
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/highway-manual-ingress.sh 'bios-aquaculture-production-verify' '' '55' "BIOS_EXPECTED_SHA=${{ inputs.bios_expected_sha }}"
