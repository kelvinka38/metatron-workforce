name: MCP Recovery G10 Build Test

on:
  push:
    branches: [mcp-recovery-g10-20260913]
    paths:
      - '.github/workflows/mcp-recovery-g10-build-test.yml'

permissions:
  contents: write

jobs:
  build-test:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Patch and unit-test broker CAS
        shell: bash
        run: |
          set -euo pipefail
          SRC=.mcp-recovery/host/metatron-mcp-broker.current
          PATCH=.mcp-recovery/g10/broker-auth-state-cas-g10-patch.py
          OUT=.mcp-recovery/g10/metatron-mcp-broker.g10
          cp "$SRC" "$OUT"
          python3 "$PATCH" "$OUT"
          python3 -m py_compile "$OUT"
          chmod +x "$OUT"

          T="$(mktemp -d)"
          trap 'rm -rf "$T"' EXIT
          export METATRON_MCP_AUTH_STATE_PATH="$T/state.enc"
          export METATRON_MCP_AUTH_STATE_LOCK="$T/state.lock"

          call_broker() { printf '%s' "$1" | "$OUT"; }
          read0="$(call_broker '{"op":"auth_state_read","args":{}}')"
          python3 - "$read0" <<'PY'
import json,sys
r=json.loads(sys.argv[1]); p=json.loads(r['stdout'])
assert r['ok'] is True and p['exists'] is False and p['sha256']==''
PY

          one="$(printf one | base64 -w0)"
          write1="$(call_broker "{\"op\":\"auth_state_compare_and_swap\",\"args\":{\"expected_sha256\":\"\",\"content_b64\":\"$one\"}}")"
          v1="$(python3 - "$write1" <<'PY'
import json,sys
r=json.loads(sys.argv[1]); assert r['ok'] is True
print(json.loads(r['stdout'])['sha256'])
PY
)"

          a="$(printf two-a | base64 -w0)"
          b="$(printf two-b | base64 -w0)"
          set +e
          (call_broker "{\"op\":\"auth_state_compare_and_swap\",\"args\":{\"expected_sha256\":\"$v1\",\"content_b64\":\"$a\"}}" >"$T/a.json"; echo $? >"$T/a.rc") &
          pa=$!
          (call_broker "{\"op\":\"auth_state_compare_and_swap\",\"args\":{\"expected_sha256\":\"$v1\",\"content_b64\":\"$b\"}}" >"$T/b.json"; echo $? >"$T/b.rc") &
          pb=$!
          wait "$pa"; wait "$pb"
          set -e
          python3 - "$T/a.json" "$T/b.json" <<'PY'
import json,sys
rs=[]
for p in sys.argv[1:]:
  r=json.load(open(p)); rs.append(r)
assert sum(1 for r in rs if r['ok']) == 1, rs
losers=[r for r in rs if not r['ok']]
assert len(losers)==1 and losers[0]['exitCode']==75 and json.loads(losers[0]['stdout'])['status']=='conflict', rs
print('BROKER_AUTH_STATE_CAS_CONCURRENCY_PASS')
PY
          rm -rf "$T"
          trap - EXIT

      - name: Build isolated G10 runtime from immutable G9 image
        shell: bash
        run: |
          set -euo pipefail
          cat > .mcp-recovery/g10/Dockerfile.g10 <<'EOF'
          FROM metatron-ssh-mcp-runtime:g9
          COPY auth-oauth-resilience-g10-patch.mjs /tmp/auth-oauth-resilience-g10-patch.mjs
          RUN node /tmp/auth-oauth-resilience-g10-patch.mjs /app/auth-proxy.mjs \
           && node --check /app/auth-proxy.mjs \
           && grep -Fq 'METATRON_MCP_OAUTH_RESILIENCE_G10' /app/auth-proxy.mjs \
           && grep -Fq "grant_types_supported: ['authorization_code', 'refresh_token']" /app/auth-proxy.mjs \
           && grep -Fq 'auth_state_compare_and_swap' /app/auth-proxy.mjs \
           && grep -Fq 'AUTH_CONTROL_STATE_HOST_CAS_SAVE_PASS' /app/auth-proxy.mjs \
           && AUTH_PROXY_SELF_TEST=1 node /app/auth-proxy.mjs \
           && rm -f /tmp/auth-oauth-resilience-g10-patch.mjs
          EOF
          docker build --pull=false -f .mcp-recovery/g10/Dockerfile.g10 -t metatron-ssh-mcp-runtime:g10 .mcp-recovery/g10 | tee .mcp-recovery/g10/build.log
          id="$(docker image inspect metatron-ssh-mcp-runtime:g10 --format '{{.Id}}')"
          base="$(docker image inspect metatron-ssh-mcp-runtime:g9 --format '{{.Id}}')"
          test -n "$id" && test "$id" != "$base"
          docker run --rm -e AUTH_PROXY_SELF_TEST=1 metatron-ssh-mcp-runtime:g10 | tee .mcp-recovery/g10/selftest.log
          grep -q 'AUTH_OAUTH_RESILIENCE_G10_ACCEPTANCE_PASS' .mcp-recovery/g10/selftest.log
          grep -q 'AUTH_PROXY_ACCEPTANCE_PASS' .mcp-recovery/g10/selftest.log
          printf 'G10_IMAGE_ID=%s\nG9_IMAGE_ID=%s\nBROKER_CANDIDATE_SHA256=%s\n' "$id" "$base" "$(sha256sum .mcp-recovery/g10/metatron-mcp-broker.g10 | awk '{print $1}')" > .mcp-recovery/g10/build-report.txt
          echo 'G10_BUILD_SELFTEST_PASS'

      - name: Commit candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'metatron-recovery-bot'
          git config user.email 'metatron-recovery-bot@users.noreply.github.com'
          git add .mcp-recovery/g10
          git diff --cached --quiet && exit 0
          git commit -m 'test(recovery): record G10 build and CAS evidence'
          git push origin HEAD:mcp-recovery-g10-20260913
