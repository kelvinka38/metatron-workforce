name: Forensic Gateway Boundary

on:
  push:
    branches:
      - forensic/gateway-route-probe-20260828
    paths:
      - '.github/workflows/forensic-gateway-boundary.yml'

permissions:
  contents: read

jobs:
  inspect-gateway:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    steps:
      - name: Inspect live Gateway routing read-only
        shell: bash
        run: |
          set -euo pipefail
          echo '=== HOST / CONTAINERS ==='
          hostname
          docker ps --format 'NAME={{.Names}} IMAGE={{.Image}} PORTS={{.Ports}}'
          echo '=== GATEWAY NETWORK ==='
          docker network inspect metatron-gateway-online --format '{{json .Containers}}'
          echo '=== CANDIDATE GATEWAY CONTAINERS ==='
          for cid in $(docker ps -q); do
            name=$(docker inspect "$cid" --format '{{.Name}}' | sed 's#^/##')
            image=$(docker inspect "$cid" --format '{{.Config.Image}}')
            nets=$(docker inspect "$cid" --format '{{range $k,$v := .NetworkSettings.Networks}}{{printf "%s " $k}}{{end}}')
            case "$name $image $nets" in
              *gateway*|*envoy*|*cloudflared*|*metatron-gateway-online*)
                echo "--- $name | $image | $nets"
                docker inspect "$cid" --format 'CMD={{json .Config.Cmd}} ENTRYPOINT={{json .Config.Entrypoint}} MOUNTS={{json .Mounts}}'
                ;;
            esac
          done
          echo '=== ROUTE / CONFIG CANDIDATES FROM RUNNING CONTAINERS ==='
          for cid in $(docker ps -q); do
            name=$(docker inspect "$cid" --format '{{.Name}}' | sed 's#^/##')
            image=$(docker inspect "$cid" --format '{{.Config.Image}}')
            case "$name $image" in
              *envoy*|*gateway*)
                echo "### $name"
                docker exec "$cid" sh -lc 'for f in /etc/envoy/envoy.yaml /etc/envoy/envoy.yml /etc/envoy/*.yaml /etc/envoy/*.yml /config/*.yaml /config/*.yml; do [ -f "$f" ] && { echo "FILE=$f"; sed -n "1,260p" "$f"; }; done' 2>&1 || true
                ;;
            esac
          done
          echo '=== PUBLIC ROUTE PROBES ==='
          for p in /telegram/health /workforce/core /workforce/management /workforce/operations /workforce/work /actuator/health; do
            code=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "https://gate.metatron.vn$p" || true)
            echo "$p => $code"
          done
