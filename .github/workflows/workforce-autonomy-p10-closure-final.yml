name: Workforce P10 Closure Final (Accepted Historical Disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Historical lane is intentionally disabled
        shell: bash
        run: |
          set -euo pipefail
          echo 'HISTORICAL_EXECUTION=DISABLED'
          echo 'REASON=The destructive GS3/GS4 closure workflow is historical after accepted closure and must not execute again by default.'
          echo 'REPLACEMENT=native runtime-closure + current targeted acceptance'
          echo 'SELF_HOSTED_RUNNER_REQUIRED=false'
