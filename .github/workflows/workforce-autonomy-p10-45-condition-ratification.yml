name: Workforce P10 45-Condition Ratification (Accepted Historical Disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Historical lane is intentionally disabled
        shell: bash
        run: |
          set -euo pipefail
          echo 'HISTORICAL_EXECUTION=DISABLED'
          echo 'REASON=The one-shot L10 ratification lane is historical after accepted closure and must not mutate or monopolize the production runner.'
          echo 'REPLACEMENT=native runtime-closure + current targeted acceptance'
          echo 'SELF_HOSTED_RUNNER_REQUIRED=false'
