name: Workforce Autonomy P10 45 Condition Ratification

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact deployed main SHA to ratify
        required: true
        type: string
      gs12_run_id:
        description: Optional successful GS1/GS2 run ID; auto-discovered when blank
        required: false
        type: string
      gs34_run_id:
        description: Optional successful GS3/GS4 run ID; auto-discovered when blank
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  resolve-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      target_sha: ${{ steps.resolve.outputs.target_sha }}
      gs12_run_id: ${{ steps.resolve.outputs.gs12_run_id }}
      gs34_run_id: ${{ steps.resolve.outputs.gs34_run_id }}
      ready: ${{ steps.resolve.outputs.ready }}
    steps:
      - name: Resolve successful same-SHA Golden Slice runs
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_TARGET_SHA: ${{ inputs.target_sha }}
          INPUT_GS12_RUN_ID: ${{ inputs.gs12_run_id }}
          INPUT_GS34_RUN_ID: ${{ inputs.gs34_run_id }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            TARGET_SHA="$INPUT_TARGET_SHA"
            GS12_HINT="$INPUT_GS12_RUN_ID"
            GS34_HINT="$INPUT_GS34_RUN_ID"
          else
            TARGET_SHA="$AUTO_TARGET_SHA"
            GS12_HINT=''
            GS34_HINT=''
          fi
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]

          python3 - "$TARGET_SHA" "$GS12_HINT" "$GS34_HINT" "$GITHUB_API_URL" "$GITHUB_REPOSITORY" > /tmp/resolved.env <<'PY'
          import json, os, sys, urllib.request
          target, gs12_hint, gs34_hint, api, repo = sys.argv[1:]
          token=os.environ['GH_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as r: return json.load(r)
          def valid_run(run_id, workflow_name):
              d=get(f'{api}/repos/{repo}/actions/runs/{run_id}')
              if d.get('head_sha') != target or d.get('conclusion') != 'success' or d.get('name') != workflow_name:
                  raise SystemExit(f'RUN_NOT_VALID id={run_id} name={d.get("name")} sha={d.get("head_sha")} conclusion={d.get("conclusion")}')
              return str(d['id'])
          def discover(workflow_file, workflow_name, hint):
              if hint: return valid_run(hint,workflow_name)
              data=get(f'{api}/repos/{repo}/actions/workflows/{workflow_file}/runs?per_page=100')
              for r in data.get('workflow_runs',[]):
                  if r.get('head_sha')==target and r.get('conclusion')=='success' and r.get('name')==workflow_name:
                      return str(r['id'])
              return ''
          gs12=discover('workforce-autonomy-p10-production-acceptance.yml','Workforce Autonomy P10 Production Acceptance',gs12_hint)
          gs34=discover('workforce-autonomy-p10-gs3-gs4-production-acceptance.yml','Workforce Autonomy P10 GS3 GS4 Production Acceptance',gs34_hint)
          ready=bool(gs12 and gs34)
          print(f'TARGET_SHA={target}')
          print(f'GS12_RUN_ID={gs12}')
          print(f'GS34_RUN_ID={gs34}')
          print(f'READY={str(ready).lower()}')
          PY
          cat /tmp/resolved.env
          source /tmp/resolved.env
          {
            echo "target_sha=$TARGET_SHA"
            echo "gs12_run_id=$GS12_RUN_ID"
            echo "gs34_run_id=$GS34_RUN_ID"
            echo "ready=$READY"
          } >> "$GITHUB_OUTPUT"

  ratify-production:
    needs: resolve-evidence
    if: ${{ needs.resolve-evidence.outputs.ready == 'true' }}
    runs-on: [self-hosted, linux, x64, metatron-prod]
    concurrency:
      group: metatron-production-lane
      cancel-in-progress: false
    environment: production
    timeout-minutes: 35
    env:
      TARGET_SHA: ${{ needs.resolve-evidence.outputs.target_sha }}
      GS12_RUN_ID: ${{ needs.resolve-evidence.outputs.gs12_run_id }}
      GS34_RUN_ID: ${{ needs.resolve-evidence.outputs.gs34_run_id }}
      GH_TOKEN: ${{ github.token }}
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx384m -XX:MaxMetaspaceSize=192m -Dorg.gradle.workers.max=1 -Dorg.gradle.daemon=false"
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-evidence.outputs.target_sha }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'
          cache: gradle

      - name: Verify exact production identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          CID=$(docker ps --filter name=deploy-workforce-1 --format '{{.ID}}' | head -1)
          test -n "$CID"
          DEPLOYED_SHA=$(docker inspect "$CID" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^METATRON_COMMIT_SHA=//p' | head -1)
          test "$DEPLOYED_SHA" = "$TARGET_SHA"
          test "$(docker inspect "$CID" --format '{{.State.Health.Status}}')" = healthy
          echo "CID=$CID" >> "$GITHUB_ENV"
          echo "DEPLOYED_SHA=$DEPLOYED_SHA" >> "$GITHUB_ENV"

      - name: Download exact-SHA Golden Slice evidence
        shell: bash
        run: |
          set -euo pipefail
          E=/tmp/p10-ratification-${GITHUB_RUN_ID}
          mkdir -p "$E/gs12" "$E/gs34"
          load_evidence() {
            local run_id="$1" expected_prefix="$2" dest="$3" kind="$4"
            local listing="$E/artifacts-$run_id.json"
            local artifact_id=''
            if curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > "$listing"; then
              artifact_id=$(python3 - "$listing" "$expected_prefix" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1])); prefix=sys.argv[2]
          rows=[a for a in data.get('artifacts',[]) if not a.get('expired') and str(a.get('name','')).startswith(prefix)]
          if len(rows)==1:
              print(rows[0]['id'])
          PY
              )
            fi
            if [ -n "$artifact_id" ]; then
              if curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" -o "$E/$run_id.zip" \
                && python3 -m zipfile -e "$E/$run_id.zip" "$dest"; then
                echo "P10_EVIDENCE_SOURCE kind=$kind run_id=$run_id source=github-artifact"
                return 0
              fi
              rm -rf "$dest"
              mkdir -p "$dest"
            fi

            local durable="$HOME/.metatron/acceptance-evidence/p10/$TARGET_SHA/$kind-$run_id"
            test -d "$durable"
            test -f "$durable/_index.txt"
            grep -Fx "kind=$kind" "$durable/_index.txt" >/dev/null
            grep -Fx "target_sha=$TARGET_SHA" "$durable/_index.txt" >/dev/null
            grep -Fx "run_id=$run_id" "$durable/_index.txt" >/dev/null
            cp -a "$durable/." "$dest/"
            echo "P10_EVIDENCE_SOURCE kind=$kind run_id=$run_id source=production-runner-durable-store"
          }
          load_evidence "$GS12_RUN_ID" 'workforce-p10-production-evidence-' "$E/gs12" gs12
          load_evidence "$GS34_RUN_ID" 'workforce-p10-gs34-production-evidence-' "$E/gs34" gs34
          echo "EVIDENCE_ROOT=$E" >> "$GITHUB_ENV"

      - name: Execute exact-SHA institutional invariant suite
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          python3 scripts/autonomy/p10_collect.py --self-test
          python3 scripts/autonomy/p10_general_runtime_guard.py --self-test
          python3 scripts/autonomy/p10_ratify.py --self-test
          ./gradlew clean test --no-daemon --max-workers=1
          test -d build/test-results/test
          printf 'target_sha=%s\nfull_test_suite=PASS\n' "$TARGET_SHA" > "$EVIDENCE_ROOT/invariant-suite.txt"

      - name: Collect and independently ratify all 45 production conditions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/autonomy/p10_collect.py \
            --target-sha "$TARGET_SHA" \
            --deployed-sha "$DEPLOYED_SHA" \
            --gs12 "$EVIDENCE_ROOT/gs12" \
            --gs34 "$EVIDENCE_ROOT/gs34" \
            --test-results build/test-results/test \
            --output "$EVIDENCE_ROOT/manifest.json"
          python3 scripts/autonomy/p10_general_runtime_guard.py \
            --gs12 "$EVIDENCE_ROOT/gs12" \
            --manifest "$EVIDENCE_ROOT/manifest.json" \
            --target-sha "$TARGET_SHA"
          python3 scripts/autonomy/p10_ratify.py "$EVIDENCE_ROOT/manifest.json" \
            --output "$EVIDENCE_ROOT/verdict.json"
          python3 - "$EVIDENCE_ROOT/verdict.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d.get('verdict')=='ACCEPTED_L10', d.get('errors')
          assert d.get('golden_slices_passed')==4
          assert d.get('general_execution_runtime_passed') is True
          assert d.get('conditions_accounted')==45
          assert not d.get('unresolved_critical_contradictions')
          print('P10_GOLDEN_SLICES=4/4')
          print('P10_GENERAL_MUTATING_EXECUTION_RUNTIME=PASS')
          print('P10_PRODUCTION_CONDITIONS=45/45')
          print('P10_UNRESOLVED_CRITICAL_CONTRADICTIONS=0')
          print('P10_FINAL_VERDICT=ACCEPTED_L10')
          PY

          DURABLE="$HOME/.metatron/acceptance-evidence/p10/$TARGET_SHA/ratification-$GITHUB_RUN_ID"
          rm -rf "$DURABLE"
          mkdir -p "$DURABLE"
          cp -a "$EVIDENCE_ROOT/." "$DURABLE/"
          cp -a build/test-results/test "$DURABLE/test-results"
          printf 'kind=ratification\ntarget_sha=%s\nrun_id=%s\n' "$TARGET_SHA" "$GITHUB_RUN_ID" > "$DURABLE/_index.txt"
          echo "P10_RATIFICATION_DURABLE_EVIDENCE=$DURABLE"

      - name: Upload final P10 ratification evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: workforce-p10-accepted-l10-evidence-${{ github.run_id }}
          path: |
            /tmp/p10-ratification-${{ github.run_id }}/
            build/test-results/test/
          if-no-files-found: warn
          retention-days: 30
