name: General Engineering GO1 Production Acceptance

on:
  workflow_run:
    workflows: ["Highway Production Deploy"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact deployed production SHA to validate
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: metatron-go1-production
  cancel-in-progress: true

jobs:
  unknown-bug:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, linux, x64, metatron-prod]
    environment: production
    timeout-minutes: 12
    env:
      TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && (inputs.target_sha != '' && inputs.target_sha || github.sha) || github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Execute vague engineering Objective end to end
        shell: bash
        run: |
          set -euo pipefail
          BASE=/opt/metatron/metatron-workforce
          COMPOSE="$GITHUB_WORKSPACE/deploy/docker-compose.yml"
          test -r "$BASE/.env"
          set -a
          source "$BASE/.env"
          set +a
          test -n "${TELEGRAM_WEBHOOK_SECRET:-}"
          test -n "${TELEGRAM_ALLOWED_USER_ID:-}"
          test -n "${GITHUB_TOKEN:-}"
          test -n "${OPENAI_API_KEY:-}${GEMINI_API_KEY:-}${ANTHROPIC_API_KEY:-}"

          LIVE_CID=$(docker ps --filter name=deploy-workforce-1 --format '{{.ID}}' | head -1)
          test -n "$LIVE_CID"
          LIVE_SHA=$(docker inspect "$LIVE_CID" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^METATRON_COMMIT_SHA=//p' | head -1)
          test "$LIVE_SHA" = "$TARGET_SHA"
          test "$(docker inspect "$LIVE_CID" --format '{{.State.Health.Status}}')" = healthy
          docker image inspect "metatron-workforce:$TARGET_SHA" >/dev/null
          echo "GO1_TARGET_SHA=$TARGET_SHA"

          read -r SINK_PORT HOST_PORT < <(python3 <<'PY'
          import socket
          sockets=[]
          try:
              for _ in range(2):
                  s=socket.socket()
                  s.bind(('127.0.0.1',0))
                  sockets.append(s)
              print(*(s.getsockname()[1] for s in sockets))
          finally:
              for s in sockets: s.close()
          PY
          )
          PROJECT="go1-${GITHUB_RUN_ID}"
          OUT="/tmp/metatron-go1-${GITHUB_RUN_ID}"
          mkdir -p "$OUT"

          python3 - "$SINK_PORT" "$OUT/telegram-sink.log" <<'PY' &
          import json,sys
          from http.server import BaseHTTPRequestHandler,ThreadingHTTPServer
          port=int(sys.argv[1]); log=sys.argv[2]
          class H(BaseHTTPRequestHandler):
              counter=9000
              def do_POST(self):
                  n=int(self.headers.get('content-length','0')); body=self.rfile.read(n); H.counter+=1
                  with open(log,'ab') as f: f.write(self.path.encode()+b' '+body+b'\n')
                  raw=json.dumps({'ok':True,'result':{'message_id':H.counter}}).encode()
                  self.send_response(200); self.send_header('Content-Type','application/json')
                  self.send_header('Content-Length',str(len(raw))); self.end_headers(); self.wfile.write(raw)
              def log_message(self,*args): pass
          ThreadingHTTPServer(('0.0.0.0',port),H).serve_forever()
          PY
          SINK_PID=$!

          cleanup() {
            set +e
            METATRON_HOST_PORT="$HOST_PORT" \
            METATRON_STATE_VOLUME_NAME="${PROJECT}-state" \
            METATRON_WORKFORCE_NETWORK_NAME="${PROJECT}-network" \
            METATRON_WORKFORCE_GATEWAY_ALIAS="workforce-go1-${GITHUB_RUN_ID}" \
            TELEGRAM_API_BASE_URL="http://host.docker.internal:$SINK_PORT" \
            docker compose -p "$PROJECT" --env-file "$BASE/.env" -f "$COMPOSE" down -v --remove-orphans >/dev/null 2>&1 || true
            kill "$SINK_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            curl -fsS --max-time 1 -X POST "http://127.0.0.1:$SINK_PORT/bottest/sendMessage" \
              -H 'Content-Type: application/json' -d '{}' >/dev/null && break
            sleep 1
          done
          kill -0 "$SINK_PID"

          METATRON_VERSION=0.1.0 \
          METATRON_ENVIRONMENT=production \
          METATRON_IMAGE_TAG="$TARGET_SHA" \
          METATRON_COMMIT_SHA="$TARGET_SHA" \
          METATRON_HOST_PORT="$HOST_PORT" \
          METATRON_STATE_VOLUME_NAME="${PROJECT}-state" \
          METATRON_WORKFORCE_NETWORK_NAME="${PROJECT}-network" \
          METATRON_WORKFORCE_GATEWAY_ALIAS="workforce-go1-${GITHUB_RUN_ID}" \
          METATRON_CONTAINER_MEM_LIMIT=768m \
          METATRON_CONTAINER_MEM_RESERVATION=384m \
          METATRON_CONTAINER_CPUS=1.0 \
          TELEGRAM_API_BASE_URL="http://host.docker.internal:$SINK_PORT" \
          docker compose -p "$PROJECT" --env-file "$BASE/.env" -f "$COMPOSE" up -d --no-build --force-recreate

          CID=$(METATRON_HOST_PORT="$HOST_PORT" \
            METATRON_STATE_VOLUME_NAME="${PROJECT}-state" \
            METATRON_WORKFORCE_NETWORK_NAME="${PROJECT}-network" \
            METATRON_WORKFORCE_GATEWAY_ALIAS="workforce-go1-${GITHUB_RUN_ID}" \
            docker compose -p "$PROJECT" --env-file "$BASE/.env" -f "$COMPOSE" ps -q workforce)
          test -n "$CID"
          READY=0
          for _ in $(seq 1 90); do
            if curl -fsS --max-time 2 "http://127.0.0.1:$HOST_PORT/actuator/health" | grep -q '"status"[[:space:]]*:[[:space:]]*"UP"'; then
              if [ "$(docker inspect "$CID" --format '{{.State.Health.Status}}')" = healthy ]; then READY=1; break; fi
            fi
            sleep 2
          done
          test "$READY" = 1
          echo 'GO1_ISOLATED_RUNTIME=READY'

          UPDATE_ID=$(date +%s%N | cut -c1-15)
          TEXT="Take ownership of one governed general engineering Objective against kelvinka38/metatron-workforce using execution.general.workspace. An acceptance fixture responsible for URL slug normalization has an observable defect: consecutive or mixed internal whitespace produces repeated or inconsistent separators instead of exactly one hyphen. Find the root cause yourself. Fix the defect without weakening, deleting, or changing the fixture tests. Run tests for the affected project and require PASS after your latest source change. Create one local Git commit for the verified repair and publish a reviewable unmerged GitHub pull request against main. Verify every acceptance criterion through independent Observation. Do not merge."

          BODY=$(python3 - "$UPDATE_ID" "$TEXT" "$TELEGRAM_ALLOWED_USER_ID" <<'PY'
          import json,sys
          update=int(sys.argv[1]); text=sys.argv[2]; uid=int(sys.argv[3])
          print(json.dumps({
              'update_id':update,
              'message':{
                  'message_id':update % 2000000000,
                  'from':{'id':uid,'is_bot':False,'first_name':'Founder'},
                  'chat':{'id':uid,'type':'private'},
                  'date':0,
                  'text':text
              }
          },ensure_ascii=False))
          PY
          )
          STATUS=$(curl -sS -o "$OUT/ingress.json" -w '%{http_code}' --connect-timeout 3 --max-time 30 \
            -X POST "http://127.0.0.1:$HOST_PORT/telegram/webhook" \
            -H "X-Telegram-Bot-Api-Secret-Token: $TELEGRAM_WEBHOOK_SECRET" \
            -H 'Content-Type: application/json' --data-binary "$BODY")
          cat "$OUT/ingress.json"
          test "$STATUS" = 200
          echo 'GO1_TYPED_TELEGRAM_INGRESS=PASS'

          OID=""
          for _ in $(seq 1 120); do
            PAYLOAD=$(curl -fsS --max-time 3 "http://127.0.0.1:$HOST_PORT/workforce/management/objectives" || true)
            OID=$(python3 - "$PAYLOAD" "$UPDATE_ID" <<'PY'
          import json,sys
          try: rows=json.loads(sys.argv[1])
          except Exception: raise SystemExit
          needle=f'telegram:update:{sys.argv[2]}'
          found=[]
          for row in rows if isinstance(rows,list) else []:
              if needle in json.dumps(row,sort_keys=True):
                  oid=(row.get('objective') or {}).get('objectiveId')
                  if oid: found.append(oid)
          found=list(dict.fromkeys(found))
          if len(found)==1: print(found[0])
          PY
            )
            [ -n "$OID" ] && break
            sleep 1
          done
          test -n "$OID"
          echo "GO1_OBJECTIVE_ID=$OID"

          TERMINAL=""
          for _ in $(seq 1 240); do
            curl -fsS --max-time 4 -H 'X-Metatron-Actor: human-primary' \
              "http://127.0.0.1:$HOST_PORT/workforce/monitor/api/objectives/$OID" > "$OUT/objective.json" || true
            TERMINAL=$(python3 - "$OUT/objective.json" <<'PY'
          import json,sys
          try: d=json.load(open(sys.argv[1]))
          except Exception: print('WAIT'); raise SystemExit
          state=d.get('objectiveStatus','')
          if state in ('COMPLETED','DELIVERED'): print('PASS')
          elif state in ('BLOCKED','ESCALATED','CANCELLED'): print('FAIL:'+state)
          else: print('WAIT')
          PY
            )
            case "$TERMINAL" in
              PASS) break ;;
              FAIL:*) cat "$OUT/objective.json"; exit 1 ;;
            esac
            sleep 2
          done
          test "$TERMINAL" = PASS
          cat "$OUT/objective.json"
          echo 'GO1_OBJECTIVE_COMPLETED=PASS'

          python3 - "$OUT/objective.json" "$OUT/evidence.txt" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          refs=d.get('evidenceReferences') or []
          open(sys.argv[2],'w').write('\n'.join(refs))
          required=[
              'action-fabric:action=workspace.file.search',
              'action-fabric:action=workspace.file.read',
              'action-fabric:action=workspace.test.run',
              'action-fabric:action=workspace.git.run',
              'action-fabric:action=workspace.github.pr.publish',
              'github-general-proposal:true'
          ]
          for needle in required:
              assert any(needle in ref for ref in refs), (needle, refs)
          assert any(('action-fabric:action=workspace.file.patch' in ref
                      or 'action-fabric:action=workspace.file.write' in ref) for ref in refs), refs
          pr=next((ref[len('github-pr:'):] for ref in refs if ref.startswith('github-pr:https://github.com/')),None)
          assert pr, refs
          print(pr)
          PY
          PR_URL=$(python3 - "$OUT/evidence.txt" <<'PY'
          import sys,re
          for line in open(sys.argv[1]):
              if line.startswith('github-pr:https://github.com/'):
                  print(line.split(':',1)[1].strip()); break
          PY
          )
          test -n "$PR_URL"
          PR_NUMBER=$(python3 - "$PR_URL" <<'PY'
          import re,sys
          m=re.search(r'/pull/(\d+)$',sys.argv[1]); assert m; print(m.group(1))
          PY
          )
          echo "GO1_PR_URL=$PR_URL"

          curl -fsS --max-time 20 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/kelvinka38/metatron-workforce/pulls/$PR_NUMBER" > "$OUT/pr.json"
          curl -fsS --max-time 20 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/kelvinka38/metatron-workforce/pulls/$PR_NUMBER/files?per_page=100" > "$OUT/files.json"

          python3 - "$OUT/pr.json" "$OUT/files.json" <<'PY'
          import json,sys
          pr=json.load(open(sys.argv[1])); files=json.load(open(sys.argv[2]))
          assert pr.get('state')=='open', pr
          assert not pr.get('merged',False), pr
          assert pr.get('merged_at') is None, pr
          paths=[f.get('filename') for f in files]
          assert paths==['acceptance/general-engineering-go1/slugify.py'], paths
          print('GO1_FRESH_GITHUB_PR_SHAPE=PASS')
          PY

          HEAD_REF=$(python3 - "$OUT/pr.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['head']['ref'])
          PY
          )
          curl -fsS --max-time 20 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/kelvinka38/metatron-workforce/contents/acceptance/general-engineering-go1/slugify.py?ref=$HEAD_REF" > "$OUT/source.json"

          python3 - "$OUT/source.json" "$OUT/fixed_slugify.py" <<'PY'
          import base64,json,sys
          node=json.load(open(sys.argv[1]))
          body=base64.b64decode(node['content']).decode()
          open(sys.argv[2],'w').write(body)
          PY
          python3 - "$OUT/fixed_slugify.py" <<'PY'
          import importlib.util,sys
          spec=importlib.util.spec_from_file_location('fixed_slugify',sys.argv[1])
          module=importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          cases={
              "Hello   Metatron   World":"hello-metatron-world",
              "  Hello\t  Metatron\nWorld  ":"hello-metatron-world",
              "  Metatron 2026  ":"metatron-2026"
          }
          for raw,expected in cases.items():
              actual=module.slugify(raw)
              assert actual==expected,(raw,actual,expected)
          print('GO1_INDEPENDENT_BEHAVIOR_VERIFICATION=PASS')
          PY

          grep -q 'action-fabric:action=workspace.file.search' "$OUT/evidence.txt"
          grep -q 'action-fabric:action=workspace.file.read' "$OUT/evidence.txt"
          grep -q 'action-fabric:action=workspace.test.run' "$OUT/evidence.txt"
          grep -q 'github-general-proposal:true' "$OUT/evidence.txt"
          echo 'GO1_UNKNOWN_BUG_DIAGNOSIS=PASS'
          echo 'GO1_REAL_CODE_MUTATION=PASS'
          echo 'GO1_REAL_TEST_EXECUTION=PASS'
          echo 'GO1_REAL_GITHUB_PR=PASS'
          echo 'GO1_INDEPENDENT_OBSERVATION=PASS'
          echo 'GENERAL_ENGINEERING_GO1=PASS'
