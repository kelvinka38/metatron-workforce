name: General Engineering GO1 Highway Ingress

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact deployed production SHA to validate
        required: false
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: general-engineering-go1-highway-ingress
  cancel-in-progress: true

jobs:
  enqueue-go1:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - name: Publish immutable control-plane release
        shell: bash
        run: |
          set -euo pipefail
          bash highway/publish-release.sh "$GITHUB_WORKSPACE" "$GITHUB_SHA"

      - name: Submit GO1 acceptance to Highway
        shell: bash
        env:
          REQUESTED_TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          TARGET_SHA="${REQUESTED_TARGET_SHA:-$GITHUB_SHA}"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          BASE=/opt/metatron/metatron-workforce
          set -a
          source "$BASE/.env"
          source "$HOME/.metatron/highway/highway.env"
          set +a
          bash "$HOME/.metatron/highway/current/ensure-running.sh"
          CTL="python3 $HOME/.metatron/highway/current/highwayctl.py"
          TASK=$($CTL submit             --kind general-engineering-go1             --source-sha "$GITHUB_SHA"             --priority 50             --dedupe-key "general-engineering-go1:$TARGET_SHA:$GITHUB_RUN_ID"             --env "TARGET_SHA=$TARGET_SHA"             | python3 -c 'import json,sys; print(json.load(sys.stdin)["task_id"])')
          echo "HIGHWAY_GO1_TASK=$TASK"
          $CTL get "$TASK"
          echo 'GO1_GITHUB_EXECUTION_PLANE=BYPASSED'
          echo 'GENERAL_ENGINEERING_GO1_HIGHWAY_INGRESS=PASS'
