name: Runtime Conformance Point 2 (Manual Forensic)

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact deployed runtime SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  point2:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    environment: production
    timeout-minutes: 15
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Run Point 2 forensic lane
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/runtime-conformance-point2.sh
          scripts/runtime-conformance-point2.sh
