name: Cancel Legacy P10 Auto Fanout — Archived

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'P10_RESIDUAL_AUTOFANOUT_CLEANUP_ARCHIVED=PASS'
          echo 'One-time queue cleanup completed; automatic execution is disabled.'
