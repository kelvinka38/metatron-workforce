name: Cancel Legacy P10 Auto Fanout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-cancel-legacy-p10-autofanout.yml'

permissions:
  contents: read
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel residual auto-fanout runs
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 34022156952 34022165064; do
            code=$(curl -sS -o "/tmp/cancel-$run_id.json" -w '%{http_code}' -X POST               -H "Authorization: Bearer $GH_TOKEN"               -H 'Accept: application/vnd.github+json'               -H 'X-GitHub-Api-Version: 2022-11-28'               "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel")
            case "$code" in
              202|409) echo "P10_RESIDUAL_CANCEL=$run_id:$code" ;;
              *) cat "/tmp/cancel-$run_id.json" >&2; exit 1 ;;
            esac
          done
          echo 'P10_RESIDUAL_AUTOFANOUT_CANCELLED=PASS'
