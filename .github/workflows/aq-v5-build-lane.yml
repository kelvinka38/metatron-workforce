name: Aquaculture v5 BIOS Build Lane

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 20
    steps:
      - name: Fetch exact BIOS v5 candidate and run full suite
        shell: bash
        env:
          BIOS_SHA: b1cb17290256e3a712c73dcd32bf42927e676fd4
        run: |
          set -euo pipefail
          BASE=/opt/metatron/metatron-workforce
          test -r "$BASE/.env"
          set -a; source "$BASE/.env"; set +a
          test -n "${GITHUB_TOKEN:-}"
          STAGE=$(mktemp -d /tmp/aq-v5-build.XXXXXX)
          trap 'rm -rf "$STAGE"' EXIT
          curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/kelvinka38/bios/tarball/$BIOS_SHA" | tar -xz -C "$STAGE" --strip-components=1
          cd "$STAGE"
          echo "BIOS_V5_SHA=$BIOS_SHA"
          node --check bios_runtime/domains/aquaculture/web/app.js
          python3 -m unittest discover -s tests -v
          echo '=== APP ANALYSIS FLOW SNIPPETS ==='
          python3 - <<'PY'
          from pathlib import Path
          s=Path('bios_runtime/domains/aquaculture/web/app.js').read_text()
          needles=['renderDecision','scenarios/generate','scenarios/evaluate','decision/recommend','Phân tích','analysis/start','analysis/status']
          for needle in needles:
              print('\n--- '+needle+' ---')
              start=0; seen=0
              while True:
                  i=s.find(needle,start)
                  if i<0: break
                  seen+=1
                  print(s[max(0,i-1200):min(len(s),i+2400)])
                  start=i+len(needle)
                  if seen>=5: break
              if not seen: print('NOT_FOUND')
          PY
          echo 'AQUACULTURE_V5_BUILD_LANE=PASS'
