name: Workforce Autonomy P10 GS3 GS4 Production Acceptance
run-name: P10 GS34 ${{ inputs.target_sha }}

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact deployed SHA to validate; defaults to dispatched ref SHA
        required: false
        type: string

permissions:
  contents: read

# Serialize with the existing GS1/GS2 production workflow. This keeps fault injection from
# interrupting the already-proven governed mutation slice while preserving independent evidence.
concurrency:
  group: metatron-production-lane
  cancel-in-progress: false

jobs:
  recovery-and-elasticity:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, linux, x64, metatron-prod]
    environment: production
    timeout-minutes: 45
    steps:
      - name: Run strict GS3 failure recovery and GS4 bounded elasticity
        shell: bash
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && (inputs.target_sha != '' && inputs.target_sha || github.sha) || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          BASE=/opt/metatron/metatron-workforce
          EVIDENCE=/tmp/workforce-p10-gs34-${GITHUB_RUN_ID}
          mkdir -p "$EVIDENCE"
          test -r "$BASE/.env"
          set -a; source "$BASE/.env"; set +a
          test -n "${TELEGRAM_WEBHOOK_SECRET:-}"
          test -n "${TELEGRAM_ALLOWED_USER_ID:-}"

          current_cid() {
            docker ps --filter name=deploy-workforce-1 --format '{{.ID}}' | head -1
          }

          CID=$(current_cid)
          test -n "$CID"
          DEPLOYED_SHA=$(docker inspect "$CID" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^METATRON_COMMIT_SHA=//p' | head -1)
          test "$DEPLOYED_SHA" = "$TARGET_SHA"
          test "$(docker inspect "$CID" --format '{{.State.Health.Status}}')" = healthy
          printf 'target_sha=%s\ndeployed_sha=%s\ncontainer=%s\n' "$TARGET_SHA" "$DEPLOYED_SHA" "$CID" > "$EVIDENCE/deployment.txt"

          submit_objective() {
            local label="$1" text="$2" update_id="$3"
            local body="$EVIDENCE/${label}-request.json"
            local response="$EVIDENCE/${label}-response.json"
            local duplicate_response="$EVIDENCE/${label}-duplicate-response.json"
            python3 - "$TELEGRAM_ALLOWED_USER_ID" "$update_id" "$text" > "$body" <<'PY'
          import json,sys
          uid=int(sys.argv[1]); update=int(sys.argv[2]); text=sys.argv[3]
          print(json.dumps({"update_id":update,"message":{"message_id":update%2000000000,"from":{"id":uid,"is_bot":False,"first_name":"Founder"},"chat":{"id":uid,"type":"private"},"date":0,"text":text}}))
          PY
            local start_ns end_ns status elapsed_ms
            start_ns=$(date +%s%N)
            status=$(curl -sS -o "$response" -w '%{http_code}' --proto '=https' --tlsv1.2 --max-time 20 \
              -X POST https://gate.metatron.vn/telegram/webhook \
              -H "X-Telegram-Bot-Api-Secret-Token: $TELEGRAM_WEBHOOK_SECRET" \
              -H 'Content-Type: application/json' --data-binary "@$body")
            end_ns=$(date +%s%N)
            elapsed_ms=$(( (end_ns-start_ns)/1000000 ))
            test "$status" = 200
            test "$elapsed_ms" -lt 5000
            printf 'update_id=%s\nack_http=%s\nack_millis=%s\n' "$update_id" "$status" "$elapsed_ms" > "$EVIDENCE/${label}-ingress.txt"

            # Exact provider replay: must be absorbed by durable ingress dedupe, not become a second Objective.
            status=$(curl -sS -o "$duplicate_response" -w '%{http_code}' --proto '=https' --tlsv1.2 --max-time 20 \
              -X POST https://gate.metatron.vn/telegram/webhook \
              -H "X-Telegram-Bot-Api-Secret-Token: $TELEGRAM_WEBHOOK_SECRET" \
              -H 'Content-Type: application/json' --data-binary "@$body")
            test "$status" = 200
            echo "duplicate_http=$status" >> "$EVIDENCE/${label}-ingress.txt"
          }

          locate_objective() {
            local label="$1" update_id="$2"
            local out="$EVIDENCE/${label}-objectives.json"
            for i in $(seq 1 180); do
              curl -fsS --max-time 5 http://127.0.0.1:8080/workforce/management/objectives > "$out" || true
              if python3 - "$out" "$update_id" > "$EVIDENCE/${label}-objective-id.txt" <<'PY'
          import json,sys
          path,update=sys.argv[1],sys.argv[2]
          try: data=json.load(open(path))
          except Exception: raise SystemExit(1)
          needle=f"telegram:update:{update}"
          found=[]
          for item in data if isinstance(data,list) else []:
              if needle in json.dumps(item,sort_keys=True):
                  objective=item.get('objective',{}) if isinstance(item,dict) else {}
                  oid=objective.get('objectiveId') or objective.get('objective_id')
                  if oid: found.append(oid)
          found=list(dict.fromkeys(found))
          if len(found)!=1: raise SystemExit(1)
          print(found[0])
          PY
              then return 0; fi
              sleep 2
            done
            echo "OBJECTIVE_NOT_FOUND label=$label update=$update_id" >&2
            return 1
          }

          wait_complete() {
            local label="$1" oid="$2" loops="${3:-300}"
            local view="$EVIDENCE/${label}-terminal-view.json" states="$EVIDENCE/${label}-states.txt"
            : > "$states"
            for i in $(seq 1 "$loops"); do
              curl -fsS --max-time 5 "http://127.0.0.1:8080/workforce/management/objectives/${oid}" > "$view" || true
              state=$(python3 - "$view" <<'PY'
          import json,sys
          try: print((json.load(open(sys.argv[1])).get('objective') or {}).get('status',''))
          except Exception: print('')
          PY
              )
              [ -n "$state" ] && echo "$state" >> "$states"
              case "$state" in
                COMPLETED|DELIVERED) return 0 ;;
                CANCELLED|ESCALATED) echo "${label}_BAD_TERMINAL_STATUS=$state" >&2; return 2 ;;
              esac
              sleep 2
            done
            echo "${label}_COMPLETION_TIMEOUT" >&2
            return 1
          }

          snapshot_state() {
            local label="$1"
            CID=$(current_cid); test -n "$CID"
            for f in management-state.json autonomy-coordination-state.json autonomy-scheduling-state.json autonomy-safety-state.json execution-attempts.json observation-state.json workforce-core-state.json workplace-continuity-state.json; do
              docker exec "$CID" sh -c "test -f /var/lib/metatron-workforce/$f && cat /var/lib/metatron-workforce/$f" > "$EVIDENCE/${label}-${f}" 2>/dev/null || true
            done
            docker exec "$CID" sh -c 'find /var/lib/metatron-workforce/recovery-probes -maxdepth 1 -type f -print 2>/dev/null | sort' > "$EVIDENCE/${label}-recovery-markers.txt" || true
          }

          assert_recovery() {
            local label="$1" oid="$2" minimum_dispatches="$3" require_local_history="$4"
            snapshot_state "$label"
            OID="$oid" LABEL="$label" MIN_DISPATCHES="$minimum_dispatches" REQUIRE_LOCAL_HISTORY="$require_local_history" EVIDENCE="$EVIDENCE" python3 - <<'PY'
          import json,os,pathlib,re
          root=pathlib.Path(os.environ['EVIDENCE']); label=os.environ['LABEL']; oid=os.environ['OID']; minimum=int(os.environ['MIN_DISPATCHES'])
          require_local_history=os.environ['REQUIRE_LOCAL_HISTORY']=='true'
          view=json.load(open(root/f'{label}-terminal-view.json'))
          assert (view.get('objective') or {}).get('objectiveId')==oid
          assert (view.get('objective') or {}).get('status') in ('COMPLETED','DELIVERED')
          blob=json.dumps(view,sort_keys=True)
          assert 'autonomy.recovery.probe.read' in blob, 'recovery capability not bound'
          if require_local_history:
              history=view.get('history') or []
              hblob=json.dumps(history,sort_keys=True)
              assert 'LOCAL_RECOVERY' in hblob, 'missing autonomous local recovery event'
              assert 'BLOCKED' in hblob, 'typed transient blocker not recorded'

          coordination=json.load(open(root/f'{label}-autonomy-coordination-state.json'))
          dispatches=[d for d in (coordination.get('dispatches') or {}).values() if d.get('objectiveId')==oid]
          assert len(dispatches)>=minimum, (len(dispatches),minimum)
          attempts=sorted((int(d.get('attempt',0)),d.get('status',''),d.get('stepId',''),d.get('idempotencyKey','')) for d in dispatches)
          by_step={}
          for attempt,status,step_id,key in attempts:
              assert step_id, attempts
              by_step.setdefault(step_id,[]).append((attempt,status,key))
          recovering_steps=[
              step_id for step_id,rows in by_step.items()
              if any(status=='FAILED' for _,status,_ in rows)
              and any(status=='SUCCEEDED' for _,status,_ in rows)
          ]
          assert recovering_steps, attempts
          for step_id,rows in by_step.items():
              keys={key for _,_,key in rows if key}
              assert len(keys)==1, f'logical dispatch idempotency key changed across retry: step={step_id} keys={sorted(keys)}'

          execution=json.load(open(root/f'{label}-execution-attempts.json'))
          execution_attempts=[a for a in execution.values() if a.get('objectiveId')==oid]
          assert execution_attempts, 'missing canonical execution attempts'
          assert any(a.get('status')=='SUCCEEDED' for a in execution_attempts), [a.get('status') for a in execution_attempts]

          observation=json.load(open(root/f'{label}-observation-state.json'))
          reports=[r for r in (observation.get('reportsByRequirement') or {}).values() if r.get('objectiveId')==oid]
          assert reports and all(r.get('criterionResult')=='PASS' for r in reports), [(r.get('criterionResult'),r.get('quality')) for r in reports]
          print(f'{label.upper()}_AUTONOMOUS_RECOVERY=PASS')
          PY
          }

          # ------------------------------------------------------------------
          # GS3-A — transient provider/execution failure, bounded Manager recovery.
          # ------------------------------------------------------------------
          GS3A_UPDATE=$(date +%s%N | cut -c1-18)
          GS3A_TARGET="p10-recovery://transient-timeout/${GITHUB_RUN_ID}-${GS3A_UPDATE}"
          GS3A_TEXT="Take ownership of one bounded READ_ONLY production recovery Objective. Use the available composite capability autonomy.recovery.probe.read against exact target ${GS3A_TARGET}. The capability intentionally injects one transient provider timeout. Recover autonomously without Human resume, preserve durable attempt/runtime/fencing evidence, independently verify the acceptance criterion through Observation, and complete. Do not mutate anything and do not invent lower-level capabilities."
          submit_objective gs3a "$GS3A_TEXT" "$GS3A_UPDATE"
          locate_objective gs3a "$GS3A_UPDATE"
          GS3A_OID=$(cat "$EVIDENCE/gs3a-objective-id.txt")
          wait_complete gs3a "$GS3A_OID" 300
          assert_recovery gs3a "$GS3A_OID" 2 true

          # Runtime replacement must be visible because the governed execution wrapper retries the
          # injected provider failure within Execution before Manager advances the dispatch attempt.
          python3 - "$EVIDENCE/gs3a-execution-attempts.json" "$GS3A_OID" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1])); oid=sys.argv[2]
          attempts=[a for a in data.values() if a.get('objectiveId')==oid]
          runtimes={a.get('runtimeId') for a in attempts if a.get('runtimeId')}
          assert len(runtimes)>=2, runtimes
          assert any(a.get('status') in ('FAILED','FENCED','ABANDONED') for a in attempts), [a.get('status') for a in attempts]
          print('GS3_PROVIDER_TIMEOUT_RUNTIME_REPLACEMENT=PASS')
          PY

          # ------------------------------------------------------------------
          # GS3-B — hard Workforce JVM/container process termination while a Work dispatch is active.
          # Inject SIGKILL from a bounded helper in the host PID namespace. Linux intentionally
          # protects a PID namespace's init process from SIGKILL sent by a member of that same
          # namespace, so an in-container `kill -9 1` cannot prove process loss. Do not use
          # `docker kill`: Docker treats that as a manual lifecycle action and suppresses the
          # restart policy. The helper receives only CAP_KILL, no network, and targets the exact
          # host PID resolved from the already-verified production container.
          # Workforce durable reconciliation must recover the Objective; no external resume/replan
          # or Objective state transition is called.
          # ------------------------------------------------------------------
          GS3B_UPDATE=$((GS3A_UPDATE+1))
          GS3B_TARGET="p10-recovery://restart-window/${GITHUB_RUN_ID}-${GS3B_UPDATE}"
          GS3B_TEXT="Take ownership of one bounded READ_ONLY restart-recovery Objective. Use the available composite capability autonomy.recovery.probe.read against exact target ${GS3B_TARGET}. Hold the governed Work dispatch open for the production restart fault window, then recover from runtime/process loss without Human operation, independently verify Observation, and complete. Do not mutate anything and do not invent lower-level capabilities."
          submit_objective gs3b "$GS3B_TEXT" "$GS3B_UPDATE"
          locate_objective gs3b "$GS3B_UPDATE"
          GS3B_OID=$(cat "$EVIDENCE/gs3b-objective-id.txt")

          for i in $(seq 1 180); do
            CID=$(current_cid); test -n "$CID"
            docker exec "$CID" cat /var/lib/metatron-workforce/autonomy-coordination-state.json > "$EVIDENCE/gs3b-pre-coordination.json" || true
            if python3 - "$EVIDENCE/gs3b-pre-coordination.json" "$GS3B_OID" <<'PY'
          import json,sys
          try: data=json.load(open(sys.argv[1]))
          except Exception: raise SystemExit(1)
          oid=sys.argv[2]
          active=[d for d in (data.get('dispatches') or {}).values() if d.get('objectiveId')==oid and d.get('status')=='STARTED']
          raise SystemExit(0 if active else 1)
          PY
            then break; fi
            [ "$i" -lt 180 ] || { echo 'GS3B_ACTIVE_DISPATCH_NOT_OBSERVED' >&2; exit 1; }
            sleep 1
          done

          CID=$(current_cid); test -n "$CID"
          RESTARTS_BEFORE=$(docker inspect "$CID" --format '{{.RestartCount}}')
          RESTART_POLICY=$(docker inspect "$CID" --format '{{.HostConfig.RestartPolicy.Name}}')
          case "$RESTART_POLICY" in
            always|unless-stopped|on-failure) ;;
            *) echo "GS3B_NO_RESTART_POLICY=$RESTART_POLICY" >&2; exit 1 ;;
          esac
          docker exec "$CID" cat /var/lib/metatron-workforce/management-state.json > "$EVIDENCE/gs3b-pre-management.json"
          docker exec "$CID" cat /var/lib/metatron-workforce/execution-attempts.json > "$EVIDENCE/gs3b-pre-execution-attempts.json"
          docker exec "$CID" sh -c 'find /var/lib/metatron-workforce/runtime-state -type f -maxdepth 2 -print -exec cat {} \; 2>/dev/null' > "$EVIDENCE/gs3b-pre-runtime-state.txt" || true
          HOST_PID=$(docker inspect "$CID" --format '{{.State.Pid}}')
          test "$HOST_PID" -gt 1
          FAULT_IMAGE='alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc'
          printf 'fault=SIGKILL_HOST_PID\ncontainer=%s\nhost_pid=%s\nrestart_policy=%s\n' \
            "$CID" "$HOST_PID" "$RESTART_POLICY" > "$EVIDENCE/gs3b-kill.txt"
          docker run --rm --network none --pid host --read-only \
            --cap-drop ALL --cap-add KILL "$FAULT_IMAGE" kill -9 "$HOST_PID"

          for i in $(seq 1 180); do
            CID=$(current_cid)
            if [ -n "$CID" ]; then
              health=$(docker inspect "$CID" --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' 2>/dev/null || true)
              restarts=$(docker inspect "$CID" --format '{{.RestartCount}}' 2>/dev/null || echo 0)
              if [ "$health" = healthy ] && [ "$restarts" -gt "$RESTARTS_BEFORE" ]; then break; fi
            fi
            [ "$i" -lt 180 ] || { echo 'GS3B_CONTAINER_DID_NOT_AUTORESTART_HEALTHY' >&2; exit 1; }
            sleep 2
          done
          RESTARTS_AFTER=$(docker inspect "$CID" --format '{{.RestartCount}}')
          printf 'restart_count_before=%s\nrestart_count_after=%s\n' "$RESTARTS_BEFORE" "$RESTARTS_AFTER" > "$EVIDENCE/gs3b-restart.txt"

          # Management lease is intentionally durable. The new runner must wait/fence the stale lease,
          # then reconcile the interrupted dispatch; allow enough time for the 5-minute lease ceiling.
          wait_complete gs3b "$GS3B_OID" 420
          assert_recovery gs3b "$GS3B_OID" 2 false

          OID="$GS3B_OID" EVIDENCE="$EVIDENCE" python3 - <<'PY'
          import json,os,pathlib,re
          root=pathlib.Path(os.environ['EVIDENCE']); oid=os.environ['OID']
          view=json.load(open(root/'gs3b-terminal-view.json'))
          history=view.get('history') or []
          lease_versions=[]
          for event in history:
              if event.get('type')=='MANAGEMENT_LEASE_ACQUIRED':
                  m=re.search(r'fencing_version=(\d+)',event.get('detail',''))
                  if m: lease_versions.append(int(m.group(1)))
          assert len(lease_versions)>=2 and max(lease_versions)>min(lease_versions), lease_versions
          coordination=json.load(open(root/'gs3b-autonomy-coordination-state.json'))
          dispatches=[d for d in (coordination.get('dispatches') or {}).values() if d.get('objectiveId')==oid]
          assert any('interrupted-read-only-retry' in (d.get('failure') or '') for d in dispatches), [(d.get('status'),d.get('failure')) for d in dispatches]
          execution=json.load(open(root/'gs3b-execution-attempts.json'))
          attempts=[a for a in execution.values() if a.get('objectiveId')==oid]
          assert any(a.get('status') in ('ABANDONED','FENCED','FAILED') for a in attempts), [a.get('status') for a in attempts]
          assert any(a.get('status')=='SUCCEEDED' for a in attempts), [a.get('status') for a in attempts]
          assert len({a.get('runtimeId') for a in attempts if a.get('runtimeId')})>=2
          print('GS3_PROCESS_RESTART_LEASE_FENCING=PASS')
          print('GS3_RUNTIME_LOSS_OBJECTIVE_SURVIVAL=PASS')
          PY

          # ------------------------------------------------------------------
          # GS3-C — deliberately insufficient Observation evidence on first verification pass.
          # Observation itself owns bounded retry and must later PASS without Human intervention.
          # ------------------------------------------------------------------
          GS3C_UPDATE=$((GS3B_UPDATE+1))
          GS3C_TARGET="p10-recovery://observation-retry/${GITHUB_RUN_ID}-${GS3C_UPDATE}"
          GS3C_TEXT="Take ownership of one bounded READ_ONLY Observation-recovery Objective. Use the available composite capability autonomy.recovery.probe.read against exact target ${GS3C_TARGET}. Execution completes once, while independent Observation intentionally begins with insufficient evidence and must retry autonomously until authoritative evidence settles. Complete only after Observation PASS. Do not mutate anything."
          submit_objective gs3c "$GS3C_TEXT" "$GS3C_UPDATE"
          locate_objective gs3c "$GS3C_UPDATE"
          GS3C_OID=$(cat "$EVIDENCE/gs3c-objective-id.txt")
          wait_complete gs3c "$GS3C_OID" 180
          snapshot_state gs3c
          OID="$GS3C_OID" EVIDENCE="$EVIDENCE" python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['EVIDENCE']); oid=os.environ['OID']
          view=json.load(open(root/'gs3c-terminal-view.json'))
          assert (view.get('objective') or {}).get('status') in ('COMPLETED','DELIVERED')
          observation=json.load(open(root/'gs3c-observation-state.json'))
          requirements=[r for r in (observation.get('requirements') or {}).values() if r.get('objectiveId')==oid]
          assert requirements
          attempts=observation.get('attemptsByRequirement') or {}
          counts=[int(attempts.get(r.get('requirementId'),0)) for r in requirements]
          assert counts and min(counts)>=2, counts
          reports=[r for r in (observation.get('reportsByRequirement') or {}).values() if r.get('objectiveId')==oid]
          assert reports and all(r.get('criterionResult')=='PASS' and r.get('quality')!='INSUFFICIENT' for r in reports)
          coordination=json.load(open(root/'gs3c-autonomy-coordination-state.json'))
          dispatches=[d for d in (coordination.get('dispatches') or {}).values() if d.get('objectiveId')==oid]
          assert len(dispatches)==1 and dispatches[0].get('status')=='SUCCEEDED', [(d.get('attempt'),d.get('status')) for d in dispatches]
          print('GS3_INSUFFICIENT_OBSERVATION_AUTONOMOUS_RETRY=PASS')
          PY

          # ------------------------------------------------------------------
          # GS4 — real four-repository fan-out/join with bounded scheduler-derived concurrency.
          # ------------------------------------------------------------------
          GS4_UPDATE=$((GS3C_UPDATE+1))
          GS4_TEXT='Take ownership of one bounded-elasticity Objective: perform governed READ_ONLY audits of kelvinka38/universal, kelvinka38/metatron-institution, kelvinka38/metatron-workforce, and kelvinka38/bios as independent Work where dependencies allow; schedule them concurrently within finite capacity, then join all four results using cross-repository-audit-analysis, verify through Observation, and complete with evidence. Do not mutate anything.'
          submit_objective gs4 "$GS4_TEXT" "$GS4_UPDATE"
          locate_objective gs4 "$GS4_UPDATE"
          GS4_OID=$(cat "$EVIDENCE/gs4-objective-id.txt")
          wait_complete gs4 "$GS4_OID" 360
          snapshot_state gs4
          OID="$GS4_OID" EVIDENCE="$EVIDENCE" python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['EVIDENCE']); oid=os.environ['OID']
          view=json.load(open(root/'gs4-terminal-view.json'))
          assert (view.get('objective') or {}).get('status') in ('COMPLETED','DELIVERED')
          work=view.get('autonomousWork') or {}
          plan=work.get('plannedWork') or []
          audits=[s for s in plan if s.get('requiredCapability')=='repository.audit.read']
          joins=[s for s in plan if s.get('requiredCapability')=='cross-repository-audit-analysis']
          assert len(audits)>=4, len(audits)
          assert joins and any(len(s.get('dependsOn') or [])>=4 for s in joins), joins

          scheduling=json.load(open(root/'gs4-autonomy-scheduling-state.json'))
          decisions=[d for d in (scheduling.get('decisions') or []) if d.get('objectiveId')==oid]
          assert decisions, 'missing scheduler decisions'
          parallel=[d for d in decisions if len(d.get('selectedStepIds') or [])>=2]
          assert parallel, [(d.get('readyStepIds'),d.get('selectedStepIds')) for d in decisions]
          assert all(1 <= int(d.get('structuralParallelismLimit',0)) <= 4 for d in decisions)
          assert all(len(d.get('selectedStepIds') or []) <= int(d.get('structuralParallelismLimit',0)) for d in decisions)

          coordination=json.load(open(root/'gs4-autonomy-coordination-state.json'))
          graphs=[g for g in (coordination.get('graphs') or {}).values() if g.get('objectiveId')==oid]
          assert graphs and graphs[-1].get('status')=='COMPLETED'
          graph=sorted(graphs,key=lambda g:int(g.get('graphVersion',0)))[-1]
          nodes=graph.get('nodes') or {}
          join_nodes=[n for n in nodes.values() if (n.get('spec') or {}).get('requiredCapability')=='cross-repository-audit-analysis']
          assert join_nodes
          for join in join_nodes:
              deps=(join.get('spec') or {}).get('dependsOn') or []
              assert len(deps)>=4
              assert all((nodes.get(dep) or {}).get('status')=='SUCCEEDED' for dep in deps)

          dispatches=[d for d in (coordination.get('dispatches') or {}).values() if d.get('objectiveId')==oid]
          assert len(dispatches)>=5
          ids=[d.get('dispatchId') for d in dispatches]; assert len(ids)==len(set(ids))
          keys=[d.get('idempotencyKey') for d in dispatches]; assert len(keys)==len(set(keys))
          first_parallel=parallel[0].get('selectedStepIds') or []
          starts=[float(d.get('createdAt')) for d in dispatches if d.get('stepId') in first_parallel]
          assert len(starts)>=2 and max(starts)-min(starts) < 1.0, starts
          join_steps={(n.get('spec') or {}).get('stepId') for n in join_nodes}
          join_dispatch=[d for d in dispatches if d.get('stepId') in join_steps]
          dep_dispatch=[d for d in dispatches if d.get('stepId') not in join_steps]
          assert join_dispatch and dep_dispatch
          assert min(float(d.get('createdAt')) for d in join_dispatch) >= max(float(d.get('updatedAt')) for d in dep_dispatch), 'join dispatched before dependencies completed'
          print('GS4_BOUNDED_PARALLEL_READY_SET=PASS')
          print('GS4_FANOUT_JOIN=PASS')
          print('GS4_DISPATCH_IDEMPOTENCY=PASS')
          PY

          printf 'GS3A_OBJECTIVE_ID=%s\nGS3B_OBJECTIVE_ID=%s\nGS3C_OBJECTIVE_ID=%s\nGS4_OBJECTIVE_ID=%s\n' \
            "$GS3A_OID" "$GS3B_OID" "$GS3C_OID" "$GS4_OID" > "$EVIDENCE/objectives.txt"
          CID=$(current_cid); docker logs --since 50m "$CID" > "$EVIDENCE/workforce.log" 2>&1 || true
          tar -C "$EVIDENCE" -czf "/tmp/workforce-p10-gs34-${GITHUB_RUN_ID}.tgz" .

          DURABLE="$HOME/.metatron/acceptance-evidence/p10/$TARGET_SHA/gs34-$GITHUB_RUN_ID"
          rm -rf "$DURABLE"
          mkdir -p "$DURABLE"
          cp -a "$EVIDENCE/." "$DURABLE/"
          printf 'kind=gs34\ntarget_sha=%s\nrun_id=%s\n' "$TARGET_SHA" "$GITHUB_RUN_ID" > "$DURABLE/_index.txt"

          echo 'P10_GOLDEN_SLICE_3=PASS'
          echo 'P10_GOLDEN_SLICE_4=PASS'
          echo 'P10_L10_VERDICT=NOT_YET_CLAIMED_45_CONDITION_GATE_REMAINS'
          echo "P10_GS34_DURABLE_EVIDENCE=$DURABLE"

      - name: Upload GS3 GS4 production evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: workforce-p10-gs34-production-evidence-${{ github.run_id }}
          path: |
            /tmp/workforce-p10-gs34-${{ github.run_id }}/
            /tmp/workforce-p10-gs34-${{ github.run_id }}.tgz
          if-no-files-found: warn
          retention-days: 14
