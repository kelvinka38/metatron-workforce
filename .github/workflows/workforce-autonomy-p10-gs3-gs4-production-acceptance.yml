name: Workforce P10 GS3 GS4 (Accepted Historical Disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Historical lane is intentionally disabled
        shell: bash
        run: |
          set -euo pipefail
          echo 'HISTORICAL_EXECUTION=DISABLED'
          echo 'REASON=The old Golden Slice production lane is historical after accepted closure and is retained only in Git history.'
          echo 'REPLACEMENT=native runtime-closure + current targeted acceptance'
          echo 'SELF_HOSTED_RUNNER_REQUIRED=false'
