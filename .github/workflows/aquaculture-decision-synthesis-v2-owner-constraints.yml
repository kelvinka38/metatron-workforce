          s=s.replace(old,new)
          p.write_text(s)

          # Add strict owner-invariant regression tests using the same live-pilot semantics.
          p=Path('tests/test_aquaculture_synthesis_v2.py')
          s=p.read_text()
          marker='''          if __name__=='__main__':unittest.main()
          '''
          assert marker in s
          extra=r'''              def test_strict_owner_invariants_do_not_fake_compliance(self):
                  # Existing discovery is authoritative; generation must backfill constraints even
                  # when the row predates the current parser implementation.
                  self.svc.update_discovery(self.actor,{'case_id':self.case,'farm_id':self.farm['farm_id'],'items':[
                    {'semantic_key':'CD-08','normalized_value':'Năng lượng tái tạo, không thức ăn công nghiệp, không hoá chất','original_value':'Năng lượng tái tạo, không thức ăn công nghiệp, không hoá chất','field_state':'DECLARED','owner_lock':True}
