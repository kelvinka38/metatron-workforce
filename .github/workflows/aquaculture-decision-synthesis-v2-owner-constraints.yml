name: Aquaculture Decision Synthesis v2 Owner Constraints

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquaculture-decision-synthesis-v2-owner-constraints.yml'

permissions:
  contents: read

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 10
    steps:
      - name: Tighten owner invariant semantics and decision readiness
        shell: bash
        run: |
          set -euo pipefail
          BASE=/opt/metatron/metatron-workforce
          set -a; source "$BASE/.env"; set +a
          test -n "${GITHUB_TOKEN:-}"
          WORK=/tmp/bios-aq-synthesis-owner-constraints
          rm -rf "$WORK"
          git clone --depth 1 --branch aquaculture-decision-synthesis-v2 "https://x-access-token:${GITHUB_TOKEN}@github.com/kelvinka38/bios.git" "$WORK"
          cd "$WORK"
          git config user.name 'Metatron Selfhosted'
          git config user.email 'metatron@localhost'
          python3 - <<'PY'
          from pathlib import Path

          p=Path('bios_runtime/domains/aquaculture/services.py')
          s=p.read_text()
          old='''        if "khong thuc an cong nghiep" in text or "khong dung thuc an cong nghiep" in text:
                      out.append({"constraint_type":"LOW_INPUT_REQUIRED","value":True,"scope":{},"authority_ref":actor_id})
          '''
          if old not in s:
              # real source uses class indentation, replace compactly
              old='''        if "khong thuc an cong nghiep" in text or "khong dung thuc an cong nghiep" in text:
              out.append({"constraint_type":"LOW_INPUT_REQUIRED","value":True,"scope":{},"authority_ref":actor_id})
          '''
          new='''        if "khong thuc an cong nghiep" in text or "khong dung thuc an cong nghiep" in text:
              out.append({"constraint_type":"NO_COMMERCIAL_FEED_REQUIRED","value":True,"scope":{},"authority_ref":actor_id})
          if "giam cam cong nghiep" in text or "giam thuc an cong nghiep" in text or "it dau vao" in text:
              out.append({"constraint_type":"LOW_INPUT_REQUIRED","value":True,"scope":{},"authority_ref":actor_id})
          '''
          assert old in s, 'owner feed parser block not found'
          s=s.replace(old,new)

          old='''            "low_input": any(x in text for x in ("không thức ăn công nghiệp","khong thuc an cong nghiep","thức ăn tự nhiên","thuc an tu nhien")),
              "no_chemical": any(x in text for x in ("không hoá chất","không hóa chất","khong hoa chat")),
          '''
          new='''            "low_input": any(x in text for x in ("không thức ăn công nghiệp","khong thuc an cong nghiep","thức ăn tự nhiên","thuc an tu nhien","giảm cám công nghiệp","giam cam cong nghiep")),
              "no_commercial_feed": any(x in text for x in ("không thức ăn công nghiệp","khong thuc an cong nghiep","không dùng thức ăn công nghiệp","khong dung thuc an cong nghiep")),
              "no_chemical": any(x in text for x in ("không hoá chất","không hóa chất","khong hoa chat")),
          '''
          assert old in s, 'owner profile block not found'
          s=s.replace(old,new)

          marker='''    def _auto_candidates(self, species:str, discovery:dict, preferred_species:str|None, farm_id:str, farm_location:dict|None=None)->list[dict]:
          '''
          helper='''    def _sync_owner_constraints_from_discovery(self,farm_id:str,actor_id:str,discovery:dict)->None:
              """Backfill/migrate canonical owner constraints from authoritative discovery.

              Older pilot rows may predate a parser rule. Reanalysis must therefore
              synchronize the latest locked CD-06/CD-08 semantics before generation.
              """
              import json
              def signature(items):
                  out=[]
                  for item in items:
                      scope=dict(item.get("scope") or {});scope.pop("source_semantic",None)
                      out.append((str(item.get("constraint_type")),json.dumps(item.get("value"),sort_keys=True,ensure_ascii=False),json.dumps(scope,sort_keys=True,ensure_ascii=False)))
                  return sorted(out)
              desired={"CD-06":[],"CD-08":[]}
              cd6=discovery.get("CD-06") or {}
              if cd6.get("owner_lock") and cd6.get("normalized_value") not in (None,"","OPEN","UNKNOWN"):
                  value=cd6.get("normalized_value");species=value[0] if isinstance(value,list) and value else value
                  if isinstance(species,dict):species=species.get("species") or species.get("scientific_name") or species.get("vi")
                  resolved=self.knowledge.resolve_species_name(species) or species
                  if resolved:desired["CD-06"]=[{"constraint_type":"SPECIES_LOCK","value":resolved,"scope":{},"authority_ref":actor_id}]
              cd8=discovery.get("CD-08") or {}
              if cd8.get("owner_lock"):
                  desired["CD-08"]=self._owner_invariant_constraints(cd8.get("normalized_value"),actor_id)
              active=self.repo.active_constraints(farm_id)
              for semantic,items in desired.items():
                  existing=[x for x in active if (x.get("scope") or {}).get("source_semantic")==semantic]
                  if signature(existing)!=signature(items):
                      refs=(discovery.get(semantic) or {}).get("evidence_refs") or []
                      self.repo.replace_semantic_constraints(farm_id,semantic,items,actor_id,refs)

          '''
          assert marker in s
          if '_sync_owner_constraints_from_discovery' not in s:
              s=s.replace(marker,helper+marker)

          old='''        discovery={x["semantic_key"]:x for x in self.repo.get_discovery(farm["farm_id"])}
              pref=(discovery.get("CD-06") or {}).get("normalized_value")
          '''
          new='''        discovery={x["semantic_key"]:x for x in self.repo.get_discovery(farm["farm_id"])}
              self._sync_owner_constraints_from_discovery(farm["farm_id"],actor_id,discovery)
              pref=(discovery.get("CD-06") or {}).get("normalized_value")
          '''
          assert old in s, 'generation discovery block not found'
          s=s.replace(old,new)

          old='''                cand=synthesize_candidate(species=species,culture_method=culture_method,input_strategy=input_strategy,discovery=discovery,farm_location=farm_location or {},economics=economics,preferred_species=preferred_species,owner_profile=profile,knowledge_refs=base_refs+econ_refs)
          '''
          new='''                cand=synthesize_candidate(species=species,culture_method=culture_method,input_strategy=input_strategy,discovery=discovery,farm_location=farm_location or {},economics=economics,preferred_species=preferred_species,owner_profile=profile,knowledge_refs=base_refs+econ_refs,nutrition_items=nutrition.get("items") or [])
          '''
          assert old in s, 'synthesis call not found'
          s=s.replace(old,new)
          p.write_text(s)

          p=Path('bios_runtime/domains/aquaculture/synthesis.py')
          s=p.read_text()
          old='''def synthesize_candidate(*,species:str,culture_method:str,input_strategy:str,discovery:dict,farm_location:dict|None,economics:dict,preferred_species:str|None,owner_profile:dict,knowledge_refs:list[str])->dict:
          '''
          new='''def synthesize_candidate(*,species:str,culture_method:str,input_strategy:str,discovery:dict,farm_location:dict|None,economics:dict,preferred_species:str|None,owner_profile:dict,knowledge_refs:list[str],nutrition_items:list[dict]|None=None)->dict:
          '''
          assert old in s
          s=s.replace(old,new)
          old='''    inp=INPUT_PROFILES.get(input_strategy,INPUT_PROFILES["OPEN"])

              # A single-species candidate cannot honestly claim to be a polyculture design.
          '''
          new='''    inp=INPUT_PROFILES.get(input_strategy,INPUT_PROFILES["OPEN"])
              nutrition_items=list(nutrition_items or [])
              nutrition_text=" ".join(str(x.get("notes") or "")+" "+str(x.get("value") or "") for x in nutrition_items).casefold()
              if input_strategy=="COMMERCIAL_FEED":
                  commercial_feed_relation="REQUIRED"
              elif input_strategy=="MIXED_LOW_INPUT" and any(x in nutrition_text for x in ("pellet","commercial feed","cám","cam")):
                  commercial_feed_relation="PRESENT_IN_REFERENCE"
              elif input_strategy=="NATURAL" and nutrition_items:
                  commercial_feed_relation="NONE_IN_REFERENCE"
              else:
                  commercial_feed_relation="UNRESOLVED"

              # A single-species candidate cannot honestly claim to be a polyculture design.
          '''
          assert old in s, 'synthesis input profile anchor missing'
          s=s.replace(old,new)
          old='''    if context["water_source"]=="UNKNOWN":material_unknowns.append({"property":"water_source","impact":"BLOCKING","resolution":"resolve the actual water source and supply path"})

              risk={
          '''
          new='''    if context["water_source"]=="UNKNOWN":material_unknowns.append({"property":"water_source","impact":"BLOCKING","resolution":"resolve the actual water source and supply path"})
              if owner_profile.get("no_commercial_feed") and commercial_feed_relation=="UNRESOLVED":material_unknowns.append({"property":"no_commercial_feed_pathway","impact":"BLOCKING","resolution":"prove a species/system nutrition pathway that does not depend on industrial/commercial feed"})
              if owner_profile.get("no_chemical"):material_unknowns.append({"property":"no_chemical_protocol","impact":"BLOCKING","resolution":"provide or validate a complete no-chemical operating protocol for this system; owner intent alone is not evidence"})
              if owner_profile.get("renewable"):material_unknowns.append({"property":"renewable_energy_design","impact":"BLOCKING","resolution":"size renewable generation/storage and backup against the system's actual critical loads"})

              invariant_conflicts=[]
              if owner_profile.get("no_commercial_feed") and commercial_feed_relation in {"REQUIRED","PRESENT_IN_REFERENCE"}:
                  invariant_conflicts.append("The evidence-backed nutrition pathway uses industrial/commercial feed, conflicting with the locked owner invariant.")

              risk={
          '''
          assert old in s, 'material unknown anchor missing'
          s=s.replace(old,new)
          old='''        "owner_alignment_unknowns":sum([
                  1 if owner_profile.get("low_input") and input_strategy not in {"NATURAL","MIXED_LOW_INPUT","LOW_INPUT"} else 0,
                  1 if owner_profile.get("no_chemical") else 0,
                  1 if owner_profile.get("renewable") else 0,
              ]),
              "owner_targets":{"low_input":bool(owner_profile.get("low_input")),"no_chemical":bool(owner_profile.get("no_chemical")),"renewable":bool(owner_profile.get("renewable"))},
          '''
          new='''        "owner_alignment_unknowns":sum([
                  1 if owner_profile.get("no_commercial_feed") and commercial_feed_relation=="UNRESOLVED" else 0,
                  1 if owner_profile.get("low_input") and not owner_profile.get("no_commercial_feed") and input_strategy not in {"NATURAL","MIXED_LOW_INPUT","LOW_INPUT"} else 0,
                  1 if owner_profile.get("no_chemical") else 0,
                  1 if owner_profile.get("renewable") else 0,
              ]),
              "owner_invariant_conflicts":invariant_conflicts,
              "owner_targets":{"low_input":bool(owner_profile.get("low_input")),"no_commercial_feed":bool(owner_profile.get("no_commercial_feed")),"no_chemical":bool(owner_profile.get("no_chemical")),"renewable":bool(owner_profile.get("renewable"))},
          '''
          assert old in s, 'owner risk block missing'
          s=s.replace(old,new)
          old='''        "input_strategy":input_strategy,
              "input_strategy_description":inp["description"],
              "chemical_strategy":"NONE_TARGET" if owner_profile.get("no_chemical") else "OPEN",
              "energy_strategy":"RENEWABLE_PRIORITY" if owner_profile.get("renewable") else "OPEN",
          '''
          new='''        "input_strategy":input_strategy,
              "input_strategy_description":inp["description"],
              "commercial_feed_relation":commercial_feed_relation,
              "chemical_strategy":"NO_CHEMICAL_REQUIRED_UNRESOLVED" if owner_profile.get("no_chemical") else "OPEN",
              "energy_strategy":"RENEWABLE_REQUIRED_UNRESOLVED" if owner_profile.get("renewable") else "OPEN",
          '''
          assert old in s, 'production strategies block missing'
          s=s.replace(old,new)
          old='''    if not current_capital:why.append("It is not financially cleared: current capital requirement is still unresolved and must remain visible as a blocker.")

              return {
          '''
          new='''    if not current_capital:why.append("It is not financially cleared: current capital requirement is still unresolved and must remain visible as a blocker.")
              if invariant_conflicts:why.extend(invariant_conflicts)
              if owner_profile.get("no_chemical"):why.append("The owner requires no chemicals; this remains unproven until a complete operating protocol is evidenced.")
              if owner_profile.get("renewable"):why.append("The owner requires renewable energy; this remains unproven until loads, generation, storage and critical backup are sized.")

              return {
          '''
          assert old in s, 'why block missing'
          s=s.replace(old,new)
          p.write_text(s)

          p=Path('bios_runtime/domains/aquaculture/rules.py')
          s=p.read_text()
          old='''            if ctype=="LOW_INPUT_REQUIRED":
                  strategy=str(production.get("input_strategy") or "").upper()
                  result="PASS" if strategy in {"LOW_INPUT","NATURAL","MIXED_LOW_INPUT"} else ("CONDITIONAL" if not strategy else "FAIL")
                  gates.append(gate("AQ-OWNER-LOW-INPUT","OWNER_INVARIANT_GATE",result,"Scenario input strategy is checked against owner low-input invariant."))
                  if result=="CONDITIONAL": unknowns.append({"subject":"scenario","property":"input_strategy","impact":"BLOCKING","resolution_method":"define input strategy"})
              elif ctype=="SPECIES_LOCK":
          '''
          new='''            if ctype=="LOW_INPUT_REQUIRED":
                  strategy=str(production.get("input_strategy") or "").upper()
                  result="PASS" if strategy in {"LOW_INPUT","NATURAL","MIXED_LOW_INPUT"} else ("CONDITIONAL" if not strategy or strategy in {"OPEN","UNKNOWN"} else "FAIL")
                  gates.append(gate("AQ-OWNER-LOW-INPUT","OWNER_INVARIANT_GATE",result,"Scenario input strategy is checked against owner low-input invariant."))
                  if result=="CONDITIONAL": unknowns.append({"subject":"scenario","property":"input_strategy","impact":"BLOCKING","resolution_method":"define and evidence a low-input strategy"})
              elif ctype=="NO_COMMERCIAL_FEED_REQUIRED":
                  strategy=str(production.get("input_strategy") or "OPEN").upper()
                  relation=str(production.get("commercial_feed_relation") or "UNRESOLVED").upper()
                  if strategy=="COMMERCIAL_FEED" or relation in {"REQUIRED","PRESENT_IN_REFERENCE"}: result="FAIL"
                  elif strategy=="NATURAL" and relation=="NONE_IN_REFERENCE": result="PASS"
                  else: result="CONDITIONAL"
                  gates.append(gate("AQ-OWNER-NO-COMMERCIAL-FEED","OWNER_INVARIANT_GATE",result,"The scenario must not rely on industrial/commercial feed; a reduced-feed reference is not equivalent to zero commercial feed."))
                  if result=="CONDITIONAL": unknowns.append({"subject":"scenario","property":"no_commercial_feed_pathway","impact":"BLOCKING","resolution_method":"prove a nutrition pathway with no industrial/commercial feed for this species/system"})
              elif ctype=="SPECIES_LOCK":
          '''
          assert old in s, 'low input rules block missing'
          s=s.replace(old,new)
          old='''            elif ctype=="NO_CHEMICAL_REQUIRED":
                  strategy=str(production.get("chemical_strategy") or "OPEN").upper()
                  result="PASS" if strategy in {"NONE","NONE_TARGET","NO_CHEMICAL"} else ("CONDITIONAL" if strategy in {"","OPEN","UNKNOWN"} else "FAIL")
                  gates.append(gate("AQ-OWNER-NO-CHEMICAL","OWNER_INVARIANT_GATE",result,"Scenario chemical strategy is checked against the owner's explicit no-chemical invariant."))
                  if result=="CONDITIONAL":
                      unknowns.append({"subject":"scenario","property":"chemical_strategy","impact":"BLOCKING","resolution_method":"define a no-chemical-compatible production strategy"})
              elif ctype=="RENEWABLE_REQUIRED":
                  strategy=str(production.get("energy_strategy") or "OPEN").upper()
                  result="PASS" if strategy in {"RENEWABLE_PRIORITY","RENEWABLE_ONLY","SOLAR"} else ("CONDITIONAL" if strategy in {"","OPEN","UNKNOWN"} else "FAIL")
                  gates.append(gate("AQ-OWNER-RENEWABLE","OWNER_INVARIANT_GATE",result,"Scenario energy strategy is checked against the owner's explicit renewable-energy invariant."))
                  if result=="CONDITIONAL":
                      unknowns.append({"subject":"scenario","property":"energy_strategy","impact":"BLOCKING","resolution_method":"define an energy strategy that preserves the renewable-energy invariant"})
          '''
          new='''            elif ctype=="NO_CHEMICAL_REQUIRED":
                  strategy=str(production.get("chemical_strategy") or "OPEN").upper()
                  result="PASS" if strategy in {"NONE_EVIDENCED","NO_CHEMICAL_EVIDENCED"} else ("FAIL" if strategy in {"CHEMICAL_REQUIRED","CHEMICAL_DEPENDENT"} else "CONDITIONAL")
                  gates.append(gate("AQ-OWNER-NO-CHEMICAL","OWNER_INVARIANT_GATE",result,"Owner intent does not prove no-chemical feasibility; the complete operating protocol must be evidenced."))
                  if result=="CONDITIONAL":
                      unknowns.append({"subject":"scenario","property":"no_chemical_protocol","impact":"BLOCKING","resolution_method":"validate a complete no-chemical operating protocol for the selected system"})
              elif ctype=="RENEWABLE_REQUIRED":
                  strategy=str(production.get("energy_strategy") or "OPEN").upper()
                  result="PASS" if strategy in {"RENEWABLE_EVIDENCED","SOLAR_EVIDENCED"} else ("FAIL" if strategy in {"GRID_ONLY","FOSSIL_ONLY"} else "CONDITIONAL")
                  gates.append(gate("AQ-OWNER-RENEWABLE","OWNER_INVARIANT_GATE",result,"A renewable preference/label does not prove that generation, storage and backup cover the system's critical loads."))
                  if result=="CONDITIONAL":
                      unknowns.append({"subject":"scenario","property":"renewable_energy_design","impact":"BLOCKING","resolution_method":"size renewable generation/storage and critical backup against actual system loads"})
          '''
          assert old in s, 'chemical/renewable block missing'
          s=s.replace(old,new)
          p.write_text(s)

          p=Path('bios_runtime/domains/aquaculture/farmer_workspace.py')
          s=p.read_text()
          old='''    def _scenario_projection(self,s:dict,rank:int)->dict[str,Any]:
              prod=s.get("production") or {};econ=s.get("economics") or {};risk=s.get("risk") or {};market=s.get("market_pathway") or {};synth=risk.get("synthesis") or {}
          '''
          new='''    def _scenario_projection(self,s:dict,rank:int)->dict[str,Any]:
              prod=s.get("production") or {};econ=s.get("economics") or {};risk=s.get("risk") or {};market=s.get("market_pathway") or {};synth=risk.get("synthesis") or {}
              unknown_map={x["unknown_id"]:x for x in self.repo.list_unknowns(s["farm_id"],active_only=True)}
              decision_gaps=[unknown_map[x] for x in s.get("unknown_refs") or [] if x in unknown_map]
              readiness="READY_TO_SELECT" if s.get("eligibility")=="ELIGIBLE" and not decision_gaps and s.get("recommendation_state")!="PROVISIONAL" else ("REJECTED" if s.get("eligibility")=="INELIGIBLE" else "EVIDENCE_GAPS")
          '''
          assert old in s, 'projection header missing'
          s=s.replace(old,new)
          old='''              "rank":rank,"name":f"{friendly_species(species)} · {method_vi} · {input_vi}","species_name":friendly_species(species),"scientific_name":species,
                  "eligibility":s.get("eligibility"),"recommendation_state":s.get("recommendation_state"),"blocking_unknowns":len(s.get("unknown_refs") or []),
          '''
          new='''              "rank":rank,"name":f"{friendly_species(species)} · {method_vi} · {input_vi}","species_name":friendly_species(species),"scientific_name":species,
                  "eligibility":s.get("eligibility"),"recommendation_state":s.get("recommendation_state"),"decision_readiness":readiness,"blocking_unknowns":len(s.get("unknown_refs") or []),
                  "decision_gaps":[{"property":x.get("property"),"impact":x.get("impact"),"resolution_method":x.get("resolution_method"),"status":x.get("status")} for x in decision_gaps],
                  "owner_invariant_conflicts":risk.get("owner_invariant_conflicts") or [],
          '''
