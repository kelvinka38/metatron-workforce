          p.write_text(s)

          p=Path('bios_runtime/domains/aquaculture/web/app.js')
          s=p.read_text()
          old=''' '<div>'+pill(s.eligibility,scenarioStatus(s))+pref+'</div><div class="small muted">PHƯƠNG ÁN #'+html(s.rank||i+1)+'</div><h3>'+html(s.name)+'</h3><div class="latin">'+html(s.scientific_name)+'</div>'+'''
          new=''' '<div>'+pill(s.decision_readiness==="READY_TO_SELECT"?"Sẵn sàng chốt":s.decision_readiness==="REJECTED"?"Không phù hợp":"Cần kiểm chứng",s.decision_readiness==="READY_TO_SELECT"?"ok":s.decision_readiness==="REJECTED"?"bad":"warn")+pref+'</div><div class="small muted">PHƯƠNG ÁN #'+html(s.rank||i+1)+'</div><h3>'+html(s.name)+'</h3><div class="latin">'+html(s.scientific_name)+'</div>'+'''
          assert old in s, 'scenario card badge missing'
          s=s.replace(old,new)
          old=''' '</div><div class="card-actions"><button class="btn btn-secondary detailScenario" data-i="'+i+'">Xem hồ sơ phương án</button>'+(s.eligibility==="INELIGIBLE"?"":'<button class="btn btn-primary chooseScenario" data-i="'+i+'">Chọn</button>')+'</div></div>'
          '''
          new=''' '</div><div class="card-actions"><button class="btn btn-secondary detailScenario" data-i="'+i+'">Xem hồ sơ phương án</button>'+(s.decision_readiness==="READY_TO_SELECT"?'<button class="btn btn-primary chooseScenario" data-i="'+i+'">Chọn & chốt</button>':'')+'</div></div>'
          '''
          assert old in s, 'scenario choose button missing'
          s=s.replace(old,new)
          old=''' const gates=(s.gate_results||[]).map(humanGate),p=s.production_blueprint||{},e=s.economics||{},m=s.market||{},r=s.risks||{},trace=s.decision_trace||[],unknowns=s.material_unknowns||[];
          '''
          new=''' const gates=(s.gate_results||[]).map(humanGate),p=s.production_blueprint||{},e=s.economics||{},m=s.market||{},r=s.risks||{},trace=s.decision_trace||[],unknowns=[...(s.material_unknowns||[]),...(s.decision_gaps||[])],conflicts=s.owner_invariant_conflicts||[];
          '''
          assert old in s, 'scenario detail vars missing'
          s=s.replace(old,new)
          old=''' '<h3>Điểm phải làm rõ trước khi chốt</h3>'+list(unknowns,'Không có material unknown được derive ở bước synthesis.')+
              '<h3>Step 1 đã tác động vào phương án thế nào</h3>'''
          new=''' '<h3>Xung đột với nguyên tắc của bạn</h3>'+list(conflicts,'Không có xung đột owner-invariant đã xác định.')+
              '<h3>Điểm phải làm rõ trước khi chốt</h3>'+list(unknowns,'Không có material unknown được derive ở bước synthesis.')+
              '<h3>Step 1 đã tác động vào phương án thế nào</h3>'''
          assert old in s, 'detail gaps section missing'
          s=s.replace(old,new)
          old=''' '<div class="notice" style="margin-top:15px"><strong>Mức khuyến nghị</strong>'+html(label(s.recommendation_state))+'</div>')
          '''
          new=''' '<div class="notice" style="margin-top:15px"><strong>Trạng thái quyết định</strong>'+html(s.decision_readiness==="READY_TO_SELECT"?"Đủ bằng chứng hiện tại để chọn":s.decision_readiness==="REJECTED"?"Không phù hợp với hard gate hiện tại":"CHƯA ĐỦ BẰNG CHỨNG ĐỂ KHUYẾN NGHỊ / CHỐT")+'</div>')
          '''
