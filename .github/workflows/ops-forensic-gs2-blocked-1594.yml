name: Forensic GS2 Blocked (Highway Ingress)

on:
  workflow_dispatch:
    inputs:
      objective_id:
        description: Objective ID to inspect
        required: false
        default: objective:intelligence-case:case-446b826e-96d3-436f-b55f-4092cfc8391e:request:telegram:update:178868477505983197
        type: string

permissions:
  contents: read

jobs:
  enqueue:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Submit forensic read to persistent Highway
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/highway-manual-ingress.sh 'ops-forensic-gs2-blocked' '' '25' "OID=${{ inputs.objective_id }}"
