name: Live Worker Guidance Proof

# rerun-after-audit-wiring: c30de86752af3db2bce8b98a9f7d9ffc4831ce90
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-worker-guidance-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-live-worker-guidance:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 10
    steps:
      - name: Execute Gateway Head through live guidance gate
        shell: bash
        run: |
          set -euo pipefail

          echo '=== LIVE DOCKER TOPOLOGY ==='
          docker ps --format 'NAME={{.Names}} IMAGE={{.Image}} PORTS={{.Ports}}'

          CONTAINER=''
          IP=''
          for candidate in $(docker ps --format '{{.Names}}'); do
            candidate_ips=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' "$candidate" 2>/dev/null || true)
            for candidate_ip in $candidate_ips; do
              code=$(curl -sS -m 2 -o /tmp/probe.json -w '%{http_code}' "http://${candidate_ip}:8080/public/docs/gateway/manifest.json" || true)
              if [ "$code" = '200' ]; then
                CONTAINER="$candidate"
                IP="$candidate_ip"
                break 2
              fi
            done
          done
          if [ -z "$CONTAINER" ] || [ -z "$IP" ]; then
            echo 'LIVE_WORKER_GUIDANCE=FAIL workforce_container_probe_failed'
            exit 1
          fi

          BASE="http://${IP}:8080"
          WORKER='WORKER-GATEWAY-HEAD-01'
          PARTICIPANT='PARTICIPANT-GATEWAY-HEAD-01'
          PARTICIPATION='PARTICIPATION-GATEWAY-HEAD-01'
          WORK="WORK-GUIDANCE-PROOF-${GITHUB_RUN_ID}"
          ASSIGNMENT="ASSIGNMENT-GUIDANCE-PROOF-${GITHUB_RUN_ID}"

          echo "CONTAINER=$CONTAINER"
          echo "CONTAINER_IP=$IP"
          echo "WORKER=$WORKER"
          echo "WORK=$WORK"

          code=$(curl -sS -o /tmp/worker.json -w '%{http_code}' "$BASE/workforce/core/workers/$WORKER" || true)
          if [ "$code" = '404' ]; then
            curl -fsS -X POST "$BASE/workforce/core/participants" \
              -H 'Content-Type: application/json' \
              --data "{\"participantId\":\"$PARTICIPANT\",\"type\":\"AI\",\"provenanceRef\":\"production:gateway-head-guidance-proof\"}" >/dev/null
            curl -fsS -X POST "$BASE/workforce/core/workers" \
              -H 'Content-Type: application/json' \
              --data "{\"workerId\":\"$WORKER\",\"participantId\":\"$PARTICIPANT\"}" >/dev/null
            curl -fsS -X POST "$BASE/workforce/core/workers/$WORKER/status/ACTIVE" >/dev/null
            curl -fsS -X POST "$BASE/workforce/core/participations" \
              -H 'Content-Type: application/json' \
              --data "{\"participationId\":\"$PARTICIPATION\",\"workerId\":\"$WORKER\",\"organizationRef\":\"METATRON\",\"positionRef\":\"POSITION-HEAD-OF-GATEWAY\",\"roleRef\":\"ROLE-HEAD-OF-GATEWAY\"}" >/dev/null
            curl -fsS -X POST "$BASE/workforce/core/participations/$PARTICIPATION/status/ACTIVE" >/dev/null
            curl -fsS -X POST "$BASE/workforce/core/capabilities" \
              -H 'Content-Type: application/json' \
              --data "{\"workerId\":\"$WORKER\",\"capabilityRef\":\"gateway.audit.read\",\"level\":1.0,\"evidenceRef\":\"production:gateway-head-guidance-proof\"}" >/dev/null
            echo 'WORKER_BOOTSTRAP=CREATED'
          elif [ "$code" = '200' ]; then
            echo 'WORKER_BOOTSTRAP=EXISTING'
          else
            echo "LIVE_WORKER_GUIDANCE=FAIL worker_lookup_http_$code"
            cat /tmp/worker.json || true
            exit 1
          fi

          curl -fsS -X POST "$BASE/workforce/core/workers/$WORKER/status/ACTIVE" >/dev/null
          WORKER_VIEW=$(curl -fsS "$BASE/workforce/core/workers/$WORKER")
          echo "$WORKER_VIEW" | grep -q 'ROLE-HEAD-OF-GATEWAY' || {
            curl -sS -X POST "$BASE/workforce/core/participations" \
              -H 'Content-Type: application/json' \
              --data "{\"participationId\":\"$PARTICIPATION\",\"workerId\":\"$WORKER\",\"organizationRef\":\"METATRON\",\"positionRef\":\"POSITION-HEAD-OF-GATEWAY\",\"roleRef\":\"ROLE-HEAD-OF-GATEWAY\"}" >/dev/null || true
            curl -fsS -X POST "$BASE/workforce/core/participations/$PARTICIPATION/status/ACTIVE" >/dev/null
          }
          WORKER_VIEW=$(curl -fsS "$BASE/workforce/core/workers/$WORKER")
          echo "$WORKER_VIEW" | grep -q 'gateway.audit.read' || \
            curl -fsS -X POST "$BASE/workforce/core/capabilities" \
              -H 'Content-Type: application/json' \
              --data "{\"workerId\":\"$WORKER\",\"capabilityRef\":\"gateway.audit.read\",\"level\":1.0,\"evidenceRef\":\"production:gateway-head-guidance-proof\"}" >/dev/null

          curl -fsS -X POST "$BASE/workforce/work" \
            -H 'Content-Type: application/json' \
            --data "{\"workId\":\"$WORK\",\"objectiveRef\":\"gateway:live-guidance-proof\",\"organizationContextId\":\"METATRON\",\"originatedByWorkerId\":\"$WORKER\",\"description\":\"Production proof: required public Gateway guidance must be read before gateway.audit.read executes\"}" >/tmp/work-originated.json
          curl -fsS -X POST "$BASE/workforce/work/$WORK/assignment" \
            -H 'Content-Type: application/json' \
            --data "{\"ref\":\"$ASSIGNMENT\"}" >/dev/null
          curl -fsS -X POST "$BASE/workforce/work/$WORK/start" >/dev/null

          HTTP=$(curl -sS -o /tmp/guidance-proof.json -w '%{http_code}' -X POST \
            "$BASE/workforce/management/gateway-head/execute?workerId=$WORKER&workId=$WORK" \
            -H 'X-Metatron-Actor: FOUNDER')
          echo "EXECUTE_HTTP=$HTTP"
          cat /tmp/guidance-proof.json
          echo

          [ "$HTTP" = '200' ] || {
            echo 'LIVE_WORKER_GUIDANCE=FAIL execute_http'
            exit 1
          }
          grep -q '"guidanceRequired":true' /tmp/guidance-proof.json
          grep -q '"guidanceSatisfied":true' /tmp/guidance-proof.json
          grep -q '"guidanceReceiptCount":6' /tmp/guidance-proof.json
          grep -q '"crossRepositoryCredentialUsed":false' /tmp/guidance-proof.json
          grep -q '"state":"COMPLETED"' /tmp/guidance-proof.json
          grep -q 'guidance-receipt:gateway:SOT.md:sha256:' /tmp/guidance-proof.json
          grep -q 'guidance-receipt:gateway:PRODUCTION_COMPLETION.md:sha256:' /tmp/guidance-proof.json

          FINAL_WORK=$(curl -fsS "$BASE/workforce/work/$WORK")
          echo "FINAL_WORK=$FINAL_WORK"
          echo 'LIVE_WORKER_GUIDANCE=PASS'
