name: BIOS Highway Ingress

on:
  workflow_dispatch:
    inputs:
      bios_sha:
        description: Exact BIOS source SHA already accepted by BIOS Runtime CI
        required: true
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: bios-highway-ingress
  cancel-in-progress: true

jobs:
  enqueue-bios:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - name: Publish Workforce control-plane release
        shell: bash
        run: |
          set -euo pipefail
          bash highway/publish-release.sh "$GITHUB_WORKSPACE" "$GITHUB_SHA"

      - name: Submit BIOS deployment to Highway
        shell: bash
        env:
          BIOS_REQUESTED_SHA: ${{ inputs.bios_sha }}
        run: |
          set -euo pipefail
          [[ "$BIOS_REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          ENV_FILE="${METATRON_PRODUCTION_ENV_FILE:-$HOME/.metatron/config/workforce.env}"
          test -r "$ENV_FILE"
          set -a
          source "$ENV_FILE"
          source "$HOME/.metatron/highway/highway.env"
          set +a
          bash "$HOME/.metatron/highway/current/ensure-running.sh"
          CTL="python3 $HOME/.metatron/highway/current/highwayctl.py"
          TASK=$($CTL submit             --kind bios-deploy             --source-sha "$GITHUB_SHA"             --dedupe-key "bios-deploy:$BIOS_REQUESTED_SHA"             --priority 100             --env "BIOS_REQUESTED_SHA=$BIOS_REQUESTED_SHA"             | python3 -c 'import json,sys; print(json.load(sys.stdin)["task_id"])')
          echo "HIGHWAY_BIOS_TASK=$TASK"
          $CTL get "$TASK"
          echo 'BIOS_GITHUB_EXECUTION_PLANE=BYPASSED'
          echo 'BIOS_HIGHWAY_INGRESS=PASS'
