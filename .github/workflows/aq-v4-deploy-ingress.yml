name: Deploy BIOS Aquaculture v4 via Highway

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bios-aquaculture-v4-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Publish this exact Workforce control-plane release
        shell: bash
        run: |
          set -euo pipefail
          bash highway/publish-release.sh "$GITHUB_WORKSPACE" "$GITHUB_SHA"

      - name: Submit exact BIOS SHA to canonical Highway and wait for acceptance
        shell: bash
        env:
          BIOS_REQUESTED_SHA: 33f6345de4ce631f156482358143758a506cda1f
        run: |
          set -euo pipefail
          [[ "$BIOS_REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          BASE=/opt/metatron/metatron-workforce
          set -a
          source "$BASE/.env"
          source "$HOME/.metatron/highway/highway.env"
          set +a
          bash "$HOME/.metatron/highway/current/ensure-running.sh"
          CTL="python3 $HOME/.metatron/highway/current/highwayctl.py"
          TASK=$($CTL submit \
            --kind bios-deploy \
            --source-sha "$GITHUB_SHA" \
            --dedupe-key "bios-deploy:$BIOS_REQUESTED_SHA" \
            --priority 100 \
            --env "BIOS_REQUESTED_SHA=$BIOS_REQUESTED_SHA" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["task_id"])')
          echo "HIGHWAY_BIOS_TASK=$TASK"
          $CTL get "$TASK"
          $CTL wait "$TASK" --timeout 1800 --poll 2
          echo "BIOS_AQUACULTURE_V4_HIGHWAY_DEPLOY=PASS"
