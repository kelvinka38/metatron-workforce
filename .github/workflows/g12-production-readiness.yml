name: G12 Production Readiness Evidence

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  g12-acceptance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source tree is clean
        run: |
          test -z "$(git status --porcelain)"

      - name: Setup Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: gradle

      - name: Disable file-mode noise in CI
        run: git config core.filemode false

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run full acceptance suite
        run: ./gradlew clean test --no-daemon

      - name: Run durable runtime recovery acceptance
        run: ./gradlew test --tests '*RuntimeDurableRecoveryTest' --no-daemon

      - name: Run all G12 acceptance tests
        run: ./gradlew test --tests '*Phase12*AcceptanceTest*' --no-daemon

      - name: Generate G12 runtime evidence
        run: ./gradlew test --tests '*Phase12RuntimeEvidenceCaptureTest*' --no-daemon

      - name: Build deployable Workforce runtime
        run: ./gradlew bootJar --no-daemon

      - name: Execute deployable Workforce runtime evidence smoke
        env:
          METATRON_COMMIT_SHA: ${{ github.sha }}
          METATRON_VERSION: g12-${{ github.sha }}
          METATRON_ENVIRONMENT: ci-deployed-runtime
          METATRON_RUNTIME_STATE_DIR: runtime-state/production
        run: |
          java -jar build/libs/metatron-workforce-0.1.0.jar
          test -d runtime-evidence/production
          test -d runtime-state/production
          test "$(find runtime-state/production -type f -name '*.properties' | wc -l)" -ge 2
          evidence_root="$(find runtime-evidence/production -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$evidence_root"
          for file in deployment-identity.json runtime-health.json execution-summary.json security-decisions.json audit-provenance.json logs.jsonl metrics.json traces.json README.md; do
            test -s "$evidence_root/$file"
          done
          grep -q '"sameOrganizationVisible":true' "$evidence_root/security-decisions.json"
          grep -q '"crossOrganizationVisible":false' "$evidence_root/security-decisions.json"
          grep -q '"runtimeStateAfterReplacement":"RUNNING"' "$evidence_root/deployment-identity.json"
          grep -q '"runtime_recovery_success":1' "$evidence_root/metrics.json"
          grep -q '"execution_success":1' "$evidence_root/metrics.json"
          test "$(grep -c 'runtime_started' "$evidence_root/logs.jsonl")" -ge 1
          grep -q '"executionId"' "$evidence_root/traces.json"
          grep -q '"authorizationId"' "$evidence_root/traces.json"
          find runtime-evidence/production -type f -maxdepth 3 -print
          find runtime-state/production -type f -maxdepth 2 -print

      - name: Collect G12 repository evidence
        if: always()
        run: |
          mkdir -p build/g12-evidence
          cp -R docs/phase-12 build/g12-evidence/phase-12
          cp -R build/test-results build/g12-evidence/test-results 2>/dev/null || true
          cp -R build/reports/tests build/g12-evidence/test-report 2>/dev/null || true
          cp -R build/reports/problems build/g12-evidence/problems-report 2>/dev/null || true
          cp -R build/g12-runtime-evidence build/g12-evidence/runtime-evidence 2>/dev/null || true
          cp -R runtime-evidence build/g12-evidence/production-runtime-evidence 2>/dev/null || true
          cp -R runtime-state build/g12-evidence/runtime-state 2>/dev/null || true
          git rev-parse HEAD > build/g12-evidence/commit.txt
          git status --short > build/g12-evidence/git-status.txt
          {
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "workflow_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "ref=${GITHUB_REF}"
            echo "sha=${GITHUB_SHA}"
            echo "runner=${RUNNER_OS}"
            java -version 2>&1
            ./gradlew --version
          } > build/g12-evidence/execution-environment.txt

      - name: Upload G12 evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g12-production-readiness-evidence
          path: build/g12-evidence
          if-no-files-found: error
          retention-days: 30
