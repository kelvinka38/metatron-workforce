name: G12 Production Readiness Evidence

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact deployed/source SHA to validate
        required: false
        type: string
permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx384m -XX:MaxMetaspaceSize=192m -Dorg.gradle.workers.max=1 -Dorg.gradle.daemon=false"

concurrency:
  group: workforce-g12-acceptance
  cancel-in-progress: true

jobs:
  g12-acceptance:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    env:
      TARGET_SHA: ${{ inputs.target_sha != '' && inputs.target_sha || github.sha }}
    steps:
      - name: Checkout exact accepted source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Verify exact source identity and clean tree
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"

      - name: Setup Java 22
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'
          cache: gradle

      - name: Disable file-mode noise in CI
        run: git config core.filemode false

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run full acceptance suite and build
        run: ./gradlew clean test bootJar --no-daemon --max-workers=1

      - name: Run durable runtime recovery acceptance
        run: ./gradlew test --tests '*RuntimeDurableRecoveryTest' --no-daemon --max-workers=1

      - name: Run all G12 acceptance tests
        run: ./gradlew test --tests '*Phase12*AcceptanceTest*' --no-daemon --max-workers=1

      - name: Generate G12 runtime evidence
        run: ./gradlew test --tests '*Phase12RuntimeEvidenceCaptureTest*' --no-daemon --max-workers=1

      - name: Execute deployable Workforce runtime evidence smoke
        env:
          METATRON_COMMIT_SHA: ${{ env.TARGET_SHA }}
          METATRON_VERSION: g12-${{ env.TARGET_SHA }}
          METATRON_ENVIRONMENT: ci-deployed-runtime
          METATRON_RUNTIME_STATE_DIR: runtime-state/production
        run: |
          java -Xmx384m -XX:MaxMetaspaceSize=192m -jar build/libs/metatron-workforce-0.1.0.jar --g12-evidence
          test -d runtime-evidence/production
          test -d runtime-state/production
          test "$(find runtime-state/production -type f -name '*.properties' | wc -l)" -ge 2
          evidence_root="$(find runtime-evidence/production -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$evidence_root"
          for file in deployment-identity.json runtime-health.json execution-summary.json security-decisions.json audit-provenance.json logs.jsonl metrics.json traces.json README.md; do test -s "$evidence_root/$file"; done
          jq -e --arg sha "$TARGET_SHA" '.commitSha == $sha' "$evidence_root/deployment-identity.json"
          jq -e --arg sha "$TARGET_SHA" '.commitSha == $sha' "$evidence_root/audit-provenance.json"
          jq -e --arg sha "$TARGET_SHA" '.commitSha == $sha' "$evidence_root/traces.json"
          jq -e '.sameOrganizationVisible == true and .crossOrganizationVisible == false' "$evidence_root/security-decisions.json"
          jq -e '.runtimeStateAfterReplacement == "RUNNING"' "$evidence_root/deployment-identity.json"
          jq -e '.runtime_recovery_success == 1 and .execution_success == 1' "$evidence_root/metrics.json"
          test "$(grep -c 'runtime_started' "$evidence_root/logs.jsonl")" -ge 1
          jq -e 'has("executionId") and has("authorizationReference")' "$evidence_root/traces.json"

      - name: Collect G12 repository evidence
        if: always()
        run: |
          mkdir -p build/g12-evidence
          cp -R docs/phase-12 build/g12-evidence/phase-12
          cp -R build/test-results build/g12-evidence/test-results 2>/dev/null || true
          cp -R build/reports/tests build/g12-evidence/test-report 2>/dev/null || true
          cp -R build/reports/problems build/g12-evidence/problems-report 2>/dev/null || true
          cp -R build/g12-runtime-evidence build/g12-evidence/runtime-evidence 2>/dev/null || true
          cp -R runtime-evidence build/g12-evidence/production-runtime-evidence 2>/dev/null || true
          cp -R runtime-state build/g12-evidence/runtime-state 2>/dev/null || true
          git rev-parse HEAD > build/g12-evidence/commit.txt
          git status --short > build/g12-evidence/git-status.txt
          printf 'workflow_run=%s\nworkflow_attempt=%s\nevent=%s\nref=%s\ntarget_sha=%s\nrunner=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$TARGET_SHA" "$RUNNER_OS" > build/g12-evidence/execution-environment.txt
          java -version >> build/g12-evidence/execution-environment.txt 2>&1
          ./gradlew --version >> build/g12-evidence/execution-environment.txt

      - name: Upload G12 evidence bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: g12-production-readiness-evidence-${{ env.TARGET_SHA }}
          path: build/g12-evidence
          if-no-files-found: error
          retention-days: 14
