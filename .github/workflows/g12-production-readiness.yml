name: G12 Production Readiness (Historical Disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Historical lane is intentionally disabled
        shell: bash
        run: |
          set -euo pipefail
          echo 'HISTORICAL_EXECUTION=DISABLED'
          echo 'REASON=Historical G12 acceptance is superseded by exact-SHA Highway workforce-build plus native runtime-closure.'
          echo 'REPLACEMENT=workforce-build + runtime-closure'
          echo 'SELF_HOSTED_RUNNER_REQUIRED=false'
