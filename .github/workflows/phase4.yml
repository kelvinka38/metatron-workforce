name: phase4-organization

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  phase4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Phase 4 acceptance
        run: ./gradlew clean test --tests 'com.metatron.workforce.phase4.Phase4OrganizationAcceptanceTest' --no-daemon
      - name: Phase 4 unit regression
        run: ./gradlew test --tests 'com.metatron.workforce.phase4.*' --no-daemon
      - name: Full regression
        run: ./gradlew test --no-daemon
      - name: Build deployable artifact
        run: ./gradlew bootJar --no-daemon
