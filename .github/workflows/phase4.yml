name: phase4-organization

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx384m -XX:MaxMetaspaceSize=192m -Dorg.gradle.workers.max=1 -Dorg.gradle.daemon=false"

concurrency:
  group: workforce-phase4-acceptance
  cancel-in-progress: true

jobs:
  phase4:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'
          cache: gradle
      - name: Phase 4 acceptance
        run: ./gradlew clean test --tests 'com.metatron.workforce.phase4.Phase4OrganizationAcceptanceTest' --no-daemon --max-workers=1
      - name: Full regression and build
        run: ./gradlew test bootJar --no-daemon --max-workers=1
