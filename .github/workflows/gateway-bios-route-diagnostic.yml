name: Gateway BIOS Route Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gateway-bios-route-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    steps:
      - name: Inspect live Gateway to BIOS route
        shell: bash
        run: |
          set -euo pipefail
          ENVOY=$(docker ps --format '{{.Names}} {{.Image}}' | awk 'tolower($0) ~ /envoy/ {print $1; exit}')
          test -n "$ENVOY"
          echo "ENVOY_CONTAINER=$ENVOY"
          echo '=== LIVE ENVOY CONFIG ==='
          docker exec "$ENVOY" sh -c 'nl -ba /etc/envoy/envoy.yaml | sed -n "1,180p"'
          echo '=== ENVOY MOUNTS ==='
          docker inspect "$ENVOY" --format '{{range .Mounts}}{{println .Type .Source "->" .Destination}}{{end}}'
          echo '=== ENVOY LABELS / COMPOSE SOURCE ==='
          docker inspect "$ENVOY" --format '{{json .Config.Labels}}'
          echo '=== BIOS DIRECT VS ENVOY ==='
          docker run --rm --network metatron-gateway-online python:3.12-slim python -c "import urllib.request; print('DIRECT_BIOS_HTTP='+str(urllib.request.urlopen('http://bios:8080/health',timeout=3).status))"
          docker exec "$ENVOY" sh -c 'wget -S -O- -T 3 http://bios:8080/health 2>&1 | head -20' || true
          docker exec "$ENVOY" sh -c 'wget -S -O- -T 3 http://bios:8081/health 2>&1 | head -20' || true
