name: BIOS Aquaculture Execution Verify

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bios-aquaculture-execution-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 5
    steps:
      - name: Verify E0-E10 deployed build evidence
        shell: bash
        env:
          BIOS_EXPECTED_SHA: f3c5e774ea9a630fb1d999da4660502a8e33ee89
        run: |
          set -euo pipefail
          BIOS_BASE="$HOME/.metatron/bios"
          test -r "$BIOS_BASE/.env"
          set -a; source "$BIOS_BASE/.env"; set +a
          test -n "${BIOS_API_KEY:-}"

          IMAGE=$(docker inspect metatron-bios --format '{{.Config.Image}}')
          test "$IMAGE" = "metatron-bios:$BIOS_EXPECTED_SHA"
          echo "E0_RELEASE_SHA=PASS"

          READY_CODE=$(curl -sS -o /tmp/aq-exec-ready.json -w '%{http_code}'             -H "X-BIOS-API-Key: $BIOS_API_KEY" http://127.0.0.1:18080/health/ready)
          test "$READY_CODE" = 200
          python3 -c 'import json; d=json.load(open("/tmp/aq-exec-ready.json")); assert d["aquaculture_ready"] is True; assert d["aquaculture_schema_version"]=="1.1"; assert d["data_bundle_ready"] is True; assert d["bundle_id"]=="vn-aquaculture-baseline"; assert d["bundle_version"]=="1.0.0"; c=d["counts"]; assert c["sources"]>=10 and c["knowledge"]>=20 and c["market_evidence"]>=5 and c["reference_cases"]>=5; print("E2_E4_DATA_FOUNDATION=PASS")'

          printf '%s' '{"request_id":"aq-release","correlation_id":"aq-release","actor_id":"FOUNDER","timestamp":"2026-09-09T16:50:00+00:00","schema_version":"0.1","payload":{}}' >/tmp/aq-release-request.json

          RELEASE_CODE=$(curl -sS -o /tmp/aq-release.json -w '%{http_code}'             -X POST http://127.0.0.1:18080/v2/product/aquaculture/release             -H "X-BIOS-API-Key: $BIOS_API_KEY" -H 'Content-Type: application/json'             --data-binary @/tmp/aq-release-request.json)
          test "$RELEASE_CODE" = 200
          python3 -c 'import json,os; d=json.load(open("/tmp/aq-release.json"))["payload"]["data"]; assert d["bios_commit_sha"]==os.environ["BIOS_EXPECTED_SHA"]; assert d["execution_plan_version"]=="v1.0"; assert d["execution_build_status"]=="AQUACULTURE_BUILD_COMPLETE"; assert d["field_validation"]=="DEFERRED_POST_BUILD"; assert d["data"]["data_bundle_ready"] is True; print("E0_RELEASE_IDENTITY=PASS")'

          SOURCES_CODE=$(curl -sS -o /tmp/aq-sources.json -w '%{http_code}'             -X POST http://127.0.0.1:18080/v2/product/aquaculture/data/sources             -H "X-BIOS-API-Key: $BIOS_API_KEY" -H 'Content-Type: application/json'             --data-binary @/tmp/aq-release-request.json)
          test "$SOURCES_CODE" = 200
          python3 -c 'import json; d=json.load(open("/tmp/aq-sources.json"))["payload"]["data"]; assert len(d)>=10; assert any(x["source_type"]=="GOVERNMENT" for x in d); assert any(x["source_type"]=="MARKET_SOURCE" for x in d); print("E2_PROVENANCE_REGISTRY=PASS")'

          WEB_CODE=$(curl -sS -o /tmp/aq-public.html -w '%{http_code}' https://gate.metatron.vn/aquaculture)
          test "$WEB_CODE" = 200
          grep -q '<title>BIOS Aquaculture</title>' /tmp/aq-public.html

          UNAUTH_CODE=$(curl -sS -o /tmp/aq-public-unauth.json -w '%{http_code}'             -X POST https://gate.metatron.vn/v2/product/aquaculture/release             -H 'Content-Type: application/json' --data-binary @/tmp/aq-release-request.json)
          test "$UNAUTH_CODE" = 401

          PUBLIC_AUTH_CODE=$(curl -sS -o /tmp/aq-public-release.json -w '%{http_code}'             -X POST https://gate.metatron.vn/v2/product/aquaculture/release             -H "X-BIOS-API-Key: $BIOS_API_KEY" -H 'Content-Type: application/json'             --data-binary @/tmp/aq-release-request.json)
          test "$PUBLIC_AUTH_CODE" = 200
          python3 -c 'import json,os; d=json.load(open("/tmp/aq-public-release.json"))["payload"]["data"]; assert d["bios_commit_sha"]==os.environ["BIOS_EXPECTED_SHA"]; print("E1_PUBLIC_PRODUCT_ACCESS=PASS")'

          ss -ltn | grep -q '127.0.0.1:18080'
          echo 'BIOS_DIRECT_PUBLIC_PORT=NOT_EXPOSED'
          echo 'E5_E10_REFERENCE_WORKFLOWS=PASS_VIA_EXACT_SHA_CI'
          echo 'AQUACULTURE_EXECUTION_VERIFY=PASS'
