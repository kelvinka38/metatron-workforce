name: BIOS Aquaculture Execution Verify (Highway Ingress)

on:
  workflow_dispatch:
    inputs:
      bios_expected_sha:
        description: Exact deployed BIOS SHA
        required: false
        default: 19214a7015e6b7a4af7403aa79854e2828d4ecb0
        type: string

permissions:
  contents: read

jobs:
  enqueue:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Submit to persistent Highway
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/highway-manual-ingress.sh 'bios-aquaculture-execution-verify' '' '55' "BIOS_EXPECTED_SHA=${{ inputs.bios_expected_sha }}"
