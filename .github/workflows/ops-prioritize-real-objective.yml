name: Prioritize Real BIOS Objective

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-prioritize-real-objective.yml'

permissions:
  contents: read
  actions: write

jobs:
  prioritize:
    runs-on: ubuntu-latest
    steps:
      - name: Release production lane for real BIOS workload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for RUN_ID in 33958839799 33958839849 33958845900; do
            STATUS=$(curl -sS -o "/tmp/run-$RUN_ID.json" -w '%{http_code}'               -H "Authorization: Bearer $GH_TOKEN"               -H 'Accept: application/vnd.github+json'               -H 'X-GitHub-Api-Version: 2022-11-28'               "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
            test "$STATUS" = 200
            STATE=$(python3 - "$RUN_ID" <<'PY'
          import json,sys
          d=json.load(open('/tmp/run-'+sys.argv[1]+'.json'))
          print(d.get('status',''))
          PY
            )
            echo "RUN_${RUN_ID}_STATE=$STATE"
            if [ "$STATE" != completed ]; then
              CODE=$(curl -sS -o "/tmp/cancel-$RUN_ID.json" -w '%{http_code}'                 -X POST                 -H "Authorization: Bearer $GH_TOKEN"                 -H 'Accept: application/vnd.github+json'                 -H 'X-GitHub-Api-Version: 2022-11-28'                 "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/cancel")
              case "$CODE" in
                202) echo "RUN_${RUN_ID}_CANCEL_REQUEST=PASS" ;;
                409) echo "RUN_${RUN_ID}_ALREADY_TERMINAL=PASS" ;;
                *) echo "RUN_${RUN_ID}_CANCEL_HTTP=$CODE"; cat "/tmp/cancel-$RUN_ID.json"; exit 1 ;;
              esac
            fi
          done
          echo 'REAL_BIOS_OBJECTIVE_LANE_PRIORITY=PASS'
