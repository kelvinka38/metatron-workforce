name: Diagnose BIOS Objective (Highway Ingress)

on:
  workflow_dispatch:
    inputs:
      objective_id:
        description: Objective ID to inspect
        required: false
        default: objective_43caf8a918ad4f4fb800cfb213f45292
        type: string

permissions:
  contents: read

jobs:
  enqueue:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Submit diagnostic to persistent Highway
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/highway-manual-ingress.sh 'ops-diagnose-bios-objective' '' '25' "OBJECTIVE_ID=${{ inputs.objective_id }}"
