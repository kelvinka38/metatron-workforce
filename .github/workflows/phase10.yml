name: phase10

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx384m -XX:MaxMetaspaceSize=192m -Dorg.gradle.workers.max=1 -Dorg.gradle.daemon=false"

concurrency:
  group: workforce-phase10-acceptance
  cancel-in-progress: true

jobs:
  phase10:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: gradle
      - run: ./gradlew clean test --no-daemon --max-workers=1
