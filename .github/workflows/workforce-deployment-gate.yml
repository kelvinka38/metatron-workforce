name: Workforce Deployment Gate

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  METATRON_CI: "true"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx384m -XX:MaxMetaspaceSize=192m -Dorg.gradle.workers.max=1 -Dorg.gradle.daemon=false"

concurrency:
  group: workforce-deployment-gate
  cancel-in-progress: true

jobs:
  deployment-gate:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Normalize POSIX line endings
        run: |
          find . -type f \( -name 'gradlew' -o -name '*.sh' \) -exec sed -i 's/\r$//' {} +

      - name: Setup Java 22
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Test and build
        run: ./gradlew clean test bootJar --no-daemon --max-workers=1

      - name: Validate production compose
        env:
          METATRON_IMAGE_TAG: validation
          METATRON_COMMIT_SHA: validation
        run: docker compose -f deploy/docker-compose.yml config >/dev/null

      - name: Run isolated deployment gate
        run: bash deploy/deploy.sh
