name: Workforce Deployment Gate

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'Dockerfile'
      - 'deploy/**'
      - '.github/workflows/workforce-deployment-gate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'Dockerfile'
      - 'deploy/**'
      - '.github/workflows/workforce-deployment-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  METATRON_CI: "true"

jobs:
  deployment-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize POSIX line endings
        run: |
          find . -type f \( -name 'gradlew' -o -name '*.sh' \) -exec sed -i 's/\r$//' {} +

      - name: Setup Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Test
        run: ./gradlew clean test --no-daemon

      - name: Build deployable artifact
        run: ./gradlew bootJar --no-daemon

      - name: Validate production compose
        run: docker compose -f deploy/docker-compose.yml config

      - name: Run isolated deployment gate
        run: bash deploy/deploy.sh
