name: core-ci

on:
  pull_request:
    paths: ["core/**", ".github/workflows/core-ci.yml"]
  push:
    branches: [main]
    paths: ["core/**", ".github/workflows/core-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # GitHub-hosted (free for public repos). Never the self-hosted prod runner: forks can open PRs.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Unit tests
        working-directory: core
        run: python -m unittest discover -s tests -t . -v
      - name: Isolation tests (root)
        working-directory: core
        run: sudo env "PATH=$PATH" python -m unittest discover -s tests -t . -v
