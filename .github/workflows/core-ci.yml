name: core-ci

on:
  pull_request:
    paths: ["core/**", ".github/workflows/core-ci.yml"]
  push:
    branches: [main]
    paths: ["core/**", ".github/workflows/core-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Self-hosted: no GitHub-hosted minutes. Runs unprivileged only - never sudo on the prod host.
    # The root-only agent-user isolation tests are skipped here and run inside the Core container (M1-3).
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests
        working-directory: core
        run: |
          python3 --version
          python3 -B -m unittest discover -s tests -t . -v
