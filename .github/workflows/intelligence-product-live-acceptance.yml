name: Intelligence Product Live Acceptance (Manual Forensic)

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact deployed production SHA to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  accept-intelligence-product:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    environment: production
    timeout-minutes: 15
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Run Intelligence forensic lane
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/highway-intelligence-lane.sh
          scripts/highway-intelligence-lane.sh
