name: Intelligence Product Live Acceptance

on:
  workflow_run:
    workflows: ["Telegram Provider Adapter Live Acceptance"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact deployed production SHA to validate; defaults to dispatched ref SHA
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: metatron-intelligence-product-live-acceptance
  cancel-in-progress: true

jobs:
  accept-intelligence-product:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, linux, x64, metatron-prod]
    environment: production
    steps:
      - name: Prove visible depth control and grounded fresh-reality acquisition
        shell: bash
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && (inputs.target_sha != '' && inputs.target_sha || github.sha) || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          BASE=/opt/metatron/metatron-workforce
          test -r "$BASE/.env"
          set -a; source "$BASE/.env"; set +a
          test -n "${TELEGRAM_WEBHOOK_SECRET:-}"
          test -n "${TELEGRAM_ALLOWED_USER_ID:-}"

          CID=$(docker ps --filter name=deploy-workforce-1 --format '{{.ID}}' | head -1)
          test -n "$CID"
          DEPLOYED_SHA=$(docker inspect "$CID" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^METATRON_COMMIT_SHA=//p' | head -1)
          test "$DEPLOYED_SHA" = "$TARGET_SHA"

          send_update() {
            local update_id="$1"
            local text="$2"
            local body
            body=$(python3 - "$update_id" "$text" "$TELEGRAM_ALLOWED_USER_ID" <<'PY'
          import json,sys
          update_id=int(sys.argv[1]); text=sys.argv[2]; uid=int(sys.argv[3])
          print(json.dumps({"update_id":update_id,"message":{"message_id":update_id%2000000000,"from":{"id":uid,"is_bot":False,"first_name":"Founder"},"chat":{"id":uid,"type":"private"},"date":0,"text":text}}, ensure_ascii=False))
          PY
            )
            local status
            status=$(curl -sS -o /tmp/metatron-intelligence-product.json -w '%{http_code}' \
              --proto '=https' --tlsv1.2 --max-time 20 \
              -X POST https://gate.metatron.vn/telegram/webhook \
              -H "X-Telegram-Bot-Api-Secret-Token: $TELEGRAM_WEBHOOK_SECRET" \
              -H 'Content-Type: application/json' \
              --data-binary "$body")
            test "$status" = 200
          }

          wait_for() {
            local since="$1"
            local predicate="$2"
            for i in $(seq 1 90); do
              LOGS=$(docker logs --since "$since" "$CID" 2>&1 || true)
              if eval "$predicate"; then return 0; fi
              sleep 2
            done
            return 1
          }

          assert_fresh_information_lookup() {
            local update_id="$1"
            local text="$2"
            local subject_pattern="$3"
            local since
            since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            send_update "$update_id" "$text"
            wait_for "$since" "grep -q 'telegram_send_success update_id=$update_id' <<<\"\$LOGS\" && grep -Eq 'telegram_answer_ready update_id=$update_id.*route=intelligence-[^ ]*-ir[1-9][0-9]*of[1-9][0-9]*' <<<\"\$LOGS\""

            local logs
            logs=$(docker logs --since "$since" "$CID" 2>&1 || true)
            if grep -q "telegram_interaction_failed update_id=$update_id" <<<"$logs" \
              || grep -q "telegram_failure_notification_sent update_id=$update_id" <<<"$logs"; then
              echo "FRESH_INFORMATION_INTERACTION_FAILED update_id=$update_id" >&2
              exit 1
            fi
            if grep -Eq "telegram_answer_ready update_id=$update_id.*route=execution-objective-|execution-objective-workforce-accepted.*$update_id|METATRON WORK ACCEPTED.*$update_id" <<<"$logs"; then
              echo "FRESH_INFORMATION_WRONGLY_BECAME_OBJECTIVE update_id=$update_id" >&2
              exit 1
            fi

            local case_proof=0
            while IFS= read -r case_file; do
              [ -n "$case_file" ] || continue
              if docker exec "$CID" sh -c "grep -Eqi '$subject_pattern' '$case_file' && grep -q 'SATISFIED' '$case_file' && grep -Eq 'https?://' '$case_file'"; then
                case_proof=1
                echo "GROUNDED_CASE_FILE=$case_file"
                break
              fi
            done < <(docker exec "$CID" sh -c "grep -R -l 'telegram:update:$update_id' /var/lib/metatron-workforce 2>/dev/null || true")
            test "$case_proof" = 1
          }

          BASE_ID=$(date +%s%N | cut -c1-14)
          DEEP_UPDATE="${BASE_ID}01"
          MODE_UPDATE="${BASE_ID}02"
          GOLD_UPDATE="${BASE_ID}03"
          FX_UPDATE="${BASE_ID}04"
          WEATHER_UPDATE="${BASE_ID}05"
          AUTO_UPDATE="${BASE_ID}06"

          # 1) Human-readable provider UI must enter canonical, channel-neutral depth control.
          SINCE_DEEP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          send_update "$DEEP_UPDATE" '🔬 Deep'
          wait_for "$SINCE_DEEP" "grep -q 'telegram_answer_ready update_id=$DEEP_UPDATE.*provenance=intelligence-depth-control:telegram:update:$DEEP_UPDATE' <<<\"\$LOGS\" && grep -q 'telegram_send_success update_id=$DEEP_UPDATE' <<<\"\$LOGS\""

          SINCE_MODE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          send_update "$MODE_UPDATE" '🎛 Mode'
          wait_for "$SINCE_MODE" "grep -q 'telegram_answer_ready update_id=$MODE_UPDATE.*provenance=intelligence-depth-control:telegram:update:$MODE_UPDATE' <<<\"\$LOGS\" && grep -q 'telegram_send_success update_id=$MODE_UPDATE' <<<\"\$LOGS\""

          # 2) Ordinary fresh-information questions must remain conversational Intelligence work:
          # semantic cognition -> current external evidence -> grounded terminal answer.
          # They MUST NOT create a durable Workforce Objective merely because evidence acquisition is required.
          assert_fresh_information_lookup "$GOLD_UPDATE" \
            'Giá vàng hôm nay tại Việt Nam. Hãy dùng dữ liệu hiện tại và nêu nguồn.' \
            'vàng|gold'
          assert_fresh_information_lookup "$FX_UPDATE" \
            'Tỷ giá USD/VND hiện tại khoảng bao nhiêu? Dùng dữ liệu mới và cho nguồn.' \
            'USD|VND|tỷ giá|exchange'
          assert_fresh_information_lookup "$WEATHER_UPDATE" \
            'Thời tiết hiện tại ở Thành phố Hồ Chí Minh thế nào? Kiểm tra dữ liệu mới và nêu nguồn.' \
            'thời tiết|weather|Ho Chi Minh|Hồ Chí Minh'

          # Restore semantic AUTO so acceptance never leaves a Human preference changed.
          SINCE_AUTO=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          send_update "$AUTO_UPDATE" '🤖 Auto'
          wait_for "$SINCE_AUTO" "grep -q 'telegram_answer_ready update_id=$AUTO_UPDATE.*provenance=intelligence-depth-control:telegram:update:$AUTO_UPDATE' <<<\"\$LOGS\" && grep -q 'telegram_send_success update_id=$AUTO_UPDATE' <<<\"\$LOGS\""

          curl -fsS --proto '=https' --tlsv1.2 --max-time 10 https://gate.metatron.vn/telegram/health | grep -q '"status":"UP"'

          echo 'HUMAN_READABLE_DEPTH_CONTROL=PASS'
          echo 'CANONICAL_DEPTH_STATE=PASS'
          echo 'DEPTH_STATUS_VISIBILITY=PASS'
          echo 'FRESH_REALITY_SEMANTIC_ROUTE=PASS'
          echo 'FRESH_EXTERNAL_EVIDENCE_ACQUIRED=PASS'
          echo 'REQUIREMENT_EVIDENCE_PRESERVED=PASS'
          echo 'FRESH_INFORMATION_NOT_OBJECTIVE=PASS'
          echo 'FRESH_INFORMATION_MULTI_DOMAIN=PASS'
          echo 'FRESH_REALITY_TERMINAL_DELIVERY=PASS'
          echo 'DEPTH_PREFERENCE_RESTORED_AUTO=PASS'
          echo 'INTELLIGENCE_PRODUCT_LIVE_ACCEPTANCE=PASS'
