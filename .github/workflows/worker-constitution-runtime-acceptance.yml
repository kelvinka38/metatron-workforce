name: Worker Constitution Runtime Acceptance

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/main/java/com/metatron/workforce/operating/**'
      - 'src/main/java/com/metatron/workforce/workplace/**'
      - 'src/main/java/com/metatron/workforce/management/GeneralWorkspaceAutonomousCapability.java'
      - 'src/main/java/com/metatron/workforce/action/GeneralCognitiveWorkerBrain.java'
      - 'src/test/java/com/metatron/workforce/operating/**'
      - 'src/test/java/com/metatron/workforce/workplace/**'
      - 'src/test/java/com/metatron/workforce/action/GeneralCognitiveWorkerBrainClosureTest.java'
      - '.github/workflows/worker-constitution-runtime-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-constitution-runtime-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 20
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx384m -XX:MaxMetaspaceSize=192m -Dorg.gradle.workers.max=1 -Dorg.gradle.daemon=false"
    steps:
      - name: Checkout exact PR SHA
        uses: actions/checkout@v7
      - name: Set up Java 22
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'
          cache: gradle
      - name: Verify Worker Constitution runtime acceptance
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean test bootJar --no-daemon --max-workers=1
          test -f build/libs/*.jar
          echo "WORKER_CONSTITUTION_RUNTIME_ACCEPTANCE=PASS"
