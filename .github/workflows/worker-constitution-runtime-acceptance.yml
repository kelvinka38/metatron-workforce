name: Worker Constitution Runtime Acceptance (Highway Ingress)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enqueue:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Submit exact source build and acceptance to persistent Highway
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/highway-manual-ingress.sh 'workforce-build' '' '90'
