name: phase6-authorization-execution

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  phase6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Phase 6 acceptance
        run: ./gradlew clean test --tests 'com.metatron.workforce.phase6.Phase6AuthorizationExecutionAcceptanceTest' --no-daemon
      - name: Phase 6 regression
        run: ./gradlew test --tests 'com.metatron.workforce.phase6.*' --no-daemon
      - name: Full regression
        run: ./gradlew test --no-daemon
      - name: Build deployable artifact
        run: ./gradlew bootJar --no-daemon
