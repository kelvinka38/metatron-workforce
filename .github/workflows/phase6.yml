name: phase6-authorization-execution

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx384m -XX:MaxMetaspaceSize=192m -Dorg.gradle.workers.max=1 -Dorg.gradle.daemon=false"

concurrency:
  group: workforce-phase6-acceptance
  cancel-in-progress: true

jobs:
  phase6:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: gradle
      - name: Phase 6 acceptance
        run: ./gradlew clean test --tests 'com.metatron.workforce.phase6.Phase6AuthorizationExecutionAcceptanceTest' --no-daemon --max-workers=1
      - name: Full regression and build
        run: ./gradlew test bootJar --no-daemon --max-workers=1
