name: Phase 6 (Historical Disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Historical lane is intentionally disabled
        shell: bash
        run: |
          set -euo pipefail
          echo 'HISTORICAL_EXECUTION=DISABLED'
          echo 'REASON=Historical phase acceptance is superseded by current Highway conformance and exact-SHA production acceptance.'
          echo 'REPLACEMENT=Highway Conformance CI / production-highway-full'
          echo 'SELF_HOSTED_RUNNER_REQUIRED=false'
