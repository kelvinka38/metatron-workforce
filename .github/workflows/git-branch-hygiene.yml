name: Git Branch Hygiene

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/git-branch-hygiene.yml'
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      apply:
        description: Delete historical metatron/objective-* branches already merged into main
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  delete-closed-objective-head:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'metatron/objective-')
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Delete closed governed Objective branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$HEAD_REF" >/dev/null 2>&1; then
            git push origin --delete "$HEAD_REF"
            echo "CLOSED_OBJECTIVE_BRANCH_DELETED=$HEAD_REF"
          else
            echo "CLOSED_OBJECTIVE_BRANCH_ALREADY_ABSENT=$HEAD_REF"
          fi

  historical-merged-objective-sweep:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Audit or prune historical merged Objective branches
        env:
          APPLY: ${{ github.event_name == 'push' || inputs.apply }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          mapfile -t branches < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin/metatron/ \
              | grep '^metatron/objective-' \
              | sort
          )

          candidates=()
          for branch in "${branches[@]}"; do
            if git merge-base --is-ancestor "refs/remotes/origin/$branch" origin/main; then
              candidates+=("$branch")
            fi
          done

          echo "MERGED_OBJECTIVE_BRANCH_CANDIDATES=${#candidates[@]}"
          printf '%s\n' "${candidates[@]}"

          if [[ "$APPLY" != "true" ]]; then
            echo 'GIT_BRANCH_HYGIENE_DRY_RUN=PASS'
            exit 0
          fi

          deleted=0
          for branch in "${candidates[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
              deleted=$((deleted + 1))
              echo "DELETED=$branch"
            else
              echo "ALREADY_ABSENT=$branch"
            fi
          done

          echo "MERGED_OBJECTIVE_BRANCHES_DELETED=$deleted"
          echo 'GIT_BRANCH_HYGIENE_APPLY=PASS'
