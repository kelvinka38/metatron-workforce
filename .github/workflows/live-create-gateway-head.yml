name: Live Gateway Head Blocker Inspection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-create-gateway-head.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    steps:
      - name: Inspect blocked Gateway Head institutional work
        shell: bash
        run: |
          set -euo pipefail
          BASE=http://127.0.0.1:8080
          echo '=== WORK ==='
          curl -fsS "$BASE/workforce/work/WORK-GATEWAY-HEAD-20260828" | tee /tmp/work.json
          echo
          echo '=== WORKER ==='
          curl -fsS "$BASE/workforce/core/workers/WORKER-GATEWAY-HEAD-01" | tee /tmp/worker.json
          echo
          python3 - <<'PY'
          import json
          w=json.load(open('/tmp/work.json'))
          print('WORK_STATUS='+w['status'])
          print('EVIDENCE_REFS='+repr(w.get('evidenceRefs',[])))
          print('OUTCOME_REF='+str(w.get('outcomeRef')))
          PY
