name: Live Gateway Head Credential Diagnose

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-create-gateway-head.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    steps:
      - name: Diagnose cross-repository knowledge credential without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          ENV=/opt/metatron/metatron-workforce/.env
          test -r "$ENV"
          set -a; source "$ENV"; set +a

          for n in GITHUB_TOKEN GH_TOKEN GITHUB_PAT METATRON_GITHUB_TOKEN GITHUB_APP_ID GITHUB_APP_INSTALLATION_ID GITHUB_APP_PRIVATE_KEY; do
            if [ -n "${!n:-}" ]; then echo "$n=PRESENT"; else echo "$n=ABSENT"; fi
          done

          if [ -n "${GITHUB_TOKEN:-}" ]; then
            CODE=$(curl -sS -o /tmp/gh-probe.json -w '%{http_code}' \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              'https://api.github.com/repos/kelvinka38/metatron-institution/contents/06_GATEWAY/SOT.md?ref=b3516179879dc90dd482660efef71894069470c3')
            echo "GITHUB_TOKEN_INSTITUTION_HTTP=$CODE"
          else
            echo 'GITHUB_TOKEN_INSTITUTION_HTTP=NO_TOKEN'
          fi

          if [ -n "${GH_TOKEN:-}" ]; then
            CODE=$(curl -sS -o /tmp/gh-probe2.json -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              'https://api.github.com/repos/kelvinka38/metatron-institution/contents/06_GATEWAY/SOT.md?ref=b3516179879dc90dd482660efef71894069470c3')
            echo "GH_TOKEN_INSTITUTION_HTTP=$CODE"
          fi
          if [ -n "${GITHUB_PAT:-}" ]; then
            CODE=$(curl -sS -o /tmp/gh-probe3.json -w '%{http_code}' \
              -H "Authorization: Bearer $GITHUB_PAT" \
              -H 'Accept: application/vnd.github+json' \
              'https://api.github.com/repos/kelvinka38/metatron-institution/contents/06_GATEWAY/SOT.md?ref=b3516179879dc90dd482660efef71894069470c3')
            echo "GITHUB_PAT_INSTITUTION_HTTP=$CODE"
          fi
          if [ -n "${METATRON_GITHUB_TOKEN:-}" ]; then
            CODE=$(curl -sS -o /tmp/gh-probe4.json -w '%{http_code}' \
              -H "Authorization: Bearer $METATRON_GITHUB_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              'https://api.github.com/repos/kelvinka38/metatron-institution/contents/06_GATEWAY/SOT.md?ref=b3516179879dc90dd482660efef71894069470c3')
            echo "METATRON_GITHUB_TOKEN_INSTITUTION_HTTP=$CODE"
          fi
