name: Live Gateway Head Execution

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-create-gateway-head.yml'

permissions:
  contents: read

jobs:
  execute:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    steps:
      - name: Execute governed Gateway Head institutional work
        shell: bash
        run: |
          set -euo pipefail
          BASE=http://127.0.0.1:8080
          echo '=== EXECUTE WORKER ASSIGNMENT ==='
          curl -fsS -X POST \
            -H 'X-Metatron-Actor: FOUNDER' \
            "$BASE/workforce/management/gateway-head/execute?workerId=WORKER-GATEWAY-HEAD-01&workId=WORK-GATEWAY-HEAD-20260828" \
            | tee /tmp/gateway-head-result.json
          echo
          echo '=== RESULT ASSERTIONS ==='
          python3 - <<'PY'
          import json
          p='/tmp/gateway-head-result.json'
          data=json.load(open(p))
          assert data['workerId']=='WORKER-GATEWAY-HEAD-01'
          assert data['role']=='ROLE-HEAD-OF-GATEWAY'
          assert len(data['documentsRead']) >= 6
          assert data['gatewayAudit']['state']=='COMPLETED'
          assert data['status'] in ('BLOCKED','READY_FOR_ADMITTED_MUTATION')
          print('WORKER='+data['workerId'])
          print('ROLE='+data['role'])
          print('DOCUMENTS_READ='+str(len(data['documentsRead'])))
          for d in data['documentsRead']:
              print('DOC='+d['path']+' SHA='+d['sha']+' BYTES='+str(d['bytes']))
          print('AUDIT='+data['gatewayAudit']['state'])
          print('STATUS='+data['status'])
          print('NEXT_ACTION='+data['nextAction'])
          if 'workState' in data: print('WORK_STATE='+data['workState'])
          print('EVIDENCE_COUNT='+str(len(data['evidence'])))
          PY
          echo 'LIVE_GATEWAY_HEAD_EXECUTION=PASS'
