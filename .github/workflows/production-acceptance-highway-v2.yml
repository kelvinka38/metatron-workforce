name: Production Acceptance Highway V2

on:
  workflow_run:
    workflows: ["Highway Production Deploy"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact deployed production SHA to validate
        required: false
        type: string

permissions:
  contents: read

jobs:
  highway:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, linux, x64, metatron-prod]
    environment: production
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && (inputs.target_sha != '' && inputs.target_sha || github.sha) || github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Run concurrent isolated production acceptance highway
        shell: bash
        run: |
          chmod +x scripts/production-acceptance-highway.sh
          scripts/production-acceptance-highway.sh
      - name: Upload highway evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-acceptance-highway-${{ github.run_id }}
          path: /tmp/metatron-production-highway-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 90
