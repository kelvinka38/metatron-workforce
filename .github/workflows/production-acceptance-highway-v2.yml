name: Production Acceptance Highway V2

on:
  workflow_run:
    workflows: ["Highway Production Deploy"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact deployed production SHA to validate
        required: false
        type: string

permissions:
  contents: read

jobs:
  highway:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, linux, x64, metatron-prod]
    environment: production
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && (inputs.target_sha != '' && inputs.target_sha || github.sha) || github.event.workflow_run.head_sha }}
      POINT2_LANE_REVISION: production-route-log-v2
    steps:
      - uses: actions/checkout@v7
      - name: Run concurrent isolated production acceptance highway
        shell: bash
        run: |
          set -euo pipefail
          echo "POINT2_LANE_REVISION=$POINT2_LANE_REVISION"
          chmod +x scripts/production-acceptance-highway.sh scripts/highway-intelligence-lane.sh
          mkdir -p "/tmp/metatron-production-highway-${GITHUB_RUN_ID}"

          (set +e; scripts/production-acceptance-highway.sh > "/tmp/metatron-production-highway-${GITHUB_RUN_ID}/highway-core.log" 2>&1; echo $? > "/tmp/metatron-production-highway-${GITHUB_RUN_ID}/highway-core.rc") & CORE_PID=$!
          (set +e; scripts/highway-intelligence-lane.sh > "/tmp/metatron-production-highway-${GITHUB_RUN_ID}/point2-intelligence.log" 2>&1; echo $? > "/tmp/metatron-production-highway-${GITHUB_RUN_ID}/point2-intelligence.rc") & INTEL_PID=$!

          echo "HIGHWAY_CORE_PID=$CORE_PID"
          echo "HIGHWAY_POINT2_INTELLIGENCE_PID=$INTEL_PID"
          wait "$CORE_PID" || true
          wait "$INTEL_PID" || true

          cat "/tmp/metatron-production-highway-${GITHUB_RUN_ID}/highway-core.log" || true
          cat "/tmp/metatron-production-highway-${GITHUB_RUN_ID}/point2-intelligence.log" || true
          test "$(cat "/tmp/metatron-production-highway-${GITHUB_RUN_ID}/highway-core.rc")" = 0
          test "$(cat "/tmp/metatron-production-highway-${GITHUB_RUN_ID}/point2-intelligence.rc")" = 0
          echo 'HIGHWAY_POINT2_INTELLIGENCE_CONCURRENT=PASS'
          echo 'PRODUCTION_ACCEPTANCE_HIGHWAY_WITH_POINT2=PASS'
      - name: Upload highway evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-acceptance-highway-${{ github.run_id }}
          path: /tmp/metatron-production-highway-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 90
