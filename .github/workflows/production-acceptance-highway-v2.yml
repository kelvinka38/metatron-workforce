name: Production Acceptance Highway Ingress

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact deployed production SHA to validate
        required: false
        type: string
      profile:
        description: FAST for routine gate; FULL only for explicit isolated stress
        required: false
        default: FAST
        type: choice
        options: [FAST, FULL]

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-acceptance-highway-ingress
  cancel-in-progress: true

jobs:
  enqueue-highway:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - name: Publish immutable control-plane release
        shell: bash
        run: |
          set -euo pipefail
          bash highway/publish-release.sh "$GITHUB_WORKSPACE" "$GITHUB_SHA"

      - name: Submit acceptance profile to persistent Highway
        shell: bash
        env:
          REQUESTED_TARGET_SHA: ${{ inputs.target_sha }}
          REQUESTED_PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          TARGET_SHA="${REQUESTED_TARGET_SHA:-$GITHUB_SHA}"
          PROFILE="${REQUESTED_PROFILE:-FAST}"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$PROFILE" in
            FAST) KIND=production-highway-fast; PRIORITY=70 ;;
            FULL) KIND=production-highway-full; PRIORITY=40 ;;
            *) echo "unsupported profile: $PROFILE" >&2; exit 1 ;;
          esac
          BASE=/opt/metatron/metatron-workforce
          set -a
          source "$BASE/.env"
          source "$HOME/.metatron/highway/highway.env"
          set +a
          bash "$HOME/.metatron/highway/current/ensure-running.sh"
          CTL="python3 $HOME/.metatron/highway/current/highwayctl.py"
          TASK=$($CTL submit             --kind "$KIND"             --source-sha "$GITHUB_SHA"             --priority "$PRIORITY"             --dedupe-key "$KIND:$TARGET_SHA:$GITHUB_RUN_ID"             --env "TARGET_SHA=$TARGET_SHA"             | python3 -c 'import json,sys; print(json.load(sys.stdin)["task_id"])')
          echo "HIGHWAY_ACCEPTANCE_TASK=$TASK"
          echo "HIGHWAY_ACCEPTANCE_PROFILE=$PROFILE"
          $CTL get "$TASK"
          echo 'PRODUCTION_ACCEPTANCE_GITHUB_EXECUTION_PLANE=BYPASSED'
          echo 'PRODUCTION_ACCEPTANCE_HIGHWAY_INGRESS=PASS'
