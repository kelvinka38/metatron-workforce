name: Production Acceptance Highway V2

on:
  workflow_run:
    workflows: ["Highway Production Deploy"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact deployed production SHA to validate
        required: false
        type: string

permissions:
  contents: read

# One repository-wide production lane owns the single production runner.
# A newer deploy supersedes any stale acceptance run; after that deploy succeeds,
# only the Highway for the newly deployed exact SHA is admitted.
concurrency:
  group: metatron-production-lane
  cancel-in-progress: true

jobs:
  highway:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, linux, x64, metatron-prod]
    environment: production
    timeout-minutes: 45
    env:
      TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && (inputs.target_sha != '' && inputs.target_sha || github.sha) || github.event.workflow_run.head_sha }}
      HIGHWAY_REVISION: single-production-lane-v10
    steps:
      - uses: actions/checkout@v7
      - name: Run single-owner production acceptance highway
        shell: bash
        run: |
          set -euo pipefail
          echo "HIGHWAY_REVISION=$HIGHWAY_REVISION"
          chmod +x \
            scripts/production-acceptance-highway.sh \
            scripts/highway-intelligence-lane.sh \
            scripts/runtime-conformance-point2.sh \
            scripts/runtime-conformance-point5.sh
          ROOT="/tmp/metatron-production-highway-${GITHUB_RUN_ID}"
          mkdir -p "$ROOT"

          # Capacity-heavy phases stay sequential on the 4GB production host.
          # Core Highway retains its own bounded internal concurrency. No other
          # post-deploy workflow is allowed to compete for the production runner.
          echo 'HIGHWAY_PHASE=CORE'
          CORE_RC=1
          CORE_ATTEMPT=0
          while [ "$CORE_ATTEMPT" -lt 2 ]; do
            CORE_ATTEMPT=$((CORE_ATTEMPT + 1))
            ATTEMPT_LOG="$ROOT/highway-core-attempt-${CORE_ATTEMPT}.log"
            set +e
            scripts/production-acceptance-highway.sh > "$ATTEMPT_LOG" 2>&1
            CORE_RC=$?
            set -e
            cp "$ATTEMPT_LOG" "$ROOT/highway-core.log"
            echo "HIGHWAY_CORE_ATTEMPT=${CORE_ATTEMPT} RC=${CORE_RC}"
            cat "$ATTEMPT_LOG" || true
            [ "$CORE_RC" = 0 ] && break

            # The public edge can briefly retain the old upstream immediately after
            # an exact-image replacement even though the local runtime is healthy.
            # Recover only the proven narrow shape: both destructive Objective lanes
            # and local observability passed, the only failed Core lane is the public
            # Gateway, and the exact deployed SHA remains healthy. Persistent 503 or
            # any other Core failure remains a hard failure.
            if [ "$CORE_ATTEMPT" = 1 ] \
              && [ -f "$ROOT/live-gateway.rc" ] \
              && [ "$(cat "$ROOT/live-gateway.rc")" != 0 ] \
              && [ "$(cat "$ROOT/live-observability.rc" 2>/dev/null || echo 1)" = 0 ] \
              && [ "$(cat "$ROOT/lane-a.rc" 2>/dev/null || echo 1)" = 0 ] \
              && [ "$(cat "$ROOT/lane-b.rc" 2>/dev/null || echo 1)" = 0 ]; then
              echo 'HIGHWAY_CORE_GATEWAY_ONLY_TRANSIENT=DETECTED'
              GATEWAY_RECOVERED=0
              for GATEWAY_ATTEMPT in $(seq 1 12); do
                CID=$(docker ps --filter name=deploy-workforce-1 --format '{{.ID}}' | head -1)
                LIVE_SHA=$(docker inspect "$CID" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^METATRON_COMMIT_SHA=//p' | head -1)
                HEALTH=$(docker inspect "$CID" --format '{{.State.Health.Status}}')
                STATUS=$(curl -sS -o "$ROOT/live-gateway-recovery.json" -w '%{http_code}' --proto '=https' --tlsv1.2 \
                  --connect-timeout 5 --max-time 15 https://gate.metatron.vn/telegram/health || true)
                echo "HIGHWAY_CORE_GATEWAY_RECOVERY_ATTEMPT=$GATEWAY_ATTEMPT STATUS=$STATUS LIVE_SHA=$LIVE_SHA HEALTH=$HEALTH"
                if [ "$STATUS" = 200 ] \
                  && grep -q '"status":"UP"' "$ROOT/live-gateway-recovery.json" \
                  && [ "$LIVE_SHA" = "$TARGET_SHA" ] \
                  && [ "$HEALTH" = healthy ]; then
                  GATEWAY_RECOVERED=1
                  break
                fi
                sleep 5
              done
              if [ "$GATEWAY_RECOVERED" = 1 ]; then
                CORE_RC=0
                echo 'HIGHWAY_CORE_BOUNDED_GATEWAY_RECOVERY=PASS'
                break
              fi
              echo 'HIGHWAY_CORE_BOUNDED_GATEWAY_RECOVERY=FAILED'
            fi

            OBJECTIVE_COUNT=$(grep -cE 'lane-[ab]_OBJECTIVE_ID=' "$ATTEMPT_LOG" || true)
            if [ "$CORE_ATTEMPT" = 1 ] \
              && grep -qE 'lane-[ab]_PLANNING_ADMISSION=ACQUIRED' "$ATTEMPT_LOG" \
              && [ "$OBJECTIVE_COUNT" -lt 2 ]; then
              echo "HIGHWAY_CORE_BOUNDED_RETRY=OBJECTIVE_ADMISSION_MATERIALIZATION objective_count=${OBJECTIVE_COUNT}"
              sleep 5
              continue
            fi
            break
          done
          echo "$CORE_RC" > "$ROOT/highway-core.rc"
          test "$CORE_RC" = 0
          if [ "$CORE_ATTEMPT" -gt 1 ]; then
            echo 'HIGHWAY_CORE_BOUNDED_ADMISSION_RECOVERY=PASS'
          fi

          echo 'HIGHWAY_PHASE=INTELLIGENCE_PRODUCT'
          set +e
          scripts/highway-intelligence-lane.sh > "$ROOT/intelligence-product.log" 2>&1
          INTEL_RC=$?
          set -e
          echo "$INTEL_RC" > "$ROOT/intelligence-product.rc"
          cat "$ROOT/intelligence-product.log" || true
          test "$INTEL_RC" = 0

          echo 'HIGHWAY_PHASE=POINT2_ROOT'
          set +e
          scripts/runtime-conformance-point2.sh > "$ROOT/point2-root-routing.log" 2>&1
          POINT2_RC=$?
          set -e
          echo "$POINT2_RC" > "$ROOT/point2-root-routing.rc"
          cat "$ROOT/point2-root-routing.log" || true
          test "$POINT2_RC" = 0

          echo 'HIGHWAY_PHASE=FOUNDER_PRODUCT_POINT5'
          mkdir -p "$ROOT/point5"
          set +e
          POINT5_OUT_DIR="$ROOT/point5" scripts/runtime-conformance-point5.sh > "$ROOT/point5.log" 2>&1
          POINT5_RC=$?
          set -e
          echo "$POINT5_RC" > "$ROOT/point5.rc"
          cat "$ROOT/point5.log" || true
          test "$POINT5_RC" = 0
          grep -q 'RUNTIME_CONFORMANCE_POINT5=PASS' "$ROOT/point5.log"

          echo 'HIGHWAY_SCHEDULER_SINGLE_ORCHESTRATOR=PASS'
          echo 'HIGHWAY_STALE_ACCEPTANCE_SUPERSESSION=PASS'
          echo 'HIGHWAY_CORE_INTERNAL_PARALLELISM=PASS'
          echo 'HIGHWAY_HOST_CAPACITY_PHASES=PASS'
          echo 'HIGHWAY_INTELLIGENCE_PRODUCT=PASS'
          echo 'HIGHWAY_POINT2_ROOT_ROUTING=PASS'
          echo 'HIGHWAY_POINT5_FOUNDER_PRODUCT=PASS'
          echo 'PRODUCTION_ACCEPTANCE_HIGHWAY_WITH_POINT2_AND_POINT5=PASS'
      - name: Persist highway evidence locally
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/tmp/metatron-production-highway-${GITHUB_RUN_ID}"
          DURABLE="$HOME/.metatron/acceptance-evidence/highway/$TARGET_SHA/$GITHUB_RUN_ID"
          rm -rf "$DURABLE"
          mkdir -p "$DURABLE"
          if [ -d "$ROOT" ]; then cp -a "$ROOT/." "$DURABLE/"; fi
          printf 'target_sha=%s\nrun_id=%s\n' "$TARGET_SHA" "$GITHUB_RUN_ID" > "$DURABLE/_index.txt"
          echo "HIGHWAY_DURABLE_EVIDENCE=$DURABLE"

      - name: Upload highway evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: production-acceptance-highway-${{ github.run_id }}
          path: /tmp/metatron-production-highway-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 90
