name: Highway Manual Ingress Live Proof

on:
  push:
    branches: [verify/highway-manual-ingress-live]
    paths:
      - '.github/workflows/highway-manual-ingress-live-proof.yml'

permissions:
  contents: read

concurrency:
  group: highway-manual-ingress-live-proof
  cancel-in-progress: true

jobs:
  prove:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 10
    env:
      TARGET_MAIN_SHA: e14e3267bff6b9bc8011231daf0b3aefa6996d73
    steps:
      - uses: actions/checkout@v7

      - name: Wait for exact main runtime closure and active registry
        shell: bash
        run: |
          set -euo pipefail
          BASE=/opt/metatron/metatron-workforce
          set -a
          source "$BASE/.env"
          source "$HOME/.metatron/highway/highway.env"
          set +a
          bash "$HOME/.metatron/highway/current/ensure-running.sh"
          CTL="python3 $HOME/.metatron/highway/current/highwayctl.py"

          FOUND=''
          for _ in $(seq 1 480); do
            $CTL list --limit 500 >/tmp/manual-ingress-tasks.json
            FOUND=$(python3 - /tmp/manual-ingress-tasks.json "$TARGET_MAIN_SHA" <<'PY'
          import json,sys
          rows=[r for r in json.load(open(sys.argv[1])) if r.get('source_sha')==sys.argv[2] and r.get('kind')=='runtime-closure']
          rows.sort(key=lambda r:r.get('created_at') or '')
          if rows and rows[-1].get('state')=='SUCCEEDED':
              print(rows[-1]['task_id'])
          elif rows and rows[-1].get('state') in ('FAILED','DEAD_LETTERED','BLOCKED','CANCELLED'):
              raise SystemExit(f"runtime closure failed: {rows[-1]}")
          else:
              print('')
          PY
          )
            [ -n "$FOUND" ] && break
            sleep 1
          done
          test -n "$FOUND"
          echo "MANUAL_INGRESS_RUNTIME_CLOSURE_TASK=$FOUND"

          test -r "$HOME/.metatron/highway/current/task-registry.json"
          python3 - "$HOME/.metatron/highway/current/task-registry.json" <<'PY'
          import json,sys
          tasks=json.load(open(sys.argv[1]))['tasks']
          required={
            'bios-p10-release-readiness',
            'gateway-director-live-acceptance',
            'mother-baby-bios-live-objective',
            'ops-inspect-runners',
            'ops-reconcile-bios-auth',
            'runtime-point4-mutation',
            'runtime-point4-read',
            'telegram-provider-live-acceptance',
          }
          missing=sorted(required-set(tasks))
          assert not missing, missing
          print('HIGHWAY_OPERATIONAL_REGISTRY_ACTIVE=PASS')
          PY

          CID=$(docker ps --filter name=deploy-workforce-1 --format '{{.ID}}' | head -1)
          test -n "$CID"
          LIVE_SHA=$(docker inspect "$CID" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^METATRON_COMMIT_SHA=//p' | head -1)
          LIVE_HEALTH=$(docker inspect "$CID" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}')
          test "$LIVE_SHA" = "$TARGET_MAIN_SHA"
          test "$LIVE_HEALTH" = healthy
          echo "HIGHWAY_OPERATIONAL_LIVE_SHA=$LIVE_SHA"
          echo 'HIGHWAY_OPERATIONAL_EXACT_RUNTIME=PASS'

      - name: Prove manual workflow becomes short ingress
        shell: bash
        run: |
          set -euo pipefail
          START=$(python3 -c 'import time; print(time.monotonic())')
          bash scripts/highway-manual-ingress.sh 'ops-live-probe-gs2' '' '20' | tee /tmp/manual-ingress-submit.log
          END=$(python3 -c 'import time; print(time.monotonic())')
          TASK=$(sed -n 's/^HIGHWAY_MANUAL_TASK=//p' /tmp/manual-ingress-submit.log | tail -1)
          test -n "$TASK"
          ELAPSED=$(python3 - "$START" "$END" <<'PY'
          import sys
          print(float(sys.argv[2])-float(sys.argv[1]))
          PY
          )
          python3 - "$ELAPSED" <<'PY'
          import sys
          elapsed=float(sys.argv[1])
          assert elapsed < 20.0, elapsed
          print(f'HIGHWAY_MANUAL_INGRESS_SECONDS={elapsed:.3f}')
          print('HIGHWAY_MANUAL_RUNNER_RELEASE_BOUNDED=PASS')
          PY

          BASE=/opt/metatron/metatron-workforce
          set -a
          source "$BASE/.env"
          source "$HOME/.metatron/highway/highway.env"
          set +a
          CTL="python3 $HOME/.metatron/highway/current/highwayctl.py"
          $CTL wait "$TASK" --timeout 30 >/tmp/manual-ingress-terminal.json
          cat /tmp/manual-ingress-terminal.json
          python3 - /tmp/manual-ingress-terminal.json <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['state']=='SUCCEEDED',d
          assert d['kind']=='ops-live-probe-gs2',d
          print('HIGHWAY_MANUAL_TASK_EXECUTED_OUTSIDE_ACTIONS=PASS')
          print('HIGHWAY_MANUAL_INGRESS_LIVE=PASS')
          PY
