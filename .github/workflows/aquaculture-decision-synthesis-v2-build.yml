name: Aquaculture Decision Synthesis v2 Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aquaculture-decision-synthesis-v2-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 10
    steps:
      - name: Patch BIOS decision synthesis branch
        shell: bash
        run: |
          set -euo pipefail
          BASE=/opt/metatron/metatron-workforce
          set -a; source "$BASE/.env"; set +a
          test -n "${GITHUB_TOKEN:-}"
          WORK=/tmp/bios-aq-decision-synthesis-v2
          rm -rf "$WORK"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: bearer $GITHUB_TOKEN" clone --depth 1 --branch aquaculture-decision-synthesis-v2 https://github.com/kelvinka38/bios.git "$WORK"
          cd "$WORK"
          git config user.name 'Metatron Selfhosted'
          git config user.email 'metatron@localhost'
          python3 - <<'PY'
          from pathlib import Path

          p=Path('bios_runtime/domains/aquaculture/services.py')
          s=p.read_text()
          anchor='from .planning import build_operating_blueprint\n'
          if 'from .synthesis import synthesize_candidate\n' not in s:
              assert anchor in s
              s=s.replace(anchor,anchor+'from .synthesis import synthesize_candidate\n')
          a=s.index('    def _auto_candidates(')
          b=s.index('\n    def generate_scenarios',a)
          method='''    def _auto_candidates(self, species:str, discovery:dict, preferred_species:str|None, farm_id:str, farm_location:dict|None=None)->list[dict]:
              direction=(discovery.get("CD-05") or {}).get("normalized_value") or "UNKNOWN"
              water=(discovery.get("CD-04") or {}).get("normalized_value")
              profile=self._owner_preference_profile(discovery)
              context={"direction":direction}
              env=self.knowledge.query({"knowledge_class":"SPECIES_ENVIRONMENT","subject":species,"property":"water_environment","production_context":context})
              if env["status"]=="RESOLVED" and water not in (None,"UNKNOWN"):
                  allowed=env["items"][0].get("value")
                  if water not in set(allowed if isinstance(allowed,list) else [allowed]): return []
              legal=self.knowledge.query({"knowledge_class":"LEGAL_STATUS","subject":species,"property":"production_allowed","production_context":context})
              if legal["status"]=="RESOLVED" and not bool(legal["items"][0].get("value")): return []
              systems=self.knowledge.query({"knowledge_class":"PRODUCTION_SYSTEM_OPTIONS","subject":species,"property":"culture_styles","production_context":context})
              styles=[]
              if systems["status"]=="RESOLVED":
                  value=systems["items"][0].get("value"); styles=list(value if isinstance(value,list) else [value])
              if not styles: styles=["OPEN"]
              style_order=["EXTENSIVE","LOW_INPUT_POND","EARTH_POND","POND","SEMI_INTENSIVE","SEMI_INTENSIVE_POND","CAGE","FATTENING","TANK_RAS","INTENSIVE","OPEN"] if profile["low_input"] else ["POND","EARTH_POND","SEMI_INTENSIVE","SEMI_INTENSIVE_POND","EXTENSIVE","CAGE","FATTENING","TANK_RAS","INTENSIVE","OPEN"]
              styles=sorted(dict.fromkeys(styles),key=lambda x:(style_order.index(x) if x in style_order else len(style_order),str(x)))
              nutrition=self.knowledge.query({"knowledge_class":"NUTRITION_OPTIONS","subject":species,"property":"input_strategies","production_context":context})
              strategies=[]
              if nutrition["status"]=="RESOLVED":
                  value=nutrition["items"][0].get("value"); strategies=list(value if isinstance(value,list) else [value])
              if not strategies: strategies=["OPEN"]
              strategy_order=["MIXED_LOW_INPUT","LOW_INPUT","NATURAL","COMMERCIAL_FEED","OPEN"] if profile["low_input"] else ["COMMERCIAL_FEED","MIXED_LOW_INPUT","LOW_INPUT","NATURAL","OPEN"]
              strategies=sorted(dict.fromkeys(strategies),key=lambda x:(strategy_order.index(x) if x in strategy_order else len(strategy_order),str(x)))
              base_refs=[]
              for result in (env,legal,systems,nutrition): base_refs.extend([x["knowledge_id"] for x in result.get("items") or []])
              candidates=[]
              for culture_method in styles:
                  # A single-species card must never masquerade as a polyculture design.
                  if culture_method=="POLYCULTURE_POND":
                      continue
                  for input_strategy in strategies:
                      proto={"species_set":[species],"production_direction":direction,"culture_method":culture_method,"input_strategy":input_strategy}
                      economics,econ_refs,econ_assumptions=build_reference_economics(self.knowledge,self.repo,species,proto,discovery,farm_location=farm_location or {})
                      cand=synthesize_candidate(species=species,culture_method=culture_method,input_strategy=input_strategy,discovery=discovery,farm_location=farm_location or {},economics=economics,preferred_species=preferred_species,owner_profile=profile,knowledge_refs=base_refs+econ_refs)
                      cand["assumptions"].extend(econ_assumptions)
                      cand["assumptions"].append({"kind":"KNOWLEDGE_DERIVED_SYSTEM_VARIANT","knowledge_refs":sorted(set(base_refs)),"culture_method":culture_method,"input_strategy":input_strategy})
                      if species==preferred_species: cand["assumptions"].append({"kind":"OWNER_INTENT_PREFERENCE","source_semantic":"CD-06"})
                      if profile["raw"]: cand["assumptions"].append({"kind":"OWNER_OPERATING_INVARIANTS","source_semantic":"CD-08","value":profile["raw"]})
                      market=match_scenario(self.repo,farm_id,cand)
                      cand["market_pathway"].update({
                          "evidence_level":market["evidence_level"],"market_freshness":market["market_freshness"],
                          "buyer_concentration":market["buyer_concentration"],"buyer_concentration_risk":market["buyer_concentration_risk"],
                          "target_grade":market["target_grade"],"expected_volume_kg":market["expected_volume_kg"],
                          "expected_harvest_window":market["expected_harvest_window"],
                          "matched_demand_refs":[x["demand_id"] for x in market.get("matched_demands") or []],
                      })
                      cand["risk"]["market_liquidity"]=market["evidence_level"]
                      cand["risk"]["synthesis"]=cand.pop("synthesis")
                      candidates.append(cand)
              return candidates[:6]
          '''
          s=s[:a]+method+s[b:]
          old='candidates.extend(self._auto_candidates(sp,discovery,preferred,farm_location=farm.get("location") or {}))'
          new='candidates.extend(self._auto_candidates(sp,discovery,preferred,farm["farm_id"],farm_location=farm.get("location") or {}))'
          assert old in s
          s=s.replace(old,new)
          p.write_text(s)

          p=Path('bios_runtime/domains/aquaculture/farmer_workspace.py')
          s=p.read_text()
          insert='''    def _scenario_projection(self,s:dict,rank:int)->dict[str,Any]:
              prod=s.get("production") or {};econ=s.get("economics") or {};risk=s.get("risk") or {};market=s.get("market_pathway") or {};synth=risk.get("synthesis") or {}
              species=((prod.get("species_set") or [s.get("label")])[0])
              method=str(prod.get("culture_method") or "OPEN")
              input_strategy=str(prod.get("input_strategy") or "OPEN")
              method_vi={"POND":"Ao","EARTH_POND":"Ao đất","LOW_INPUT_POND":"Ao ít đầu vào","EXTENSIVE":"Quảng canh","SEMI_INTENSIVE":"Bán thâm canh","SEMI_INTENSIVE_POND":"Ao bán thâm canh","INTENSIVE":"Thâm canh","CAGE":"Lồng","TANK_RAS":"Bể tuần hoàn","FATTENING":"Vỗ béo","OPEN":"Chưa chốt"}.get(method,method)
              input_vi={"NATURAL":"Thức ăn tự nhiên","MIXED_LOW_INPUT":"Tự nhiên + bổ sung","LOW_INPUT":"Ít đầu vào mua ngoài","COMMERCIAL_FEED":"Thức ăn thương mại","OPEN":"Chưa đủ bằng chứng"}.get(input_strategy,input_strategy)
              return {
                  "rank":rank,"name":f"{friendly_species(species)} · {method_vi} · {input_vi}","species_name":friendly_species(species),"scientific_name":species,
                  "eligibility":s.get("eligibility"),"recommendation_state":s.get("recommendation_state"),"blocking_unknowns":len(s.get("unknown_refs") or []),
                  "culture_method":method,"input_strategy":input_strategy,"intensity":prod.get("intensity"),"species_configuration":prod.get("species_configuration"),
                  "capital_required_minor":econ.get("capital_required_minor"),"historical_cycle_cost_reference_minor_range":econ.get("historical_cycle_cost_reference_minor_range"),
                  "production_volume_kg_range":econ.get("production_volume_kg_range"),"revenue_reference_minor_range":econ.get("revenue_reference_minor_range"),
                  "economic_model_state":econ.get("model_state","INSUFFICIENT_EVIDENCE"),"economic_completeness":econ.get("economic_completeness",0),
                  "working_capital_minor":econ.get("working_capital_minor"),"time_to_cash_days":econ.get("time_to_cash_days"),
                  "market_evidence_level":market.get("evidence_level","NONE"),"market_freshness":market.get("market_freshness","UNKNOWN"),"buyer_concentration_risk":market.get("buyer_concentration_risk","UNKNOWN"),
                  "owner_intent_preferred":bool(risk.get("owner_intent_preferred")),"owner_alignment_unknowns":int(risk.get("owner_alignment_unknowns") or 0),
                  "why_proposed":synth.get("why_proposed") or [],"decision_trace":risk.get("decision_trace") or [],"material_unknowns":prod.get("material_unknowns") or synth.get("material_unknowns") or [],
                  "production_blueprint":{"configuration":prod.get("species_configuration"),"intensity":prod.get("intensity"),"area_basis":prod.get("area_basis"),"stocking":prod.get("stocking_assumptions"),"environment_strategy":prod.get("environment_strategy"),"infrastructure_requirements":prod.get("infrastructure_requirements") or [],"operating_capability_requirements":prod.get("operating_capability_requirements") or [],"cycle_duration":prod.get("cycle_duration_assumptions"),"harvest_target":prod.get("harvest_target")},
                  "economics":{"model_state":econ.get("model_state"),"capital_required_minor":econ.get("capital_required_minor"),"historical_cycle_cost_reference_minor_range":econ.get("historical_cycle_cost_reference_minor_range"),"production_volume_kg_range":econ.get("production_volume_kg_range"),"revenue_reference_minor_range":econ.get("revenue_reference_minor_range"),"market_price_reference":econ.get("market_price_reference"),"time_to_cash_days":econ.get("time_to_cash_days"),"reference_context":econ.get("reference_context"),"knowledge_refs":econ.get("knowledge_refs") or [],"evidence_refs":econ.get("evidence_refs") or []},
                  "market":{"evidence_level":market.get("evidence_level","NONE"),"market_freshness":market.get("market_freshness","UNKNOWN"),"buyer_concentration":market.get("buyer_concentration"),"buyer_concentration_risk":market.get("buyer_concentration_risk"),"matched_demand_refs":market.get("matched_demand_refs") or []},
                  "risks":{"biological":risk.get("biological"),"disease_health":risk.get("disease_health"),"environmental":risk.get("environmental"),"infrastructure":risk.get("infrastructure"),"operational_complexity":risk.get("operational_complexity"),"input_dependence":risk.get("input_dependence"),"financial_downside":risk.get("financial_downside"),"market_liquidity":risk.get("market_liquidity"),"evidence_uncertainty":risk.get("evidence_uncertainty")},
                  "gate_results":s.get("gate_results") or [],"tradeoffs":s.get("tradeoffs") or [],"_ref":{"scenario_id":s["scenario_id"],"version":s["version"]},
              }

          '''
          marker='    def summary(self,farm_id:str)->dict[str,Any]:\n'
          assert marker in s
          if '_scenario_projection' not in s:s=s.replace(marker,insert+marker)
          a=s.index('            "scenarios":[{',s.index('    def summary('))
          b=s.index('            "decision":',a)
          s=s[:a]+'            "scenarios":[self._scenario_projection(s,i+1) for i,s in enumerate(scenarios)],\n'+s[b:]
          p.write_text(s)

          p=Path('bios_runtime/domains/aquaculture/web/app.js')
          s=p.read_text()
          a=s.index('function scenarioCard(s,i){')
          b=s.index('\nfunction friendlyMethod',a)
          card='''function scenarioCard(s,i){
           const pref=s.owner_intent_preferred?'<span class="pill info" style="margin-left:6px">Bạn đang quan tâm</span>':"";
           const cycle=s.production_blueprint?.cycle_duration?.days_reference||s.time_to_cash_days;
           return '<div class="scenario-card '+(i===0&&s.eligibility!=="INELIGIBLE"?"featured":"")+'">'+
           '<div>'+pill(s.eligibility,scenarioStatus(s))+pref+'</div><div class="small muted">PHƯƠNG ÁN #'+html(s.rank||i+1)+'</div><h3>'+html(s.name)+'</h3><div class="latin">'+html(s.scientific_name)+'</div>'+
           '<div class="scenario-facts">'+fact("Cường độ",label(s.intensity))+fact("Cấu hình",label(s.species_configuration))+fact("Chu kỳ tham chiếu",cycle?num(cycle)+" ngày":"Chưa đủ bằng chứng")+
           fact("Vốn hiện hành",s.capital_required_minor?money(s.capital_required_minor):"Chưa đủ bằng chứng để chốt")+
           fact("Sản lượng tham chiếu",s.production_volume_kg_range?num(s.production_volume_kg_range.min)+"–"+num(s.production_volume_kg_range.max)+" kg":"Chưa đủ bằng chứng")+
           fact("Thị trường",label(s.market_evidence_level)+" · "+(s.market_freshness==="CURRENT"?"mới":s.market_freshness==="STALE"?"cũ":"chưa rõ độ mới"))+fact("Cần làm rõ",num(s.blocking_unknowns)+" điểm")+
           '</div><div class="card-actions"><button class="btn btn-secondary detailScenario" data-i="'+i+'">Xem hồ sơ phương án</button>'+(s.eligibility==="INELIGIBLE"?"":'<button class="btn btn-primary chooseScenario" data-i="'+i+'">Chọn</button>')+'</div></div>'
          }
          '''
          s=s[:a]+card+s[b:]
          a=s.index('function showScenario(s){')
          b=s.index('\nasync function chooseScenario',a)
          detail='''function showScenario(s){
           const gates=(s.gate_results||[]).map(humanGate),p=s.production_blueprint||{},e=s.economics||{},m=s.market||{},r=s.risks||{},trace=s.decision_trace||[],unknowns=s.material_unknowns||[];
           const list=(xs,empty)=>xs?.length?'<ul>'+xs.map(x=>'<li>'+html(typeof x==="string"?x:(x.effect||x.resolution||JSON.stringify(x)))+'</li>').join("")+'</ul>':'<p class="muted small">'+html(empty)+'</p>';
           const range=x=>x&&x.min!=null&&x.max!=null?num(x.min)+'–'+num(x.max):'Chưa đủ bằng chứng';
           openModal(modalHead(s.name)+'<p class="latin">'+html(s.scientific_name)+'</p>'+
           '<div class="notice"><strong>Vì sao BIOS tạo phương án này</strong>'+list(s.why_proposed,'Chưa có reasoning trace.')+'</div>'+
           '<h3>Cấu hình sản xuất</h3><div class="quick-actions">'+summaryTile("Cấu hình",label(p.configuration))+summaryTile("Cường độ",label(p.intensity))+summaryTile("Diện tích dùng để tính",p.area_basis?.usable_area_m2?num(p.area_basis.usable_area_m2)+" m²":"Chưa rõ")+summaryTile("Mật độ thả",p.stocking?.density_per_m2!=null?num(p.stocking.density_per_m2)+" con/m²":"Chưa đủ bằng chứng")+summaryTile("Số lượng thả tham chiếu",p.stocking?.quantity!=null?num(p.stocking.quantity):"Chưa đủ bằng chứng")+summaryTile("Chu kỳ",p.cycle_duration?.days_reference?num(p.cycle_duration.days_reference)+" ngày":"Chưa đủ bằng chứng")+'</div>'+
           '<h3>Quản lý nước & hạ tầng</h3><div class="notice"><strong>'+html(p.environment_strategy?.strategy||"Chưa chốt")+'</strong>'+list(p.environment_strategy?.requirements,'Chưa có yêu cầu nguồn nước được derive.')+'</div>'+list(p.infrastructure_requirements,'Chưa đủ bằng chứng hạ tầng.')+
           '<h3>Kinh tế</h3><div class="quick-actions">'+summaryTile("Vốn hiện hành",e.capital_required_minor?money(e.capital_required_minor):"CHƯA ĐỦ BẰNG CHỨNG")+summaryTile("Chi phí lịch sử tham chiếu",e.historical_cycle_cost_reference_minor_range?money(e.historical_cycle_cost_reference_minor_range.min)+'–'+money(e.historical_cycle_cost_reference_minor_range.max):"Không có")+summaryTile("Sản lượng tham chiếu",range(e.production_volume_kg_range)+" kg")+summaryTile("Doanh thu tham chiếu",e.revenue_reference_minor_range?money(e.revenue_reference_minor_range.min)+'–'+money(e.revenue_reference_minor_range.max):"Chưa đủ bằng chứng")+summaryTile("Time-to-cash",e.time_to_cash_days?num(e.time_to_cash_days)+" ngày":"Chưa đủ bằng chứng")+'</div>'+
           '<h3>Thị trường</h3><div class="quick-actions">'+summaryTile("Mức bằng chứng",label(m.evidence_level))+summaryTile("Độ mới",label(m.market_freshness))+summaryTile("Rủi ro tập trung người mua",label(m.buyer_concentration_risk))+'</div>'+
           '<h3>Rủi ro</h3><div class="quick-actions">'+Object.entries(r).map(([k,v])=>summaryTile(k.replaceAll("_"," "),label(v))).join("")+'</div>'+
           '<h3>Điểm phải làm rõ trước khi chốt</h3>'+list(unknowns,'Không có material unknown được derive ở bước synthesis.')+
           '<h3>Step 1 đã tác động vào phương án thế nào</h3><div class="market-list">'+(trace.length?trace.map(x=>'<div class="market-row"><strong>'+html(x.semantic)+'</strong><div>'+html(x.decision_role)+'</div><div class="source">'+html(x.effect)+'</div></div>').join(""):'<p class="muted">Không có reasoning trace — đây là lỗi.</p>')+'</div>'+
           '<h3>Hard gates</h3><div class="market-list">'+(gates.length?gates.map(g=>'<div class="market-row"><strong>'+html(g.title)+'</strong><div>'+pill(g.status)+'</div><div class="source">'+html(g.text)+'</div></div>').join(""):'<p class="muted">Chưa có đánh giá hard gate.</p>')+'</div>'+
           '<div class="notice" style="margin-top:15px"><strong>Mức khuyến nghị</strong>'+html(label(s.recommendation_state))+'</div>')
          }
          '''
          s=s[:a]+detail+s[b:]
          s=s.replace('BIOS sẽ lọc bằng điều kiện sinh học, pháp lý, vốn và bằng chứng thị trường. Không có một “điểm số thần kỳ” ghi đè hard gate.','BIOS sẽ dựng các hệ thống nuôi khác nhau từ toàn bộ context Step 1, rồi mới hard-gate sinh học, pháp lý, vốn và đối chiếu thị trường. Mỗi phương án phải cho thấy Step 1 đã tác động vào nó thế nào.')
          p.write_text(s)

          Path('tests/test_aquaculture_synthesis_v2.py').write_text(r'''from __future__ import annotations
          import tempfile,unittest
          from pathlib import Path
          from bios_runtime.store import Store
          from bios_runtime.models import utc_now
          from bios_runtime.domains.aquaculture.services import AquacultureService
          from bios_runtime.domains.aquaculture.data_bundle import AquacultureDataBundleImporter
          from bios_runtime.domains.aquaculture.farmer_workspace import AquacultureFarmerWorkspace

          ROOT=Path(__file__).resolve().parents[1]
          BUNDLE=ROOT/'KNOWLEDGE'/'DOMAINS'/'AQUACULTURE'/'data'/'vietnam_baseline_v1.json'

          class AquacultureSynthesisV2Test(unittest.TestCase):
              def setUp(self):
                  self.tmp=tempfile.TemporaryDirectory();self.store=Store(str(Path(self.tmp.name)/'bios.db'));self.actor='synthesis-owner';self.case='case-synthesis-v2';ts=utc_now()
                  self.store.save_case({'id':self.case,'schema_version':'0.1','actor_id':self.actor,'status':'ACTIVE','mode':'OPERATING','created_at':ts,'updated_at':ts})
                  self.svc=AquacultureService(self.store);AquacultureDataBundleImporter(self.svc.repo).import_file(BUNDLE,imported_by='TEST',authority_ref='TEST')
                  self.farm=self.svc.create_farm(self.actor,{'case_id':self.case,'name':'Bac Lieu synthesis','location':{'country':'VN','province':'Bạc Liêu'},'timezone':'Asia/Ho_Chi_Minh'})
                  self.svc.update_discovery(self.actor,{'case_id':self.case,'farm_id':self.farm['farm_id'],'items':[
                    {'semantic_key':'CD-01','normalized_value':{'country':'VN','province':'Bạc Liêu'},'original_value':'Bạc Liêu','field_state':'DECLARED'},
                    {'semantic_key':'CD-02','normalized_value':{'value':650,'unit':'m2'},'original_value':'650','field_state':'DECLARED'},
                    {'semantic_key':'CD-03','normalized_value':'CANAL','original_value':'CANAL','field_state':'DECLARED'},
                    {'semantic_key':'CD-04','normalized_value':'BRACKISH','original_value':'BRACKISH','field_state':'DECLARED'},
                    {'semantic_key':'CD-05','normalized_value':'GROW_OUT','original_value':'GROW_OUT','field_state':'DECLARED'},
                    {'semantic_key':'CD-06','normalized_value':'Cá nâu','original_value':'Cá nâu','field_state':'DECLARED'},
                    {'semantic_key':'CD-07','normalized_value':{'amount_minor':'500000000','currency':'VND'},'original_value':'500000000','field_state':'DECLARED','owner_lock':True},
                    {'semantic_key':'CD-08','normalized_value':'không hóa chất','original_value':'không hóa chất','field_state':'DECLARED','owner_lock':True},
                  ]})
              def tearDown(self):self.tmp.cleanup()
              def test_generation_is_full_context_system_synthesis(self):
                  self.svc.generate_scenarios(self.actor,{'case_id':self.case,'farm_id':self.farm['farm_id']})
                  rows=[]
                  for x in self.svc.repo.list_scenarios(self.farm['farm_id']):
                      rows.append(self.svc.evaluate_scenario(self.actor,{'case_id':self.case,'scenario_id':x['scenario_id'],'version':x['version']}))
                  scat=[x for x in rows if x['production']['species_set']==['Scatophagus argus']]
                  self.assertGreaterEqual(len(scat),2)
                  for x in scat:
                      p=x['production'];risk=x['risk'];trace=risk['decision_trace']
                      self.assertNotEqual('POLYCULTURE_POND',p['culture_method'])
                      self.assertEqual(650,p['area_basis']['usable_area_m2'])
                      self.assertEqual('CANAL',p['environment_strategy']['water_source'])
                      self.assertTrue(p['infrastructure_requirements'])
                      self.assertIn('species_configuration',p)
                      self.assertIn('harvest_target',p)
                      self.assertEqual({'CD-01','CD-02','CD-03','CD-04','CD-05','CD-06','CD-07','CD-08'},set(t['semantic'] for t in trace if t['semantic'].startswith('CD-')))
                      self.assertIn('synthesis',risk)
                      self.assertIn('evidence_level',x['market_pathway'])
                  w=AquacultureFarmerWorkspace(self.svc.repo).summary(self.farm['farm_id'])
                  first=w['scenarios'][0]
                  self.assertIn(' · ',first['name'])
                  self.assertTrue(first['decision_trace'])
                  self.assertIn('production_blueprint',first)
                  self.assertIn('economics',first)
                  self.assertIn('market',first)
                  self.assertIn('risks',first)

          if __name__=='__main__':unittest.main()
          ''')
          PY
          python3 -m py_compile bios_runtime/domains/aquaculture/services.py bios_runtime/domains/aquaculture/farmer_workspace.py bios_runtime/domains/aquaculture/synthesis.py
          python3 - <<'PY'
          from pathlib import Path
