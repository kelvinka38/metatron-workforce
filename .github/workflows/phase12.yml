name: Phase 12 (Historical Disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Historical lane is intentionally disabled
        shell: bash
        run: |
          set -euo pipefail
          echo 'HISTORICAL_EXECUTION=DISABLED'
          echo 'REASON=Historical phase acceptance is superseded by exact-SHA Highway build/runtime evidence.'
          echo 'REPLACEMENT=workforce-build + runtime-closure'
          echo 'SELF_HOSTED_RUNNER_REQUIRED=false'
