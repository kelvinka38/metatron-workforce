name: BIOS P10 Release Readiness (Highway Ingress)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enqueue:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Submit BIOS P10 release readiness to persistent Highway
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/highway-manual-ingress.sh 'bios-p10-release-readiness' '' '75'
