name: Proposal Before Approval Routing Selfhosted

on:
  push:
    branches: [fix/proposal-before-approval-routing]
    paths:
      - 'src/main/java/com/metatron/workforce/interaction/intelligence/**'
      - 'src/test/java/com/metatron/workforce/interaction/intelligence/**'
      - '.github/workflows/proposal-before-approval-routing-selfhosted.yml'

permissions:
  contents: read

concurrency:
  group: proposal-before-approval-routing-selfhosted
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Full repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean test bootJar --no-daemon --max-workers=1
          echo 'PROPOSAL_BEFORE_APPROVAL_FULL_SUITE=PASS'
