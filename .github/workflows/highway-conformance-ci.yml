name: Highway Conformance CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'deploy/docker-compose.yml'
      - 'src/main/java/com/metatron/workforce/interaction/channel/TelegramBotGateway.java'
      - 'src/main/java/com/metatron/workforce/interaction/tools/WebSearchToolAdapter.java'
      - 'src/main/java/com/metatron/workforce/interaction/intelligence/**'
      - 'src/main/java/com/metatron/workforce/execution/**'
      - 'src/main/java/com/metatron/workforce/action/**'
      - 'src/main/java/com/metatron/workforce/management/**'
      - 'src/test/java/com/metatron/workforce/interaction/intelligence/**'
      - 'src/test/java/com/metatron/workforce/execution/**'
      - 'src/test/java/com/metatron/workforce/architecture/**'
      - '.github/workflows/production-deploy.yml'
      - '.github/workflows/production-acceptance-highway-v2.yml'
      - '.github/workflows/intelligence-product-live-acceptance.yml'
      - '.github/workflows/runtime-conformance-point2.yml'
      - '.github/workflows/runtime-conformance-point4-production-acceptance.yml'
      - '.github/workflows/runtime-conformance-point4-read-production-acceptance.yml'
      - '.github/workflows/runtime-conformance-point5-production-acceptance.yml'
      - '.github/workflows/workforce-autonomy-p10-after-deploy.yml'
      - '.github/workflows/workforce-autonomy-p10-production-acceptance.yml'
      - '.github/workflows/workforce-autonomy-p10-gs3-gs4-production-acceptance.yml'
      - '.github/workflows/workforce-autonomy-p10-45-condition-ratification.yml'
      - '.github/workflows/gateway-director-live-acceptance.yml'
      - '.github/workflows/workforce-live-acceptance.yml'
      - '.github/workflows/production-worker-state-hygiene.yml'
      - '.github/workflows/ops-bootstrap-current-p10-ratification.yml'
      - '.github/workflows/founder-authorized-deep-p10-25b9a6b.yml'
      - '.github/workflows/ops-one-shot-p10-closure-71f2973.yml'
      - '.github/workflows/workforce-autonomy-p10-gs12-to-gs34.yml'
      - '.github/workflows/highway-conformance-ci.yml'
      - '.github/workflows/highway-execution-fabric-acceptance.yml'
      - 'highway/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: highway-conformance-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  topology:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Audit SoT mutation and execution workspace ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sot_enforcement/inventory.py
          echo 'SOT_ENFORCEMENT_PR_GATE=PASS'
      - name: Compile Gradle production and test sources
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean compileJava compileTestJava --no-daemon --max-workers=1
      - name: EE test ExecutionWorkspaceIsolationRegressionTest
        shell: bash
        run: ./gradlew test --tests 'com.metatron.workforce.runtime.execution.ExecutionWorkspaceIsolationRegressionTest' --no-daemon --max-workers=1
      - name: EE test ExecutionResourceManagerTest
        shell: bash
        run: ./gradlew test --tests 'com.metatron.workforce.runtime.execution.ExecutionResourceManagerTest' --no-daemon --max-workers=1
      - name: EE test ExecutionResourceSchedulerTest
        shell: bash
        run: ./gradlew test --tests 'com.metatron.workforce.runtime.execution.ExecutionResourceSchedulerTest' --no-daemon --max-workers=1
      - name: EE test ExecutionWorkspaceManagerTest
        shell: bash
        run: ./gradlew test --tests 'com.metatron.workforce.runtime.execution.ExecutionWorkspaceManagerTest' --no-daemon --max-workers=1
      - name: EE test HighwayResourceBridgeServiceTest
        shell: bash
        run: ./gradlew test --tests 'com.metatron.workforce.runtime.execution.HighwayResourceBridgeServiceTest' --no-daemon --max-workers=1
      - name: EE test RepositoryIntegrationControllerTest
        shell: bash
        run: ./gradlew test --tests 'com.metatron.workforce.runtime.execution.RepositoryIntegrationControllerTest' --no-daemon --max-workers=1
      - name: EE test ExecutionIsolationRecoveryTest
        shell: bash
        run: ./gradlew test --tests 'com.metatron.workforce.runtime.execution.ExecutionIsolationRecoveryTest' --no-daemon --max-workers=1
      - name: Diagnostic runtime package tests
        shell: bash
        run: ./gradlew test --tests 'com.metatron.workforce.runtime.*' --no-daemon --max-workers=1
      - name: Diagnostic management package tests
        shell: bash
        run: ./gradlew test --tests 'com.metatron.workforce.management.*' --no-daemon --max-workers=1
      - name: Diagnostic execution action deploy architecture tests
        shell: bash
        run: ./gradlew test --tests 'com.metatron.workforce.execution.*' --tests 'com.metatron.workforce.action.*' --tests 'com.metatron.workforce.deploy.*' --tests 'com.metatron.workforce.architecture.*' --no-daemon --max-workers=1
      - name: Diagnostic intelligence planning tests
        shell: bash
        run: ./gradlew test --tests '*ExecutionWorkPlanner*' --tests '*ExecutionPlanProposalService*' --tests '*FounderWorkerExecutionPlanningAcceptanceTest' --tests '*IntelligenceExecutionAdmissionServiceTest' --tests '*ApprovalDeferredExecutionRoutingTest' --tests '*FrontierSemanticExecutionWorkPlanTest' --tests '*IntelligencePlannerTest' --no-daemon --max-workers=1
      - name: Diagnostic intelligence frontier tests
        shell: bash
        run: ./gradlew test --tests '*FrontierSemantic*' --no-daemon --max-workers=1
      - name: Diagnostic intelligence fabric routing provider tests
        shell: bash
        run: ./gradlew test --tests '*IntelligenceFabric*' --tests '*Routing*' --tests '*Provider*' --tests '*CapacityAware*' --tests '*LatencyAware*' --tests '*FreshInformation*' --tests '*NoLegacy*' --tests '*RouterBacked*' --no-daemon --max-workers=1
      - name: Diagnostic intelligence cognitive depth case tests
        shell: bash
        run: ./gradlew test --tests '*CognitiveRuntime*' --tests '*IntelligenceDepth*' --tests '*IntelligenceCase*' --tests '*CurrentExternalCase*' --tests '*DeepInstitutional*' --no-daemon --max-workers=1
      - name: Diagnostic intelligence evidence knowledge institutional tests
        shell: bash
        run: ./gradlew test --tests '*Evidence*' --tests '*Knowledge*' --tests '*Bios*' --tests '*Institutional*' --tests '*WorkplaceIntelligence*' --tests '*IntelligenceOutcome*' --no-daemon --max-workers=1
      - name: Diagnostic interaction intelligence aggregate tests
        shell: bash
        run: ./gradlew test --tests 'com.metatron.workforce.interaction.intelligence.*' --no-daemon --max-workers=1
      - name: Diagnostic interaction channel tests
        shell: bash
        run: ./gradlew test --tests 'com.metatron.workforce.interaction.channel.*' --no-daemon --max-workers=1
      - name: Diagnostic interaction tools tests
        shell: bash
        run: ./gradlew test --tests 'com.metatron.workforce.interaction.tools.*' --no-daemon --max-workers=1
      - name: Diagnostic interaction llm tests
        shell: bash
        run: ./gradlew test --tests 'com.metatron.workforce.interaction.llm.*' --no-daemon --max-workers=1
      - name: Diagnostic interaction knowledge tests
        shell: bash
        run: ./gradlew test --tests 'com.metatron.workforce.interaction.knowledge.*' --no-daemon --max-workers=1
      - name: Diagnostic interaction routing memory evidence tests
        shell: bash
        run: ./gradlew test --tests 'com.metatron.workforce.interaction.routing.*' --tests 'com.metatron.workforce.interaction.memory.*' --tests 'com.metatron.workforce.interaction.evidence.*' --no-daemon --max-workers=1
      - name: Diagnostic interaction aggregate tests
        shell: bash
        run: ./gradlew test --tests 'com.metatron.workforce.interaction.*' --no-daemon --max-workers=1
      - name: Diagnostic workplace actor core observation work tests
        shell: bash
        run: ./gradlew test --tests 'com.metatron.workforce.workplace.*' --tests 'com.metatron.workforce.actor.*' --tests 'com.metatron.workforce.core.*' --tests 'com.metatron.workforce.observation.*' --tests 'com.metatron.workforce.work.*' --no-daemon --max-workers=1
      - name: Diagnostic phase and peripheral tests
        shell: bash
        run: ./gradlew test --tests 'com.metatron.workforce.phase3.*' --tests 'com.metatron.workforce.phase4.*' --tests 'com.metatron.workforce.phase5.*' --tests 'com.metatron.workforce.phase6.*' --tests 'com.metatron.workforce.phase7.*' --tests 'com.metatron.workforce.phase8.*' --tests 'com.metatron.workforce.phase9.*' --tests 'com.metatron.workforce.phase10.*' --tests 'com.metatron.workforce.phase11.*' --tests 'com.metatron.workforce.phase12.*' --tests 'com.metatron.workforce.operating.*' --tests 'com.metatron.workforce.gateway.*' --tests 'com.metatron.workforce.evidence.*' --tests 'com.metatron.workforce.adapter.telegram.*' --tests 'com.metatron.workforce.workers.audit.*' --tests 'com.metatron.workforce.deliberation.*' --tests 'com.metatron.workforce.bios.*' --tests 'com.metatron.workforce.WorkforceCompletionAcceptanceTest' --tests 'com.metatron.workforce.MetatronWorkforceApplicationStartupTest' --tests 'com.metatron.workforce.WorkforceOperationalDurabilityAcceptanceTest' --no-daemon --max-workers=1
      - name: Enforce full Gradle build gate
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew test bootJar --no-daemon --max-workers=1
          echo 'HIGHWAY_FULL_BUILD_PR_GATE=PASS'
      - name: Validate production compose topology
        shell: bash
        run: |
          set -euo pipefail
          METATRON_SANDBOX_TOKEN=compose-validation-only docker compose -f deploy/docker-compose.yml config >/dev/null
          echo 'HIGHWAY_COMPOSE_TOPOLOGY_PR_GATE=PASS'
      - name: Enforce consolidated PR contracts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/highway-tasks/pr-consolidated-contracts.sh
          echo 'HIGHWAY_CONSOLIDATED_PR_CONTRACTS=PASS'
      - name: Enforce single PR queue surface and fabric contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 highway/audit_workflow_queue_surface.py
          python3 -m unittest discover -s highway/tests -v
          python3 -m py_compile highway/highwayd.py highway/highwayctl.py highway/audit_workflow_queue_surface.py
          bash -n highway/install.sh highway/ensure-running.sh highway/publish-release.sh
          for script in scripts/highway-tasks/*.sh; do bash -n "$script"; done

          TMP_HIGHWAY=$(mktemp -d)
          cleanup_tmp_highway() { rm -rf "$TMP_HIGHWAY"; }
          trap cleanup_tmp_highway EXIT
          for n in 1 2 3 4; do
            METATRON_HIGHWAY_INSTALL_DIR="$TMP_HIGHWAY" \
              bash highway/publish-release.sh "$GITHUB_WORKSPACE" "$GITHUB_SHA" >"/tmp/highway-pr-publish-$n.log" 2>&1 &
          done
          wait
          test "$(cat "$TMP_HIGHWAY/releases/$GITHUB_SHA/.highway-source-sha")" = "$GITHUB_SHA"
          test -f "$TMP_HIGHWAY/releases/$GITHUB_SHA/scripts/highway-tasks/workforce-build.sh"
          test "$(find "$TMP_HIGHWAY/releases" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1
          SOURCE_HASH=$(sha256sum "$TMP_HIGHWAY/releases/$GITHUB_SHA/scripts/highway-tasks/workforce-build.sh")
          METATRON_HIGHWAY_INSTALL_DIR="$TMP_HIGHWAY" \
            bash highway/publish-release.sh "$GITHUB_WORKSPACE" "$GITHUB_SHA" >/tmp/highway-pr-republish.log
          test "$SOURCE_HASH" = "$(sha256sum "$TMP_HIGHWAY/releases/$GITHUB_SHA/scripts/highway-tasks/workforce-build.sh")"

          echo 'HIGHWAY_SINGLE_PR_SELF_HOSTED_GATE=PASS'
          echo 'HIGHWAY_QUEUE_SURFACE_AUDIT_STRICT=PASS'
          echo 'HIGHWAY_SCHEDULER_UNIT_CONTRACT=PASS'
          echo 'HIGHWAY_ATOMIC_IMMUTABLE_RELEASE_PUBLICATION=PASS'
      - name: Validate highway shells
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/production-acceptance-highway.sh
          bash -n scripts/highway-intelligence-lane.sh
          bash -n scripts/runtime-conformance-point2.sh
          bash -n scripts/runtime-conformance-point5.sh
          echo 'HIGHWAY_SHELLS=PASS'
      - name: Enforce persistent multi-executor Highway execution fabric
        shell: bash
        run: |
          set -euo pipefail
          D=.github/workflows/production-deploy.yml
          B=.github/workflows/bios-production-deploy.yml
          M=.github/workflows/meeting-real-worker-production-acceptance.yml
          G=.github/workflows/general-engineering-go1-production-acceptance.yml
          H=.github/workflows/production-acceptance-highway-v2.yml
          O=.github/workflows/work-observability-production-acceptance.yml
          C=.github/workflows/workplace-control-room-production-acceptance.yml
          Y=.github/workflows/production-worker-state-hygiene.yml
          REG=highway/task-registry.json
          DAEMON=highway/highwayd.py

          grep -q 'name: Highway Release Ingress' "$D"
          grep -q -- '--kind workforce-build' "$D"
          grep -q -- '--kind workforce-deploy' "$D"
          grep -q 'bash highway/install.sh "$GITHUB_WORKSPACE" "$GITHUB_SHA"' "$D"
          grep -q 'HIGHWAY_EXACT_CONTROL_PLANE_ACTIVE=PASS' "$D"
          ! grep -q './gradlew clean test bootJar' "$D"
          ! grep -q 'docker compose' "$D"

          for wf in "$B" "$M" "$G" "$H" "$O" "$C" "$Y"; do
            grep -q 'highwayctl.py' "$wf"
            ! grep -q 'workflow_run:' "$wf"
          done

          grep -q 'ThreadPoolExecutor' "$DAEMON"
          grep -q 'journal_mode=WAL' "$DAEMON"
          grep -q 'lease_expires_at' "$DAEMON"
          grep -q 'heartbeat_at' "$DAEMON"
          grep -q 'resource_conflicts' "$DAEMON"
          grep -q 'dependencies_json' "$DAEMON"
          grep -q 'resource_locks' "$DAEMON"

          python3 - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('highway/task-registry.json').read_text())['tasks']
          required={
              'workforce-build','workforce-deploy','production-highway-fast',
              'work-observability','control-room-fast','bios-deploy',
              'meeting-real-worker','general-engineering-go1',
              'production-highway-full','worker-state-hygiene','runtime-closure'
          }
          assert required <= set(reg), required-set(reg)
          def resources(kind):
              return {(x['name'],x['mode']) for x in reg[kind].get('resources',[])}
          assert ('prod:workforce','WRITE') in resources('workforce-deploy')
          assert ('prod:bios','WRITE') in resources('bios-deploy')
          assert ('prod:workforce','READ') in resources('meeting-real-worker')
          assert ('state:meeting','WRITE') in resources('meeting-real-worker')
          assert ('prod:workforce','READ') in resources('production-highway-fast')
          assert ('prod:workforce','READ') in resources('work-observability')
          assert ('prod:workforce','READ') in resources('control-room-fast')
          fanout=set(reg['workforce-deploy'].get('on_success',[]))
          assert {'production-highway-fast','work-observability','control-room-fast','runtime-closure'} <= fanout
          assert ('prod:workforce','READ') in resources('runtime-closure')
          print('HIGHWAY_PERSISTENT_SCHEDULER_CONTRACT=PASS')
          print('HIGHWAY_RESOURCE_AWARE_LOCKING_CONTRACT=PASS')
          print('HIGHWAY_MULTI_EXECUTOR_CONTRACT=PASS')
          print('HIGHWAY_POST_DEPLOY_PARALLEL_FANOUT_CONTRACT=PASS')
          print('HIGHWAY_NATIVE_RUNTIME_CLOSURE_CONTRACT=PASS')
          print('HIGHWAY_GITHUB_INGRESS_ONLY_CONTRACT=PASS')
          PY

          echo 'HIGHWAY_ZERO_UNNECESSARY_QUEUE_CONTRACT=PASS'
      - name: Verify bounded execution planning recovery contract
        shell: bash
        run: |
          set -euo pipefail
          P=src/main/java/com/metatron/workforce/interaction/intelligence/ExecutionWorkPlanner.java
          T=src/test/java/com/metatron/workforce/interaction/intelligence/ExecutionWorkPlannerTest.java
          H=scripts/production-acceptance-highway.sh
          grep -q 'deterministicSingleRepositoryAudit' "$P"
          grep -q 'reconcileSingleRepositoryAudit' "$P"
          grep -q 'Never use `cross-repository-audit-analysis` for a single-repository audit' "$P"
          grep -q 'boundedSingleRepositoryAuditCanPlanWithoutExternalProvider' "$T"
          grep -q 'providerlessPlannerStillFailsClosedOutsideBoundedAuditShape' "$T"
          grep -q 'w=d.get.*autonomousWork' "$H"
          grep -q 'flock 9' "$H"
          echo 'HIGHWAY_BOUNDED_PLANNING_FALLBACK=PASS'
          echo 'HIGHWAY_PLANNING_CAPACITY_SERIALIZATION_CONTRACT=PASS'
      - name: Validate canonical production defaults
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f deploy/docker-compose.yml config --format json > /tmp/live.json
          python3 - /tmp/live.json <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); w=d['services']['workforce']; p=w['ports'][0]
          assert str(p['published'])=='8080' and str(p['target'])=='8080' and p['host_ip']=='127.0.0.1',p
          assert d['volumes']['workforce-state']['name']=='metatron-workforce-state'
          assert d['volumes']['workforce-objective-workspaces']['name']=='metatron-workforce-objective-workspaces'
          assert d['volumes']['workforce-execution-workspaces']['name']=='metatron-workforce-execution-workspaces'
          assert d['networks']['workforce']['name']=='metatron-workforce'
          assert d['networks']['gateway']['name']=='metatron-gateway-online'
          assert w['environment']['TELEGRAM_API_BASE_URL']=='https://api.telegram.org'
          print('HIGHWAY_CANONICAL_DEFAULTS=PASS')
          PY
      - name: Prove two isolated destructive lane configs do not collide
        shell: bash
        run: |
          set -euo pipefail
          METATRON_HOST_PORT=18111 METATRON_STATE_VOLUME_NAME=highway-test-a-state METATRON_WORKSPACE_VOLUME_NAME=highway-test-a-objective-workspaces METATRON_EXECUTION_WORKSPACE_VOLUME_NAME=highway-test-a-execution-workspaces METATRON_WORKFORCE_NETWORK_NAME=highway-test-a-network METATRON_WORKFORCE_GATEWAY_ALIAS=workforce-highway-test-a TELEGRAM_API_BASE_URL=http://host.docker.internal:19111 docker compose -p highway-test-a -f deploy/docker-compose.yml config --format json > /tmp/a.json
          METATRON_HOST_PORT=18222 METATRON_STATE_VOLUME_NAME=highway-test-b-state METATRON_WORKSPACE_VOLUME_NAME=highway-test-b-objective-workspaces METATRON_EXECUTION_WORKSPACE_VOLUME_NAME=highway-test-b-execution-workspaces METATRON_WORKFORCE_NETWORK_NAME=highway-test-b-network METATRON_WORKFORCE_GATEWAY_ALIAS=workforce-highway-test-b TELEGRAM_API_BASE_URL=http://host.docker.internal:19222 docker compose -p highway-test-b -f deploy/docker-compose.yml config --format json > /tmp/b.json
          python3 - /tmp/a.json /tmp/b.json <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1])); b=json.load(open(sys.argv[2]))
          def f(d):
            w=d['services']['workforce']; p=w['ports'][0]
            return (str(p['published']),d['volumes']['workforce-state']['name'],d['volumes']['workforce-objective-workspaces']['name'],d['volumes']['workforce-execution-workspaces']['name'],d['networks']['workforce']['name'],w['environment']['TELEGRAM_API_BASE_URL'],tuple(w['networks']['gateway'].get('aliases',[])))
          fa,fb=f(a),f(b); assert fa!=fb
          assert fa[0]=='18111' and fb[0]=='18222'; assert fa[1]!=fb[1] and fa[2]!=fb[2] and fa[3]!=fb[3] and fa[4]!=fb[4] and fa[5]!=fb[5] and fa[6]!=fb[6]; assert fa[2]=='highway-test-a-objective-workspaces' and fb[2]=='highway-test-b-objective-workspaces'; assert fa[3]=='highway-test-a-execution-workspaces' and fb[3]=='highway-test-b-execution-workspaces'
          print('HIGHWAY_CONFIG_ISOLATION=PASS')
          PY
      - name: Verify grounded search and provider isolation remain explicit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'TELEGRAM_API_BASE_URL' src/main/java/com/metatron/workforce/interaction/channel/TelegramBotGateway.java
          grep -q 'https://api.telegram.org' src/main/java/com/metatron/workforce/interaction/channel/TelegramBotGateway.java
          grep -q 'google_search' src/main/java/com/metatron/workforce/interaction/tools/WebSearchToolAdapter.java
          grep -q 'groundingChunks' src/main/java/com/metatron/workforce/interaction/tools/WebSearchToolAdapter.java
          grep -q 'looksLikeInsufficientAnswer' src/main/java/com/metatron/workforce/interaction/tools/WebSearchToolAdapter.java
          echo 'HIGHWAY_PROVIDER_ISOLATION_WITH_REAL_DEFAULT=PASS'
          echo 'POINT2_GROUNDED_SEARCH_CONTRACT=PASS'
