name: Highway Conformance CI

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'deploy/docker-compose.yml'
      - 'src/main/java/com/metatron/workforce/interaction/channel/TelegramBotGateway.java'
      - 'src/main/java/com/metatron/workforce/interaction/tools/WebSearchToolAdapter.java'
      - 'src/main/java/com/metatron/workforce/interaction/intelligence/**'
      - 'src/test/java/com/metatron/workforce/interaction/intelligence/**'
      - '.github/workflows/production-deploy.yml'
      - '.github/workflows/production-acceptance-highway-v2.yml'
      - '.github/workflows/intelligence-product-live-acceptance.yml'
      - '.github/workflows/runtime-conformance-point2.yml'
      - '.github/workflows/runtime-conformance-point4-production-acceptance.yml'
      - '.github/workflows/runtime-conformance-point4-read-production-acceptance.yml'
      - '.github/workflows/runtime-conformance-point5-production-acceptance.yml'
      - '.github/workflows/workforce-autonomy-p10-after-deploy.yml'
      - '.github/workflows/workforce-autonomy-p10-production-acceptance.yml'
      - '.github/workflows/workforce-autonomy-p10-gs3-gs4-production-acceptance.yml'
      - '.github/workflows/workforce-autonomy-p10-45-condition-ratification.yml'
      - '.github/workflows/gateway-director-live-acceptance.yml'
      - '.github/workflows/highway-conformance-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  topology:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate highway shells
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/production-acceptance-highway.sh
          bash -n scripts/highway-intelligence-lane.sh
          bash -n scripts/runtime-conformance-point2.sh
          bash -n scripts/runtime-conformance-point5.sh
          echo 'HIGHWAY_SHELLS=PASS'
      - name: Enforce one automatic latest-SHA production lane
        shell: bash
        run: |
          set -euo pipefail
          H=.github/workflows/production-acceptance-highway-v2.yml
          D=.github/workflows/production-deploy.yml
          P4=.github/workflows/runtime-conformance-point4-production-acceptance.yml
          P4R=.github/workflows/runtime-conformance-point4-read-production-acceptance.yml
          P5=.github/workflows/runtime-conformance-point5-production-acceptance.yml
          P10C=.github/workflows/workforce-autonomy-p10-after-deploy.yml
          P10GS12=.github/workflows/workforce-autonomy-p10-production-acceptance.yml
          P10GS34=.github/workflows/workforce-autonomy-p10-gs3-gs4-production-acceptance.yml
          P10R=.github/workflows/workforce-autonomy-p10-45-condition-ratification.yml
          GDIR=.github/workflows/gateway-director-live-acceptance.yml

          grep -q 'workflows: \["Highway Production Deploy"\]' "$H"
          ! grep -q 'workflow_run:' .github/workflows/intelligence-product-live-acceptance.yml
          ! grep -q 'workflow_run:' .github/workflows/runtime-conformance-point2.yml
          ! grep -q 'workflow_run:' "$P4"
          ! grep -q 'workflow_run:' "$P4R"
          ! grep -q 'workflow_run:' "$P5"
          grep -q 'workflow_dispatch:' "$P4"
          grep -q 'workflow_dispatch:' "$P4R"
          grep -q 'workflow_dispatch:' "$P5"
          ! grep -q 'workflow_run:' "$P10C"
          ! grep -q '^  push:' "$P10C"
          grep -q 'workflow_dispatch:' "$P10C"
          grep -q 'cancel-in-progress: true' "$P10C"
          grep -q 'P10_RATIFICATION_ON_DEMAND=PASS' "$P10C"
          ! grep -q 'workflow_run:' "$P10GS12"
          ! grep -q 'workflow_run:' "$P10GS34"
          ! grep -q 'workflow_run:' "$P10R"
          grep -q 'group: metatron-production-lane' "$P10GS12"
          grep -q 'group: metatron-production-lane' "$P10GS34"
          grep -q 'group: metatron-production-lane' "$P10R"
          grep -q 'runs-on: ubuntu-latest' "$P10R"
          grep -q 'group: metatron-production-lane' "$GDIR"

          grep -q 'HIGHWAY_REVISION: single-production-lane-' "$H"
          grep -q 'group: metatron-production-lane' "$H"
          grep -q 'cancel-in-progress: true' "$H"
          grep -q 'group: metatron-production-lane' "$D"
          grep -q 'cancel-in-progress: true' "$D"

          grep -q "scripts/production-acceptance-highway.sh" "$H"
          grep -q "scripts/highway-intelligence-lane.sh" "$H"
          grep -q "scripts/runtime-conformance-point2.sh" "$H"
          grep -q "scripts/runtime-conformance-point5.sh" "$H"
          grep -q "scripts/runtime-conformance-point5.sh" "$P5"
          ! grep -Eq 'production-acceptance-highway\.sh.*&|highway-intelligence-lane\.sh.*&|runtime-conformance-point2\.sh.*&|runtime-conformance-point5\.sh.*&' "$H"

          python3 - <<'PY'
          from pathlib import Path
          deploy=Path('.github/workflows/production-deploy.yml').read_text()
          h=Path('.github/workflows/production-acceptance-highway-v2.yml').read_text()
          positions=[
              h.index('scripts/production-acceptance-highway.sh >'),
              h.index('scripts/highway-intelligence-lane.sh >'),
              h.index('scripts/runtime-conformance-point2.sh >'),
              h.index('scripts/runtime-conformance-point5.sh >'),
          ]
          assert positions==sorted(positions) and len(set(positions))==4,positions
          build=deploy.split('  deploy-production:',1)[0]
          deploy_job='  deploy-production:'+deploy.split('  deploy-production:',1)[1]
          assert 'group: metatron-hosted-build-main' in build and 'cancel-in-progress: true' in build
          assert 'group: metatron-production-lane' in deploy_job and 'cancel-in-progress: true' in deploy_job
          assert 'group: metatron-production-lane' in h and 'cancel-in-progress: true' in h
          assert 'actions/cache/save@v4' in build
          assert 'actions/cache/restore@v4' in deploy_job
          assert 'fail-on-cache-miss: true' in deploy_job
          assert 'PRODUCTION_EXACT_TESTED_ARTIFACT_HANDOFF=PASS' in deploy_job
          assert './gradlew clean test bootJar' not in deploy_job
          assert "      - 'scripts/**'" not in deploy
          assert 'workforce-autonomy-p10-production-acceptance.yml' not in deploy
          print('HIGHWAY_TESTED_CACHE_HANDOFF=PASS')
          print('HIGHWAY_TESTED_ARTIFACT_HANDOFF=PASS')
          print('HIGHWAY_RUNTIME_ONLY_DEPLOY_TRIGGER=PASS')
          print('HIGHWAY_CAPACITY_PHASE_ORDER=PASS')
          print('HIGHWAY_LATEST_SHA_WINS_POLICY=PASS')
          print('HIGHWAY_RATIFIED_POINT_WORKFLOWS_MANUAL_ONLY=PASS')
          PY
          echo 'HIGHWAY_SINGLE_AUTO_ORCHESTRATOR=PASS'
          echo 'HIGHWAY_DEEP_RATIFICATION_ON_DEMAND=PASS'
          echo 'HIGHWAY_PREEMPTS_STALE_RATIFICATION=PASS'
          echo 'P10_DUPLICATE_AUTOTRIGGERS_REMOVED=PASS'
          echo 'HIGHWAY_NO_STANDALONE_PROD_QUEUE_FANOUT=PASS'
      - name: Verify bounded execution planning recovery contract
        shell: bash
        run: |
          set -euo pipefail
          P=src/main/java/com/metatron/workforce/interaction/intelligence/ExecutionWorkPlanner.java
          T=src/test/java/com/metatron/workforce/interaction/intelligence/ExecutionWorkPlannerTest.java
          H=scripts/production-acceptance-highway.sh
          grep -q 'deterministicSingleRepositoryAudit' "$P"
          grep -q 'reconcileSingleRepositoryAudit' "$P"
          grep -q 'Never use `cross-repository-audit-analysis` for a single-repository audit' "$P"
          grep -q 'boundedSingleRepositoryAuditCanPlanWithoutExternalProvider' "$T"
          grep -q 'providerlessPlannerStillFailsClosedOutsideBoundedAuditShape' "$T"
          grep -q 'w=d.get.*autonomousWork' "$H"
          grep -q 'flock 9' "$H"
          echo 'HIGHWAY_BOUNDED_PLANNING_FALLBACK=PASS'
          echo 'HIGHWAY_PLANNING_CAPACITY_SERIALIZATION_CONTRACT=PASS'
      - name: Validate canonical production defaults
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f deploy/docker-compose.yml config --format json > /tmp/live.json
          python3 - /tmp/live.json <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); w=d['services']['workforce']; p=w['ports'][0]
          assert str(p['published'])=='8080' and str(p['target'])=='8080' and p['host_ip']=='127.0.0.1',p
          assert d['volumes']['workforce-state']['name']=='metatron-workforce-state'
          assert d['networks']['workforce']['name']=='metatron-workforce'
          assert d['networks']['gateway']['name']=='metatron-gateway-online'
          assert w['environment']['TELEGRAM_API_BASE_URL']=='https://api.telegram.org'
          print('HIGHWAY_CANONICAL_DEFAULTS=PASS')
          PY
      - name: Prove two isolated destructive lane configs do not collide
        shell: bash
        run: |
          set -euo pipefail
          METATRON_HOST_PORT=18111 METATRON_STATE_VOLUME_NAME=highway-test-a-state METATRON_WORKFORCE_NETWORK_NAME=highway-test-a-network METATRON_WORKFORCE_GATEWAY_ALIAS=workforce-highway-test-a TELEGRAM_API_BASE_URL=http://host.docker.internal:19111 docker compose -p highway-test-a -f deploy/docker-compose.yml config --format json > /tmp/a.json
          METATRON_HOST_PORT=18222 METATRON_STATE_VOLUME_NAME=highway-test-b-state METATRON_WORKFORCE_NETWORK_NAME=highway-test-b-network METATRON_WORKFORCE_GATEWAY_ALIAS=workforce-highway-test-b TELEGRAM_API_BASE_URL=http://host.docker.internal:19222 docker compose -p highway-test-b -f deploy/docker-compose.yml config --format json > /tmp/b.json
          python3 - /tmp/a.json /tmp/b.json <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1])); b=json.load(open(sys.argv[2]))
          def f(d):
            w=d['services']['workforce']; p=w['ports'][0]
            return (str(p['published']),d['volumes']['workforce-state']['name'],d['networks']['workforce']['name'],w['environment']['TELEGRAM_API_BASE_URL'],tuple(w['networks']['gateway'].get('aliases',[])))
          fa,fb=f(a),f(b); assert fa!=fb
          assert fa[0]=='18111' and fb[0]=='18222'; assert fa[1]!=fb[1] and fa[2]!=fb[2] and fa[3]!=fb[3] and fa[4]!=fb[4]
          print('HIGHWAY_CONFIG_ISOLATION=PASS')
          PY
      - name: Verify grounded search and provider isolation remain explicit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'TELEGRAM_API_BASE_URL' src/main/java/com/metatron/workforce/interaction/channel/TelegramBotGateway.java
          grep -q 'https://api.telegram.org' src/main/java/com/metatron/workforce/interaction/channel/TelegramBotGateway.java
          grep -q 'google_search' src/main/java/com/metatron/workforce/interaction/tools/WebSearchToolAdapter.java
          grep -q 'groundingChunks' src/main/java/com/metatron/workforce/interaction/tools/WebSearchToolAdapter.java
          grep -q 'looksLikeInsufficientAnswer' src/main/java/com/metatron/workforce/interaction/tools/WebSearchToolAdapter.java
          echo 'HIGHWAY_PROVIDER_ISOLATION_WITH_REAL_DEFAULT=PASS'
          echo 'POINT2_GROUNDED_SEARCH_CONTRACT=PASS'
