name: Highway Conformance CI

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'deploy/docker-compose.yml'
      - 'src/main/java/com/metatron/workforce/interaction/channel/TelegramBotGateway.java'
      - '.github/workflows/production-deploy.yml'
      - '.github/workflows/production-acceptance-highway-v2.yml'
      - '.github/workflows/intelligence-product-live-acceptance.yml'
      - '.github/workflows/runtime-conformance-point2.yml'
      - '.github/workflows/highway-conformance-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  topology:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate highway shells
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/production-acceptance-highway.sh
          bash -n scripts/highway-intelligence-lane.sh
          bash -n scripts/runtime-conformance-point2.sh
          echo 'HIGHWAY_SHELLS=PASS'
      - name: Enforce one automatic production acceptance orchestrator
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'workflows: \["Highway Production Deploy"\]' .github/workflows/production-acceptance-highway-v2.yml
          ! grep -q 'workflow_run:' .github/workflows/intelligence-product-live-acceptance.yml
          ! grep -q 'workflow_run:' .github/workflows/runtime-conformance-point2.yml
          grep -q "scripts/production-acceptance-highway.sh" .github/workflows/production-acceptance-highway-v2.yml
          grep -q "scripts/highway-intelligence-lane.sh" .github/workflows/production-acceptance-highway-v2.yml
          grep -q "scripts/runtime-conformance-point2.sh" .github/workflows/production-acceptance-highway-v2.yml
          ! grep -Eq 'PID=\$\(run_lane|PID=\$\([^)]*&' .github/workflows/production-acceptance-highway-v2.yml
          grep -q -- "- 'scripts/\*\*'" .github/workflows/production-deploy.yml
          echo 'HIGHWAY_SINGLE_AUTO_ORCHESTRATOR=PASS'
          echo 'HIGHWAY_NO_STANDALONE_PROD_QUEUE_FANOUT=PASS'
      - name: Validate canonical production defaults
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f deploy/docker-compose.yml config --format json > /tmp/live.json
          python3 - /tmp/live.json <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); w=d['services']['workforce']
          p=w['ports'][0]
          assert str(p['published'])=='8080' and str(p['target'])=='8080' and p['host_ip']=='127.0.0.1', p
          assert d['volumes']['workforce-state']['name']=='metatron-workforce-state'
          assert d['networks']['workforce']['name']=='metatron-workforce'
          assert d['networks']['gateway']['name']=='metatron-gateway-online'
          assert w['environment']['TELEGRAM_API_BASE_URL']=='https://api.telegram.org'
          print('HIGHWAY_CANONICAL_DEFAULTS=PASS')
          PY
      - name: Prove two isolated lane configs do not collide
        shell: bash
        run: |
          set -euo pipefail
          METATRON_HOST_PORT=18111 \
          METATRON_STATE_VOLUME_NAME=highway-test-a-state \
          METATRON_WORKFORCE_NETWORK_NAME=highway-test-a-network \
          METATRON_WORKFORCE_GATEWAY_ALIAS=workforce-highway-test-a \
          TELEGRAM_API_BASE_URL=http://host.docker.internal:19111 \
          docker compose -p highway-test-a -f deploy/docker-compose.yml config --format json > /tmp/lane-a.json

          METATRON_HOST_PORT=18222 \
          METATRON_STATE_VOLUME_NAME=highway-test-b-state \
          METATRON_WORKFORCE_NETWORK_NAME=highway-test-b-network \
          METATRON_WORKFORCE_GATEWAY_ALIAS=workforce-highway-test-b \
          TELEGRAM_API_BASE_URL=http://host.docker.internal:19222 \
          docker compose -p highway-test-b -f deploy/docker-compose.yml config --format json > /tmp/lane-b.json

          python3 - /tmp/lane-a.json /tmp/lane-b.json <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1])); b=json.load(open(sys.argv[2]))
          def facts(d):
              w=d['services']['workforce']; p=w['ports'][0]
              return {
                  'port':str(p['published']), 'host':p['host_ip'],
                  'volume':d['volumes']['workforce-state']['name'],
                  'network':d['networks']['workforce']['name'],
                  'telegram':w['environment']['TELEGRAM_API_BASE_URL'],
                  'aliases':tuple(w['networks']['gateway'].get('aliases',[])),
              }
          fa,fb=facts(a),facts(b)
          assert fa['host']==fb['host']=='127.0.0.1'
          assert fa['port']=='18111' and fb['port']=='18222', (fa,fb)
          assert fa['volume']=='highway-test-a-state' and fb['volume']=='highway-test-b-state', (fa,fb)
          assert fa['network']=='highway-test-a-network' and fb['network']=='highway-test-b-network', (fa,fb)
          assert fa['telegram'].endswith(':19111') and fb['telegram'].endswith(':19222'), (fa,fb)
          assert 'workforce-highway-test-a' in fa['aliases'] and 'workforce-highway-test-b' in fb['aliases'], (fa,fb)
          for key in ('port','volume','network','telegram','aliases'): assert fa[key] != fb[key], (key,fa,fb)
          print('HIGHWAY_CONFIG_ISOLATION=PASS')
          PY
      - name: Verify acceptance provider override remains opt-in
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'TELEGRAM_API_BASE_URL' src/main/java/com/metatron/workforce/interaction/channel/TelegramBotGateway.java
          grep -q 'https://api.telegram.org' src/main/java/com/metatron/workforce/interaction/channel/TelegramBotGateway.java
          echo 'HIGHWAY_PROVIDER_ISOLATION_WITH_REAL_DEFAULT=PASS'
