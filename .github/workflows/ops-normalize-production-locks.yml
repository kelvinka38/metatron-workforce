name: Normalize Production Workflow Locks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-normalize-production-locks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Normalize self-hosted production workflow locks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.github/workflows')
          changed = []
          skipped_without_lock = []

          for path in sorted(root.glob('*.yml')):
              if path.name == 'ops-normalize-production-locks.yml':
                  continue
              text = path.read_text()
              if 'metatron-prod' not in text:
                  continue

              # Any workflow executing on the single live production runner is part of the
              # same mutable production state boundary. Existing per-workflow concurrency
              # groups are unsafe once CI capacity is separated from that runner.
              pattern = re.compile(
                  r'(?m)^concurrency:\n'
                  r'(?P<body>(?:^[ \t]+.*\n){1,4})'
              )
              match = pattern.search(text)
              if not match:
                  skipped_without_lock.append(str(path))
                  continue

              body = match.group('body')
              if 'group:' not in body:
                  skipped_without_lock.append(str(path))
                  continue

              replacement = (
                  'concurrency:\n'
                  '  group: metatron-production-state\n'
                  '  cancel-in-progress: false\n'
              )
              updated = text[:match.start()] + replacement + text[match.end():]
              if updated != text:
                  path.write_text(updated)
                  changed.append(str(path))

          print('CHANGED_WORKFLOWS=' + str(len(changed)))
          for item in changed:
              print('CHANGED=' + item)
          for item in skipped_without_lock:
              print('NO_EXISTING_LOCK=' + item)
          PY

      - name: Verify production workflows share the global lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          failures=[]
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              if path.name == 'ops-normalize-production-locks.yml':
                  continue
              text=path.read_text()
              if 'metatron-prod' not in text:
                  continue
              if 'concurrency:' in text:
                  if 'group: metatron-production-state' not in text:
                      failures.append(f'{path}:wrong_group')
                  if 'cancel-in-progress: true' in text:
                      failures.append(f'{path}:cancels_in_progress')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('PRODUCTION_LOCK_NORMALIZATION=PASS')
          PY

      - name: Commit normalized locks
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'NO_LOCK_CHANGES_REQUIRED'
            exit 0
          fi
          git config user.name 'metatron-infra-bot'
          git config user.email 'metatron-infra-bot@users.noreply.github.com'
          git add .github/workflows/*.yml
          git commit -m 'ci: serialize workflows that touch live production state'
          git push origin HEAD:main
