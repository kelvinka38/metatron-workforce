name: Aquaculture v4 BIOS Candidate Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-bios-candidate:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 20
    steps:
      - name: Patch candidate locally, run suite, then publish parse fix
        shell: bash
        env:
          BIOS_BRANCH: fix/aquaculture-product-correctness-v4
          BIOS_SHA: 40f7f48ad7ab8ecb8253aea1d2fe0ffc41a7e515
        run: |
          set -euo pipefail
          BASE=/opt/metatron/metatron-workforce
          test -r "$BASE/.env"
          set -a
          source "$BASE/.env"
          set +a
          test -n "${GITHUB_TOKEN:-}"
          STAGE=$(mktemp -d /tmp/aq-v4-candidate.XXXXXX)
          trap 'rm -rf "$STAGE"' EXIT
          curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/kelvinka38/bios/tarball/$BIOS_SHA" \
            | tar -xz -C "$STAGE" --strip-components=1
          cd "$STAGE"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('bios_runtime/domains/aquaculture/web/app.js')
          s=p.read_text()
          bad='UNRESOLVED_UNTIL_FARM/CYCLE_EVIDENCE:'
          good='"UNRESOLVED_UNTIL_FARM/CYCLE_EVIDENCE":'
          assert bad in s, 'expected parse bug is no longer present at candidate SHA'
          p.write_text(s.replace(bad,good))
          PY
          node --check bios_runtime/domains/aquaculture/web/app.js
          python3 -m unittest discover -s tests -v
          echo "AQUACULTURE_V4_PATCHED_SUITE=PASS base_sha=$BIOS_SHA"
          META=$(curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/kelvinka38/bios/contents/bios_runtime/domains/aquaculture/web/app.js?ref=$BIOS_BRANCH")
          FILE_SHA=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])' <<<"$META")
          python3 - "$FILE_SHA" "$BIOS_BRANCH" <<'PY' >/tmp/aq-v4-app-update.json
          import base64,json,sys
          from pathlib import Path
          sha,branch=sys.argv[1:]
          print(json.dumps({
            'message':'fix(aquaculture): restore farmer UI JavaScript parseability',
            'content':base64.b64encode(Path('bios_runtime/domains/aquaculture/web/app.js').read_bytes()).decode(),
            'sha':sha,
            'branch':branch,
          }))
          PY
          curl -fsSL -X PUT \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/aq-v4-app-update.json \
            "https://api.github.com/repos/kelvinka38/bios/contents/bios_runtime/domains/aquaculture/web/app.js" \
            >/tmp/aq-v4-app-update-response.json
          NEW_SHA=$(python3 -c 'import json; print(json.load(open("/tmp/aq-v4-app-update-response.json"))["commit"]["sha"])')
          echo "AQUACULTURE_V4_UI_FIX_PUBLISHED=PASS sha=$NEW_SHA"
