name: Aquaculture v4 BIOS Candidate Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-bios-candidate:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 20
    steps:
      - name: Repair branch parse bug and run complete BIOS suite
        shell: bash
        run: |
          set -euo pipefail
          BASE=/opt/metatron/metatron-workforce
          test -r "$BASE/.env"
          set -a
          source "$BASE/.env"
          set +a
          test -n "${GITHUB_TOKEN:-}"
          STAGE=$(mktemp -d /tmp/aq-v4-candidate.XXXXXX)
          trap 'rm -rf "$STAGE"' EXIT
          git -c http.extraHeader="Authorization: Bearer $GITHUB_TOKEN" clone --quiet --single-branch --branch fix/aquaculture-product-correctness-v4 https://github.com/kelvinka38/bios.git "$STAGE"
          cd "$STAGE"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('bios_runtime/domains/aquaculture/web/app.js')
          s=p.read_text()
          bad='UNRESOLVED_UNTIL_FARM/CYCLE_EVIDENCE:'
          good='"UNRESOLVED_UNTIL_FARM/CYCLE_EVIDENCE":'
          if bad in s:
              p.write_text(s.replace(bad,good))
          PY
          if ! git diff --quiet; then
            git config user.name 'Metatron Selfhosted'
            git config user.email 'metatron@localhost'
            git add bios_runtime/domains/aquaculture/web/app.js
            git commit -m 'fix(aquaculture): restore farmer UI JavaScript parseability'
            git -c http.extraHeader="Authorization: Bearer $GITHUB_TOKEN" push origin HEAD:fix/aquaculture-product-correctness-v4
          fi
          BIOS_SHA=$(git rev-parse HEAD)
          echo "BIOS_CANDIDATE_SHA=$BIOS_SHA"
          node --check bios_runtime/domains/aquaculture/web/app.js
          python3 -m unittest discover -s tests -v
          echo "AQUACULTURE_V4_EXACT_SHA_TEST=PASS sha=$BIOS_SHA"
