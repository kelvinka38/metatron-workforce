name: Aquaculture v4 BIOS Candidate Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-bios-candidate:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 20
    steps:
      - name: Fetch and test exact BIOS candidate SHA
        shell: bash
        env:
          BIOS_SHA: 40f7f48ad7ab8ecb8253aea1d2fe0ffc41a7e515
        run: |
          set -euo pipefail
          BASE=/opt/metatron/metatron-workforce
          test -r "$BASE/.env"
          set -a
          source "$BASE/.env"
          set +a
          test -n "${GITHUB_TOKEN:-}"
          [[ "$BIOS_SHA" =~ ^[0-9a-f]{40}$ ]]
          STAGE=$(mktemp -d /tmp/aq-v4-candidate.XXXXXX)
          trap 'rm -rf "$STAGE"' EXIT
          curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/kelvinka38/bios/tarball/$BIOS_SHA" \
            | tar -xz -C "$STAGE" --strip-components=1
          cd "$STAGE"
          echo "BIOS_CANDIDATE_SHA=$BIOS_SHA"
          python3 -m unittest discover -s tests -v
          echo 'AQUACULTURE_V4_EXACT_SHA_TEST=PASS'
