name: Aquaculture v4 Deploy Contract Update

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  update-deploy-contract:
    runs-on: [self-hosted, linux, x64, metatron-prod]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish deploy-contract update
        shell: bash
        env:
          TARGET_BRANCH: ops/validate-aquaculture-product-v4
        run: |
          set -euo pipefail
          BASE=/opt/metatron/metatron-workforce
          test -r "$BASE/.env"
          set -a
          source "$BASE/.env"
          set +a
          test -n "${GITHUB_TOKEN:-}"
          python3 ops/patch_aq_v4_deploy.py scripts/highway-tasks/bios-deploy.sh /tmp/bios-deploy-v4.sh
          bash -n /tmp/bios-deploy-v4.sh
          API="https://api.github.com/repos/kelvinka38/metatron-workforce/contents/scripts/highway-tasks/bios-deploy.sh?ref=$TARGET_BRANCH"
          META=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' "$API")
          FILE_SHA=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])' <<<"$META")
          python3 - "$FILE_SHA" "$TARGET_BRANCH" <<'PY' >/tmp/bios-deploy-update.json
          import base64,json,sys
          sha,branch=sys.argv[1:]
          content=open('/tmp/bios-deploy-v4.sh','rb').read()
          print(json.dumps({
              'message':'fix(aquaculture): align deploy acceptance with v4 decision product',
              'content':base64.b64encode(content).decode(),
              'sha':sha,
              'branch':branch,
          }))
          PY
          CURRENT=$(python3 -c 'import base64,json,sys; print(base64.b64decode(json.load(sys.stdin)["content"]).decode(),end="")' <<<"$META")
          if [ "$CURRENT" = "$(cat /tmp/bios-deploy-v4.sh)" ]; then
            echo 'AQ_V4_DEPLOY_CONTRACT_ALREADY_CURRENT=PASS'
            exit 0
          fi
          curl -fsSL -X PUT \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/bios-deploy-update.json \
            'https://api.github.com/repos/kelvinka38/metatron-workforce/contents/scripts/highway-tasks/bios-deploy.sh' \
            >/tmp/bios-deploy-update-response.json
          NEW_SHA=$(python3 -c 'import json; print(json.load(open("/tmp/bios-deploy-update-response.json"))["commit"]["sha"])')
          echo "AQ_V4_DEPLOY_CONTRACT_PUBLISHED=PASS sha=$NEW_SHA"
