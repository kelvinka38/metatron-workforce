# Canonical live production stack. Defaults preserve the single live production instance.
# Highway acceptance may override host port, state/workspace volumes and workforce network names so multiple
# exact-image production-equivalent lanes can run concurrently without sharing mutable state.
services:
  workforce-state-init:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /state && chmod 700 /state"]
    restart: "no"
    read_only: true
    network_mode: none
    volumes:
      - workforce-state:/state

  workforce-workspace-init:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /workspaces && chmod 700 /workspaces"]
    restart: "no"
    read_only: true
    network_mode: none
    volumes:
      - workforce-objective-workspaces:/workspaces

  workforce-execution-workspace-init:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /executions && chmod 700 /executions"]
    restart: "no"
    read_only: true
    network_mode: none
    volumes:
      - workforce-execution-workspaces:/executions

  workforce-sandbox:
    depends_on:
      workforce-execution-workspace-init:
        condition: service_completed_successfully
    build:
      context: ..
      dockerfile: runtime-sandbox/Dockerfile
    image: metatron-workforce-sandbox:${METATRON_IMAGE_TAG:-0.1.0}
    restart: unless-stopped
    mem_limit: ${METATRON_SANDBOX_MEM_LIMIT:-1280m}
    mem_reservation: ${METATRON_SANDBOX_MEM_RESERVATION:-512m}
    cpus: ${METATRON_SANDBOX_CPUS:-1.00}
    pids_limit: 512
    expose:
      - "8090"
    environment:
      SANDBOX_TOKEN: "${METATRON_SANDBOX_TOKEN:-}"
      SANDBOX_WORKSPACE_ROOT: "/workspaces"
      SANDBOX_ALLOWED_EXECUTABLES: "git,java,javac,sh,bash,gradle,mvn,./gradlew,./mvnw,node,npm,npx,pnpm,yarn,python3,python,pip3"
    volumes:
      - workforce-execution-workspaces:/workspaces
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,json; assert json.load(urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2))['status']=='UP'"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    networks:
      workforce:
        aliases:
          - workforce-sandbox

  workforce:
    depends_on:
      workforce-state-init:
        condition: service_completed_successfully
      workforce-workspace-init:
        condition: service_completed_successfully
      workforce-execution-workspace-init:
        condition: service_completed_successfully
      workforce-sandbox:
        condition: service_healthy
    build:
      context: ..
      dockerfile: Dockerfile
    image: metatron-workforce:${METATRON_IMAGE_TAG:-0.1.0}
    restart: unless-stopped
    stop_grace_period: 20s
    mem_limit: ${METATRON_CONTAINER_MEM_LIMIT:-768m}
    mem_reservation: ${METATRON_CONTAINER_MEM_RESERVATION:-384m}
    cpus: ${METATRON_CONTAINER_CPUS:-1.50}
    pids_limit: 256
    ports:
      - "127.0.0.1:${METATRON_HOST_PORT:-8080}:8080"
    expose:
      - "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_PORT: "8080"
      JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=65.0 -XX:InitialRAMPercentage=20.0 -XX:+ExitOnOutOfMemoryError -Djava.io.tmpdir=/tmp}"
      METATRON_VERSION: "${METATRON_VERSION:-0.1.0}"
      METATRON_COMMIT_SHA: "${METATRON_COMMIT_SHA:-unknown}"
      METATRON_ENVIRONMENT: "${METATRON_ENVIRONMENT:-production}"
      METATRON_MANAGEMENT_STATE_PATH: "${METATRON_MANAGEMENT_STATE_PATH:-/var/lib/metatron-workforce/management-state.json}"
      METATRON_WORKFORCE_CORE_STATE_PATH: "${METATRON_WORKFORCE_CORE_STATE_PATH:-/var/lib/metatron-workforce/workforce-core-state.json}"
      METATRON_RUNTIME_EVIDENCE_DIR: "${METATRON_RUNTIME_EVIDENCE_DIR:-/var/lib/metatron-workforce/runtime-evidence}"
      METATRON_COMMANDER_SSH_KEY: "${METATRON_COMMANDER_SSH_KEY:-/run/secrets/metatron_commander_ed25519}"
      METATRON_COMMANDER_SSH_TARGET: "${METATRON_COMMANDER_SSH_TARGET:-metatron-mcp@host.docker.internal}"
      METATRON_INFERENCE_LEDGER_PATH: "${METATRON_INFERENCE_LEDGER_PATH:-/var/lib/metatron-workforce/inference-ledger.jsonl}"
      METATRON_COGNITION_CAPACITY_EVENT_PATH: "${METATRON_COGNITION_CAPACITY_EVENT_PATH:-/var/lib/metatron-workforce/cognition-capacity-events.jsonl}"
      METATRON_COGNITION_URL: "${METATRON_COGNITION_URL:-http://metatron-cognition-node:8091}"
      METATRON_COGNITION_AUTH: "${METATRON_COGNITION_AUTH:-}"
      METATRON_COGNITION_MAX_CONCURRENT: "${METATRON_COGNITION_MAX_CONCURRENT:-4}"
      METATRON_COGNITION_MAX_QUEUED: "${METATRON_COGNITION_MAX_QUEUED:-1024}"
      METATRON_COGNITION_QUEUE_WAIT_MS: "${METATRON_COGNITION_QUEUE_WAIT_MS:-60000}"
      METATRON_TELEGRAM_INGRESS_PATH: "${METATRON_TELEGRAM_INGRESS_PATH:-/var/lib/metatron-workforce/telegram-ingress-state.json}"
      METATRON_RUNTIME_EXECUTION_TOKEN: "${METATRON_RUNTIME_EXECUTION_TOKEN:-}"
      METATRON_RUNTIME_PROFILE_BINDINGS_PATH: "${METATRON_RUNTIME_PROFILE_BINDINGS_PATH:-/var/lib/metatron-workforce/runtime-profile-bindings.tsv}"
      METATRON_OBJECTIVE_WORKSPACE_ROOT: "${METATRON_OBJECTIVE_WORKSPACE_ROOT:-/var/lib/metatron-workforce/objective-workspaces}"
      METATRON_EXECUTION_WORKSPACE_ROOT: "${METATRON_EXECUTION_WORKSPACE_ROOT:-/var/lib/metatron/executions}"
      METATRON_EXECUTION_WORKSPACE_BINDINGS_PATH: "${METATRON_EXECUTION_WORKSPACE_BINDINGS_PATH:-/var/lib/metatron-workforce/execution-workspace-bindings.json}"
      METATRON_EXECUTION_RESOURCE_STATE_PATH: "${METATRON_EXECUTION_RESOURCE_STATE_PATH:-/var/lib/metatron-workforce/execution-resource-state.json}"
      METATRON_EXECUTION_RESOURCE_QUEUE_PATH: "${METATRON_EXECUTION_RESOURCE_QUEUE_PATH:-/var/lib/metatron-workforce/execution-resource-queue.json}"
      METATRON_EXECUTION_SLOTS: "${METATRON_EXECUTION_SLOTS:-4}"
      METATRON_JVM_BUILD_SLOTS: "${METATRON_JVM_BUILD_SLOTS:-2}"
      METATRON_GITHUB_MUTATION_SLOTS: "${METATRON_GITHUB_MUTATION_SLOTS:-2}"
      METATRON_DOCKER_BUILD_SLOTS: "${METATRON_DOCKER_BUILD_SLOTS:-1}"
      METATRON_MAX_ACTIVE_EXECUTIONS_PER_OBJECTIVE: "${METATRON_MAX_ACTIVE_EXECUTIONS_PER_OBJECTIVE:-4}"
      METATRON_RESOURCE_LEASE_SECONDS: "${METATRON_RESOURCE_LEASE_SECONDS:-60}"
      METATRON_SANDBOX_URL: "${METATRON_SANDBOX_URL:-http://workforce-sandbox:8090}"
      METATRON_SANDBOX_TOKEN: "${METATRON_SANDBOX_TOKEN:-}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_WEBHOOK_SECRET: "${TELEGRAM_WEBHOOK_SECRET:-}"
      TELEGRAM_ALLOWED_USER_ID: "${TELEGRAM_ALLOWED_USER_ID:-}"
      TELEGRAM_API_BASE_URL: "${TELEGRAM_API_BASE_URL:-https://api.telegram.org}"
      METATRON_ORGANIZATION_ID: "${METATRON_ORGANIZATION_ID:-}"
      METATRON_GATEWAY_AUDIT_URL: "${METATRON_GATEWAY_AUDIT_URL:-http://envoy:8080/healthz}"
      METATRON_GATEWAY_AUDIT_TOKEN: "${METATRON_GATEWAY_AUDIT_TOKEN:-}"
      METATRON_LLM_PROVIDER: "${METATRON_LLM_PROVIDER:-AUTO}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4.1-mini}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.6-flash}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"
      CLOUDFLARE_ACCOUNT_ID: "${CLOUDFLARE_ACCOUNT_ID:-}"
      HETZNER_API_TOKEN: "${HETZNER_API_TOKEN:-}"
    volumes:
      - workforce-state:/var/lib/metatron-workforce
      - workforce-objective-workspaces:/var/lib/metatron-workforce/objective-workspaces
      - workforce-execution-workspaces:/var/lib/metatron/executions
      - /opt/metatron/workforce-commander/id_ed25519:/run/secrets/metatron_commander_ed25519:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      workforce:
      gateway:
        aliases:
          - ${METATRON_WORKFORCE_GATEWAY_ALIAS:-workforce-production}

volumes:
  workforce-state:
    name: ${METATRON_STATE_VOLUME_NAME:-metatron-workforce-state}
  workforce-objective-workspaces:
    name: ${METATRON_WORKSPACE_VOLUME_NAME:-metatron-workforce-objective-workspaces}
  workforce-execution-workspaces:
    name: ${METATRON_EXECUTION_WORKSPACE_VOLUME_NAME:-metatron-workforce-execution-workspaces}

networks:
  workforce:
    name: ${METATRON_WORKFORCE_NETWORK_NAME:-metatron-workforce}
  gateway:
    external: true
    name: ${METATRON_GATEWAY_NETWORK_NAME:-metatron-gateway-online}
