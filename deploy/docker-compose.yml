services:
  workforce:
    build:
      context: ..
      dockerfile: Dockerfile
    image: metatron-workforce:0.1.0
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SERVER_PORT: "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - workforce

networks:
  workforce:
    name: metatron-workforce
