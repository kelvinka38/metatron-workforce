# Resource-bounded build defaults for the canonical 4 GiB production host.
# Keep Gradle/test JVMs small enough to coexist with running Metatron services.
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.jvmargs=-Xms64m -Xmx256m -XX:MaxMetaspaceSize=192m -Dfile.encoding=UTF-8
